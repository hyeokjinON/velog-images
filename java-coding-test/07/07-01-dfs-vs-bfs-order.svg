<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 676" width="760" height="676" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
  <title>그림 7-1. 같은 그래프에서 DFS 와 BFS 가 노드를 방문하는 순서</title>
  <rect width="760" height="676" fill="#ffffff"/>
  <text x="24" y="40" font-size="21" fill="#0f172a" font-weight="700">같은 그래프에서 DFS 와 BFS 가</text>
  <text x="24" y="70" font-size="21" fill="#0f172a" font-weight="700">노드를 방문하는 순서</text>
  <text x="24" y="102" font-size="16" fill="#475569">간선 0-1, 0-2, 1-3, 1-4, 2-5 에서 0 부터 출발. 파란 동그라미 숫자 =</text>
  <text x="24" y="126" font-size="16" fill="#475569">몇 번째로 방문했는가 (JDK 21 실행 결과)</text>
  <rect x="24" y="164" width="348" height="372" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="40" y="194" font-size="17" fill="#1e3a8a" font-weight="700">① 재귀 DFS (스택 DFS 도 같다)</text>
  <line x1="220" y1="254" x2="140" y2="344" stroke="#94a3b8" stroke-width="2"/>
  <line x1="220" y1="254" x2="300" y2="344" stroke="#94a3b8" stroke-width="2"/>
  <line x1="140" y1="344" x2="100" y2="434" stroke="#94a3b8" stroke-width="2"/>
  <line x1="140" y1="344" x2="180" y2="434" stroke="#94a3b8" stroke-width="2"/>
  <line x1="300" y1="344" x2="300" y2="434" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="220" cy="254" r="22" fill="#ffffff" stroke="#1e3a8a" stroke-width="2"/>
  <text x="220" y="260" font-size="17" fill="#0f172a" font-weight="700" text-anchor="middle">0</text>
  <circle cx="244" cy="232" r="13" fill="#1e3a8a"/>
  <text x="244" y="238" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle">1</text>
  <circle cx="140" cy="344" r="22" fill="#ffffff" stroke="#1e3a8a" stroke-width="2"/>
  <text x="140" y="350" font-size="17" fill="#0f172a" font-weight="700" text-anchor="middle">1</text>
  <circle cx="164" cy="322" r="13" fill="#1e3a8a"/>
  <text x="164" y="328" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle">2</text>
  <circle cx="300" cy="344" r="22" fill="#ffffff" stroke="#1e3a8a" stroke-width="2"/>
  <text x="300" y="350" font-size="17" fill="#0f172a" font-weight="700" text-anchor="middle">2</text>
  <circle cx="324" cy="322" r="13" fill="#1e3a8a"/>
  <text x="324" y="328" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle">5</text>
  <circle cx="100" cy="434" r="22" fill="#ffffff" stroke="#1e3a8a" stroke-width="2"/>
  <text x="100" y="440" font-size="17" fill="#0f172a" font-weight="700" text-anchor="middle">3</text>
  <circle cx="124" cy="412" r="13" fill="#1e3a8a"/>
  <text x="124" y="418" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle">3</text>
  <circle cx="180" cy="434" r="22" fill="#ffffff" stroke="#1e3a8a" stroke-width="2"/>
  <text x="180" y="440" font-size="17" fill="#0f172a" font-weight="700" text-anchor="middle">4</text>
  <circle cx="204" cy="412" r="13" fill="#1e3a8a"/>
  <text x="204" y="418" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle">4</text>
  <circle cx="300" cy="434" r="22" fill="#ffffff" stroke="#1e3a8a" stroke-width="2"/>
  <text x="300" y="440" font-size="17" fill="#0f172a" font-weight="700" text-anchor="middle">5</text>
  <circle cx="324" cy="412" r="13" fill="#1e3a8a"/>
  <text x="324" y="418" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle">6</text>
  <text x="40" y="498" font-size="16" fill="#0f172a" font-weight="700">방문 순서 0 → 1 → 3 → 4 → 2 → 5</text>
  <text x="40" y="522" font-size="16" fill="#334155">1 아래(3, 4)를 다 본 뒤 2 로</text>
  <rect x="388" y="164" width="348" height="372" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="404" y="194" font-size="17" fill="#1e3a8a" font-weight="700">② BFS (큐)</text>
  <rect x="396" y="222" width="332" height="64" rx="6" fill="#e0f2fe" stroke="none" stroke-width="0"/>
  <text x="404" y="260" font-size="16" fill="#475569" font-weight="700">거리 0</text>
  <rect x="396" y="312" width="332" height="64" rx="6" fill="#ecfdf5" stroke="none" stroke-width="0"/>
  <text x="404" y="350" font-size="16" fill="#475569" font-weight="700">거리 1</text>
  <rect x="396" y="402" width="332" height="64" rx="6" fill="#fff7ed" stroke="none" stroke-width="0"/>
  <text x="404" y="440" font-size="16" fill="#475569" font-weight="700">거리 2</text>
  <line x1="614" y1="254" x2="534" y2="344" stroke="#94a3b8" stroke-width="2"/>
  <line x1="614" y1="254" x2="694" y2="344" stroke="#94a3b8" stroke-width="2"/>
  <line x1="534" y1="344" x2="494" y2="434" stroke="#94a3b8" stroke-width="2"/>
  <line x1="534" y1="344" x2="574" y2="434" stroke="#94a3b8" stroke-width="2"/>
  <line x1="694" y1="344" x2="694" y2="434" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="614" cy="254" r="22" fill="#ffffff" stroke="#1e3a8a" stroke-width="2"/>
  <text x="614" y="260" font-size="17" fill="#0f172a" font-weight="700" text-anchor="middle">0</text>
  <circle cx="638" cy="232" r="13" fill="#1e3a8a"/>
  <text x="638" y="238" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle">1</text>
  <circle cx="534" cy="344" r="22" fill="#ffffff" stroke="#1e3a8a" stroke-width="2"/>
  <text x="534" y="350" font-size="17" fill="#0f172a" font-weight="700" text-anchor="middle">1</text>
  <circle cx="558" cy="322" r="13" fill="#1e3a8a"/>
  <text x="558" y="328" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle">2</text>
  <circle cx="694" cy="344" r="22" fill="#ffffff" stroke="#1e3a8a" stroke-width="2"/>
  <text x="694" y="350" font-size="17" fill="#0f172a" font-weight="700" text-anchor="middle">2</text>
  <circle cx="718" cy="322" r="13" fill="#1e3a8a"/>
  <text x="718" y="328" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle">3</text>
  <circle cx="494" cy="434" r="22" fill="#ffffff" stroke="#1e3a8a" stroke-width="2"/>
  <text x="494" y="440" font-size="17" fill="#0f172a" font-weight="700" text-anchor="middle">3</text>
  <circle cx="518" cy="412" r="13" fill="#1e3a8a"/>
  <text x="518" y="418" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle">4</text>
  <circle cx="574" cy="434" r="22" fill="#ffffff" stroke="#1e3a8a" stroke-width="2"/>
  <text x="574" y="440" font-size="17" fill="#0f172a" font-weight="700" text-anchor="middle">4</text>
  <circle cx="598" cy="412" r="13" fill="#1e3a8a"/>
  <text x="598" y="418" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle">5</text>
  <circle cx="694" cy="434" r="22" fill="#ffffff" stroke="#1e3a8a" stroke-width="2"/>
  <text x="694" y="440" font-size="17" fill="#0f172a" font-weight="700" text-anchor="middle">5</text>
  <circle cx="718" cy="412" r="13" fill="#1e3a8a"/>
  <text x="718" y="418" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle">6</text>
  <text x="404" y="498" font-size="16" fill="#0f172a" font-weight="700">방문 순서 0 → 1 → 2 → 3 → 4 → 5</text>
  <text x="404" y="522" font-size="16" fill="#334155" font-family="Consolas, D2Coding, monospace">dist = [0, 1, 1, 2, 2, 2]</text>
  <rect x="24" y="556" width="712" height="100" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1"/>
  <text x="44" y="586" font-size="17" fill="#047857" font-weight="700">DFS 는 한 갈래를 끝까지, BFS 는 거리 순서(층)대로 꺼낸다.</text>
  <text x="44" y="612" font-size="16" fill="#334155">BFS 는 거리 1 인 1, 2 를 다 꺼낸 다음에야 거리 2 인 3, 4, 5 를 꺼낸다.</text>
  <text x="44" y="638" font-size="16" fill="#334155">그래서 처음 도착했을 때의 거리가 최단이다 (4-1절).</text>
</svg>
