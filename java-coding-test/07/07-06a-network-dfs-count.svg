<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 654" width="760" height="654" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
  <title>그림 7-6a. 네트워크 예제 1, 2 — 바깥 반복문이 새 시작점을 만날 때만 count 가 오른다</title>
  <rect width="760" height="654" fill="#ffffff"/>
  <text x="24" y="40" font-size="21" fill="#0f172a" font-weight="700">네트워크 예제 1, 2 — 바깥 반복문이 새</text>
  <text x="24" y="70" font-size="21" fill="#0f172a" font-weight="700">시작점을 만날 때만 count 가 오른다</text>
  <text x="24" y="102" font-size="16" fill="#475569">동그라미 = 컴퓨터, 선 = computers[i][j] == 1, 같은 색 = 같은 네트워크</text>
  <rect x="24" y="140" width="348" height="400" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="40" y="170" font-size="17" fill="#1e3a8a" font-weight="700">① 예제 1 → 답 2</text>
  <line x1="114" y1="220" x2="282" y2="220" stroke="#94a3b8" stroke-width="3"/>
  <circle cx="114" cy="220" r="24" fill="#eff6ff" stroke="#1e3a8a" stroke-width="3"/>
  <text x="114" y="226" font-size="18" fill="#1e3a8a" font-weight="700" text-anchor="middle">0</text>
  <circle cx="282" cy="220" r="24" fill="#eff6ff" stroke="#1e3a8a" stroke-width="3"/>
  <text x="282" y="226" font-size="18" fill="#1e3a8a" font-weight="700" text-anchor="middle">1</text>
  <circle cx="198" cy="310" r="24" fill="#fff7ed" stroke="#c2410c" stroke-width="3"/>
  <text x="198" y="316" font-size="18" fill="#c2410c" font-weight="700" text-anchor="middle">2</text>
  <text x="44" y="380" font-size="16" fill="#334155" font-family="Consolas, D2Coding, monospace">i=0: count 1</text>
  <text x="68" y="408" font-size="16" fill="#334155" font-family="Consolas, D2Coding, monospace">visit(0) → visit(1)</text>
  <text x="44" y="436" font-size="16" fill="#334155" font-family="Consolas, D2Coding, monospace">i=1: 방문함, 건너뜀</text>
  <text x="44" y="464" font-size="16" fill="#334155" font-family="Consolas, D2Coding, monospace">i=2: count 2</text>
  <text x="68" y="492" font-size="16" fill="#334155" font-family="Consolas, D2Coding, monospace">visit(2)</text>
  <rect x="388" y="140" width="348" height="400" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="404" y="170" font-size="17" fill="#1e3a8a" font-weight="700">② 예제 2 → 답 1</text>
  <line x1="478" y1="220" x2="646" y2="220" stroke="#94a3b8" stroke-width="3"/>
  <line x1="646" y1="220" x2="562" y2="310" stroke="#94a3b8" stroke-width="3"/>
  <circle cx="478" cy="220" r="24" fill="#eff6ff" stroke="#1e3a8a" stroke-width="3"/>
  <text x="478" y="226" font-size="18" fill="#1e3a8a" font-weight="700" text-anchor="middle">0</text>
  <circle cx="646" cy="220" r="24" fill="#eff6ff" stroke="#1e3a8a" stroke-width="3"/>
  <text x="646" y="226" font-size="18" fill="#1e3a8a" font-weight="700" text-anchor="middle">1</text>
  <circle cx="562" cy="310" r="24" fill="#eff6ff" stroke="#1e3a8a" stroke-width="3"/>
  <text x="562" y="316" font-size="18" fill="#1e3a8a" font-weight="700" text-anchor="middle">2</text>
  <text x="408" y="380" font-size="16" fill="#334155" font-family="Consolas, D2Coding, monospace">i=0: count 1</text>
  <text x="432" y="408" font-size="16" fill="#334155" font-family="Consolas, D2Coding, monospace">visit(0) → visit(1)</text>
  <text x="432" y="436" font-size="16" fill="#334155" font-family="Consolas, D2Coding, monospace">→ visit(2)</text>
  <text x="408" y="464" font-size="16" fill="#334155" font-family="Consolas, D2Coding, monospace">i=1: 방문함, 건너뜀</text>
  <text x="408" y="492" font-size="16" fill="#334155" font-family="Consolas, D2Coding, monospace">i=2: 방문함, 건너뜀</text>
  <rect x="24" y="560" width="712" height="74" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1"/>
  <text x="44" y="590" font-size="17" fill="#047857" font-weight="700">visit 안에서는 count 를 올리지 않는다. 한 번의 visit 가 한 네트워크를</text>
  <text x="44" y="616" font-size="16" fill="#334155">통째로 칠하고, 바깥 반복문은 칠해진 컴퓨터를 건너뛴다.</text>
</svg>
