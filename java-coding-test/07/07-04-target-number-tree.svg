  <text x="44" y="702" font-size="17" fill="#047857" font-weight="700">리프 16개 중 sum 이 4 인 것은 +4+1−2+1 과 +4−1+2−1 의 2개 → 답 2</text>
  <text x="44" y="728" font-size="16" fill="#334155">−4 로 시작한 오른쪽 8개는 가장 커도 0 이라 하나도 4 가 되지 않는다.</text>
