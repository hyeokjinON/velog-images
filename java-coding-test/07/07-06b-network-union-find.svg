  <text x="44" y="642" font-size="17" fill="#047857" font-weight="700">끝난 뒤 parent = [1, 2, 2]. find(0) 은 0 → 1 → 2 를 따라가 2 를 돌려주고,</text>
  <text x="44" y="668" font-size="16" fill="#334155">경로 압축으로 parent[0] 을 2 로 바꾼다. count 1 = 기대 출력 1</text>
