<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 892" width="760" height="892" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
  <title>그림 2-1. HashMap 이 키의 칸 번호를 정하는 과정 — hashCode, 섞기, 아래 4비트, 16칸 배열에 들어간 모습</title>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
  <rect width="760" height="892" fill="#ffffff"/>
  <text x="24" y="40" font-size="22" fill="#0f172a" font-weight="700">HashMap 이 키의 칸 번호를 정하는 과정</text>
  <text x="24" y="70" font-size="20" fill="#0f172a" font-weight="700">hashCode → 섞기 → 아래 4비트 → 16칸 배열</text>
  <text x="24" y="104" font-size="16" fill="#475569">tableSize = 16. 값은 JDK 21 에서 실행해 출력한 값이다.</text>
  <circle cx="38" cy="142" r="13" fill="#1d4ed8"/>
  <text x="38" y="148" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle">1</text>
  <text x="60" y="148" font-size="17" fill="#0f172a" font-weight="700">bucketIndex(key, 16) 의 세 단계</text>
  <rect x="24" y="168" width="712" height="112" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="44" y="198" font-size="17" fill="#0f172a" font-weight="700" font-family="Consolas, monospace">"apple"</text>
  <text x="190" y="198" font-size="16" fill="#334155" font-family="Consolas, monospace">h = 93029210</text>
  <text x="190" y="228" font-size="16" fill="#334155" font-family="Consolas, monospace">spread = h ^ (h &gt;&gt;&gt; 16) = 93030097</text>
  <text x="190" y="260" font-size="16" fill="#475569">아래 4비트: 섞기 전 1010 (10번) → 섞은 뒤 0001</text>
  <rect x="612" y="198" width="104" height="50" rx="8" fill="#ffffff" stroke="#047857" stroke-width="2"/>
  <text x="664" y="230" font-size="18" fill="#047857" font-weight="700" text-anchor="middle">1번 칸</text>
  <rect x="24" y="292" width="712" height="112" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="44" y="322" font-size="17" fill="#0f172a" font-weight="700" font-family="Consolas, monospace">"banana"</text>
  <text x="190" y="322" font-size="16" fill="#334155" font-family="Consolas, monospace">h = -1396355227</text>
  <text x="190" y="352" font-size="16" fill="#334155" font-family="Consolas, monospace">spread = h ^ (h &gt;&gt;&gt; 16) = -1396317280</text>
  <text x="190" y="384" font-size="16" fill="#475569">아래 4비트: 섞기 전 0101 (5번) → 섞은 뒤 0000</text>
  <rect x="612" y="322" width="104" height="50" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="664" y="354" font-size="18" fill="#1d4ed8" font-weight="700" text-anchor="middle">0번 칸</text>
  <rect x="24" y="416" width="712" height="112" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="44" y="446" font-size="17" fill="#0f172a" font-weight="700" font-family="Consolas, monospace">"cherry"</text>
  <text x="190" y="446" font-size="16" fill="#334155" font-family="Consolas, monospace">h = -1361513063</text>
  <text x="190" y="476" font-size="16" fill="#334155" font-family="Consolas, monospace">spread = h ^ (h &gt;&gt;&gt; 16) = -1361552575</text>
  <text x="190" y="508" font-size="16" fill="#475569">아래 4비트: 섞기 전 1001 (9번) → 섞은 뒤 0001</text>
  <rect x="612" y="446" width="104" height="50" rx="8" fill="#ffffff" stroke="#047857" stroke-width="2"/>
  <text x="664" y="478" font-size="18" fill="#047857" font-weight="700" text-anchor="middle">1번 칸</text>
  <circle cx="38" cy="568" r="13" fill="#1d4ed8"/>
  <text x="38" y="574" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle">2</text>
  <text x="60" y="574" font-size="17" fill="#0f172a" font-weight="700">실제 HashMap 의 내부 배열 (리플렉션으로 연 값)</text>
  <rect x="24" y="594" width="712" height="220" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="44" y="612" width="96" height="46" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="92" y="642" font-size="16" fill="#0f172a" font-weight="700" text-anchor="middle">0번 칸</text>
  <rect x="180" y="612" width="120" height="46" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="240" y="642" font-size="16" fill="#0f172a" font-weight="700" font-family="Consolas, monospace" text-anchor="middle">banana</text>
  <line x1="300" y1="635" x2="348" y2="635" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="350" y="612" width="120" height="46" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="410" y="642" font-size="16" fill="#0f172a" font-weight="700" font-family="Consolas, monospace" text-anchor="middle">date</text>
  <line x1="140" y1="635" x2="178" y2="635" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="44" y="674" width="96" height="46" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="92" y="704" font-size="16" fill="#0f172a" font-weight="700" text-anchor="middle">1번 칸</text>
  <rect x="180" y="674" width="120" height="46" rx="6" fill="#ffffff" stroke="#047857" stroke-width="2"/>
  <text x="240" y="704" font-size="16" fill="#0f172a" font-weight="700" font-family="Consolas, monospace" text-anchor="middle">apple</text>
  <line x1="300" y1="697" x2="348" y2="697" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="350" y="674" width="120" height="46" rx="6" fill="#ffffff" stroke="#047857" stroke-width="2"/>
  <text x="410" y="704" font-size="16" fill="#0f172a" font-weight="700" font-family="Consolas, monospace" text-anchor="middle">cherry</text>
  <line x1="140" y1="697" x2="178" y2="697" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="44" y="736" width="96" height="46" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="92" y="766" font-size="16" fill="#475569" text-anchor="middle">2 ~ 15번</text>
  <text x="180" y="766" font-size="16" fill="#94a3b8">비어 있음 (null)</text>
  <text x="500" y="644" font-size="16" fill="#475569">← 넣은 순서로 이어진다</text>
  <text x="500" y="706" font-size="16" fill="#047857" font-weight="700">← apple 과 cherry 가 충돌</text>
  <text x="24" y="842" font-size="16" fill="#334155">date 는 6절에서 넣은 네 번째 키다. bucketIndex 로도 0번 칸이다.</text>
  <text x="24" y="868" font-size="16" fill="#334155">HashMap 은 0번 칸부터 돌아서 키 출력이 [banana, date, apple, cherry] 다.</text>
</svg>
