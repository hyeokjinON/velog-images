<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 726" width="760" height="726" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
  <title>그림 2-3. 넣은 뒤 키 필드를 바꾸면 — 원소는 2번 칸에 남아 있는데 두 가지 get 이 모두 null 이 되는 이유</title>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
  <rect width="760" height="726" fill="#ffffff"/>
  <text x="24" y="40" font-size="22" fill="#0f172a" font-weight="700">넣은 뒤 키 필드를 바꾸면</text>
  <text x="24" y="70" font-size="20" fill="#0f172a" font-weight="700">원소는 2번 칸에 남아 있는데 get 이 모두 null</text>
  <text x="24" y="104" font-size="16" fill="#475569">16칸 테이블 중 2번 칸과 10번 칸만 그렸다. (r,c) 는 MutablePoint 의 값이다.</text>
  <rect x="24" y="134" width="712" height="112" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="48" cy="162" r="13" fill="#1d4ed8"/>
  <text x="48" y="168" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle">1</text>
  <text x="72" y="168" font-size="16" fill="#0f172a" font-weight="700" font-family="Consolas, monospace">map.put(p, "start")</text>
  <text x="48" y="200" font-size="16" fill="#334155">p = (1,2), hashCode 994</text>
  <text x="48" y="226" font-size="16" fill="#334155">994 &amp; 15 = 2 → 2번 칸에 넣는다</text>
  <rect x="400" y="166" width="150" height="70" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="475" y="190" font-size="16" fill="#475569" text-anchor="middle">2번 칸</text>
  <text x="475" y="220" font-size="16" fill="#0f172a" font-weight="700" font-family="Consolas, monospace" text-anchor="middle">(1,2)=start</text>
  <rect x="566" y="166" width="150" height="70" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="641" y="190" font-size="16" fill="#475569" text-anchor="middle">10번 칸</text>
  <text x="641" y="220" font-size="16" fill="#94a3b8" text-anchor="middle">비어 있음</text>
  <rect x="24" y="258" width="712" height="112" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1"/>
  <circle cx="48" cy="286" r="13" fill="#c2410c"/>
  <text x="48" y="292" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle">2</text>
  <text x="72" y="292" font-size="16" fill="#0f172a" font-weight="700" font-family="Consolas, monospace">p.r = 9</text>
  <text x="48" y="324" font-size="16" fill="#334155">맵 안의 키도 같은 객체라 (9,2)</text>
  <text x="48" y="350" font-size="16" fill="#334155">칸은 다시 계산하지 않는다</text>
  <rect x="400" y="290" width="150" height="70" rx="6" fill="#ffffff" stroke="#c2410c" stroke-width="2"/>
  <text x="475" y="314" font-size="16" fill="#475569" text-anchor="middle">2번 칸</text>
  <text x="475" y="344" font-size="16" fill="#c2410c" font-weight="700" font-family="Consolas, monospace" text-anchor="middle">(9,2)=start</text>
  <rect x="566" y="290" width="150" height="70" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="641" y="314" font-size="16" fill="#475569" text-anchor="middle">10번 칸</text>
  <text x="641" y="344" font-size="16" fill="#94a3b8" text-anchor="middle">비어 있음</text>
  <rect x="24" y="382" width="712" height="112" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  <circle cx="48" cy="410" r="13" fill="#b91c1c"/>
  <text x="48" y="416" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle">3</text>
  <text x="72" y="416" font-size="16" fill="#0f172a" font-weight="700" font-family="Consolas, monospace">map.get(p)</text>
  <text x="48" y="448" font-size="16" fill="#334155">hashCode 1242, 1242 &amp; 15 = 10</text>
  <text x="48" y="474" font-size="16" fill="#b91c1c" font-weight="700">10번 칸은 비어 있음 → null</text>
  <rect x="400" y="414" width="150" height="70" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="475" y="438" font-size="16" fill="#475569" text-anchor="middle">2번 칸</text>
  <text x="475" y="468" font-size="16" fill="#0f172a" font-weight="700" font-family="Consolas, monospace" text-anchor="middle">(9,2)=start</text>
  <rect x="566" y="414" width="150" height="70" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
  <text x="641" y="438" font-size="16" fill="#475569" text-anchor="middle">10번 칸</text>
  <text x="641" y="468" font-size="16" fill="#94a3b8" text-anchor="middle">비어 있음</text>
  <rect x="24" y="506" width="712" height="112" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  <circle cx="48" cy="534" r="13" fill="#b91c1c"/>
  <text x="48" y="540" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle">4</text>
  <text x="72" y="540" font-size="16" fill="#0f172a" font-weight="700" font-family="Consolas, monospace">get(new MutablePoint(1, 2))</text>
  <text x="48" y="572" font-size="16" fill="#334155">hashCode 994 → 2번 칸은 맞지만</text>
  <text x="48" y="598" font-size="16" fill="#b91c1c" font-weight="700">(9,2) 와 equals false → null</text>
  <rect x="400" y="538" width="150" height="70" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
  <text x="475" y="562" font-size="16" fill="#475569" text-anchor="middle">2번 칸</text>
  <text x="475" y="592" font-size="16" fill="#0f172a" font-weight="700" font-family="Consolas, monospace" text-anchor="middle">(9,2)=start</text>
  <rect x="566" y="538" width="150" height="70" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="641" y="562" font-size="16" fill="#475569" text-anchor="middle">10번 칸</text>
  <text x="641" y="592" font-size="16" fill="#94a3b8" text-anchor="middle">비어 있음</text>
  <rect x="24" y="630" width="712" height="76" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="44" y="660" font-size="16" fill="#0f172a" font-weight="700" font-family="Consolas, monospace">map.size() = 1, containsKey(p) = false</text>
  <text x="44" y="688" font-size="16" fill="#334155">원소는 남아 있는데 찾지도 지우지도 못한다. 키는 불변으로 만든다.</text>
</svg>
