<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 844" width="760" height="844" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
  <title>그림 2-4. 합이 3 인 연속 구간 세기 — 누적합 6 에서 3 을 빼면 이전 누적합 3 이 두 번 나왔으므로 구간 두 개를 한꺼번에 센다</title>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
  <rect width="760" height="844" fill="#ffffff"/>
  <text x="24" y="40" font-size="22" fill="#0f172a" font-weight="700">합이 3 인 연속 구간 세기</text>
  <text x="24" y="70" font-size="20" fill="#0f172a" font-weight="700">누적합에서 3 을 뺀 값이 이전에 몇 번 나왔나</text>
  <text x="24" y="104" font-size="16" fill="#475569">입력 a = [1, 2, 3, -3, 3], k = 3. 값은 실행해 출력한 것이다.</text>
  <text x="24" y="168" font-size="16" fill="#0f172a" font-weight="700">배열 a</text>
  <text x="24" y="194" font-size="16" fill="#475569">(인덱스)</text>
  <rect x="190" y="144" width="100" height="40" rx="0" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="240" y="171" font-size="17" fill="#0f172a" font-weight="700" font-family="Consolas, monospace" text-anchor="middle">1</text>
  <text x="240" y="206" font-size="16" fill="#475569" text-anchor="middle">0</text>
  <rect x="290" y="144" width="100" height="40" rx="0" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="340" y="171" font-size="17" fill="#0f172a" font-weight="700" font-family="Consolas, monospace" text-anchor="middle">2</text>
  <text x="340" y="206" font-size="16" fill="#475569" text-anchor="middle">1</text>
  <rect x="390" y="144" width="100" height="40" rx="0" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="440" y="171" font-size="17" fill="#0f172a" font-weight="700" font-family="Consolas, monospace" text-anchor="middle">3</text>
  <text x="440" y="206" font-size="16" fill="#475569" text-anchor="middle">2</text>
  <rect x="490" y="144" width="100" height="40" rx="0" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="540" y="171" font-size="17" fill="#0f172a" font-weight="700" font-family="Consolas, monospace" text-anchor="middle">-3</text>
  <text x="540" y="206" font-size="16" fill="#475569" text-anchor="middle">3</text>
  <rect x="590" y="144" width="100" height="40" rx="0" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="640" y="171" font-size="17" fill="#0f172a" font-weight="700" font-family="Consolas, monospace" text-anchor="middle">3</text>
  <text x="640" y="206" font-size="16" fill="#475569" text-anchor="middle">4</text>
  <text x="24" y="244" font-size="16" fill="#0f172a" font-weight="700">누적합</text>
  <line x1="190" y1="216" x2="190" y2="226" stroke="#475569" stroke-width="2"/>
  <text x="190" y="246" font-size="17" fill="#1d4ed8" font-weight="700" font-family="Consolas, monospace" text-anchor="middle">0</text>
  <line x1="290" y1="216" x2="290" y2="226" stroke="#475569" stroke-width="2"/>
  <text x="290" y="246" font-size="17" fill="#1d4ed8" font-weight="700" font-family="Consolas, monospace" text-anchor="middle">1</text>
  <line x1="390" y1="216" x2="390" y2="226" stroke="#475569" stroke-width="2"/>
  <text x="390" y="246" font-size="17" fill="#1d4ed8" font-weight="700" font-family="Consolas, monospace" text-anchor="middle">3</text>
  <line x1="490" y1="216" x2="490" y2="226" stroke="#475569" stroke-width="2"/>
  <text x="490" y="246" font-size="17" fill="#1d4ed8" font-weight="700" font-family="Consolas, monospace" text-anchor="middle">6</text>
  <line x1="590" y1="216" x2="590" y2="226" stroke="#475569" stroke-width="2"/>
  <text x="590" y="246" font-size="17" fill="#1d4ed8" font-weight="700" font-family="Consolas, monospace" text-anchor="middle">3</text>
  <line x1="690" y1="216" x2="690" y2="226" stroke="#475569" stroke-width="2"/>
  <text x="690" y="246" font-size="17" fill="#1d4ed8" font-weight="700" font-family="Consolas, monospace" text-anchor="middle">6</text>
  <rect x="24" y="272" width="712" height="40" rx="0" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="44" y="299" font-size="16" fill="#1e3a8a" font-weight="700">x</text>
  <text x="100" y="299" font-size="16" fill="#1e3a8a" font-weight="700">sum</text>
  <text x="170" y="299" font-size="16" fill="#1e3a8a" font-weight="700">sum−3</text>
  <text x="260" y="299" font-size="16" fill="#1e3a8a" font-weight="700">찾은 횟수</text>
  <text x="380" y="299" font-size="16" fill="#1e3a8a" font-weight="700">찾은 구간 (인덱스)</text>
  <text x="44" y="338" font-size="16" fill="#475569">시작</text>
  <text x="170" y="338" font-size="16" fill="#334155" font-family="Consolas, monospace">seen.put(0L, 1) → seen = {0=1}</text>
  <line x1="24" y1="352" x2="736" y2="352" stroke="#e2e8f0" stroke-width="1"/>
  <text x="44" y="380" font-size="16" fill="#0f172a" font-weight="700" font-family="Consolas, monospace">1</text>
  <text x="100" y="380" font-size="16" fill="#1d4ed8" font-weight="700" font-family="Consolas, monospace">1</text>
  <text x="170" y="380" font-size="16" fill="#0f172a" font-family="Consolas, monospace">-2</text>
  <text x="260" y="380" font-size="16" fill="#94a3b8" font-weight="700">+0</text>
  <text x="380" y="380" font-size="16" fill="#94a3b8" font-family="Consolas, monospace">없음</text>
  <text x="170" y="408" font-size="15" fill="#475569" font-family="Consolas, monospace">그 뒤 seen = {0=1, 1=1}</text>
  <line x1="24" y1="422" x2="736" y2="422" stroke="#e2e8f0" stroke-width="1"/>
  <text x="44" y="450" font-size="16" fill="#0f172a" font-weight="700" font-family="Consolas, monospace">2</text>
  <text x="100" y="450" font-size="16" fill="#1d4ed8" font-weight="700" font-family="Consolas, monospace">3</text>
  <text x="170" y="450" font-size="16" fill="#0f172a" font-family="Consolas, monospace">0</text>
  <text x="260" y="450" font-size="16" fill="#047857" font-weight="700">+1</text>
  <text x="380" y="450" font-size="16" fill="#047857" font-weight="700" font-family="Consolas, monospace">[1, 2] (0~1)</text>
  <text x="170" y="478" font-size="15" fill="#475569" font-family="Consolas, monospace">그 뒤 seen = {0=1, 1=1, 3=1}</text>
  <line x1="24" y1="492" x2="736" y2="492" stroke="#e2e8f0" stroke-width="1"/>
  <text x="44" y="520" font-size="16" fill="#0f172a" font-weight="700" font-family="Consolas, monospace">3</text>
  <text x="100" y="520" font-size="16" fill="#1d4ed8" font-weight="700" font-family="Consolas, monospace">6</text>
  <text x="170" y="520" font-size="16" fill="#0f172a" font-family="Consolas, monospace">3</text>
  <text x="260" y="520" font-size="16" fill="#047857" font-weight="700">+1</text>
  <text x="380" y="520" font-size="16" fill="#047857" font-weight="700" font-family="Consolas, monospace">[3] (2)</text>
  <text x="170" y="548" font-size="15" fill="#475569" font-family="Consolas, monospace">그 뒤 seen 에 6=1 추가</text>
  <line x1="24" y1="562" x2="736" y2="562" stroke="#e2e8f0" stroke-width="1"/>
  <text x="44" y="590" font-size="16" fill="#0f172a" font-weight="700" font-family="Consolas, monospace">-3</text>
  <text x="100" y="590" font-size="16" fill="#1d4ed8" font-weight="700" font-family="Consolas, monospace">3</text>
  <text x="170" y="590" font-size="16" fill="#0f172a" font-family="Consolas, monospace">0</text>
  <text x="260" y="590" font-size="16" fill="#047857" font-weight="700">+1</text>
  <text x="380" y="590" font-size="16" fill="#047857" font-weight="700" font-family="Consolas, monospace">[1, 2, 3, -3] (0~3)</text>
  <text x="170" y="618" font-size="15" fill="#475569" font-family="Consolas, monospace">그 뒤 seen 의 3 → 3=2</text>
  <line x1="24" y1="632" x2="736" y2="632" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="24" y="632" width="712" height="70" rx="0" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1"/>
  <text x="44" y="660" font-size="16" fill="#0f172a" font-weight="700" font-family="Consolas, monospace">3</text>
  <text x="100" y="660" font-size="16" fill="#1d4ed8" font-weight="700" font-family="Consolas, monospace">6</text>
  <text x="170" y="660" font-size="16" fill="#0f172a" font-family="Consolas, monospace">3</text>
  <text x="260" y="660" font-size="16" fill="#047857" font-weight="700">+2</text>
  <text x="380" y="660" font-size="16" fill="#047857" font-weight="700" font-family="Consolas, monospace">[3, -3, 3] (2~4), [3] (4)</text>
  <text x="170" y="688" font-size="15" fill="#475569" font-family="Consolas, monospace">그 뒤 seen = {0=1, 1=1, 3=2, 6=2}</text>
  <line x1="24" y1="702" x2="736" y2="702" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="24" y="718" width="712" height="106" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="44" y="748" font-size="17" fill="#0f172a" font-weight="700" font-family="Consolas, monospace">count = 0 + 1 + 1 + 1 + 2 = 5</text>
  <text x="44" y="778" font-size="16" fill="#334155">마지막 줄은 6 − 3 = 3 인데, 누적합 3 이 앞에서 두 번 나와서</text>
  <text x="44" y="804" font-size="16" fill="#334155">구간 두 개를 한 번에 센다. 2중 for 로 모든 구간을 센 답도 5 였다.</text>
</svg>
