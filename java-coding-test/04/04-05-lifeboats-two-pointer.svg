<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 656" width="760" height="656" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
  <title>그림 4-5. 구명보트 [70, 50, 80, 50], 제한 100 — 정렬 후 양 끝 포인터가 움직이는 순서</title>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
  <rect width="760" height="656" fill="#ffffff"/>
  <text x="24" y="40" font-size="22" fill="#0f172a" font-weight="700">구명보트 [70, 50, 80, 50], 제한 100 —</text>
  <text x="24" y="70" font-size="22" fill="#0f172a" font-weight="700">정렬 후 양 끝 포인터가 움직이는 순서</text>
  <text x="24" y="104" font-size="16" fill="#475569">파랑 lo = 가장 가벼운 사람 쪽, 빨강 hi = 가장 무거운 사람 쪽</text>
  <text x="24" y="128" font-size="16" fill="#475569">회색 칸 = 이미 보트에 탄 사람, 초록 칸 = 이번 반복에 탄 사람</text>
  <text x="24" y="182" font-size="17" fill="#0f172a" font-weight="700">정렬 직후</text>
  <rect x="130" y="158" width="64" height="38" rx="0" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="162.0" y="183.0" font-size="16" fill="#334155" text-anchor="middle" font-family="Consolas, D2Coding, monospace">50</text>
  <rect x="194" y="158" width="64" height="38" rx="0" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="226.0" y="183.0" font-size="16" fill="#334155" text-anchor="middle" font-family="Consolas, D2Coding, monospace">50</text>
  <rect x="258" y="158" width="64" height="38" rx="0" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="290.0" y="183.0" font-size="16" fill="#334155" text-anchor="middle" font-family="Consolas, D2Coding, monospace">70</text>
  <rect x="322" y="158" width="64" height="38" rx="0" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="354.0" y="183.0" font-size="16" fill="#334155" text-anchor="middle" font-family="Consolas, D2Coding, monospace">80</text>
  <path d="M162.0,202 l-8,12 h16 z" fill="#1d4ed8"/>
  <text x="162.0" y="232" font-size="16" fill="#1d4ed8" font-weight="700" text-anchor="middle">lo</text>
  <path d="M354.0,202 l-8,12 h16 z" fill="#b91c1c"/>
  <text x="354.0" y="232" font-size="16" fill="#b91c1c" font-weight="700" text-anchor="middle">hi</text>
  <text x="430" y="176" font-size="16" fill="#334155">lo = 0, hi = 3, boats = 0</text>
  <line x1="24" y1="248" x2="736" y2="248" stroke="#e2e8f0" stroke-width="1"/>
  <text x="24" y="286" font-size="17" fill="#0f172a" font-weight="700">반복 1</text>
  <rect x="130" y="262" width="64" height="38" rx="0" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="162.0" y="287.0" font-size="16" fill="#334155" text-anchor="middle" font-family="Consolas, D2Coding, monospace">50</text>
  <rect x="194" y="262" width="64" height="38" rx="0" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="226.0" y="287.0" font-size="16" fill="#334155" text-anchor="middle" font-family="Consolas, D2Coding, monospace">50</text>
  <rect x="258" y="262" width="64" height="38" rx="0" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="290.0" y="287.0" font-size="16" fill="#334155" text-anchor="middle" font-family="Consolas, D2Coding, monospace">70</text>
  <rect x="322" y="262" width="64" height="38" rx="0" fill="#ecfdf5" stroke="#047857" stroke-width="2.2"/>
  <text x="354.0" y="287.0" font-size="16" fill="#047857" font-weight="700" text-anchor="middle" font-family="Consolas, D2Coding, monospace">80</text>
  <path d="M162.0,306 l-8,12 h16 z" fill="#1d4ed8"/>
  <text x="162.0" y="336" font-size="16" fill="#1d4ed8" font-weight="700" text-anchor="middle">lo</text>
  <path d="M290.0,306 l-8,12 h16 z" fill="#b91c1c"/>
  <text x="290.0" y="336" font-size="16" fill="#b91c1c" font-weight="700" text-anchor="middle">hi</text>
  <text x="430" y="280" font-size="16" fill="#334155">50 + 80 = 130 &gt; 100</text>
  <text x="430" y="306" font-size="16" fill="#334155">80 혼자 탄다, boats = 1</text>
  <line x1="24" y1="352" x2="736" y2="352" stroke="#e2e8f0" stroke-width="1"/>
  <text x="24" y="390" font-size="17" fill="#0f172a" font-weight="700">반복 2</text>
  <rect x="130" y="366" width="64" height="38" rx="0" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="162.0" y="391.0" font-size="16" fill="#334155" text-anchor="middle" font-family="Consolas, D2Coding, monospace">50</text>
  <rect x="194" y="366" width="64" height="38" rx="0" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="226.0" y="391.0" font-size="16" fill="#334155" text-anchor="middle" font-family="Consolas, D2Coding, monospace">50</text>
  <rect x="258" y="366" width="64" height="38" rx="0" fill="#ecfdf5" stroke="#047857" stroke-width="2.2"/>
  <text x="290.0" y="391.0" font-size="16" fill="#047857" font-weight="700" text-anchor="middle" font-family="Consolas, D2Coding, monospace">70</text>
  <rect x="322" y="366" width="64" height="38" rx="0" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="354.0" y="391.0" font-size="16" fill="#64748b" text-anchor="middle" font-family="Consolas, D2Coding, monospace">80</text>
  <path d="M162.0,410 l-8,12 h16 z" fill="#1d4ed8"/>
  <text x="162.0" y="440" font-size="16" fill="#1d4ed8" font-weight="700" text-anchor="middle">lo</text>
  <path d="M226.0,410 l-8,12 h16 z" fill="#b91c1c"/>
  <text x="226.0" y="440" font-size="16" fill="#b91c1c" font-weight="700" text-anchor="middle">hi</text>
  <text x="430" y="384" font-size="16" fill="#334155">50 + 70 = 120 &gt; 100</text>
  <text x="430" y="410" font-size="16" fill="#334155">70 혼자 탄다, boats = 2</text>
  <line x1="24" y1="456" x2="736" y2="456" stroke="#e2e8f0" stroke-width="1"/>
  <text x="24" y="494" font-size="17" fill="#0f172a" font-weight="700">반복 3</text>
  <rect x="130" y="470" width="64" height="38" rx="0" fill="#ecfdf5" stroke="#047857" stroke-width="2.2"/>
  <text x="162.0" y="495.0" font-size="16" fill="#047857" font-weight="700" text-anchor="middle" font-family="Consolas, D2Coding, monospace">50</text>
  <rect x="194" y="470" width="64" height="38" rx="0" fill="#ecfdf5" stroke="#047857" stroke-width="2.2"/>
  <text x="226.0" y="495.0" font-size="16" fill="#047857" font-weight="700" text-anchor="middle" font-family="Consolas, D2Coding, monospace">50</text>
  <rect x="258" y="470" width="64" height="38" rx="0" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="290.0" y="495.0" font-size="16" fill="#64748b" text-anchor="middle" font-family="Consolas, D2Coding, monospace">70</text>
  <rect x="322" y="470" width="64" height="38" rx="0" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="354.0" y="495.0" font-size="16" fill="#64748b" text-anchor="middle" font-family="Consolas, D2Coding, monospace">80</text>
  <text x="130" y="540" font-size="16" fill="#475569">lo = 1, hi = 0 → 엇갈려서 반복 끝</text>
  <text x="430" y="488" font-size="16" fill="#334155">50 + 50 = 100 ≤ 100</text>
  <text x="430" y="514" font-size="16" fill="#334155">두 50 이 같이 탄다, boats = 3</text>
  <line x1="24" y1="560" x2="736" y2="560" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="24" y="574" width="712" height="62" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
  <text x="44" y="600" font-size="17" fill="#047857" font-weight="700">보트 3척 — 주석의 답 3 과 같다.</text>
  <text x="44" y="624" font-size="16" fill="#334155">hi 는 매번 한 칸, lo 는 같이 탈 수 있을 때만 한 칸 들어온다.</text>
</svg>
