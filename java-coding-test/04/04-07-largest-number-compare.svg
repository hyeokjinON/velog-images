<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 934" width="760" height="934" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
  <title>그림 4-7. 가장 큰 수 [3, 30, 34, 5, 9] — 두 수를 이어 붙여 비교하며 이진 삽입 정렬로 자리를 찾는 과정</title>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
  <rect width="760" height="934" fill="#ffffff"/>
  <text x="24" y="40" font-size="22" fill="#0f172a" font-weight="700">가장 큰 수 [3, 30, 34, 5, 9] — 이어 붙여</text>
  <text x="24" y="70" font-size="22" fill="#0f172a" font-weight="700">비교하며 자리를 찾는 과정</text>
  <text x="24" y="104" font-size="16" fill="#475569">초록 칸 = 그 줄에서 끼워 넣은 원소, 회색 칸 = 아직 안 본 원소</text>
  <rect x="24" y="130" width="712" height="108" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
  <text x="44" y="160" font-size="17" fill="#1d4ed8" font-weight="700">두 수의 순서 정하기: "3" 과 "30"</text>
  <text x="44" y="188" font-size="16" fill="#334155" font-family="Consolas, D2Coding, monospace">"3" + "30" = "330",  "30" + "3" = "303"</text>
  <text x="44" y="216" font-size="16" fill="#334155">"330" 이 더 크다 → "3" 이 "30" 보다 앞</text>
  <text x="24" y="286" font-size="17" fill="#0f172a" font-weight="700">run</text>
  <rect x="120" y="262" width="64" height="38" rx="0" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="152.0" y="287.0" font-size="16" fill="#334155" text-anchor="middle" font-family="Consolas, D2Coding, monospace">3</text>
  <rect x="184" y="262" width="64" height="38" rx="0" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="216.0" y="287.0" font-size="16" fill="#334155" text-anchor="middle" font-family="Consolas, D2Coding, monospace">30</text>
  <rect x="248" y="262" width="64" height="38" rx="0" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="280.0" y="287.0" font-size="16" fill="#64748b" text-anchor="middle" font-family="Consolas, D2Coding, monospace">34</text>
  <rect x="312" y="262" width="64" height="38" rx="0" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="344.0" y="287.0" font-size="16" fill="#64748b" text-anchor="middle" font-family="Consolas, D2Coding, monospace">5</text>
  <rect x="376" y="262" width="64" height="38" rx="0" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="408.0" y="287.0" font-size="16" fill="#64748b" text-anchor="middle" font-family="Consolas, D2Coding, monospace">9</text>
  <text x="120" y="326" font-size="16" fill="#334155">["3", "30"] 은 이미 이 순서로 정렬된 구간</text>
  <text x="120" y="350" font-size="16" fill="#334155">"3430" &gt; "3034" 라 34 에서 run 이 끝남</text>
  <line x1="24" y1="380" x2="736" y2="380" stroke="#e2e8f0" stroke-width="1"/>
  <text x="24" y="414" font-size="17" fill="#0f172a" font-weight="700">34 넣기</text>
  <rect x="120" y="390" width="64" height="38" rx="0" fill="#ecfdf5" stroke="#047857" stroke-width="2.2"/>
  <text x="152.0" y="415.0" font-size="16" fill="#047857" font-weight="700" text-anchor="middle" font-family="Consolas, D2Coding, monospace">34</text>
  <rect x="184" y="390" width="64" height="38" rx="0" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="216.0" y="415.0" font-size="16" fill="#334155" text-anchor="middle" font-family="Consolas, D2Coding, monospace">3</text>
  <rect x="248" y="390" width="64" height="38" rx="0" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="280.0" y="415.0" font-size="16" fill="#334155" text-anchor="middle" font-family="Consolas, D2Coding, monospace">30</text>
  <rect x="312" y="390" width="64" height="38" rx="0" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="344.0" y="415.0" font-size="16" fill="#64748b" text-anchor="middle" font-family="Consolas, D2Coding, monospace">5</text>
  <rect x="376" y="390" width="64" height="38" rx="0" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="408.0" y="415.0" font-size="16" fill="#64748b" text-anchor="middle" font-family="Consolas, D2Coding, monospace">9</text>
  <text x="120" y="454" font-size="16" fill="#334155">30 보다 앞, 3 보다도 앞 ("343" &gt; "334")</text>
  <text x="120" y="478" font-size="16" fill="#334155">→ 0번 칸</text>
  <line x1="24" y1="508" x2="736" y2="508" stroke="#e2e8f0" stroke-width="1"/>
  <text x="24" y="542" font-size="17" fill="#0f172a" font-weight="700">5 넣기</text>
  <rect x="120" y="518" width="64" height="38" rx="0" fill="#ecfdf5" stroke="#047857" stroke-width="2.2"/>
  <text x="152.0" y="543.0" font-size="16" fill="#047857" font-weight="700" text-anchor="middle" font-family="Consolas, D2Coding, monospace">5</text>
  <rect x="184" y="518" width="64" height="38" rx="0" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="216.0" y="543.0" font-size="16" fill="#334155" text-anchor="middle" font-family="Consolas, D2Coding, monospace">34</text>
  <rect x="248" y="518" width="64" height="38" rx="0" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="280.0" y="543.0" font-size="16" fill="#334155" text-anchor="middle" font-family="Consolas, D2Coding, monospace">3</text>
  <rect x="312" y="518" width="64" height="38" rx="0" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="344.0" y="543.0" font-size="16" fill="#334155" text-anchor="middle" font-family="Consolas, D2Coding, monospace">30</text>
  <rect x="376" y="518" width="64" height="38" rx="0" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="408.0" y="543.0" font-size="16" fill="#64748b" text-anchor="middle" font-family="Consolas, D2Coding, monospace">9</text>
  <text x="120" y="582" font-size="16" fill="#334155">3 보다 앞, 34 보다도 앞 ("534" &gt; "345")</text>
  <text x="120" y="606" font-size="16" fill="#334155">→ 0번 칸</text>
  <line x1="24" y1="636" x2="736" y2="636" stroke="#e2e8f0" stroke-width="1"/>
  <text x="24" y="670" font-size="17" fill="#0f172a" font-weight="700">9 넣기</text>
  <rect x="120" y="646" width="64" height="38" rx="0" fill="#ecfdf5" stroke="#047857" stroke-width="2.2"/>
  <text x="152.0" y="671.0" font-size="16" fill="#047857" font-weight="700" text-anchor="middle" font-family="Consolas, D2Coding, monospace">9</text>
  <rect x="184" y="646" width="64" height="38" rx="0" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="216.0" y="671.0" font-size="16" fill="#334155" text-anchor="middle" font-family="Consolas, D2Coding, monospace">5</text>
  <rect x="248" y="646" width="64" height="38" rx="0" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="280.0" y="671.0" font-size="16" fill="#334155" text-anchor="middle" font-family="Consolas, D2Coding, monospace">34</text>
  <rect x="312" y="646" width="64" height="38" rx="0" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="344.0" y="671.0" font-size="16" fill="#334155" text-anchor="middle" font-family="Consolas, D2Coding, monospace">3</text>
  <rect x="376" y="646" width="64" height="38" rx="0" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="408.0" y="671.0" font-size="16" fill="#334155" text-anchor="middle" font-family="Consolas, D2Coding, monospace">30</text>
  <text x="120" y="710" font-size="16" fill="#334155">3, 34, 5 보다 모두 앞 ("95" &gt; "59")</text>
  <text x="120" y="734" font-size="16" fill="#334155">→ 0번 칸, 비교는 모두 9번</text>
  <line x1="24" y1="764" x2="736" y2="764" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="24" y="780" width="712" height="60" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
  <text x="44" y="806" font-size="16" fill="#047857" font-weight="700">이어 붙인 비교</text>
  <text x="220" y="806" font-size="17" fill="#047857" font-weight="700" font-family="Consolas, D2Coding, monospace">"9534330"</text>
  <text x="44" y="830" font-size="16" fill="#334155">기대 출력과 같다.</text>
  <rect x="24" y="854" width="712" height="60" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/>
  <text x="44" y="880" font-size="16" fill="#b91c1c" font-weight="700">문자열 내림차순</text>
  <text x="220" y="880" font-size="17" fill="#b91c1c" font-weight="700" font-family="Consolas, D2Coding, monospace">"9534303"</text>
  <text x="44" y="904" font-size="16" fill="#334155">"30" 이 "3" 보다 앞에 와서 틀린다.</text>
</svg>
