<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 590" width="760" height="590" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
  <title>그림 4-8b. H-Index 계수 풀이 — cnt 배열을 뒤에서부터 더해 h 번 이상 인용된 논문 수를 센다</title>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
  <rect width="760" height="590" fill="#ffffff"/>
  <text x="24" y="40" font-size="22" fill="#0f172a" font-weight="700">H-Index 계수 풀이 — cnt 배열을 뒤에서부터</text>
  <text x="24" y="70" font-size="22" fill="#0f172a" font-weight="700">더해 h 번 이상 인용된 논문 수를 센다</text>
  <text x="24" y="104" font-size="16" fill="#475569">입력 [3, 0, 6, 1, 5], n = 5, cnt 칸 번호 = 인용 횟수 (5 이상은 5번 칸)</text>
  <text x="24" y="138" font-size="18" fill="#1d4ed8" font-weight="700">① cnt 채우기 — cnt[Math.min(c, n)]++</text>
  <text x="185.0" y="170" font-size="16" fill="#475569" text-anchor="middle">[0]</text>
  <text x="255.0" y="170" font-size="16" fill="#475569" text-anchor="middle">[1]</text>
  <text x="325.0" y="170" font-size="16" fill="#475569" text-anchor="middle">[2]</text>
  <text x="395.0" y="170" font-size="16" fill="#475569" text-anchor="middle">[3]</text>
  <text x="465.0" y="170" font-size="16" fill="#475569" text-anchor="middle">[4]</text>
  <text x="535.0" y="170" font-size="16" fill="#475569" text-anchor="middle">[5]</text>
  <rect x="150" y="178" width="70" height="40" rx="0" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="185.0" y="204.0" font-size="16" fill="#334155" text-anchor="middle" font-family="Consolas, D2Coding, monospace">1</text>
  <rect x="220" y="178" width="70" height="40" rx="0" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="255.0" y="204.0" font-size="16" fill="#334155" text-anchor="middle" font-family="Consolas, D2Coding, monospace">1</text>
  <rect x="290" y="178" width="70" height="40" rx="0" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="325.0" y="204.0" font-size="16" fill="#334155" text-anchor="middle" font-family="Consolas, D2Coding, monospace">0</text>
  <rect x="360" y="178" width="70" height="40" rx="0" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="395.0" y="204.0" font-size="16" fill="#334155" text-anchor="middle" font-family="Consolas, D2Coding, monospace">1</text>
  <rect x="430" y="178" width="70" height="40" rx="0" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="465.0" y="204.0" font-size="16" fill="#334155" text-anchor="middle" font-family="Consolas, D2Coding, monospace">0</text>
  <rect x="500" y="178" width="70" height="40" rx="0" fill="#ecfdf5" stroke="#047857" stroke-width="2.2"/>
  <text x="535.0" y="204.0" font-size="16" fill="#047857" font-weight="700" text-anchor="middle" font-family="Consolas, D2Coding, monospace">2</text>
  <text x="24" y="204" font-size="17" fill="#1d4ed8" font-weight="700" font-family="Consolas, D2Coding, monospace">cnt</text>
  <text x="150" y="244" font-size="16" fill="#334155">0 → [0], 1 → [1], 3 → [3], 5 → [5]</text>
  <text x="150" y="270" font-size="16" fill="#047857">6 은 n = 5 를 넘어서 5번 칸으로 (h 는 5 를 넘을 수 없다)</text>
  <line x1="24" y1="294" x2="736" y2="294" stroke="#e2e8f0" stroke-width="1"/>
  <text x="24" y="318" font-size="18" fill="#1d4ed8" font-weight="700">② h = 5 부터 거꾸로 atLeast 더하기</text>
  <rect x="24" y="338" width="712" height="44" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="44" y="366" font-size="16" fill="#0f172a" font-weight="700">h = 5</text>
  <text x="130" y="366" font-size="16" fill="#334155" font-family="Consolas, D2Coding, monospace">atLeast = 0 + cnt[5] = 2</text>
  <text x="470" y="366" font-size="16" fill="#334155">2 ≥ 5 거짓</text>
  <rect x="24" y="392" width="712" height="44" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="44" y="420" font-size="16" fill="#0f172a" font-weight="700">h = 4</text>
  <text x="130" y="420" font-size="16" fill="#334155" font-family="Consolas, D2Coding, monospace">atLeast = 2 + cnt[4] = 2</text>
  <text x="470" y="420" font-size="16" fill="#334155">2 ≥ 4 거짓</text>
  <rect x="24" y="446" width="712" height="44" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.8"/>
  <text x="44" y="474" font-size="16" fill="#0f172a" font-weight="700">h = 3</text>
  <text x="130" y="474" font-size="16" fill="#334155" font-family="Consolas, D2Coding, monospace">atLeast = 2 + cnt[3] = 3</text>
  <text x="470" y="474" font-size="16" fill="#047857" font-weight="700">3 ≥ 3 참 → return 3</text>
  <rect x="24" y="508" width="712" height="62" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
  <text x="44" y="534" font-size="17" fill="#047857" font-weight="700">답 3 — 정렬 풀이와 같다.</text>
  <text x="44" y="558" font-size="16" fill="#334155">정렬 없이 배열을 두 번 훑어 O(n) 에 끝났다.</text>
</svg>
