<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" width="760" height="640" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
  <title>그림 1-1. n = 100,000 일 때 복잡도별 연산 횟수 — 1초에 약 1억 번 선을 넘는 것은 O(n²) 이다</title>
  <rect width="760" height="640" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
  <text x="24" y="40" font-size="22" fill="#0f172a" font-weight="700">n = 100,000 일 때 복잡도별 연산 횟수 —</text>
  <text x="24" y="70" font-size="20" fill="#0f172a" font-weight="700">1초에 약 1억 번 선을 넘는 것은 O(n²) 이다</text>
  <text x="24" y="104" font-size="16" fill="#475569">가로축은 로그 눈금이다. 눈금 한 칸마다 100배씩 커진다.</text>
  <text x="24" y="128" font-size="16" fill="#475569">값은 본문 1-3절 표의 계산값이다. 초록 = 통과, 빨강 = 시간초과</text>
  <rect x="24" y="160" width="712" height="460" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="48" y="210" font-size="17" fill="#0f172a" font-weight="700" font-family="Consolas, D2Coding, monospace">O(log n)</text>
  <text x="48" y="234" font-size="16" fill="#475569">이분탐색</text>
  <rect x="250" y="194" width="52.89" height="30" rx="3" fill="#047857" stroke="#047857" stroke-width="1"/>
  <text x="312.89" y="215" font-size="16" fill="#047857" font-weight="700">17번</text>
  <text x="48" y="280" font-size="17" fill="#0f172a" font-weight="700" font-family="Consolas, D2Coding, monospace">O(n)</text>
  <text x="48" y="304" font-size="16" fill="#475569">한 번 훑기</text>
  <rect x="250" y="264" width="215.0" height="30" rx="3" fill="#047857" stroke="#047857" stroke-width="1"/>
  <text x="455.0" y="285" font-size="16" fill="#ffffff" font-weight="700" text-anchor="end">10만 번</text>
  <text x="48" y="350" font-size="17" fill="#0f172a" font-weight="700" font-family="Consolas, D2Coding, monospace">O(n log n)</text>
  <text x="48" y="374" font-size="16" fill="#475569">정렬</text>
  <rect x="250" y="334" width="267.46" height="30" rx="3" fill="#047857" stroke="#047857" stroke-width="1"/>
  <text x="507.46000000000004" y="355" font-size="16" fill="#ffffff" font-weight="700" text-anchor="end">약 170만 번</text>
  <text x="48" y="420" font-size="17" fill="#0f172a" font-weight="700" font-family="Consolas, D2Coding, monospace">O(n²)</text>
  <text x="48" y="444" font-size="16" fill="#475569">모든 쌍 비교</text>
  <rect x="250" y="404" width="430.0" height="30" rx="3" fill="#b91c1c" stroke="#b91c1c" stroke-width="1"/>
  <text x="670.0" y="425" font-size="16" fill="#ffffff" font-weight="700" text-anchor="end">100억 번</text>
  <line x1="250" y1="476" x2="680" y2="476" stroke="#334155" stroke-width="1.5"/>
  <line x1="250" y1="476" x2="250" y2="484" stroke="#334155" stroke-width="1.5"/>
  <text x="250" y="504" font-size="16" fill="#334155" text-anchor="middle">1</text>
  <line x1="336" y1="476" x2="336" y2="484" stroke="#334155" stroke-width="1.5"/>
  <text x="336" y="504" font-size="16" fill="#334155" text-anchor="middle">100</text>
  <line x1="422" y1="476" x2="422" y2="484" stroke="#334155" stroke-width="1.5"/>
  <text x="422" y="504" font-size="16" fill="#334155" text-anchor="middle">1만</text>
  <line x1="508" y1="476" x2="508" y2="484" stroke="#334155" stroke-width="1.5"/>
  <text x="508" y="504" font-size="16" fill="#334155" text-anchor="middle">100만</text>
  <line x1="594" y1="476" x2="594" y2="484" stroke="#334155" stroke-width="1.5"/>
  <text x="594" y="504" font-size="16" fill="#334155" text-anchor="middle">1억</text>
  <line x1="680" y1="476" x2="680" y2="484" stroke="#334155" stroke-width="1.5"/>
  <text x="680" y="504" font-size="16" fill="#334155" text-anchor="middle">100억</text>
  <line x1="594" y1="176" x2="594" y2="476" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="588" y="184" font-size="16" fill="#b91c1c" font-weight="700" text-anchor="end">1억 번 ≈ 1초</text>
  <text x="48" y="538" font-size="16" fill="#334155">O(n²) 은 1억 번 선을 100배 넘어 약 100초가 걸린다.</text>
  <text x="48" y="564" font-size="16" fill="#334155">O(n log n) 의 약 170만 번은 약 0.02초다.</text>
  <text x="48" y="590" font-size="16" fill="#334155">O(2ⁿ), O(n!) 은 n = 100,000 에서 그릴 수 없을 만큼 크다.</text>
</svg>
