<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 860" width="760" height="860" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
  <title>그림 1-3. ArrayList 안의 배열 — 끝에 넣기는 빈 칸에 쓰고, 앞에 넣기와 contains 는 원소 전부를 건드린다</title>
  <rect width="760" height="860" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
  <text x="24" y="40" font-size="22" fill="#0f172a" font-weight="700">ArrayList 안의 배열(elementData) —</text>
  <text x="24" y="70" font-size="20" fill="#0f172a" font-weight="700">끝에 넣기는 빈 칸에 쓰고, 앞에 넣기는 전부 민다</text>
  <text x="24" y="104" font-size="16" fill="#475569">JDK 21 에서 실행하고 리플렉션으로 배열 칸 수를 찍어 확인했다.</text>
  <rect x="24" y="130" width="712" height="260" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="50" cy="160" r="13" fill="#1d4ed8"/>
  <text x="50" y="166" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle">1</text>
  <text x="74" y="166" font-size="17" fill="#0f172a" font-weight="700">끝에 넣기 add(x) — 다 찼을 때만 1.5배 배열로 옮긴다</text>
  <text x="48" y="202" font-size="16" fill="#334155">10칸이 다 찬 배열 (size 10)</text>
  <rect x="48" y="212" width="42" height="40" rx="3" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="69.0" y="238.0" font-size="16" fill="#0f172a" font-weight="700" font-family="Consolas, D2Coding, monospace" text-anchor="middle">1</text>
  <rect x="90" y="212" width="42" height="40" rx="3" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="111.0" y="238.0" font-size="16" fill="#0f172a" font-weight="700" font-family="Consolas, D2Coding, monospace" text-anchor="middle">2</text>
  <rect x="132" y="212" width="42" height="40" rx="3" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="153.0" y="238.0" font-size="16" fill="#0f172a" font-weight="700" font-family="Consolas, D2Coding, monospace" text-anchor="middle">3</text>
  <rect x="174" y="212" width="42" height="40" rx="3" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="195.0" y="238.0" font-size="16" fill="#0f172a" font-weight="700" font-family="Consolas, D2Coding, monospace" text-anchor="middle">4</text>
  <rect x="216" y="212" width="42" height="40" rx="3" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="237.0" y="238.0" font-size="16" fill="#0f172a" font-weight="700" font-family="Consolas, D2Coding, monospace" text-anchor="middle">5</text>
  <rect x="258" y="212" width="42" height="40" rx="3" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="279.0" y="238.0" font-size="16" fill="#0f172a" font-weight="700" font-family="Consolas, D2Coding, monospace" text-anchor="middle">6</text>
  <rect x="300" y="212" width="42" height="40" rx="3" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="321.0" y="238.0" font-size="16" fill="#0f172a" font-weight="700" font-family="Consolas, D2Coding, monospace" text-anchor="middle">7</text>
  <rect x="342" y="212" width="42" height="40" rx="3" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="363.0" y="238.0" font-size="16" fill="#0f172a" font-weight="700" font-family="Consolas, D2Coding, monospace" text-anchor="middle">8</text>
  <rect x="384" y="212" width="42" height="40" rx="3" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="405.0" y="238.0" font-size="16" fill="#0f172a" font-weight="700" font-family="Consolas, D2Coding, monospace" text-anchor="middle">9</text>
  <rect x="426" y="212" width="42" height="40" rx="3" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="447.0" y="238.0" font-size="16" fill="#0f172a" font-weight="700" font-family="Consolas, D2Coding, monospace" text-anchor="middle">10</text>
  <text x="480" y="238" font-size="16" fill="#b91c1c" font-weight="700">← 빈 칸 없음</text>
  <line x1="160" y1="258" x2="160" y2="288" stroke="#334155" stroke-width="2" marker-end="url(#ak)"/>
  <text x="176" y="280" font-size="16" fill="#334155">11번째 add: 15칸 배열을 만들고 10개를 옮겨 적은 뒤 11 을 쓴다</text>
  <rect x="48" y="296" width="42" height="40" rx="3" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
  <text x="69.0" y="322.0" font-size="16" fill="#334155" font-family="Consolas, D2Coding, monospace" text-anchor="middle">1</text>
  <rect x="90" y="296" width="42" height="40" rx="3" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
  <text x="111.0" y="322.0" font-size="16" fill="#334155" font-family="Consolas, D2Coding, monospace" text-anchor="middle">2</text>
  <rect x="132" y="296" width="42" height="40" rx="3" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
  <text x="153.0" y="322.0" font-size="16" fill="#334155" font-family="Consolas, D2Coding, monospace" text-anchor="middle">3</text>
  <rect x="174" y="296" width="42" height="40" rx="3" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
  <text x="195.0" y="322.0" font-size="16" fill="#334155" font-family="Consolas, D2Coding, monospace" text-anchor="middle">4</text>
  <rect x="216" y="296" width="42" height="40" rx="3" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
  <text x="237.0" y="322.0" font-size="16" fill="#334155" font-family="Consolas, D2Coding, monospace" text-anchor="middle">5</text>
  <rect x="258" y="296" width="42" height="40" rx="3" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
  <text x="279.0" y="322.0" font-size="16" fill="#334155" font-family="Consolas, D2Coding, monospace" text-anchor="middle">6</text>
  <rect x="300" y="296" width="42" height="40" rx="3" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
  <text x="321.0" y="322.0" font-size="16" fill="#334155" font-family="Consolas, D2Coding, monospace" text-anchor="middle">7</text>
  <rect x="342" y="296" width="42" height="40" rx="3" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
  <text x="363.0" y="322.0" font-size="16" fill="#334155" font-family="Consolas, D2Coding, monospace" text-anchor="middle">8</text>
  <rect x="384" y="296" width="42" height="40" rx="3" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
  <text x="405.0" y="322.0" font-size="16" fill="#334155" font-family="Consolas, D2Coding, monospace" text-anchor="middle">9</text>
  <rect x="426" y="296" width="42" height="40" rx="3" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
  <text x="447.0" y="322.0" font-size="16" fill="#334155" font-family="Consolas, D2Coding, monospace" text-anchor="middle">10</text>
  <rect x="468" y="296" width="42" height="40" rx="3" fill="#dcfce7" stroke="#047857" stroke-width="1.5"/>
  <text x="489.0" y="322.0" font-size="16" fill="#047857" font-weight="700" font-family="Consolas, D2Coding, monospace" text-anchor="middle">11</text>
  <rect x="510" y="296" width="42" height="40" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="552" y="296" width="42" height="40" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="594" y="296" width="42" height="40" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="636" y="296" width="42" height="40" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="48" y="370" font-size="16" fill="#047857" font-weight="700">실행 확인: 칸 수 0 → 10(첫 add) → 15(11번째) → 22(16번째)</text>
  <rect x="24" y="406" width="712" height="220" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="50" cy="436" r="13" fill="#1d4ed8"/>
  <text x="50" y="442" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle">2</text>
  <text x="74" y="442" font-size="17" fill="#0f172a" font-weight="700">앞에 넣기 add(0, "x") — 뒤 원소를 한 칸씩 전부 민다</text>
  <text x="48" y="492" font-size="16" fill="#334155">넣기 전</text>
  <rect x="150" y="466" width="64" height="40" rx="3" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="182.0" y="492.0" font-size="17" fill="#0f172a" font-weight="700" font-family="Consolas, D2Coding, monospace" text-anchor="middle">a</text>
  <rect x="214" y="466" width="64" height="40" rx="3" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="246.0" y="492.0" font-size="17" fill="#0f172a" font-weight="700" font-family="Consolas, D2Coding, monospace" text-anchor="middle">b</text>
  <rect x="278" y="466" width="64" height="40" rx="3" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="310.0" y="492.0" font-size="17" fill="#0f172a" font-weight="700" font-family="Consolas, D2Coding, monospace" text-anchor="middle">c</text>
  <rect x="342" y="466" width="64" height="40" rx="3" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="374.0" y="492.0" font-size="17" fill="#0f172a" font-weight="700" font-family="Consolas, D2Coding, monospace" text-anchor="middle">d</text>
  <rect x="406" y="466" width="64" height="40" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <path d="M374.0,510 Q406.0,536 434.0,546" stroke="#b91c1c" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <path d="M310.0,510 Q342.0,536 370.0,546" stroke="#b91c1c" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <path d="M246.0,510 Q278.0,536 306.0,546" stroke="#b91c1c" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <path d="M182.0,510 Q214.0,536 242.0,546" stroke="#b91c1c" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <text x="48" y="586" font-size="16" fill="#334155">넣은 뒤</text>
  <rect x="150" y="560" width="64" height="40" rx="3" fill="#dcfce7" stroke="#047857" stroke-width="1.5"/>
  <text x="182.0" y="586.0" font-size="17" fill="#047857" font-weight="700" font-family="Consolas, D2Coding, monospace" text-anchor="middle">x</text>
  <rect x="214" y="560" width="64" height="40" rx="3" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="246.0" y="586.0" font-size="17" fill="#0f172a" font-weight="700" font-family="Consolas, D2Coding, monospace" text-anchor="middle">a</text>
  <rect x="278" y="560" width="64" height="40" rx="3" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="310.0" y="586.0" font-size="17" fill="#0f172a" font-weight="700" font-family="Consolas, D2Coding, monospace" text-anchor="middle">b</text>
  <rect x="342" y="560" width="64" height="40" rx="3" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="374.0" y="586.0" font-size="17" fill="#0f172a" font-weight="700" font-family="Consolas, D2Coding, monospace" text-anchor="middle">c</text>
  <rect x="406" y="560" width="64" height="40" rx="3" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="438.0" y="586.0" font-size="17" fill="#0f172a" font-weight="700" font-family="Consolas, D2Coding, monospace" text-anchor="middle">d</text>
  <text x="490" y="530" font-size="16" fill="#b91c1c" font-weight="700">d, c, b, a 순서로</text>
  <text x="490" y="554" font-size="16" fill="#b91c1c" font-weight="700">4번 옮김 = 원소 수 n</text>
  <rect x="24" y="642" width="712" height="196" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="50" cy="672" r="13" fill="#1d4ed8"/>
  <text x="50" y="678" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle">3</text>
  <text x="74" y="678" font-size="17" fill="#0f172a" font-weight="700">contains("z") — 0번 칸부터 하나씩 equals 로 비교한다</text>
  <rect x="150" y="702" width="64" height="40" rx="3" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="182.0" y="728.0" font-size="17" fill="#0f172a" font-weight="700" font-family="Consolas, D2Coding, monospace" text-anchor="middle">a</text>
  <text x="182.0" y="770" font-size="16" fill="#b91c1c" text-anchor="middle">비교 1</text>
  <text x="182.0" y="794" font-size="16" fill="#b91c1c" font-weight="700" font-family="Consolas, D2Coding, monospace" text-anchor="middle">≠ z</text>
  <rect x="214" y="702" width="64" height="40" rx="3" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="246.0" y="728.0" font-size="17" fill="#0f172a" font-weight="700" font-family="Consolas, D2Coding, monospace" text-anchor="middle">b</text>
  <text x="246.0" y="770" font-size="16" fill="#b91c1c" text-anchor="middle">비교 2</text>
  <text x="246.0" y="794" font-size="16" fill="#b91c1c" font-weight="700" font-family="Consolas, D2Coding, monospace" text-anchor="middle">≠ z</text>
  <rect x="278" y="702" width="64" height="40" rx="3" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="310.0" y="728.0" font-size="17" fill="#0f172a" font-weight="700" font-family="Consolas, D2Coding, monospace" text-anchor="middle">c</text>
  <text x="310.0" y="770" font-size="16" fill="#b91c1c" text-anchor="middle">비교 3</text>
  <text x="310.0" y="794" font-size="16" fill="#b91c1c" font-weight="700" font-family="Consolas, D2Coding, monospace" text-anchor="middle">≠ z</text>
  <rect x="342" y="702" width="64" height="40" rx="3" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="374.0" y="728.0" font-size="17" fill="#0f172a" font-weight="700" font-family="Consolas, D2Coding, monospace" text-anchor="middle">d</text>
  <text x="374.0" y="770" font-size="16" fill="#b91c1c" text-anchor="middle">비교 4</text>
  <text x="374.0" y="794" font-size="16" fill="#b91c1c" font-weight="700" font-family="Consolas, D2Coding, monospace" text-anchor="middle">≠ z</text>
  <text x="48" y="728" font-size="16" fill="#334155">찾는 값 z</text>
  <text x="426" y="728" font-size="16" fill="#b91c1c" font-weight="700">→ 끝까지 없어서 false</text>
  <text x="426" y="754" font-size="16" fill="#b91c1c" font-weight="700">비교 4번 = 원소 수 n</text>
  <text x="48" y="826" font-size="16" fill="#475569">indexOf 도 같은 방식이다. 찾으면 그 자리에서 멈춘다.</text>
</svg>
