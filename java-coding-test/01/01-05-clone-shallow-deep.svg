  <text x="80" y="732" font-size="16" fill="#475569" font-family="Consolas, D2Coding, monospace" text-anchor="end">1</text>
  <rect x="330" y="536" width="60" height="40" rx="3" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="360.0" y="562.0" font-size="17" fill="#0f172a" font-weight="700" font-family="Consolas, D2Coding, monospace" text-anchor="middle">99</text>
  <rect x="390" y="536" width="60" height="40" rx="3" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="420.0" y="562.0" font-size="17" fill="#0f172a" font-weight="700" font-family="Consolas, D2Coding, monospace" text-anchor="middle">2</text>
  <rect x="330" y="586" width="60" height="40" rx="3" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="360.0" y="612.0" font-size="17" fill="#0f172a" font-weight="700" font-family="Consolas, D2Coding, monospace" text-anchor="middle">3</text>
  <rect x="390" y="586" width="60" height="40" rx="3" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="420.0" y="612.0" font-size="17" fill="#0f172a" font-weight="700" font-family="Consolas, D2Coding, monospace" text-anchor="middle">4</text>
  <rect x="560" y="650" width="60" height="40" rx="3" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="590.0" y="676.0" font-size="17" fill="#0f172a" font-weight="700" font-family="Consolas, D2Coding, monospace" text-anchor="middle">99</text>
  <rect x="620" y="650" width="60" height="40" rx="3" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="650.0" y="676.0" font-size="17" fill="#0f172a" font-weight="700" font-family="Consolas, D2Coding, monospace" text-anchor="middle">2</text>
  <rect x="560" y="700" width="60" height="40" rx="3" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="590.0" y="726.0" font-size="17" fill="#0f172a" font-weight="700" font-family="Consolas, D2Coding, monospace" text-anchor="middle">3</text>
  <rect x="620" y="700" width="60" height="40" rx="3" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="650.0" y="726.0" font-size="17" fill="#0f172a" font-weight="700" font-family="Consolas, D2Coding, monospace" text-anchor="middle">77</text>
  <rect x="620" y="700" width="60" height="40" rx="3" fill="#dcfce7" stroke="#047857" stroke-width="1.5"/>
  <text x="650" y="726" font-size="17" fill="#047857" font-weight="700" font-family="Consolas, D2Coding, monospace" text-anchor="middle">77</text>
