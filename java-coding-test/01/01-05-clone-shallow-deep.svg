  <text x="74" y="502" font-size="17" fill="#0f172a" font-weight="700" font-family="Consolas, D2Coding, monospace">deep[i] = grid[i].clone(); deep[1][1] = 77;</text>
  <text x="90" y="540" font-size="16" fill="#334155" font-weight="700" font-family="Consolas, D2Coding, monospace">grid</text>
