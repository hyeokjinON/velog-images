  <rect x="470" y="300" width="60" height="40" rx="3" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="500.0" y="326.0" font-size="17" fill="#0f172a" font-weight="700" font-family="Consolas, D2Coding, monospace" text-anchor="middle">3</text>
  <rect x="530" y="300" width="60" height="40" rx="3" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="560.0" y="326.0" font-size="17" fill="#0f172a" font-weight="700" font-family="Consolas, D2Coding, monospace" text-anchor="middle">4</text>
  <line x1="146" y1="238" x2="466" y2="230" stroke="#334155" stroke-width="2" marker-end="url(#ak)"/>
  <line x1="146" y1="278" x2="466" y2="318" stroke="#334155" stroke-width="2" marker-end="url(#ak)"/>
