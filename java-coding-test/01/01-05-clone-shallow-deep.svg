  <circle cx="50" cy="160" r="13" fill="#1d4ed8"/>
  <text x="50" y="166" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle">1</text>
  <text x="74" y="166" font-size="17" fill="#0f172a" font-weight="700" font-family="Consolas, D2Coding, monospace">shallow = grid.clone(); shallow[0][0] = 99;</text>
  <text x="90" y="208" font-size="16" fill="#334155" font-weight="700" font-family="Consolas, D2Coding, monospace">grid</text>
  <rect x="90" y="218" width="56" height="40" rx="3" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="118.0" y="244.0" font-size="16" fill="#334155" font-weight="700" font-family="Consolas, D2Coding, monospace" text-anchor="middle">●</text>
