  <text x="90" y="338" font-size="16" fill="#b91c1c" font-weight="700" font-family="Consolas, D2Coding, monospace">shallow</text>
  <rect x="90" y="348" width="56" height="40" rx="3" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="118.0" y="374.0" font-size="16" fill="#b91c1c" font-weight="700" font-family="Consolas, D2Coding, monospace" text-anchor="middle">●</text>
  <rect x="90" y="388" width="56" height="40" rx="3" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/>
