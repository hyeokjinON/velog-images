  <text x="118.0" y="692.0" font-size="16" fill="#047857" font-weight="700" font-family="Consolas, D2Coding, monospace" text-anchor="middle">●</text>
  <rect x="90" y="706" width="56" height="40" rx="3" fill="#ffffff" stroke="#047857" stroke-width="1.5"/>
  <text x="118.0" y="732.0" font-size="16" fill="#047857" font-weight="700" font-family="Consolas, D2Coding, monospace" text-anchor="middle">●</text>
