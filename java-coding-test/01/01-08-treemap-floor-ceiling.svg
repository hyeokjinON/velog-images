<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 780" width="760" height="780" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
  <title>그림 1-8. TreeMap 의 floor, ceiling, lower, higher 가 85 와 80 에서 고르는 키</title>
  <rect width="760" height="780" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
  <text x="24" y="40" font-size="22" fill="#0f172a" font-weight="700">TreeMap 의 floor, ceiling, lower, higher 가</text>
  <text x="24" y="70" font-size="20" fill="#0f172a" font-weight="700">85 와 80 에서 고르는 키</text>
  <text x="24" y="104" font-size="16" fill="#475569">cut = {0=F, 70=C, 80=B, 90=A}. 수직선의 간격은 값이 아니라 순서만 나타낸다.</text>
  <rect x="24" y="132" width="712" height="300" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="50" cy="162" r="13" fill="#1d4ed8"/>
  <text x="50" y="168" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle">1</text>
  <text x="74" y="168" font-size="17" fill="#0f172a" font-weight="700">x = 85 (키가 아니다)</text>
  <line x1="60" y1="270" x2="700" y2="270" stroke="#334155" stroke-width="2"/>
  <circle cx="110" cy="270" r="9" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="110" y="304" font-size="16" fill="#0f172a" font-weight="700" font-family="Consolas, D2Coding, monospace" text-anchor="middle">0=F</text>
  <circle cx="280" cy="270" r="9" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="280" y="304" font-size="16" fill="#0f172a" font-weight="700" font-family="Consolas, D2Coding, monospace" text-anchor="middle">70=C</text>
  <circle cx="450" cy="270" r="9" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="450" y="304" font-size="16" fill="#0f172a" font-weight="700" font-family="Consolas, D2Coding, monospace" text-anchor="middle">80=B</text>
  <circle cx="620" cy="270" r="9" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="620" y="304" font-size="16" fill="#0f172a" font-weight="700" font-family="Consolas, D2Coding, monospace" text-anchor="middle">90=A</text>
  <text x="535" y="200" font-size="16" fill="#b91c1c" font-weight="700" font-family="Consolas, D2Coding, monospace" text-anchor="middle">x = 85</text>
  <line x1="535" y1="208" x2="535" y2="256" stroke="#b91c1c" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M527,248 Q492.5,214 458,256" stroke="#1d4ed8" stroke-width="2.5" fill="none" marker-end="url(#ab)"/>
  <path d="M543,248 Q577.5,214 612,256" stroke="#047857" stroke-width="2.5" fill="none" marker-end="url(#ag)"/>
  <text x="48" y="344" font-size="16" fill="#1d4ed8" font-weight="700" font-family="Consolas, D2Coding, monospace">floorKey(85) = 80</text>
  <text x="250" y="344" font-size="16" fill="#1d4ed8">85 이하 최대</text>
  <text x="400" y="344" font-size="16" fill="#047857" font-weight="700" font-family="Consolas, D2Coding, monospace">ceilingKey(85) = 90</text>
  <text x="610" y="344" font-size="16" fill="#047857">85 이상 최소</text>
  <text x="48" y="374" font-size="16" fill="#1d4ed8" font-weight="700" font-family="Consolas, D2Coding, monospace">lowerKey(85) = 80</text>
  <text x="250" y="374" font-size="16" fill="#1d4ed8">85 미만 최대</text>
  <text x="400" y="374" font-size="16" fill="#047857" font-weight="700" font-family="Consolas, D2Coding, monospace">higherKey(85) = 90</text>
  <text x="610" y="374" font-size="16" fill="#047857">85 초과 최소</text>
  <text x="48" y="410" font-size="16" fill="#334155">85 가 키가 아니라서 "이하" 와 "미만", "이상" 과 "초과" 가 같은 키를 고른다.</text>
  <rect x="24" y="448" width="712" height="300" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="50" cy="478" r="13" fill="#1d4ed8"/>
  <text x="50" y="484" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle">2</text>
  <text x="74" y="484" font-size="17" fill="#0f172a" font-weight="700">x = 80 (키다)</text>
  <line x1="60" y1="586" x2="700" y2="586" stroke="#334155" stroke-width="2"/>
  <circle cx="110" cy="586" r="9" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="110" y="620" font-size="16" fill="#0f172a" font-weight="700" font-family="Consolas, D2Coding, monospace" text-anchor="middle">0=F</text>
  <circle cx="280" cy="586" r="9" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="280" y="620" font-size="16" fill="#0f172a" font-weight="700" font-family="Consolas, D2Coding, monospace" text-anchor="middle">70=C</text>
  <circle cx="450" cy="586" r="9" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="450" y="620" font-size="16" fill="#0f172a" font-weight="700" font-family="Consolas, D2Coding, monospace" text-anchor="middle">80=B</text>
  <circle cx="620" cy="586" r="9" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="620" y="620" font-size="16" fill="#0f172a" font-weight="700" font-family="Consolas, D2Coding, monospace" text-anchor="middle">90=A</text>
  <circle cx="450" cy="586" r="15" fill="none" stroke="#b91c1c" stroke-width="3"/>
  <text x="450" y="516" font-size="16" fill="#b91c1c" font-weight="700" font-family="Consolas, D2Coding, monospace" text-anchor="middle">x = 80</text>
  <line x1="450" y1="524" x2="450" y2="566" stroke="#b91c1c" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M436,570 Q365.0,526 288,572" stroke="#1d4ed8" stroke-width="2.5" fill="none" marker-end="url(#ab)"/>
  <path d="M464,570 Q535.0,526 612,572" stroke="#047857" stroke-width="2.5" fill="none" marker-end="url(#ag)"/>
  <text x="48" y="660" font-size="16" fill="#1d4ed8" font-weight="700" font-family="Consolas, D2Coding, monospace">floorKey(80) = 80</text>
  <text x="250" y="660" font-size="16" fill="#1d4ed8">자기 자신</text>
  <text x="400" y="660" font-size="16" fill="#047857" font-weight="700" font-family="Consolas, D2Coding, monospace">ceilingKey(80) = 80</text>
  <text x="610" y="660" font-size="16" fill="#047857">자기 자신</text>
  <text x="48" y="690" font-size="16" fill="#1d4ed8" font-weight="700" font-family="Consolas, D2Coding, monospace">lowerKey(80) = 70</text>
  <text x="250" y="690" font-size="16" fill="#1d4ed8">한 칸 왼쪽</text>
  <text x="400" y="690" font-size="16" fill="#047857" font-weight="700" font-family="Consolas, D2Coding, monospace">higherKey(80) = 90</text>
  <text x="610" y="690" font-size="16" fill="#047857">한 칸 오른쪽</text>
  <text x="48" y="726" font-size="16" fill="#334155">고를 키가 없으면 null: floorKey(-1), higherKey(95) 가 null 이었다.</text>
</svg>
