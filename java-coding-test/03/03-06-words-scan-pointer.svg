<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 700" width="760" height="700" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
  <title>그림 3-6. 숫자 문자열과 영단어 풀이 B — 위치 i 에서 숫자면 한 칸, 영단어면 단어 길이만큼 건너뛴다 ("one4seveneight")</title>
  <rect width="760" height="700" fill="#ffffff"/>
  <text x="24" y="40" font-size="22" font-weight="700" fill="#0f172a">숫자 문자열과 영단어 풀이 B — 위치 i 에서 숫자면</text>
  <text x="24" y="70" font-size="22" font-weight="700" fill="#0f172a">한 칸, 영단어면 단어 길이만큼 건너뛴다</text>
  <text x="24" y="104" font-size="16" fill="#475569">입력은 예제 1 "one4seveneight" (14자)다. 칸 위의 숫자는 위치(인덱스),</text>
  <text x="24" y="128" font-size="16" fill="#475569">칸 아래 막대는 한 번의 반복이 읽고 건너뛴 구간이다.</text>

  <g font-family="Consolas, monospace" font-size="16" fill="#64748b" text-anchor="middle">
    <text x="89" y="164">0</text><text x="135" y="164">1</text><text x="181" y="164">2</text><text x="227" y="164">3</text><text x="273" y="164">4</text><text x="319" y="164">5</text><text x="365" y="164">6</text><text x="411" y="164">7</text><text x="457" y="164">8</text><text x="503" y="164">9</text><text x="549" y="164">10</text><text x="595" y="164">11</text><text x="641" y="164">12</text><text x="687" y="164">13</text>
  </g>
  <g stroke="#cbd5e1" fill="#f8fafc">
    <rect x="66" y="172" width="46" height="42"/><rect x="112" y="172" width="46" height="42"/><rect x="158" y="172" width="46" height="42"/>
    <rect x="204" y="172" width="46" height="42" fill="#f1f5f9"/>
    <rect x="250" y="172" width="46" height="42"/><rect x="296" y="172" width="46" height="42"/><rect x="342" y="172" width="46" height="42"/><rect x="388" y="172" width="46" height="42"/><rect x="434" y="172" width="46" height="42"/>
    <rect x="480" y="172" width="46" height="42"/><rect x="526" y="172" width="46" height="42"/><rect x="572" y="172" width="46" height="42"/><rect x="618" y="172" width="46" height="42"/><rect x="664" y="172" width="46" height="42"/>
  </g>
  <g font-family="Consolas, monospace" font-size="18" fill="#0f172a" text-anchor="middle">
    <text x="89" y="199">o</text><text x="135" y="199">n</text><text x="181" y="199">e</text><text x="227" y="199" font-weight="700">4</text><text x="273" y="199">s</text><text x="319" y="199">e</text><text x="365" y="199">v</text><text x="411" y="199">e</text><text x="457" y="199">n</text><text x="503" y="199">e</text><text x="549" y="199">i</text><text x="595" y="199">g</text><text x="641" y="199">h</text><text x="687" y="199">t</text>
  </g>
  <!-- span bars -->
  <rect x="68" y="222" width="134" height="10" rx="3" fill="#1d4ed8"/>
  <rect x="206" y="222" width="42" height="10" rx="3" fill="#047857"/>
  <rect x="252" y="222" width="226" height="10" rx="3" fill="#1d4ed8"/>
  <rect x="482" y="222" width="226" height="10" rx="3" fill="#1d4ed8"/>
  <g font-size="16" font-weight="700" text-anchor="middle">
    <text x="135" y="256" fill="#1d4ed8">① one</text>
    <text x="227" y="256" fill="#047857">② 4</text>
    <text x="365" y="256" fill="#1d4ed8">③ seven</text>
    <text x="595" y="256" fill="#1d4ed8">④ eight</text>
  </g>

  <!-- rows -->
  <rect x="24" y="280" width="712" height="40" fill="#eff6ff" stroke="#bfdbfe"/>
  <g font-size="16" font-weight="700" fill="#1e3a8a">
    <text x="44" y="306">반복</text>
    <text x="120" y="306">i 에서 확인한 것</text>
    <text x="470" y="306">다음 i</text>
    <text x="580" y="306">sb</text>
  </g>
  <g font-size="16" fill="#334155">
    <circle cx="56" cy="344" r="12" fill="#1d4ed8"/><text x="56" y="350" font-weight="700" fill="#fff" text-anchor="middle">1</text>
    <text x="120" y="350">i=0, 'o' 는 숫자가 아님.</text>
    <text x="120" y="374">zero, one 순서로 확인 → one 에서 일치</text>
    <text x="470" y="350" font-family="Consolas, monospace">0+3 = 3</text>
    <text x="580" y="350" font-family="Consolas, monospace" font-weight="700" fill="#047857">"1"</text>
    <line x1="24" y1="390" x2="736" y2="390" stroke="#e2e8f0"/>

    <circle cx="56" cy="414" r="12" fill="#1d4ed8"/><text x="56" y="420" font-weight="700" fill="#fff" text-anchor="middle">2</text>
    <text x="120" y="420">i=3, '4' 는 숫자 → 그대로 붙임</text>
    <text x="470" y="420" font-family="Consolas, monospace">3+1 = 4</text>
    <text x="580" y="420" font-family="Consolas, monospace" font-weight="700" fill="#047857">"14"</text>
    <line x1="24" y1="438" x2="736" y2="438" stroke="#e2e8f0"/>

    <circle cx="56" cy="462" r="12" fill="#1d4ed8"/><text x="56" y="468" font-weight="700" fill="#fff" text-anchor="middle">3</text>
    <text x="120" y="468">i=4, 단어 8개째 seven 에서 일치</text>
    <text x="470" y="468" font-family="Consolas, monospace">4+5 = 9</text>
    <text x="580" y="468" font-family="Consolas, monospace" font-weight="700" fill="#047857">"147"</text>
    <line x1="24" y1="486" x2="736" y2="486" stroke="#e2e8f0"/>

    <circle cx="56" cy="510" r="12" fill="#1d4ed8"/><text x="56" y="516" font-weight="700" fill="#fff" text-anchor="middle">4</text>
    <text x="120" y="516">i=9, 단어 9개째 eight 에서 일치</text>
    <text x="470" y="516" font-family="Consolas, monospace">9+5 = 14</text>
    <text x="580" y="516" font-family="Consolas, monospace" font-weight="700" fill="#047857">"1478"</text>
  </g>

  <rect x="24" y="544" width="712" height="140" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <g font-size="16" fill="#334155">
    <text x="44" y="572" font-weight="700" fill="#0f172a">i = 14 가 문자열 길이와 같아 while 이 끝난다.</text>
    <text x="44" y="600">반복은 14글자에 4번뿐이다. 영단어를 만나면 단어 길이만큼 한 번에</text>
    <text x="44" y="626">건너뛰기 때문이다. Integer.parseInt("1478") = 1478 이 기대 출력과 같다.</text>
    <text x="44" y="656" fill="#b91c1c">어떤 단어와도 맞지 않으면 i 가 그대로라 무한 루프다 (실수 포인트).</text>
  </g>
</svg>
