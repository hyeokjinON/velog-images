<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 784" width="760" height="784" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
  <title>그림 3-4. 연속 구간 묶기 — j 가 같은 글자가 끝나는 곳까지 가고, i 는 j 로 건너뛴다 ("aaabccdddd")</title>
  <rect width="760" height="784" fill="#ffffff"/>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
  </defs>
  <text x="24" y="40" font-size="22" font-weight="700" fill="#0f172a">연속 구간 묶기 — j 가 같은 글자의 끝까지 가고,</text>
  <text x="24" y="70" font-size="22" font-weight="700" fill="#0f172a">i 는 j 로 건너뛴다 (입력 "aaabccdddd")</text>
  <text x="24" y="104" font-size="16" fill="#475569">파랑 = 구간 시작 i, 주황 = 구간 끝 다음 칸 j, 초록 칸 = 이번에 묶은 구간.</text>
  <text x="24" y="128" font-size="16" fill="#475569">칸 위의 숫자는 위치(인덱스)다.</text>

  <!-- reusable row template drawn 4 times; cell width 52, start x 150 -->
  <!-- step 1: i=0 j=3 -->
  <g font-size="16">
    <circle cx="44" cy="172" r="12" fill="#1d4ed8"/><text x="44" y="178" font-weight="700" fill="#fff" text-anchor="middle">1</text>
    <text x="66" y="178" font-weight="700" fill="#0f172a">i = 0 에서 시작, j 는 3 에서 멈춤</text>
    <g fill="#64748b" text-anchor="middle" font-family="Consolas, monospace">
      <text x="176" y="206">0</text><text x="228" y="206">1</text><text x="280" y="206">2</text><text x="332" y="206">3</text><text x="384" y="206">4</text><text x="436" y="206">5</text><text x="488" y="206">6</text><text x="540" y="206">7</text><text x="592" y="206">8</text><text x="644" y="206">9</text>
    </g>
    <g stroke="#cbd5e1" fill="#f8fafc">
      <rect x="150" y="214" width="52" height="40" fill="#ecfdf5" stroke="#047857"/><rect x="202" y="214" width="52" height="40" fill="#ecfdf5" stroke="#047857"/><rect x="254" y="214" width="52" height="40" fill="#ecfdf5" stroke="#047857"/>
      <rect x="306" y="214" width="52" height="40"/><rect x="358" y="214" width="52" height="40"/><rect x="410" y="214" width="52" height="40"/><rect x="462" y="214" width="52" height="40"/><rect x="514" y="214" width="52" height="40"/><rect x="566" y="214" width="52" height="40"/><rect x="618" y="214" width="52" height="40"/>
    </g>
    <g text-anchor="middle" font-family="Consolas, monospace" font-size="18" fill="#0f172a">
      <text x="176" y="240">a</text><text x="228" y="240">a</text><text x="280" y="240">a</text><text x="332" y="240">b</text><text x="384" y="240">c</text><text x="436" y="240">c</text><text x="488" y="240">d</text><text x="540" y="240">d</text><text x="592" y="240">d</text><text x="644" y="240">d</text>
    </g>
    <text x="176" y="276" text-anchor="middle" font-weight="700" fill="#1d4ed8">i</text>
    <text x="332" y="276" text-anchor="middle" font-weight="700" fill="#c2410c">j</text>
    <text x="66" y="236" fill="#334155">s</text>
    <text x="400" y="276" fill="#334155">a 3개 → sb = "3a"</text>
  </g>

  <!-- step 2: i=3 j=4 -->
  <g font-size="16">
    <line x1="24" y1="296" x2="736" y2="296" stroke="#e2e8f0"/>
    <circle cx="44" cy="324" r="12" fill="#1d4ed8"/><text x="44" y="330" font-weight="700" fill="#fff" text-anchor="middle">2</text>
    <text x="66" y="330" font-weight="700" fill="#0f172a">i = 3 으로 건너뜀, j 는 4 에서 멈춤</text>
    <g stroke="#cbd5e1" fill="#f8fafc">
      <rect x="150" y="346" width="52" height="40" fill="#f1f5f9"/><rect x="202" y="346" width="52" height="40" fill="#f1f5f9"/><rect x="254" y="346" width="52" height="40" fill="#f1f5f9"/>
      <rect x="306" y="346" width="52" height="40" fill="#ecfdf5" stroke="#047857"/>
      <rect x="358" y="346" width="52" height="40"/><rect x="410" y="346" width="52" height="40"/><rect x="462" y="346" width="52" height="40"/><rect x="514" y="346" width="52" height="40"/><rect x="566" y="346" width="52" height="40"/><rect x="618" y="346" width="52" height="40"/>
    </g>
    <g text-anchor="middle" font-family="Consolas, monospace" font-size="18" fill="#0f172a">
      <text x="176" y="372" fill="#94a3b8">a</text><text x="228" y="372" fill="#94a3b8">a</text><text x="280" y="372" fill="#94a3b8">a</text><text x="332" y="372">b</text><text x="384" y="372">c</text><text x="436" y="372">c</text><text x="488" y="372">d</text><text x="540" y="372">d</text><text x="592" y="372">d</text><text x="644" y="372">d</text>
    </g>
    <text x="332" y="408" text-anchor="middle" font-weight="700" fill="#1d4ed8">i</text>
    <text x="384" y="408" text-anchor="middle" font-weight="700" fill="#c2410c">j</text>
    <text x="440" y="408" fill="#334155">b 1개 → 개수 생략, sb = "3ab"</text>
  </g>

  <!-- step 3: i=4 j=6 -->
  <g font-size="16">
    <line x1="24" y1="428" x2="736" y2="428" stroke="#e2e8f0"/>
    <circle cx="44" cy="456" r="12" fill="#1d4ed8"/><text x="44" y="462" font-weight="700" fill="#fff" text-anchor="middle">3</text>
    <text x="66" y="462" font-weight="700" fill="#0f172a">i = 4 로 건너뜀, j 는 6 에서 멈춤</text>
    <g stroke="#cbd5e1" fill="#f8fafc">
      <rect x="150" y="478" width="52" height="40" fill="#f1f5f9"/><rect x="202" y="478" width="52" height="40" fill="#f1f5f9"/><rect x="254" y="478" width="52" height="40" fill="#f1f5f9"/><rect x="306" y="478" width="52" height="40" fill="#f1f5f9"/>
      <rect x="358" y="478" width="52" height="40" fill="#ecfdf5" stroke="#047857"/><rect x="410" y="478" width="52" height="40" fill="#ecfdf5" stroke="#047857"/>
      <rect x="462" y="478" width="52" height="40"/><rect x="514" y="478" width="52" height="40"/><rect x="566" y="478" width="52" height="40"/><rect x="618" y="478" width="52" height="40"/>
    </g>
    <g text-anchor="middle" font-family="Consolas, monospace" font-size="18" fill="#0f172a">
      <text x="176" y="504" fill="#94a3b8">a</text><text x="228" y="504" fill="#94a3b8">a</text><text x="280" y="504" fill="#94a3b8">a</text><text x="332" y="504" fill="#94a3b8">b</text><text x="384" y="504">c</text><text x="436" y="504">c</text><text x="488" y="504">d</text><text x="540" y="504">d</text><text x="592" y="504">d</text><text x="644" y="504">d</text>
    </g>
    <text x="384" y="540" text-anchor="middle" font-weight="700" fill="#1d4ed8">i</text>
    <text x="488" y="540" text-anchor="middle" font-weight="700" fill="#c2410c">j</text>
    <text x="520" y="540" fill="#334155">c 2개 → sb = "3ab2c"</text>
  </g>

  <!-- step 4: i=6 j=10 -->
  <g font-size="16">
    <line x1="24" y1="560" x2="736" y2="560" stroke="#e2e8f0"/>
    <circle cx="44" cy="588" r="12" fill="#1d4ed8"/><text x="44" y="594" font-weight="700" fill="#fff" text-anchor="middle">4</text>
    <text x="66" y="594" font-weight="700" fill="#0f172a">i = 6 으로 건너뜀, j 는 끝(10)에서 멈춤</text>
    <g stroke="#cbd5e1" fill="#f8fafc">
      <rect x="150" y="610" width="52" height="40" fill="#f1f5f9"/><rect x="202" y="610" width="52" height="40" fill="#f1f5f9"/><rect x="254" y="610" width="52" height="40" fill="#f1f5f9"/><rect x="306" y="610" width="52" height="40" fill="#f1f5f9"/><rect x="358" y="610" width="52" height="40" fill="#f1f5f9"/><rect x="410" y="610" width="52" height="40" fill="#f1f5f9"/>
      <rect x="462" y="610" width="52" height="40" fill="#ecfdf5" stroke="#047857"/><rect x="514" y="610" width="52" height="40" fill="#ecfdf5" stroke="#047857"/><rect x="566" y="610" width="52" height="40" fill="#ecfdf5" stroke="#047857"/><rect x="618" y="610" width="52" height="40" fill="#ecfdf5" stroke="#047857"/>
    </g>
    <g text-anchor="middle" font-family="Consolas, monospace" font-size="18" fill="#0f172a">
      <text x="176" y="636" fill="#94a3b8">a</text><text x="228" y="636" fill="#94a3b8">a</text><text x="280" y="636" fill="#94a3b8">a</text><text x="332" y="636" fill="#94a3b8">b</text><text x="384" y="636" fill="#94a3b8">c</text><text x="436" y="636" fill="#94a3b8">c</text><text x="488" y="636">d</text><text x="540" y="636">d</text><text x="592" y="636">d</text><text x="644" y="636">d</text>
    </g>
    <text x="488" y="672" text-anchor="middle" font-weight="700" fill="#1d4ed8">i</text>
    <text x="696" y="672" text-anchor="middle" font-weight="700" fill="#c2410c">j</text>
    <text x="150" y="672" fill="#334155">d 4개 → sb = "3ab2c4d"</text>
  </g>

  <rect x="24" y="692" width="712" height="72" rx="6" fill="#ecfdf5" stroke="#047857"/>
  <text x="44" y="720" font-size="16" font-weight="700" fill="#047857">안쪽 while 의 j++ 는 모두 10번 = 문자열 길이.</text>
  <text x="44" y="748" font-size="16" fill="#334155">i 와 j 가 뒤로 돌아가지 않으므로 이중 while 이어도 O(n) 이다.</text>
</svg>
