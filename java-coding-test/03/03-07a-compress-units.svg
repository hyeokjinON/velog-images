  <text x="24" y="104" font-size="16" fill="#475569">상자 하나가 조각 하나다. 초록 = 바로 앞 조각과 같아 묶인 조각,</text>
  <text x="24" y="128" font-size="16" fill="#475569">점선 = 단위보다 짧은 마지막 조각. 길이는 10 / 2 = 5 까지만 본다.</text>
