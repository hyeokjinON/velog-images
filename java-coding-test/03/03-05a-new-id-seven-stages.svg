<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 760" width="760" height="760" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
  <title>그림 3-5a. 신규 아이디 추천 예제 1 — 7단계를 지날 때마다 문자열과 길이가 어떻게 바뀌나</title>
  <rect width="760" height="760" fill="#ffffff"/>
  <text x="24" y="40" font-size="22" font-weight="700" fill="#0f172a">신규 아이디 추천 예제 1 — 7단계를 지날 때마다</text>
  <text x="24" y="70" font-size="22" font-weight="700" fill="#0f172a">문자열과 길이가 어떻게 바뀌나</text>
  <text x="24" y="104" font-size="16" fill="#475569">초록 = 그 단계에서 바뀐 문자열, 회색 = 바뀌지 않음.</text>
  <text x="24" y="128" font-size="16" fill="#475569">값은 풀이 A 를 단계마다 끊어 실행하고 출력한 것이다.</text>

  <rect x="24" y="148" width="712" height="40" fill="#eff6ff" stroke="#bfdbfe"/>
  <g font-size="16" font-weight="700" fill="#1e3a8a">
    <text x="44" y="174">단계</text>
    <text x="210" y="174">단계가 끝난 뒤의 문자열</text>
    <text x="670" y="174">길이</text>
  </g>

  <g font-size="16" fill="#334155">
    <!-- 0 input -->
    <text x="44" y="218" font-weight="700" fill="#0f172a">입력</text>
    <text x="210" y="218" font-family="Consolas, monospace" font-size="17" fill="#0f172a">...!@BaT#*..y.abcdefghijklm</text>
    <text x="670" y="218">27</text>
    <line x1="24" y1="236" x2="736" y2="236" stroke="#e2e8f0"/>
    <!-- 1 -->
    <circle cx="44" cy="260" r="12" fill="#1d4ed8"/><text x="44" y="266" font-weight="700" fill="#fff" text-anchor="middle">1</text>
    <text x="66" y="266">소문자로</text>
    <text x="210" y="266" font-family="Consolas, monospace" font-size="17" fill="#047857" font-weight="700">...!@bat#*..y.abcdefghijklm</text>
    <text x="670" y="266">27</text>
    <line x1="24" y1="284" x2="736" y2="284" stroke="#e2e8f0"/>
    <!-- 2 -->
    <circle cx="44" cy="308" r="12" fill="#1d4ed8"/><text x="44" y="314" font-weight="700" fill="#fff" text-anchor="middle">2</text>
    <text x="66" y="314">허용 문자만</text>
    <text x="210" y="314" font-family="Consolas, monospace" font-size="17" fill="#047857" font-weight="700">...bat..y.abcdefghijklm</text>
    <text x="670" y="314">23</text>
    <line x1="24" y1="332" x2="736" y2="332" stroke="#e2e8f0"/>
    <!-- 3 -->
    <circle cx="44" cy="356" r="12" fill="#1d4ed8"/><text x="44" y="362" font-weight="700" fill="#fff" text-anchor="middle">3</text>
    <text x="66" y="362">연속 점 하나로</text>
    <text x="210" y="362" font-family="Consolas, monospace" font-size="17" fill="#047857" font-weight="700">.bat.y.abcdefghijklm</text>
    <text x="670" y="362">20</text>
    <line x1="24" y1="380" x2="736" y2="380" stroke="#e2e8f0"/>
    <!-- 4 -->
    <circle cx="44" cy="404" r="12" fill="#1d4ed8"/><text x="44" y="410" font-weight="700" fill="#fff" text-anchor="middle">4</text>
    <text x="66" y="410">양끝 점 제거</text>
    <text x="210" y="410" font-family="Consolas, monospace" font-size="17" fill="#047857" font-weight="700">bat.y.abcdefghijklm</text>
    <text x="670" y="410">19</text>
    <line x1="24" y1="428" x2="736" y2="428" stroke="#e2e8f0"/>
    <!-- 5 -->
    <circle cx="44" cy="452" r="12" fill="#1d4ed8"/><text x="44" y="458" font-weight="700" fill="#fff" text-anchor="middle">5</text>
    <text x="66" y="458">비면 "a"</text>
    <text x="210" y="458" font-family="Consolas, monospace" font-size="17" fill="#94a3b8">bat.y.abcdefghijklm</text>
    <text x="490" y="458" fill="#94a3b8">(비지 않음)</text>
    <text x="670" y="458">19</text>
    <line x1="24" y1="476" x2="736" y2="476" stroke="#e2e8f0"/>
    <!-- 6 -->
    <circle cx="44" cy="500" r="12" fill="#1d4ed8"/><text x="44" y="506" font-weight="700" fill="#fff" text-anchor="middle">6</text>
    <text x="66" y="506">15자로 자르기</text>
    <text x="210" y="506" font-family="Consolas, monospace" font-size="17" fill="#047857" font-weight="700">bat.y.abcdefghi</text>
    <text x="400" y="506" font-family="Consolas, monospace" font-size="17" fill="#b91c1c" text-decoration="line-through">jklm</text>
    <text x="670" y="506">15</text>
    <line x1="24" y1="524" x2="736" y2="524" stroke="#e2e8f0"/>
    <!-- 7 -->
    <circle cx="44" cy="548" r="12" fill="#1d4ed8"/><text x="44" y="554" font-weight="700" fill="#fff" text-anchor="middle">7</text>
    <text x="66" y="554">짧으면 늘리기</text>
    <text x="210" y="554" font-family="Consolas, monospace" font-size="17" fill="#94a3b8">bat.y.abcdefghi</text>
    <text x="400" y="554" fill="#94a3b8">(3자 이상이라 그대로)</text>
    <text x="670" y="554">15</text>
  </g>

  <rect x="24" y="580" width="712" height="160" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <g font-size="16" fill="#334155">
    <text x="44" y="608" font-weight="700" fill="#0f172a">단계마다 무엇이 사라졌나</text>
    <text x="44" y="636">2단계: 허용되지 않은 ! @ # * 네 글자가 빠져 27자 → 23자가 된다.</text>
    <text x="44" y="662">3단계: 점 세 개(...)와 점 두 개(..)가 점 하나씩이 되어 3글자가 준다.</text>
    <text x="44" y="688">6단계: 19자라서 앞 15자만 남기고 jklm 을 버린다. 끝이 i 라 점 제거는 없다.</text>
    <text x="44" y="716" font-weight="700" fill="#047857">결과 "bat.y.abcdefghi" 가 기대 출력과 같다.</text>
  </g>
</svg>
