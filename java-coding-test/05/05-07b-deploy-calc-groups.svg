<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 650" width="760" height="650" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
  <title>그림 5-7b. 기능개발 예제 2 — 완료일을 먼저 구하고 지금 묶음의 배포일과 비교해 묶음 나누기</title>
  <rect width="760" height="650" fill="#ffffff"/>
  <text x="24" y="40" font-size="21" fill="#0f172a" font-weight="700">기능개발 예제 2 — 완료일을 구하고</text>
  <text x="24" y="70" font-size="21" fill="#0f172a" font-weight="700">지금 묶음의 배포일과 비교해 묶는다</text>
  <text x="24" y="102" font-size="16" fill="#475569">progresses [95, 90, 99, 99, 80, 99], 속도는 모두 1</text>
  <text x="24" y="140" font-size="16" fill="#1e3a8a" font-weight="700">i</text>
  <text x="70" y="140" font-size="16" fill="#1e3a8a" font-weight="700">done</text>
  <text x="160" y="140" font-size="16" fill="#1e3a8a" font-weight="700">판단</text>
  <text x="470" y="140" font-size="16" fill="#1e3a8a" font-weight="700">releaseDay</text>
  <text x="610" y="140" font-size="16" fill="#1e3a8a" font-weight="700">answer</text>
  <line x1="24" y1="152" x2="736" y2="152" stroke="#94a3b8" stroke-width="1"/>
  <text x="24" y="185" font-size="16" fill="#0f172a" font-weight="700">0</text>
  <rect x="70" y="165" width="60" height="30" rx="0" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="100.0" y="186.0" font-size="16" fill="#047857" font-weight="700" text-anchor="middle" font-family="Consolas, D2Coding, monospace">5</text>
  <text x="160" y="186" font-size="16" fill="#047857" font-weight="700">첫 작업 → 새 묶음</text>
  <text x="510" y="186" font-size="16" fill="#0f172a" font-weight="700" text-anchor="middle">5</text>
  <text x="610" y="186" font-size="16" fill="#334155" font-family="Consolas, D2Coding, monospace">[1]</text>
  <line x1="24" y1="204" x2="736" y2="204" stroke="#e2e8f0" stroke-width="1"/>
  <text x="24" y="229" font-size="16" fill="#0f172a" font-weight="700">1</text>
  <rect x="70" y="209" width="60" height="30" rx="0" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="100.0" y="230.0" font-size="16" fill="#047857" font-weight="700" text-anchor="middle" font-family="Consolas, D2Coding, monospace">10</text>
  <text x="160" y="230" font-size="16" fill="#047857" font-weight="700">10 &gt; 5 → 새 묶음</text>
  <text x="510" y="230" font-size="16" fill="#0f172a" font-weight="700" text-anchor="middle">10</text>
  <text x="610" y="230" font-size="16" fill="#334155" font-family="Consolas, D2Coding, monospace">[1, 1]</text>
  <line x1="24" y1="248" x2="736" y2="248" stroke="#e2e8f0" stroke-width="1"/>
  <text x="24" y="273" font-size="16" fill="#0f172a" font-weight="700">2</text>
  <rect x="70" y="253" width="60" height="30" rx="0" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="100.0" y="274.0" font-size="16" fill="#334155" text-anchor="middle" font-family="Consolas, D2Coding, monospace">1</text>
  <text x="160" y="274" font-size="16" fill="#334155">1 ≤ 10 → 지금 묶음에 +1</text>
  <text x="510" y="274" font-size="16" fill="#0f172a" text-anchor="middle">10</text>
  <text x="610" y="274" font-size="16" fill="#334155" font-family="Consolas, D2Coding, monospace">[1, 2]</text>
  <line x1="24" y1="292" x2="736" y2="292" stroke="#e2e8f0" stroke-width="1"/>
  <text x="24" y="317" font-size="16" fill="#0f172a" font-weight="700">3</text>
  <rect x="70" y="297" width="60" height="30" rx="0" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="100.0" y="318.0" font-size="16" fill="#334155" text-anchor="middle" font-family="Consolas, D2Coding, monospace">1</text>
  <text x="160" y="318" font-size="16" fill="#334155">1 ≤ 10 → 지금 묶음에 +1</text>
  <text x="510" y="318" font-size="16" fill="#0f172a" text-anchor="middle">10</text>
  <text x="610" y="318" font-size="16" fill="#334155" font-family="Consolas, D2Coding, monospace">[1, 3]</text>
  <line x1="24" y1="336" x2="736" y2="336" stroke="#e2e8f0" stroke-width="1"/>
  <text x="24" y="361" font-size="16" fill="#0f172a" font-weight="700">4</text>
  <rect x="70" y="341" width="60" height="30" rx="0" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="100.0" y="362.0" font-size="16" fill="#047857" font-weight="700" text-anchor="middle" font-family="Consolas, D2Coding, monospace">20</text>
  <text x="160" y="362" font-size="16" fill="#047857" font-weight="700">20 &gt; 10 → 새 묶음</text>
  <text x="510" y="362" font-size="16" fill="#0f172a" font-weight="700" text-anchor="middle">20</text>
  <text x="610" y="362" font-size="16" fill="#334155" font-family="Consolas, D2Coding, monospace">[1, 3, 1]</text>
  <line x1="24" y1="380" x2="736" y2="380" stroke="#e2e8f0" stroke-width="1"/>
  <text x="24" y="405" font-size="16" fill="#0f172a" font-weight="700">5</text>
  <rect x="70" y="385" width="60" height="30" rx="0" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="100.0" y="406.0" font-size="16" fill="#334155" text-anchor="middle" font-family="Consolas, D2Coding, monospace">1</text>
  <text x="160" y="406" font-size="16" fill="#334155">1 ≤ 20 → 지금 묶음에 +1</text>
  <text x="510" y="406" font-size="16" fill="#0f172a" text-anchor="middle">20</text>
  <text x="610" y="406" font-size="16" fill="#334155" font-family="Consolas, D2Coding, monospace">[1, 3, 2]</text>
  <line x1="24" y1="424" x2="736" y2="424" stroke="#e2e8f0" stroke-width="1"/>
  <text x="24" y="452" font-size="16" fill="#1e3a8a" font-weight="700">완료일을 배포 묶음으로 나누면</text>
  <rect x="24" y="466" width="150" height="74" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1"/>
  <rect x="73.0" y="474" width="52" height="30" rx="0" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="99.0" y="495.0" font-size="16" fill="#334155" text-anchor="middle" font-family="Consolas, D2Coding, monospace">5</text>
  <text x="99.0" y="528" font-size="16" fill="#047857" font-weight="700" text-anchor="middle">5일 배포 1개</text>
  <rect x="190" y="466" width="188" height="74" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1"/>
  <rect x="200.0" y="474" width="52" height="30" rx="0" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="226.0" y="495.0" font-size="16" fill="#334155" text-anchor="middle" font-family="Consolas, D2Coding, monospace">10</text>
  <rect x="258.0" y="474" width="52" height="30" rx="0" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="284.0" y="495.0" font-size="16" fill="#334155" text-anchor="middle" font-family="Consolas, D2Coding, monospace">1</text>
  <rect x="316.0" y="474" width="52" height="30" rx="0" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="342.0" y="495.0" font-size="16" fill="#334155" text-anchor="middle" font-family="Consolas, D2Coding, monospace">1</text>
  <text x="284.0" y="528" font-size="16" fill="#047857" font-weight="700" text-anchor="middle">10일 배포 3개</text>
  <rect x="394" y="466" width="150" height="74" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1"/>
  <rect x="414.0" y="474" width="52" height="30" rx="0" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="440.0" y="495.0" font-size="16" fill="#334155" text-anchor="middle" font-family="Consolas, D2Coding, monospace">20</text>
  <rect x="472.0" y="474" width="52" height="30" rx="0" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="498.0" y="495.0" font-size="16" fill="#334155" text-anchor="middle" font-family="Consolas, D2Coding, monospace">1</text>
  <text x="469.0" y="528" font-size="16" fill="#047857" font-weight="700" text-anchor="middle">20일 배포 2개</text>
  <rect x="24" y="558" width="712" height="74" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1"/>
  <text x="44" y="588" font-size="17" fill="#047857" font-weight="700">결과 [1, 3, 2] — 기대 출력과 같다</text>
  <text x="44" y="614" font-size="16" fill="#334155">직전 작업(1일)이 아니라 지금 묶음의 배포일(10일)과 비교한다.</text>
</svg>
