<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 650" width="760" height="650" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
  <title>그림 5-8b. 프로세스 예제 2 — 남은 것 중 최댓값을 최대 힙과 개수 배열로 알아내기</title>
  <rect width="760" height="650" fill="#ffffff"/>
  <text x="24" y="40" font-size="21" fill="#0f172a" font-weight="700">프로세스 예제 2 — "남은 것 중 최댓값" 을</text>
  <text x="24" y="70" font-size="21" fill="#0f172a" font-weight="700">최대 힙과 개수 배열로 알아내기</text>
  <text x="24" y="102" font-size="16" fill="#475569">같은 7번의 꺼내기에서 두 자료구조가 바뀌는 모습</text>
  <text x="24" y="140" font-size="16" fill="#1e3a8a" font-weight="700">꺼낸 것</text>
  <text x="150" y="140" font-size="16" fill="#1e3a8a" font-weight="700">B: 힙 (큰 것부터)</text>
  <text x="420" y="140" font-size="16" fill="#1e3a8a" font-weight="700">C: cnt[9], cnt[1]</text>
  <text x="620" y="140" font-size="16" fill="#1e3a8a" font-weight="700">C 의 max</text>
  <line x1="24" y1="152" x2="736" y2="152" stroke="#94a3b8" stroke-width="1"/>
  <text x="24" y="185" font-size="16" fill="#0f172a">처음</text>
  <text x="150" y="185" font-size="16" fill="#334155" font-family="Consolas, D2Coding, monospace">9 1 1 1 1 1</text>
  <text x="420" y="185" font-size="16" fill="#334155" font-family="Consolas, D2Coding, monospace">1, 5</text>
  <text x="620" y="185" font-size="16" fill="#0f172a" font-weight="700">9</text>
  <line x1="24" y1="200" x2="736" y2="200" stroke="#e2e8f0" stroke-width="1"/>
  <text x="24" y="225" font-size="16" fill="#c2410c">A 1 → 뒤로</text>
  <text x="150" y="225" font-size="16" fill="#334155" font-family="Consolas, D2Coding, monospace">그대로, peek 9</text>
  <text x="420" y="225" font-size="16" fill="#334155" font-family="Consolas, D2Coding, monospace">그대로</text>
  <text x="620" y="225" font-size="16" fill="#0f172a" font-weight="700">9</text>
  <line x1="24" y1="240" x2="736" y2="240" stroke="#e2e8f0" stroke-width="1"/>
  <text x="24" y="265" font-size="16" fill="#c2410c">B 1 → 뒤로</text>
  <text x="150" y="265" font-size="16" fill="#334155" font-family="Consolas, D2Coding, monospace">그대로, peek 9</text>
  <text x="420" y="265" font-size="16" fill="#334155" font-family="Consolas, D2Coding, monospace">그대로</text>
  <text x="620" y="265" font-size="16" fill="#0f172a" font-weight="700">9</text>
  <line x1="24" y1="280" x2="736" y2="280" stroke="#e2e8f0" stroke-width="1"/>
  <text x="24" y="305" font-size="16" fill="#047857" font-weight="700">C 9 실행</text>
  <text x="150" y="305" font-size="16" fill="#334155" font-family="Consolas, D2Coding, monospace">1 1 1 1 1</text>
  <text x="420" y="305" font-size="16" fill="#334155" font-family="Consolas, D2Coding, monospace">0, 5</text>
  <text x="620" y="305" font-size="16" fill="#0f172a" font-weight="700">1</text>
  <line x1="24" y1="320" x2="736" y2="320" stroke="#e2e8f0" stroke-width="1"/>
  <text x="24" y="345" font-size="16" fill="#047857" font-weight="700">D 1 실행</text>
  <text x="150" y="345" font-size="16" fill="#334155" font-family="Consolas, D2Coding, monospace">1 1 1 1</text>
  <text x="420" y="345" font-size="16" fill="#334155" font-family="Consolas, D2Coding, monospace">0, 4</text>
  <text x="620" y="345" font-size="16" fill="#0f172a" font-weight="700">1</text>
  <line x1="24" y1="360" x2="736" y2="360" stroke="#e2e8f0" stroke-width="1"/>
  <text x="24" y="385" font-size="16" fill="#047857" font-weight="700">E 1 실행</text>
  <text x="150" y="385" font-size="16" fill="#334155" font-family="Consolas, D2Coding, monospace">1 1 1</text>
  <text x="420" y="385" font-size="16" fill="#334155" font-family="Consolas, D2Coding, monospace">0, 3</text>
  <text x="620" y="385" font-size="16" fill="#0f172a" font-weight="700">1</text>
  <line x1="24" y1="400" x2="736" y2="400" stroke="#e2e8f0" stroke-width="1"/>
  <text x="24" y="425" font-size="16" fill="#047857" font-weight="700">F 1 실행</text>
  <text x="150" y="425" font-size="16" fill="#334155" font-family="Consolas, D2Coding, monospace">1 1</text>
  <text x="420" y="425" font-size="16" fill="#334155" font-family="Consolas, D2Coding, monospace">0, 2</text>
  <text x="620" y="425" font-size="16" fill="#0f172a" font-weight="700">1</text>
  <line x1="24" y1="440" x2="736" y2="440" stroke="#e2e8f0" stroke-width="1"/>
  <text x="24" y="465" font-size="16" fill="#047857" font-weight="700">A 1 실행</text>
  <text x="150" y="465" font-size="16" fill="#334155" font-family="Consolas, D2Coding, monospace">1</text>
  <text x="420" y="465" font-size="16" fill="#334155" font-family="Consolas, D2Coding, monospace">0, 1</text>
  <text x="620" y="465" font-size="16" fill="#047857" font-weight="700">반환 5</text>
  <line x1="24" y1="480" x2="736" y2="480" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="24" y="496" width="712" height="126" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1"/>
  <text x="44" y="526" font-size="17" fill="#047857" font-weight="700">실행할 때마다 B 는 maxHeap.poll(), C 는 cnt[max]-- 를 한다</text>
  <text x="44" y="552" font-size="16" fill="#334155">C 가 실행되면 9 가 사라져 최댓값이 1 로 내려간다.</text>
  <text x="44" y="578" font-size="16" fill="#334155">이 한 줄을 빼먹으면 최댓값이 9 로 남아 D 이후가 계속 뒤로 가고</text>
  <text x="44" y="604" font-size="16" fill="#334155">반복이 끝나지 않는다.</text>
</svg>
