<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 652" width="760" height="652" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
  <title>그림 5-3. 기능개발 예제 1 — 하루씩 흘리기와 완료일 바로 계산</title>
  <rect width="760" height="652" fill="#ffffff"/>
  <text x="24" y="40" font-size="21" fill="#0f172a" font-weight="700">기능개발 예제 1 — 하루씩 흘리기와</text>
  <text x="24" y="70" font-size="21" fill="#0f172a" font-weight="700">완료일 바로 계산이 같은 답 [2, 1] 을 낸다</text>
  <text x="24" y="102" font-size="16" fill="#475569">progresses [93, 30, 55], speeds [1, 30, 5]</text>
  <text x="170" y="154" font-size="15" fill="#475569" text-anchor="middle">0</text>
  <line x1="170" y1="162" x2="170" y2="368" stroke="#e2e8f0" stroke-width="1"/>
  <text x="230" y="154" font-size="15" fill="#475569" text-anchor="middle">1</text>
  <line x1="230" y1="162" x2="230" y2="368" stroke="#e2e8f0" stroke-width="1"/>
  <text x="290" y="154" font-size="15" fill="#475569" text-anchor="middle">2</text>
  <line x1="290" y1="162" x2="290" y2="368" stroke="#e2e8f0" stroke-width="1"/>
  <text x="350" y="154" font-size="15" fill="#475569" text-anchor="middle">3</text>
  <line x1="350" y1="162" x2="350" y2="368" stroke="#e2e8f0" stroke-width="1"/>
  <text x="410" y="154" font-size="15" fill="#475569" text-anchor="middle">4</text>
  <line x1="410" y1="162" x2="410" y2="368" stroke="#e2e8f0" stroke-width="1"/>
  <text x="470" y="154" font-size="15" fill="#475569" text-anchor="middle">5</text>
  <line x1="470" y1="162" x2="470" y2="368" stroke="#e2e8f0" stroke-width="1"/>
  <text x="530" y="154" font-size="15" fill="#475569" text-anchor="middle">6</text>
  <line x1="530" y1="162" x2="530" y2="368" stroke="#e2e8f0" stroke-width="1"/>
  <text x="590" y="154" font-size="15" fill="#475569" text-anchor="middle">7</text>
  <line x1="590" y1="162" x2="590" y2="368" stroke="#e2e8f0" stroke-width="1"/>
  <text x="650" y="154" font-size="15" fill="#475569" text-anchor="middle">8</text>
  <line x1="650" y1="162" x2="650" y2="368" stroke="#e2e8f0" stroke-width="1"/>
  <text x="710" y="154" font-size="15" fill="#475569" text-anchor="middle">9</text>
  <line x1="710" y1="162" x2="710" y2="368" stroke="#e2e8f0" stroke-width="1"/>
  <text x="24" y="154" font-size="16" fill="#475569">날 →</text>
  <text x="24" y="202" font-size="16" fill="#0f172a" font-weight="700">작업 0</text>
  <text x="24" y="224" font-size="15" fill="#475569">93%, 1%/일</text>
  <rect x="170" y="188" width="420" height="28" rx="4" fill="#ecfdf5" stroke="#047857" stroke-width="1"/>
  <text x="582" y="208" font-size="16" fill="#047857" font-weight="700" text-anchor="end">7일 끝</text>
  <text x="24" y="264" font-size="16" fill="#0f172a" font-weight="700">작업 1</text>
  <text x="24" y="286" font-size="15" fill="#475569">30%, 30%/일</text>
  <rect x="170" y="250" width="180" height="28" rx="4" fill="#ecfdf5" stroke="#047857" stroke-width="1"/>
  <text x="342" y="270" font-size="16" fill="#047857" font-weight="700" text-anchor="end">3일 끝</text>
  <rect x="350" y="250" width="240" height="28" rx="4" fill="#fff7ed" stroke="#c2410c" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="470.0" y="270" font-size="16" fill="#c2410c" font-weight="700" text-anchor="middle">앞 작업 대기</text>
  <text x="24" y="326" font-size="16" fill="#0f172a" font-weight="700">작업 2</text>
  <text x="24" y="348" font-size="15" fill="#475569">55%, 5%/일</text>
  <rect x="170" y="312" width="540" height="28" rx="4" fill="#ecfdf5" stroke="#047857" stroke-width="1"/>
  <text x="702" y="332" font-size="16" fill="#047857" font-weight="700" text-anchor="end">9일 끝</text>
  <line x1="590" y1="162" x2="590" y2="374" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="590" y="392" font-size="16" fill="#b91c1c" font-weight="700" text-anchor="middle">7일 배포 ① 2개</text>
  <line x1="710" y1="162" x2="710" y2="400" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="710" y="418" font-size="16" fill="#b91c1c" font-weight="700" text-anchor="end">9일 배포 ② 1개</text>
  <rect x="24" y="442" width="346" height="150" rx="8" fill="#eff6ff" stroke="#1e3a8a" stroke-width="1"/>
  <text x="40" y="472" font-size="17" fill="#1e3a8a" font-weight="700">시간 흘리기 (deploySim)</text>
  <text x="40" y="500" font-size="16" fill="#334155">하루마다 남은 작업의 진도를 올리고</text>
  <text x="40" y="524" font-size="16" fill="#334155">큐 앞의 100% 를 꺼낸다.</text>
  <text x="40" y="548" font-size="16" fill="#334155">9일을 돌아야 끝난다.</text>
  <text x="40" y="572" font-size="16" fill="#334155">반복 수는 T(날) × n 에 비례</text>
  <rect x="390" y="442" width="346" height="150" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1"/>
  <text x="406" y="472" font-size="17" fill="#047857" font-weight="700">바로 계산 (deployCalc)</text>
  <text x="406" y="500" font-size="16" fill="#334155">완료일 = 올림((100 − 진도) / 속도)</text>
  <text x="406" y="524" font-size="16" fill="#334155">→ 7, 3, 9 를 한 번씩 계산하고</text>
  <text x="406" y="548" font-size="16" fill="#334155">앞 묶음 배포일과 비교만 한다.</text>
  <text x="406" y="572" font-size="16" fill="#334155">계산 수는 n(3번)에 비례</text>
  <text x="24" y="624" font-size="16" fill="#0f172a" font-weight="700">두 방식 모두 결과는 [2, 1] — 7일째 2개, 9일째 1개 배포</text>
</svg>
