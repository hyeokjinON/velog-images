<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 618" width="760" height="618" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
  <title>그림 6-5a. 입국심사 예제 (n = 6, times = [7, 10]) — 이분탐색이 T 를 바꿔 가며 '6 명을 볼 수 있나' 를 물어 28 에 도착하는 과정</title>
  <rect width="760" height="618" fill="#ffffff"/>
  <text x="24" y="40" font-size="22" fill="#0f172a" font-weight="700">입국심사 예제 — T 분이면 6 명을 볼 수 있나?</text>
  <text x="24" y="70" font-size="22" fill="#0f172a" font-weight="700">여섯 번 물어 28 에 도착한다</text>
  <text x="24" y="104" font-size="16" fill="#475569">n = 6, times = [7, 10], lo = 1, hi = 7 × 6 = 42</text>
  <text x="24" y="128" font-size="16" fill="#475569">T 분에 본 사람 = ⌊T/7⌋ + ⌊T/10⌋, 6 이상이면 T(된다)</text>
  <text x="24" y="178" font-size="16" fill="#1e3a8a" font-weight="700">회차</text>
  <text x="92" y="178" font-size="16" fill="#1e3a8a" font-weight="700">[lo, hi]</text>
  <text x="222" y="178" font-size="16" fill="#1e3a8a" font-weight="700">mid</text>
  <text x="330" y="178" font-size="16" fill="#1e3a8a" font-weight="700">⌊mid/7⌋ + ⌊mid/10⌋</text>
  <text x="560" y="178" font-size="16" fill="#1e3a8a" font-weight="700">다음 구간</text>
  <line x1="24" y1="190" x2="736" y2="190" stroke="#94a3b8" stroke-width="1"/>
  <rect x="24" y="194" width="712" height="40" rx="0" fill="#fef2f2" stroke="#fef2f2" stroke-width="0"/>
  <text x="38" y="221" font-size="16" fill="#0f172a" font-weight="700">1</text>
  <text x="92" y="221" font-size="16" fill="#334155" font-family="Consolas, D2Coding, monospace">[1, 42]</text>
  <text x="232" y="221" font-size="17" fill="#b45309" font-weight="700" font-family="Consolas, D2Coding, monospace">21</text>
  <text x="330" y="221" font-size="16" fill="#b91c1c" font-weight="700" font-family="Consolas, D2Coding, monospace">3 + 2 = 5  F</text>
  <text x="560" y="221" font-size="16" fill="#334155" font-family="Consolas, D2Coding, monospace">lo = 22</text>
  <line x1="24" y1="238" x2="736" y2="238" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="24" y="242" width="712" height="40" rx="0" fill="#ecfdf5" stroke="#ecfdf5" stroke-width="0"/>
  <text x="38" y="269" font-size="16" fill="#0f172a" font-weight="700">2</text>
  <text x="92" y="269" font-size="16" fill="#334155" font-family="Consolas, D2Coding, monospace">[22, 42]</text>
  <text x="232" y="269" font-size="17" fill="#b45309" font-weight="700" font-family="Consolas, D2Coding, monospace">32</text>
  <text x="330" y="269" font-size="16" fill="#047857" font-weight="700" font-family="Consolas, D2Coding, monospace">4 + 3 = 7  T</text>
  <text x="560" y="269" font-size="16" fill="#334155" font-family="Consolas, D2Coding, monospace">hi = 32</text>
  <line x1="24" y1="286" x2="736" y2="286" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="24" y="290" width="712" height="40" rx="0" fill="#fef2f2" stroke="#fef2f2" stroke-width="0"/>
  <text x="38" y="317" font-size="16" fill="#0f172a" font-weight="700">3</text>
  <text x="92" y="317" font-size="16" fill="#334155" font-family="Consolas, D2Coding, monospace">[22, 32]</text>
  <text x="232" y="317" font-size="17" fill="#b45309" font-weight="700" font-family="Consolas, D2Coding, monospace">27</text>
  <text x="330" y="317" font-size="16" fill="#b91c1c" font-weight="700" font-family="Consolas, D2Coding, monospace">3 + 2 = 5  F</text>
  <text x="560" y="317" font-size="16" fill="#334155" font-family="Consolas, D2Coding, monospace">lo = 28</text>
  <line x1="24" y1="334" x2="736" y2="334" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="24" y="338" width="712" height="40" rx="0" fill="#ecfdf5" stroke="#ecfdf5" stroke-width="0"/>
  <text x="38" y="365" font-size="16" fill="#0f172a" font-weight="700">4</text>
  <text x="92" y="365" font-size="16" fill="#334155" font-family="Consolas, D2Coding, monospace">[28, 32]</text>
  <text x="232" y="365" font-size="17" fill="#b45309" font-weight="700" font-family="Consolas, D2Coding, monospace">30</text>
  <text x="330" y="365" font-size="16" fill="#047857" font-weight="700" font-family="Consolas, D2Coding, monospace">4 + 3 = 7  T</text>
  <text x="560" y="365" font-size="16" fill="#334155" font-family="Consolas, D2Coding, monospace">hi = 30</text>
  <line x1="24" y1="382" x2="736" y2="382" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="24" y="386" width="712" height="40" rx="0" fill="#ecfdf5" stroke="#ecfdf5" stroke-width="0"/>
  <text x="38" y="413" font-size="16" fill="#0f172a" font-weight="700">5</text>
  <text x="92" y="413" font-size="16" fill="#334155" font-family="Consolas, D2Coding, monospace">[28, 30]</text>
  <text x="232" y="413" font-size="17" fill="#b45309" font-weight="700" font-family="Consolas, D2Coding, monospace">29</text>
  <text x="330" y="413" font-size="16" fill="#047857" font-weight="700" font-family="Consolas, D2Coding, monospace">4 + 2 = 6  T</text>
  <text x="560" y="413" font-size="16" fill="#334155" font-family="Consolas, D2Coding, monospace">hi = 29</text>
  <line x1="24" y1="430" x2="736" y2="430" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="24" y="434" width="712" height="40" rx="0" fill="#ecfdf5" stroke="#ecfdf5" stroke-width="0"/>
  <text x="38" y="461" font-size="16" fill="#0f172a" font-weight="700">6</text>
  <text x="92" y="461" font-size="16" fill="#334155" font-family="Consolas, D2Coding, monospace">[28, 29]</text>
  <text x="232" y="461" font-size="17" fill="#b45309" font-weight="700" font-family="Consolas, D2Coding, monospace">28</text>
  <text x="330" y="461" font-size="16" fill="#047857" font-weight="700" font-family="Consolas, D2Coding, monospace">4 + 2 = 6  T</text>
  <text x="560" y="461" font-size="16" fill="#334155" font-family="Consolas, D2Coding, monospace">hi = 28</text>
  <line x1="24" y1="478" x2="736" y2="478" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="24" y="496" width="712" height="102" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1"/>
  <text x="44" y="526" font-size="17" fill="#047857" font-weight="700">lo = hi = 28 → return 28. 예제의 기대 출력과 같다.</text>
  <text x="44" y="552" font-size="16" fill="#334155">27 분이면 5 명(F), 28 분이면 6 명(T). F 와 T 의 경계가 답이다.</text>
  <text x="44" y="578" font-size="16" fill="#334155">빨강 행은 lo = mid + 1, 초록 행은 hi = mid 로 줄였다.</text>
</svg>
