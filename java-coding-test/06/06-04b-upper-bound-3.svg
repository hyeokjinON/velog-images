<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 812" width="760" height="812" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
  <title>그림 6-4b. upperBound(a, 3) — a[mid] &gt; 3 일 때만 hi = mid, 끝나면 lo = 4 라서 3 의 개수는 4 - 1 = 3</title>
  <rect width="760" height="812" fill="#ffffff"/>
  <text x="24" y="40" font-size="22" fill="#0f172a" font-weight="700">upperBound(a, 3) — 3 보다 큰 값이 처음 나오는 위치</text>
  <text x="24" y="70" font-size="22" fill="#0f172a" font-weight="700">≥ 를 &gt; 로만 바꾸면 3 들을 지나 오른쪽 경계를 찾는다</text>
  <text x="24" y="104" font-size="16" fill="#475569">a = {1, 3, 3, 3, 5, 8, 13}, 시작은 lowerBound 와 같다</text>
