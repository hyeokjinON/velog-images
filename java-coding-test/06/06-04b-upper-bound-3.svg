  <text x="44" y="720" font-size="17" fill="#047857" font-weight="700">upperBound(3) = 4. 3 의 개수 = 4 - 1 = 3 이다.</text>
  <text x="44" y="746" font-size="16" fill="#334155">그림 6-4a 의 lowerBound(3) = 1 과 빼면 인덱스 1, 2, 3 이 3 이다.</text>
  <text x="44" y="772" font-size="16" fill="#334155">같은 방법으로 [3, 8] 범위 개수 = upperBound(8) - lowerBound(3) = 6 - 1 = 5.</text>
