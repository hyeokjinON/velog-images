<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 766" width="760" height="766" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
  <title>그림 8-10. 가장 큰 수 예제 2 — 두 수를 양쪽 순서로 붙여 보고 큰 쪽 순서로 정렬한다</title>
  <rect width="760" height="766" fill="#ffffff"/>
  <text x="24" y="40" font-size="21" fill="#0f172a" font-weight="700">가장 큰 수 예제 2 — 두 수를 양쪽 순서로</text>
  <text x="24" y="70" font-size="21" fill="#0f172a" font-weight="700">붙여 보고 큰 쪽 순서로 정렬한다</text>
  <text x="24" y="102" font-size="16" fill="#475569">[3, 30, 34, 5, 9] 를 정렬할 때 Comparator 가 불린 순서 (JDK 21 출력)</text>
  <text x="24" y="126" font-size="16" fill="#475569">(b + a).compareTo(a + b) 가 양수면 b 가 앞, 음수면 a 가 앞</text>
  <rect x="24" y="162" width="712" height="40" rx="0" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="40" y="188" font-size="16" fill="#1e3a8a" font-weight="700">#</text>
  <text x="84" y="188" font-size="16" fill="#1e3a8a" font-weight="700">a, b</text>
  <text x="250" y="188" font-size="16" fill="#1e3a8a" font-weight="700">b + a  vs  a + b</text>
  <text x="520" y="188" font-size="16" fill="#1e3a8a" font-weight="700">결과 → 앞에 올 수</text>
  <rect x="24" y="202" width="712" height="42" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="40" y="230" font-size="16" fill="#475569" font-weight="700">1</text>
  <text x="84" y="230" font-size="16" fill="#0f172a" font-weight="700" font-family="Consolas, D2Coding, monospace">a=30, b=3</text>
  <text x="250" y="230" font-size="16" fill="#047857" font-weight="700" font-family="Consolas, D2Coding, monospace">330</text>
  <text x="320" y="230" font-size="16" fill="#475569">vs</text>
  <text x="360" y="230" font-size="16" fill="#334155" font-family="Consolas, D2Coding, monospace">303</text>
  <text x="520" y="230" font-size="16" fill="#047857" font-weight="700" font-family="Consolas, D2Coding, monospace">+3 → 3</text>
  <rect x="24" y="244" width="712" height="42" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="40" y="272" font-size="16" fill="#475569" font-weight="700">2</text>
  <text x="84" y="272" font-size="16" fill="#0f172a" font-weight="700" font-family="Consolas, D2Coding, monospace">a=34, b=30</text>
  <text x="250" y="272" font-size="16" fill="#334155" font-family="Consolas, D2Coding, monospace">3034</text>
  <text x="320" y="272" font-size="16" fill="#475569">vs</text>
  <text x="360" y="272" font-size="16" fill="#047857" font-weight="700" font-family="Consolas, D2Coding, monospace">3430</text>
  <text x="520" y="272" font-size="16" fill="#047857" font-weight="700" font-family="Consolas, D2Coding, monospace">-4 → 34</text>
  <rect x="24" y="286" width="712" height="42" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="40" y="314" font-size="16" fill="#475569" font-weight="700">3</text>
  <text x="84" y="314" font-size="16" fill="#0f172a" font-weight="700" font-family="Consolas, D2Coding, monospace">a=34, b=30</text>
  <text x="250" y="314" font-size="16" fill="#334155" font-family="Consolas, D2Coding, monospace">3034</text>
  <text x="320" y="314" font-size="16" fill="#475569">vs</text>
  <text x="360" y="314" font-size="16" fill="#047857" font-weight="700" font-family="Consolas, D2Coding, monospace">3430</text>
  <text x="520" y="314" font-size="16" fill="#047857" font-weight="700" font-family="Consolas, D2Coding, monospace">-4 → 34</text>
  <rect x="24" y="328" width="712" height="42" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="40" y="356" font-size="16" fill="#475569" font-weight="700">4</text>
  <text x="84" y="356" font-size="16" fill="#0f172a" font-weight="700" font-family="Consolas, D2Coding, monospace">a=34, b=3</text>
  <text x="250" y="356" font-size="16" fill="#334155" font-family="Consolas, D2Coding, monospace">334</text>
  <text x="320" y="356" font-size="16" fill="#475569">vs</text>
  <text x="360" y="356" font-size="16" fill="#047857" font-weight="700" font-family="Consolas, D2Coding, monospace">343</text>
  <text x="520" y="356" font-size="16" fill="#047857" font-weight="700" font-family="Consolas, D2Coding, monospace">-1 → 34</text>
  <rect x="24" y="370" width="712" height="42" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="40" y="398" font-size="16" fill="#475569" font-weight="700">5</text>
  <text x="84" y="398" font-size="16" fill="#0f172a" font-weight="700" font-family="Consolas, D2Coding, monospace">a=5, b=3</text>
  <text x="250" y="398" font-size="16" fill="#334155" font-family="Consolas, D2Coding, monospace">35</text>
  <text x="320" y="398" font-size="16" fill="#475569">vs</text>
  <text x="360" y="398" font-size="16" fill="#047857" font-weight="700" font-family="Consolas, D2Coding, monospace">53</text>
  <text x="520" y="398" font-size="16" fill="#047857" font-weight="700" font-family="Consolas, D2Coding, monospace">-2 → 5</text>
  <rect x="24" y="412" width="712" height="42" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="40" y="440" font-size="16" fill="#475569" font-weight="700">6</text>
  <text x="84" y="440" font-size="16" fill="#0f172a" font-weight="700" font-family="Consolas, D2Coding, monospace">a=5, b=34</text>
  <text x="250" y="440" font-size="16" fill="#334155" font-family="Consolas, D2Coding, monospace">345</text>
  <text x="320" y="440" font-size="16" fill="#475569">vs</text>
  <text x="360" y="440" font-size="16" fill="#047857" font-weight="700" font-family="Consolas, D2Coding, monospace">534</text>
  <text x="520" y="440" font-size="16" fill="#047857" font-weight="700" font-family="Consolas, D2Coding, monospace">-2 → 5</text>
  <rect x="24" y="454" width="712" height="42" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="40" y="482" font-size="16" fill="#475569" font-weight="700">7</text>
  <text x="84" y="482" font-size="16" fill="#0f172a" font-weight="700" font-family="Consolas, D2Coding, monospace">a=9, b=3</text>
  <text x="250" y="482" font-size="16" fill="#334155" font-family="Consolas, D2Coding, monospace">39</text>
  <text x="320" y="482" font-size="16" fill="#475569">vs</text>
  <text x="360" y="482" font-size="16" fill="#047857" font-weight="700" font-family="Consolas, D2Coding, monospace">93</text>
  <text x="520" y="482" font-size="16" fill="#047857" font-weight="700" font-family="Consolas, D2Coding, monospace">-6 → 9</text>
  <rect x="24" y="496" width="712" height="42" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="40" y="524" font-size="16" fill="#475569" font-weight="700">8</text>
  <text x="84" y="524" font-size="16" fill="#0f172a" font-weight="700" font-family="Consolas, D2Coding, monospace">a=9, b=34</text>
  <text x="250" y="524" font-size="16" fill="#334155" font-family="Consolas, D2Coding, monospace">349</text>
  <text x="320" y="524" font-size="16" fill="#475569">vs</text>
  <text x="360" y="524" font-size="16" fill="#047857" font-weight="700" font-family="Consolas, D2Coding, monospace">934</text>
  <text x="520" y="524" font-size="16" fill="#047857" font-weight="700" font-family="Consolas, D2Coding, monospace">-6 → 9</text>
  <rect x="24" y="538" width="712" height="42" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="40" y="566" font-size="16" fill="#475569" font-weight="700">9</text>
  <text x="84" y="566" font-size="16" fill="#0f172a" font-weight="700" font-family="Consolas, D2Coding, monospace">a=9, b=5</text>
  <text x="250" y="566" font-size="16" fill="#334155" font-family="Consolas, D2Coding, monospace">59</text>
  <text x="320" y="566" font-size="16" fill="#475569">vs</text>
  <text x="360" y="566" font-size="16" fill="#047857" font-weight="700" font-family="Consolas, D2Coding, monospace">95</text>
  <text x="520" y="566" font-size="16" fill="#047857" font-weight="700" font-family="Consolas, D2Coding, monospace">-4 → 9</text>
  <text x="24" y="610" font-size="17" fill="#0f172a" font-weight="700">정렬 결과</text>
  <rect x="140" y="588" width="68" height="40" rx="0" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="174.0" y="614.0" font-size="18" fill="#047857" font-weight="700" text-anchor="middle" font-family="Consolas, D2Coding, monospace">9</text>
  <rect x="216" y="588" width="68" height="40" rx="0" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="250.0" y="614.0" font-size="18" fill="#047857" font-weight="700" text-anchor="middle" font-family="Consolas, D2Coding, monospace">5</text>
  <rect x="292" y="588" width="68" height="40" rx="0" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="326.0" y="614.0" font-size="18" fill="#047857" font-weight="700" text-anchor="middle" font-family="Consolas, D2Coding, monospace">34</text>
  <rect x="368" y="588" width="68" height="40" rx="0" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="402.0" y="614.0" font-size="18" fill="#047857" font-weight="700" text-anchor="middle" font-family="Consolas, D2Coding, monospace">3</text>
  <rect x="444" y="588" width="68" height="40" rx="0" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="478.0" y="614.0" font-size="18" fill="#047857" font-weight="700" text-anchor="middle" font-family="Consolas, D2Coding, monospace">30</text>
  <text x="530" y="614" font-size="18" fill="#047857" font-weight="700" font-family="Consolas, D2Coding, monospace">→ "9534330"</text>
  <rect x="24" y="646" width="712" height="100" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1"/>
  <text x="44" y="676" font-size="17" fill="#047857" font-weight="700">3 과 30 은 330 &gt; 303 이라 3 이 앞이다 (1번 비교).</text>
  <text x="44" y="702" font-size="16" fill="#334155">사전순 내림차순이면 30 이 앞에 와서 9534303 이 된다.</text>
  <text x="44" y="728" font-size="16" fill="#334155">결과 9534330 은 기대 출력과 같다.</text>
</svg>
