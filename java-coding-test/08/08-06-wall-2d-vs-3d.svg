<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 746" width="760" height="746" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
  <title>그림 8-6. 벽을 1번 부술 수 있는 격자 — 방문 배열이 2차원이면 -1, 3차원이면 6</title>
  <rect width="760" height="746" fill="#ffffff"/>
  <text x="24" y="40" font-size="21" fill="#0f172a" font-weight="700">벽을 1번 부술 수 있는 격자 — 방문 배열이</text>
  <text x="24" y="70" font-size="21" fill="#0f172a" font-weight="700">2차원이면 -1, 3차원이면 6</text>
  <text x="24" y="102" font-size="16" fill="#475569">격자 {"000", "101", "001", "010"}, (0,0) → (3,2), k = 1. 숫자 = 그 칸까지</text>
  <text x="24" y="126" font-size="16" fill="#475569">지나온 칸 수. 파랑 = 벽을 안 부수고 도착, 주황 = 벽을 1번 부수고 도착</text>
  <rect x="24" y="164" width="348" height="470" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="40" y="194" font-size="17" fill="#047857" font-weight="700">① dist[r][c][부순 횟수] (3차원)</text>
  <rect x="102" y="214" width="64" height="64" rx="0" fill="#eff6ff" stroke="#1e3a8a" stroke-width="2"/>
  <text x="134.0" y="252.0" font-size="20" fill="#1e3a8a" font-weight="700" text-anchor="middle">1</text>
  <rect x="166" y="214" width="64" height="64" rx="0" fill="#eff6ff" stroke="#1e3a8a" stroke-width="2"/>
  <text x="198.0" y="252.0" font-size="20" fill="#1e3a8a" font-weight="700" text-anchor="middle">2</text>
  <rect x="230" y="214" width="64" height="64" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="102" y="278" width="64" height="64" rx="0" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1"/>
  <text x="134.0" y="316" font-size="17" fill="#475569" font-weight="700" text-anchor="middle">벽</text>
  <rect x="166" y="278" width="64" height="64" rx="0" fill="#eff6ff" stroke="#1e3a8a" stroke-width="2"/>
  <text x="198.0" y="316.0" font-size="20" fill="#1e3a8a" font-weight="700" text-anchor="middle">3</text>
  <rect x="230" y="278" width="64" height="64" rx="0" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1"/>
  <text x="262.0" y="316" font-size="17" fill="#475569" font-weight="700" text-anchor="middle">벽</text>
  <rect x="102" y="342" width="64" height="64" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="166" y="342" width="64" height="64" rx="0" fill="#eff6ff" stroke="#1e3a8a" stroke-width="2"/>
  <text x="198.0" y="380.0" font-size="20" fill="#1e3a8a" font-weight="700" text-anchor="middle">4</text>
  <rect x="230" y="342" width="64" height="64" rx="0" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1"/>
  <text x="262.0" y="380" font-size="17" fill="#475569" font-weight="700" text-anchor="middle">벽</text>
  <rect x="102" y="406" width="64" height="64" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="166" y="406" width="64" height="64" rx="0" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="198.0" y="444.0" font-size="20" fill="#c2410c" font-weight="700" text-anchor="middle">5</text>
  <rect x="230" y="406" width="64" height="64" rx="0" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="262.0" y="444.0" font-size="20" fill="#047857" font-weight="700" text-anchor="middle">6</text>
  <text x="90" y="238" font-size="16" fill="#475569" text-anchor="end">출발</text>
  <text x="302" y="444" font-size="16" fill="#475569">도착</text>
  <text x="40" y="504" font-size="16" fill="#047857" font-weight="700">답 6 (최소 경로만 표시)</text>
  <text x="40" y="530" font-size="16" fill="#334155">벽을 아껴 (1,1), (2,1) 로 내려온 뒤</text>
  <text x="40" y="556" font-size="16" fill="#334155">(3,1) 의 벽을 부순다.</text>
  <text x="40" y="582" font-size="16" fill="#334155">부순 상태와 안 부순 상태를</text>
  <text x="40" y="608" font-size="16" fill="#334155">따로 기록해 서로 막지 않는다.</text>
  <rect x="388" y="164" width="348" height="470" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="404" y="194" font-size="17" fill="#b91c1c" font-weight="700">② visited[r][c] (2차원)</text>
  <rect x="466" y="214" width="64" height="64" rx="0" fill="#eff6ff" stroke="#1e3a8a" stroke-width="2"/>
  <text x="498.0" y="252.0" font-size="20" fill="#1e3a8a" font-weight="700" text-anchor="middle">1</text>
  <rect x="530" y="214" width="64" height="64" rx="0" fill="#eff6ff" stroke="#1e3a8a" stroke-width="2"/>
  <text x="562.0" y="252.0" font-size="20" fill="#1e3a8a" font-weight="700" text-anchor="middle">2</text>
  <rect x="594" y="214" width="64" height="64" rx="0" fill="#eff6ff" stroke="#1e3a8a" stroke-width="2"/>
  <text x="626.0" y="252.0" font-size="20" fill="#1e3a8a" font-weight="700" text-anchor="middle">3</text>
  <rect x="466" y="278" width="64" height="64" rx="0" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="498.0" y="316.0" font-size="20" fill="#c2410c" font-weight="700" text-anchor="middle">2</text>
  <rect x="530" y="278" width="64" height="64" rx="0" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="562.0" y="316.0" font-size="20" fill="#b91c1c" font-weight="700" text-anchor="middle">3</text>
  <rect x="594" y="278" width="64" height="64" rx="0" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="626.0" y="316.0" font-size="20" fill="#c2410c" font-weight="700" text-anchor="middle">4</text>
  <rect x="466" y="342" width="64" height="64" rx="0" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="498.0" y="380.0" font-size="20" fill="#c2410c" font-weight="700" text-anchor="middle">3</text>
  <rect x="530" y="342" width="64" height="64" rx="0" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="562.0" y="380.0" font-size="20" fill="#b91c1c" font-weight="700" text-anchor="middle">4</text>
  <rect x="594" y="342" width="64" height="64" rx="0" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1"/>
  <text x="626.0" y="380" font-size="17" fill="#475569" font-weight="700" text-anchor="middle">벽</text>
  <rect x="466" y="406" width="64" height="64" rx="0" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="498.0" y="444.0" font-size="20" fill="#c2410c" font-weight="700" text-anchor="middle">4</text>
  <rect x="530" y="406" width="64" height="64" rx="0" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1"/>
  <text x="562.0" y="444" font-size="17" fill="#475569" font-weight="700" text-anchor="middle">벽</text>
  <rect x="594" y="406" width="64" height="64" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="454" y="238" font-size="16" fill="#475569" text-anchor="end">출발</text>
  <text x="666" y="444" font-size="16" fill="#475569">도착</text>
  <text x="404" y="504" font-size="16" fill="#b91c1c" font-weight="700">답 -1 (도착 못 함)</text>
  <text x="404" y="530" font-size="16" fill="#334155">(1,0) 벽을 부수고 온 상태가</text>
  <text x="404" y="556" font-size="16" fill="#334155">(1,1), (2,1) 을 먼저 차지했다 (빨강).</text>
  <text x="404" y="582" font-size="16" fill="#334155">벽을 아낀 경로는 (0,1) 에서</text>
  <text x="404" y="608" font-size="16" fill="#334155">(1,1) 로 못 들어간다.</text>
  <rect x="24" y="652" width="712" height="74" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1"/>
  <text x="44" y="682" font-size="17" fill="#047857" font-weight="700">같은 칸이라도 벽을 부쉈는지에 따라 앞으로 갈 수 있는 곳이 다르다.</text>
  <text x="44" y="708" font-size="16" fill="#334155">그래서 상태는 (행, 열, 부순 횟수) 이고, 방문 배열도 3차원이어야 한다.</text>
</svg>
