<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 774" width="760" height="774" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
  <title>그림 8-1. 단어 변환 예제 1 을 그래프로 그리면 — 단어가 노드, 한 글자 차이가 간선</title>
  <rect width="760" height="774" fill="#ffffff"/>
  <text x="24" y="40" font-size="21" fill="#0f172a" font-weight="700">단어 변환 예제 1 을 그래프로 그리면</text>
  <text x="24" y="70" font-size="21" fill="#0f172a" font-weight="700">— 단어가 노드, 한 글자 차이가 간선</text>
  <text x="24" y="102" font-size="16" fill="#475569">begin hit, target cog, words [hot, dot, dog, lot, log, cog]</text>
  <text x="24" y="126" font-size="16" fill="#475569">간선 옆 글자 = 그 간선에서 바뀌는 글자 (예: i→o 는 가운데 i 를 o 로)</text>
  <rect x="16" y="158" width="728" height="80" rx="6" fill="#f1f5f9" stroke="none" stroke-width="0"/>
  <text x="32" y="204" font-size="17" fill="#475569" font-weight="700">거리 0</text>
  <rect x="16" y="258" width="728" height="80" rx="6" fill="#eff6ff" stroke="none" stroke-width="0"/>
  <text x="32" y="304" font-size="17" fill="#475569" font-weight="700">거리 1</text>
  <rect x="16" y="358" width="728" height="80" rx="6" fill="#ecfdf5" stroke="none" stroke-width="0"/>
  <text x="32" y="404" font-size="17" fill="#475569" font-weight="700">거리 2</text>
  <rect x="16" y="458" width="728" height="80" rx="6" fill="#fff7ed" stroke="none" stroke-width="0"/>
  <text x="32" y="504" font-size="17" fill="#475569" font-weight="700">거리 3</text>
  <rect x="16" y="558" width="728" height="80" rx="6" fill="#f0fdf4" stroke="none" stroke-width="0"/>
  <text x="32" y="604" font-size="17" fill="#475569" font-weight="700">거리 4</text>
  <line x1="430" y1="219" x2="430" y2="277" stroke="#1e3a8a" stroke-width="4"/>
  <text x="442.0" y="254.0" font-size="15" fill="#c2410c" font-weight="700" font-family="Consolas, D2Coding, monospace">i→o</text>
  <line x1="430" y1="319" x2="300" y2="377" stroke="#1e3a8a" stroke-width="4"/>
  <text x="351.0" y="350.0" font-size="15" fill="#c2410c" font-weight="700" text-anchor="end" font-family="Consolas, D2Coding, monospace">h→d</text>
  <line x1="430" y1="319" x2="560" y2="377" stroke="#94a3b8" stroke-width="2"/>
  <text x="509.0" y="350.0" font-size="15" fill="#c2410c" font-weight="700" font-family="Consolas, D2Coding, monospace">h→l</text>
  <line x1="348" y1="398" x2="512" y2="398" stroke="#94a3b8" stroke-width="2"/>
  <text x="430.0" y="390" font-size="15" fill="#c2410c" font-weight="700" text-anchor="middle" font-family="Consolas, D2Coding, monospace">d→l</text>
  <line x1="300" y1="419" x2="300" y2="477" stroke="#1e3a8a" stroke-width="4"/>
  <text x="312.0" y="454.0" font-size="15" fill="#c2410c" font-weight="700" font-family="Consolas, D2Coding, monospace">t→g</text>
  <line x1="560" y1="419" x2="560" y2="477" stroke="#94a3b8" stroke-width="2"/>
  <text x="572.0" y="454.0" font-size="15" fill="#c2410c" font-weight="700" font-family="Consolas, D2Coding, monospace">t→g</text>
  <line x1="348" y1="498" x2="512" y2="498" stroke="#94a3b8" stroke-width="2"/>
  <text x="430.0" y="490" font-size="15" fill="#c2410c" font-weight="700" text-anchor="middle" font-family="Consolas, D2Coding, monospace">d→l</text>
  <line x1="300" y1="519" x2="430" y2="577" stroke="#1e3a8a" stroke-width="4"/>
  <text x="379.0" y="550.0" font-size="15" fill="#c2410c" font-weight="700" font-family="Consolas, D2Coding, monospace">d→c</text>
  <line x1="560" y1="519" x2="430" y2="577" stroke="#94a3b8" stroke-width="2"/>
  <text x="481.0" y="550.0" font-size="15" fill="#c2410c" font-weight="700" text-anchor="end" font-family="Consolas, D2Coding, monospace">l→c</text>
  <rect x="382.0" y="177.0" width="96" height="42" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="430" y="204" font-size="18" fill="#475569" font-weight="700" text-anchor="middle" font-family="Consolas, D2Coding, monospace">hit</text>
  <rect x="382.0" y="277.0" width="96" height="42" rx="8" fill="#eff6ff" stroke="#1e3a8a" stroke-width="2"/>
  <text x="430" y="304" font-size="18" fill="#1e3a8a" font-weight="700" text-anchor="middle" font-family="Consolas, D2Coding, monospace">hot</text>
  <rect x="252.0" y="377.0" width="96" height="42" rx="8" fill="#eff6ff" stroke="#1e3a8a" stroke-width="2"/>
  <text x="300" y="404" font-size="18" fill="#1e3a8a" font-weight="700" text-anchor="middle" font-family="Consolas, D2Coding, monospace">dot</text>
  <rect x="512.0" y="377.0" width="96" height="42" rx="8" fill="#ffffff" stroke="#1e3a8a" stroke-width="2"/>
  <text x="560" y="404" font-size="18" fill="#0f172a" font-weight="700" text-anchor="middle" font-family="Consolas, D2Coding, monospace">lot</text>
  <rect x="252.0" y="477.0" width="96" height="42" rx="8" fill="#eff6ff" stroke="#1e3a8a" stroke-width="2"/>
  <text x="300" y="504" font-size="18" fill="#1e3a8a" font-weight="700" text-anchor="middle" font-family="Consolas, D2Coding, monospace">dog</text>
  <rect x="512.0" y="477.0" width="96" height="42" rx="8" fill="#ffffff" stroke="#1e3a8a" stroke-width="2"/>
  <text x="560" y="504" font-size="18" fill="#0f172a" font-weight="700" text-anchor="middle" font-family="Consolas, D2Coding, monospace">log</text>
  <rect x="382.0" y="577.0" width="96" height="42" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="430" y="604" font-size="18" fill="#047857" font-weight="700" text-anchor="middle" font-family="Consolas, D2Coding, monospace">cog</text>
  <text x="500" y="204" font-size="16" fill="#475569">시작 (목록 밖)</text>
  <text x="500" y="604" font-size="16" fill="#047857" font-weight="700">target</text>
  <rect x="24" y="654" width="712" height="100" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1"/>
  <text x="44" y="684" font-size="17" fill="#047857" font-weight="700">노드 7개(시작 hit 포함), 간선 9개. 문제에는 한 줄도 안 나온다.</text>
  <text x="44" y="710" font-size="16" fill="#334155">파란 굵은 선 = 최소 경로 hit → hot → dot → dog → cog (4번)</text>
  <text x="44" y="736" font-size="16" fill="#334155">BFS 는 거리 0, 1, 2, 3, 4 층 순서로 단어를 꺼낸다.</text>
</svg>
