<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 596" width="760" height="596" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
  <title>그림 8-4. 이웃 찾기 방법별 BFS 1번의 실행 시간 (길이 5, 알파벳 6개 무작위 단어)</title>
  <rect width="760" height="596" fill="#ffffff"/>
  <text x="24" y="40" font-size="21" fill="#0f172a" font-weight="700">이웃 찾기 방법별 BFS 1번의 실행 시간</text>
  <text x="24" y="72" font-size="16" fill="#475569">길이 5, 알파벳 6개로 만든 무작위 단어 목록, 워밍업 3번 뒤 1번 (내 PC)</text>
  <text x="24" y="96" font-size="16" fill="#475569">막대 길이는 같은 비율 (35.2ms = 끝까지)</text>
  <text x="24" y="156" font-size="17" fill="#0f172a" font-weight="700">N = 1,000 (최소 횟수 9)</text>
  <text x="196" y="191" font-size="16" fill="#334155" text-anchor="end">① 모든 단어와 비교</text>
  <rect x="210" y="170" width="39.20454545454545" height="28" rx="3" fill="#b91c1c" stroke="#b91c1c" stroke-width="1"/>
  <text x="259.20454545454544" y="191" font-size="16" fill="#b91c1c" font-weight="700">3.0ms</text>
  <text x="196" y="231" font-size="16" fill="#334155" text-anchor="end">③ 와일드카드 버킷</text>
  <rect x="210" y="210" width="14.375" height="28" rx="3" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1"/>
  <text x="234.375" y="231" font-size="16" fill="#1e3a8a" font-weight="700">1.1ms</text>
  <text x="196" y="271" font-size="16" fill="#334155" text-anchor="end">양방향 BFS</text>
  <rect x="210" y="250" width="3" height="28" rx="3" fill="#047857" stroke="#047857" stroke-width="1"/>
  <text x="223" y="271" font-size="16" fill="#047857" font-weight="700">0.2ms</text>
  <text x="24" y="324" font-size="17" fill="#0f172a" font-weight="700">N = 5,000 (최소 횟수 5)</text>
  <text x="196" y="359" font-size="16" fill="#334155" text-anchor="end">① 모든 단어와 비교</text>
  <rect x="210" y="338" width="460.0" height="28" rx="3" fill="#b91c1c" stroke="#b91c1c" stroke-width="1"/>
  <text x="680.0" y="359" font-size="16" fill="#b91c1c" font-weight="700">35.2ms</text>
  <text x="196" y="399" font-size="16" fill="#334155" text-anchor="end">③ 와일드카드 버킷</text>
  <rect x="210" y="378" width="39.20454545454545" height="28" rx="3" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1"/>
  <text x="259.20454545454544" y="399" font-size="16" fill="#1e3a8a" font-weight="700">3.0ms</text>
  <text x="196" y="439" font-size="16" fill="#334155" text-anchor="end">양방향 BFS</text>
  <rect x="210" y="418" width="5.227272727272727" height="28" rx="3" fill="#047857" stroke="#047857" stroke-width="1"/>
  <text x="225.22727272727272" y="439" font-size="16" fill="#047857" font-weight="700">0.4ms</text>
  <rect x="24" y="476" width="712" height="100" rx="8" fill="#eff6ff" stroke="#1e3a8a" stroke-width="1"/>
  <text x="44" y="506" font-size="17" fill="#1e3a8a" font-weight="700">N 이 5배가 되자 ① 은 약 12배 (3.0 → 35.2ms) 느려졌다. N² 의 모양이다.</text>
  <text x="44" y="532" font-size="16" fill="#334155">③ 은 약 2.7배 (1.1 → 3.0ms) 로 늘었다.</text>
  <text x="44" y="558" font-size="16" fill="#334155">세 방법의 최소 횟수(답)는 두 N 모두에서 같았다.</text>
</svg>
