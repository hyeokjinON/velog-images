<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 904" width="760" height="904" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
  <title>그림 9-1. 같은 답을 내는 두 풀이의 실행 시간 — O(n) 은 거의 그대로, O(n²) 은 입력이 늘수록 급격히 늘어난다</title>
  <rect width="760" height="904" fill="#ffffff"/>
  <text x="24" y="40" font-size="22" font-weight="700" fill="#0f172a">같은 답을 내는 두 풀이의 실행 시간 —</text>
  <text x="24" y="70" font-size="20" font-weight="700" fill="#0f172a">O(n) 은 거의 그대로, O(n²) 은 입력이 늘수록 급격히 늘어난다</text>
  <text x="24" y="104" font-size="16" fill="#475569">내 PC 측정값(본문 3-2절, 3-3절의 표). 막대 길이는 패널마다</text>
  <text x="24" y="128" font-size="16" fill="#475569">가장 긴 값에 맞춘 같은 비율이다. 초록 = O(n) 풀이, 빨강 = O(n²) 풀이</text>

  <!-- Panel A -->
  <rect x="24" y="148" width="712" height="358" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <circle cx="50" cy="177" r="13" fill="#1d4ed8"/><text x="50" y="183" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">1</text>
  <text x="74" y="183" font-size="17" font-weight="700" fill="#0f172a">오픈채팅방 — 두 번 훑기 O(n) 과,</text>
  <text x="74" y="207" font-size="17" font-weight="700" fill="#0f172a">이름이 바뀔 때마다 지난 메시지를 고치는 순진한 방법 O(n²)</text>

  <g font-size="16">
    <text x="48" y="252" font-weight="700" fill="#0f172a">기록 20,000</text>
    <text x="330" y="252" text-anchor="end" fill="#334155">두 번 훑기</text>
    <rect x="342" y="236" width="3" height="22" fill="#047857"/>
    <text x="355" y="252" fill="#047857" font-weight="700">5ms</text>
    <text x="330" y="284" text-anchor="end" fill="#334155">순진한 방법</text>
    <rect x="342" y="268" width="10" height="22" fill="#b91c1c"/>
    <text x="362" y="284" fill="#b91c1c" font-weight="700">372ms</text>

    <line x1="48" y1="304" x2="712" y2="304" stroke="#e2e8f0"/>

    <text x="48" y="336" font-weight="700" fill="#0f172a">기록 100,000</text>
    <text x="48" y="360" fill="#475569">(문제 최대)</text>
    <text x="330" y="336" text-anchor="end" fill="#334155">두 번 훑기</text>
    <rect x="342" y="320" width="3" height="22" fill="#047857"/>
    <text x="355" y="336" fill="#047857" font-weight="700">17ms</text>
    <text x="330" y="368" text-anchor="end" fill="#334155">순진한 방법</text>
    <rect x="342" y="352" width="290" height="22" fill="#b91c1c"/>
    <text x="642" y="368" fill="#b91c1c" font-weight="700">10,648ms</text>
  </g>
  <g font-size="16" fill="#334155">
    <text x="48" y="410">기록이 5배(20,000 → 100,000)가 되자 순진한 방법은</text>
    <text x="48" y="434">372ms → 10,648ms 로 약 29배 느려졌다. 두 번 훑기는 5ms → 17ms 였다.</text>
    <text x="48" y="462">100,000 건에서 두 풀이의 차이는 약 626배(10,648 ÷ 17)다.</text>
    <text x="48" y="486">두 번 훑기의 막대는 너무 짧아 선 하나로 보인다.</text>
  </g>

  <!-- Panel B -->
  <rect x="24" y="526" width="712" height="358" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <circle cx="50" cy="555" r="13" fill="#1d4ed8"/><text x="50" y="561" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">2</text>
  <text x="74" y="561" font-size="17" font-weight="700" fill="#0f172a">신고 결과 받기의 중복 제거 — HashSet.add O(1) 와</text>
  <text x="74" y="585" font-size="17" font-weight="700" fill="#0f172a">ArrayList.contains O(n) 을 report 수만큼 반복</text>

  <g font-size="16">
    <text x="48" y="630" font-weight="700" fill="#0f172a">report 20,000</text>
    <text x="330" y="630" text-anchor="end" fill="#334155">HashSet</text>
    <rect x="342" y="614" width="3" height="22" fill="#047857"/>
    <text x="355" y="630" fill="#047857" font-weight="700">2ms</text>
    <text x="330" y="662" text-anchor="end" fill="#334155">ArrayList.contains</text>
    <rect x="342" y="646" width="38" height="22" fill="#b91c1c"/>
    <text x="390" y="662" fill="#b91c1c" font-weight="700">203ms</text>

    <line x1="48" y1="682" x2="712" y2="682" stroke="#e2e8f0"/>

    <text x="48" y="714" font-weight="700" fill="#0f172a">report 50,000</text>
    <text x="330" y="714" text-anchor="end" fill="#334155">HashSet</text>
    <rect x="342" y="698" width="3" height="22" fill="#047857"/>
    <text x="355" y="714" fill="#047857" font-weight="700">2ms</text>
    <text x="330" y="746" text-anchor="end" fill="#334155">ArrayList.contains</text>
    <rect x="342" y="730" width="290" height="22" fill="#b91c1c"/>
    <text x="642" y="746" fill="#b91c1c" font-weight="700">1,549ms</text>
  </g>
  <g font-size="16" fill="#334155">
    <text x="48" y="788">report 가 2.5배가 되자 ArrayList.contains 는 7.6배 느려졌다.</text>
    <text x="48" y="812">문제 최대인 200,000 개에서 HashSet 은 7ms 였고,</text>
    <text x="48" y="840">ArrayList.contains 는 재지 않았다. 입력이 4배면 시간은</text>
    <text x="48" y="864">약 16배라서 약 25초로 추정한다.</text>
  </g>
</svg>
