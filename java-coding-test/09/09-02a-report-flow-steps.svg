<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 838" width="760" height="838" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
  <title>그림 9-2a. 신고 결과 받기 풀이 A — 신고 5줄이 메일 수 배열 [2, 1, 1, 0] 이 되기까지 (예제 1, k = 2)</title>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  </defs>
  <rect width="760" height="838" fill="#ffffff"/>
  <text x="24" y="40" font-size="22" font-weight="700" fill="#0f172a">신고 결과 받기 풀이 A — 신고 5줄이 메일 수 배열</text>
  <text x="24" y="70" font-size="22" font-weight="700" fill="#0f172a">[2, 1, 1, 0] 이 되기까지 (예제 1, k = 2)</text>
  <text x="24" y="104" font-size="16" fill="#475569">파랑 = 입력과 조회용 맵, 초록 = 중복 없이 모은 결과,</text>
  <text x="24" y="128" font-size="16" fill="#475569">빨강 = 정지된 사람, 회색 화살표 = 다음 단계로 넘기는 값</text>

  <!-- 1 입력 : 150..246 -->
  <rect x="24" y="150" width="712" height="96" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
  <circle cx="50" cy="176" r="13" fill="#1d4ed8"/><text x="50" y="182" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">1</text>
  <text x="74" y="183" font-size="18" font-weight="700" fill="#1d4ed8">입력</text>
  <g font-size="16" fill="#334155">
    <text x="48" y="210">id_list  muzi, frodo, apeach, neo</text>
    <text x="48" y="234">report 5줄 "신고자 피신고자",  k = 2</text>
  </g>
  <g font-size="16" fill="#475569">
    <text x="440" y="210">k 명 이상에게 신고되면</text>
    <text x="440" y="234">정지된다</text>
  </g>
  <line x1="380" y1="248" x2="380" y2="268" stroke="#334155" stroke-width="2" marker-end="url(#g)"/>

  <!-- 2 이름 → 인덱스 : 270..366 -->
  <rect x="24" y="270" width="712" height="96" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
  <circle cx="50" cy="296" r="13" fill="#1d4ed8"/><text x="50" y="302" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">2</text>
  <text x="74" y="303" font-size="18" font-weight="700" fill="#1d4ed8">이름 → 인덱스</text>
  <g font-size="16" fill="#334155">
    <text x="48" y="330">idx 맵  muzi → 0, frodo → 1,</text>
    <text x="104" y="354">apeach → 2, neo → 3</text>
  </g>
  <g font-size="16" fill="#475569">
    <text x="440" y="330">답 배열의 몇 번째 칸에</text>
    <text x="440" y="354">더할지 이름으로 찾는다</text>
  </g>
  <line x1="380" y1="368" x2="380" y2="388" stroke="#334155" stroke-width="2" marker-end="url(#g)"/>

  <!-- 3 피신고자별 Set : 390..510 -->
  <rect x="24" y="390" width="712" height="120" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
  <circle cx="50" cy="416" r="13" fill="#047857"/><text x="50" y="422" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">3</text>
  <text x="74" y="423" font-size="18" font-weight="700" fill="#047857">피신고자별 Set</text>
  <g font-size="16" fill="#334155">
    <text x="48" y="450">reporters 맵  frodo → {muzi, apeach}</text>
    <text x="155" y="474">neo → {frodo, muzi}</text>
    <text x="155" y="498">muzi → {apeach}</text>
  </g>
  <g font-size="16" fill="#475569">
    <text x="440" y="450">같은 쌍이 또 오면</text>
    <text x="440" y="474">Set.add 가 false 를 돌려주고</text>
    <text x="440" y="498">Set 크기는 그대로다</text>
  </g>
  <line x1="380" y1="512" x2="380" y2="532" stroke="#334155" stroke-width="2" marker-end="url(#g)"/>

  <!-- 4 정지 판정 : 534..654 -->
  <rect x="24" y="534" width="712" height="120" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.6"/>
  <circle cx="50" cy="560" r="13" fill="#b91c1c"/><text x="50" y="566" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">4</text>
  <text x="74" y="567" font-size="18" font-weight="700" fill="#b91c1c">정지 판정</text>
  <g font-size="16" fill="#334155">
    <text x="48" y="594">Set 크기 ≥ k(2) ?</text>
    <text x="48" y="618" fill="#b91c1c" font-weight="700">frodo 2명 → 정지,  neo 2명 → 정지</text>
    <text x="48" y="642">muzi 1명 → 정지 아님</text>
  </g>
  <g font-size="16" fill="#475569">
    <text x="440" y="594">신고 횟수가 아니라</text>
    <text x="440" y="618">서로 다른 신고자 수로</text>
    <text x="440" y="642">판정한다</text>
  </g>
  <line x1="380" y1="656" x2="380" y2="676" stroke="#334155" stroke-width="2" marker-end="url(#g)"/>

  <!-- 5 메일 배열 : 678..814 -->
  <rect x="24" y="678" width="712" height="136" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
  <circle cx="50" cy="704" r="13" fill="#047857"/><text x="50" y="710" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">5</text>
  <text x="74" y="711" font-size="18" font-weight="700" fill="#047857">메일 배열</text>
  <g font-size="16" fill="#334155">
    <text x="48" y="738">정지된 사람의 Set 안 신고자마다 1통</text>
    <text x="48" y="762">frodo 정지 → muzi, apeach</text>
    <text x="48" y="786">neo 정지 → frodo, muzi</text>
  </g>
  <text x="440" y="738" font-size="16" fill="#334155">mail =</text>
  <text x="440" y="772" font-size="24" font-weight="700" fill="#047857">[2, 1, 1, 0]</text>
  <text x="440" y="800" font-size="16" fill="#475569">muzi frodo apeach neo 순</text>
</svg>
