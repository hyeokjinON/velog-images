<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 834" width="760" height="834" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
  <title>그림 9-4b. 오픈채팅방 두 번 훑기 — 2차에서 확정된 닉네임으로 메시지를 만든다</title>
  <rect width="760" height="834" fill="#ffffff"/>
  <text x="24" y="40" font-size="22" font-weight="700" fill="#0f172a">오픈채팅방 두 번 훑기 ② — 2차에서 확정된</text>
  <text x="24" y="70" font-size="22" font-weight="700" fill="#0f172a">닉네임으로 메시지를 만든다</text>
  <text x="24" y="104" font-size="16" fill="#475569">파랑 = 맵에서 닉네임을 꺼내 읽는 곳, 점선 = 메시지를 만들지 않는 줄</text>

  <rect x="24" y="124" width="712" height="44" rx="8" fill="#eff6ff" stroke="#1d4ed8"/>
  <text x="44" y="152" font-size="16" font-weight="700" fill="#1d4ed8">nick 맵 (그림 9-4a)</text>
  <text x="210" y="152" font-size="16" fill="#0f172a" font-family="Consolas, monospace">{ uid1234=Prodo, uid4567=Ryan }</text>

  <circle cx="38" cy="206" r="13" fill="#1d4ed8"/><text x="38" y="212" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">3</text>
  <text x="60" y="212" font-size="17" font-weight="700" fill="#1d4ed8">2차 훑기 — 같은 5줄을 다시 읽으며 Enter, Leave 만</text>
  <text x="60" y="236" font-size="17" font-weight="700" fill="#1d4ed8">메시지를 만든다. 닉네임은 nick.get(uid) 로 꺼낸다</text>

  <g font-size="16" fill="#475569">
    <text x="44" y="272">읽은 줄</text>
    <text x="250" y="272">맵에서 꺼낸 닉네임</text>
    <text x="470" y="272">넣는 칸</text>
  </g>

  <g font-size="16">
    <rect x="24" y="284" width="712" height="48" rx="8" fill="#f8fafc" stroke="#1d4ed8" stroke-width="1.4"/>
    <text x="44" y="314" font-family="Consolas, monospace" fill="#0f172a">Enter uid1234 Muzi</text>
    <text x="250" y="314" fill="#1d4ed8">get(uid1234) = Prodo</text>
    <text x="470" y="314" fill="#0f172a" font-weight="700">answer[0]</text>

    <rect x="24" y="342" width="712" height="48" rx="8" fill="#f8fafc" stroke="#1d4ed8" stroke-width="1.4"/>
    <text x="44" y="372" font-family="Consolas, monospace" fill="#0f172a">Enter uid4567 Prodo</text>
    <text x="250" y="372" fill="#1d4ed8">get(uid4567) = Ryan</text>
    <text x="470" y="372" fill="#0f172a" font-weight="700">answer[1]</text>

    <rect x="24" y="400" width="712" height="48" rx="8" fill="#f8fafc" stroke="#1d4ed8" stroke-width="1.4"/>
    <text x="44" y="430" font-family="Consolas, monospace" fill="#0f172a">Leave uid1234</text>
    <text x="250" y="430" fill="#1d4ed8">get(uid1234) = Prodo</text>
    <text x="470" y="430" fill="#0f172a" font-weight="700">answer[2]</text>

    <rect x="24" y="458" width="712" height="48" rx="8" fill="#f8fafc" stroke="#1d4ed8" stroke-width="1.4"/>
    <text x="44" y="488" font-family="Consolas, monospace" fill="#0f172a">Enter uid1234 Prodo</text>
    <text x="250" y="488" fill="#1d4ed8">get(uid1234) = Prodo</text>
    <text x="470" y="488" fill="#0f172a" font-weight="700">answer[3]</text>

    <rect x="24" y="516" width="712" height="48" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 4"/>
    <text x="44" y="546" font-family="Consolas, monospace" fill="#0f172a">Change uid4567 Ryan</text>
    <text x="250" y="546" fill="#334155">default 로 빠진다</text>
    <text x="470" y="546" fill="#475569">메시지를 만들지 않는다</text>
  </g>

  <rect x="24" y="594" width="712" height="216" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
  <circle cx="50" cy="620" r="13" fill="#047857"/><text x="50" y="626" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">4</text>
  <text x="74" y="627" font-size="18" font-weight="700" fill="#047857">answer (예제의 기대 출력과 같다)</text>
  <g font-size="17" fill="#0f172a">
    <text x="74" y="660">[0] Prodo님이 들어왔습니다.</text>
    <text x="74" y="686">[1] Ryan님이 들어왔습니다.</text>
    <text x="74" y="712">[2] Prodo님이 나갔습니다.</text>
    <text x="74" y="738">[3] Prodo님이 들어왔습니다.</text>
  </g>
  <text x="74" y="770" font-size="16" fill="#475569">[0] 은 기록에 Muzi 라고 적혀 있지만, 2차에서는 기록의 닉네임이</text>
  <text x="74" y="794" font-size="16" fill="#475569">아니라 맵의 마지막 닉네임(Prodo)을 쓴다.</text>
</svg>
