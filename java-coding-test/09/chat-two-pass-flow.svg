<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
  <title>오픈채팅방 두 번 훑기 — 1차에서 uid별 마지막 닉네임을 확정하고, 2차에서 그 닉네임으로 메시지를 만든다</title>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker>
  </defs>
  <rect width="1200" height="700" fill="#ffffff"/>
  <text x="24" y="36" font-size="20" font-weight="700" fill="#0f172a">오픈채팅방 두 번 훑기 — 1차에서 uid 별 마지막 닉네임을 확정하고, 2차에서 그 닉네임으로 메시지를 만든다</text>
  <text x="24" y="62" font-size="14" fill="#475569">같은 기록 5줄을 두 번 읽는다. 초록 = 맵에 닉네임을 쓰는 줄, 회색 = 맵을 바꾸지 않는 줄, 파랑 = 맵에서 닉네임을 꺼내 읽는 곳</text>

  <!-- 1차 -->
  <circle cx="38" cy="96" r="13" fill="#047857"/><text x="38" y="101" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">1</text>
  <text x="60" y="101" font-size="16" font-weight="700" fill="#047857">1차 훑기 — Enter, Change 는 nick.put(uid, 닉네임)으로 덮어쓰고, Enter, Leave 는 메시지 개수만 센다</text>

  <g font-size="14">
    <rect x="24" y="118" width="214" height="96" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
    <text x="36" y="144" font-family="Consolas, monospace" fill="#0f172a">Enter uid1234 Muzi</text>
    <text x="36" y="172" fill="#047857" font-weight="700">uid1234 ← Muzi</text>
    <text x="36" y="198" fill="#475569">msgCount 1</text>

    <rect x="258" y="118" width="214" height="96" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
    <text x="270" y="144" font-family="Consolas, monospace" fill="#0f172a">Enter uid4567 Prodo</text>
    <text x="270" y="172" fill="#047857" font-weight="700">uid4567 ← Prodo</text>
    <text x="270" y="198" fill="#475569">msgCount 2</text>

    <rect x="492" y="118" width="214" height="96" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
    <text x="504" y="144" font-family="Consolas, monospace" fill="#0f172a">Leave uid1234</text>
    <text x="504" y="172" fill="#334155">맵은 그대로 둔다</text>
    <text x="504" y="198" fill="#475569">msgCount 3</text>

    <rect x="726" y="118" width="214" height="96" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
    <text x="738" y="144" font-family="Consolas, monospace" fill="#0f172a">Enter uid1234 Prodo</text>
    <text x="738" y="172" fill="#047857" font-weight="700">uid1234 ← Prodo</text>
    <text x="738" y="198" fill="#475569">Muzi 를 덮어씀, msgCount 4</text>

    <rect x="960" y="118" width="216" height="96" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
    <text x="972" y="144" font-family="Consolas, monospace" fill="#0f172a">Change uid4567 Ryan</text>
    <text x="972" y="172" fill="#047857" font-weight="700">uid4567 ← Ryan</text>
    <text x="972" y="198" fill="#475569">Prodo 를 덮어씀, 4 그대로</text>
  </g>
  <g stroke="#334155" stroke-width="1.8">
    <line x1="238" y1="166" x2="254" y2="166" marker-end="url(#g)"/>
    <line x1="472" y1="166" x2="488" y2="166" marker-end="url(#g)"/>
    <line x1="706" y1="166" x2="722" y2="166" marker-end="url(#g)"/>
    <line x1="940" y1="166" x2="956" y2="166" marker-end="url(#g)"/>
  </g>

  <!-- 확정된 맵 -->
  <polyline points="1068,214 1068,312 866,312" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#g)"/><text x="1056" y="270" font-size="14" fill="#334155" text-anchor="end">5줄을 끝까지 읽은 뒤</text>
  <circle cx="318" cy="290" r="13" fill="#1d4ed8"/><text x="318" y="295" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2</text>
  <rect x="340" y="260" width="520" height="104" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="600" y="288" font-size="16" font-weight="700" fill="#1d4ed8" text-anchor="middle">1차가 끝난 뒤 확정된 nick 맵</text>
  <text x="600" y="316" font-size="16" fill="#0f172a" text-anchor="middle" font-family="Consolas, monospace">{ uid1234=Prodo, uid4567=Ryan }</text>
  <text x="600" y="346" font-size="14" fill="#334155" text-anchor="middle">msgCount = 4 이므로 answer = new String[4] 로 답 배열을 만든다</text>

  <!-- 2차 -->
  <circle cx="38" cy="410" r="13" fill="#1d4ed8"/><text x="38" y="415" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">3</text>
  <text x="60" y="415" font-size="16" font-weight="700" fill="#1d4ed8">2차 훑기 — 같은 5줄을 다시 읽으며 Enter, Leave 만 메시지를 만든다. 닉네임은 nick.get(uid) 로 꺼낸다</text>

  <g font-size="14">
    <rect x="24" y="432" width="214" height="104" rx="8" fill="#f8fafc" stroke="#1d4ed8" stroke-width="1.4"/>
    <text x="36" y="458" font-family="Consolas, monospace" fill="#0f172a">Enter uid1234 Muzi</text>
    <text x="36" y="484" fill="#1d4ed8">get(uid1234) = Prodo</text>
    <text x="36" y="510" fill="#0f172a" font-weight="700">answer[0]</text>

    <rect x="258" y="432" width="214" height="104" rx="8" fill="#f8fafc" stroke="#1d4ed8" stroke-width="1.4"/>
    <text x="270" y="458" font-family="Consolas, monospace" fill="#0f172a">Enter uid4567 Prodo</text>
    <text x="270" y="484" fill="#1d4ed8">get(uid4567) = Ryan</text>
    <text x="270" y="510" fill="#0f172a" font-weight="700">answer[1]</text>

    <rect x="492" y="432" width="214" height="104" rx="8" fill="#f8fafc" stroke="#1d4ed8" stroke-width="1.4"/>
    <text x="504" y="458" font-family="Consolas, monospace" fill="#0f172a">Leave uid1234</text>
    <text x="504" y="484" fill="#1d4ed8">get(uid1234) = Prodo</text>
    <text x="504" y="510" fill="#0f172a" font-weight="700">answer[2]</text>

    <rect x="726" y="432" width="214" height="104" rx="8" fill="#f8fafc" stroke="#1d4ed8" stroke-width="1.4"/>
    <text x="738" y="458" font-family="Consolas, monospace" fill="#0f172a">Enter uid1234 Prodo</text>
    <text x="738" y="484" fill="#1d4ed8">get(uid1234) = Prodo</text>
    <text x="738" y="510" fill="#0f172a" font-weight="700">answer[3]</text>

    <rect x="960" y="432" width="216" height="104" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 4"/>
    <text x="972" y="458" font-family="Consolas, monospace" fill="#0f172a">Change uid4567 Ryan</text>
    <text x="972" y="484" fill="#334155">default 로 빠진다</text>
    <text x="972" y="510" fill="#475569">메시지를 만들지 않는다</text>
  </g>

  <!-- 결과 -->
  <circle cx="38" cy="584" r="13" fill="#047857"/><text x="38" y="589" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">4</text>
  <rect x="60" y="558" width="1116" height="122" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
  <text x="80" y="586" font-size="16" font-weight="700" fill="#047857">answer (예제의 기대 출력과 같다)</text>
  <g font-size="15" fill="#0f172a">
    <text x="80" y="614">[0] Prodo님이 들어왔습니다.</text>
    <text x="620" y="614">[1] Ryan님이 들어왔습니다.</text>
    <text x="80" y="642">[2] Prodo님이 나갔습니다.</text>
    <text x="620" y="642">[3] Prodo님이 들어왔습니다.</text>
  </g>
  <text x="80" y="668" font-size="14" fill="#475569">[0] 은 기록에 Muzi 라고 적혀 있지만, 2차에서는 기록의 닉네임이 아니라 맵의 마지막 닉네임(Prodo)을 쓴다.</text>
</svg>
