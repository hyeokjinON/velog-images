<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
  <title>신고 결과 받기 풀이 A — 신고 5줄이 메일 수 배열 [2, 1, 1, 0] 이 되기까지</title>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  </defs>
  <rect width="1200" height="600" fill="#ffffff"/>
  <text x="24" y="36" font-size="20" font-weight="700" fill="#0f172a">신고 결과 받기 풀이 A — 신고 5줄이 메일 수 배열 [2, 1, 1, 0] 이 되기까지 (예제 1, k = 2)</text>
  <text x="24" y="62" font-size="14" fill="#475569">파랑 = 입력과 조회용 맵, 초록 = 중복 없이 모은 결과, 빨강 = 정지된 사람, 회색 화살표 = 다음 단계로 넘기는 값</text>

  <!-- 1 입력 -->
  <rect x="24" y="90" width="204" height="250" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
  <circle cx="44" cy="112" r="13" fill="#1d4ed8"/><text x="44" y="117" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">1</text>
  <text x="136" y="118" font-size="16" font-weight="700" fill="#1d4ed8" text-anchor="middle">입력</text>
  <text x="38" y="150" font-size="14" fill="#334155">id_list</text>
  <text x="38" y="170" font-size="14" fill="#334155">muzi, frodo,</text>
  <text x="38" y="190" font-size="14" fill="#334155">apeach, neo</text>
  <text x="38" y="220" font-size="14" fill="#334155">report 5줄</text>
  <text x="38" y="240" font-size="14" fill="#334155">"신고자 피신고자"</text>
  <text x="38" y="270" font-size="14" fill="#334155">k = 2</text>
  <text x="38" y="300" font-size="13" fill="#475569">k 명 이상에게 신고되면</text>
  <text x="38" y="318" font-size="13" fill="#475569">정지된다</text>

  <!-- 2 이름 → 인덱스 -->
  <rect x="261" y="90" width="204" height="250" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
  <circle cx="281" cy="112" r="13" fill="#1d4ed8"/><text x="281" y="117" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2</text>
  <text x="373" y="118" font-size="16" font-weight="700" fill="#1d4ed8" text-anchor="middle">이름 → 인덱스</text>
  <text x="275" y="150" font-size="14" fill="#334155">idx 맵</text>
  <text x="275" y="176" font-size="14" fill="#334155">muzi → 0</text>
  <text x="275" y="198" font-size="14" fill="#334155">frodo → 1</text>
  <text x="275" y="220" font-size="14" fill="#334155">apeach → 2</text>
  <text x="275" y="242" font-size="14" fill="#334155">neo → 3</text>
  <text x="275" y="280" font-size="13" fill="#475569">답 배열의 몇 번째 칸에</text>
  <text x="275" y="298" font-size="13" fill="#475569">더할지 이름으로 찾는다</text>

  <!-- 3 피신고자별 Set -->
  <rect x="498" y="90" width="204" height="250" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
  <circle cx="518" cy="112" r="13" fill="#047857"/><text x="518" y="117" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">3</text>
  <text x="610" y="118" font-size="16" font-weight="700" fill="#047857" text-anchor="middle">피신고자별 Set</text>
  <text x="512" y="150" font-size="14" fill="#334155">reporters 맵</text>
  <text x="512" y="176" font-size="14" fill="#334155">frodo → {muzi, apeach}</text>
  <text x="512" y="198" font-size="14" fill="#334155">neo → {frodo, muzi}</text>
  <text x="512" y="220" font-size="14" fill="#334155">muzi → {apeach}</text>
  <text x="512" y="258" font-size="13" fill="#475569">같은 쌍이 또 오면</text>
  <text x="512" y="276" font-size="13" fill="#475569">Set.add 가 false 를 돌려주고</text>
  <text x="512" y="294" font-size="13" fill="#475569">Set 크기는 그대로다</text>

  <!-- 4 정지 판정 -->
  <rect x="735" y="90" width="204" height="250" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.6"/>
  <circle cx="755" cy="112" r="13" fill="#b91c1c"/><text x="755" y="117" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">4</text>
  <text x="847" y="118" font-size="16" font-weight="700" fill="#b91c1c" text-anchor="middle">정지 판정</text>
  <text x="749" y="150" font-size="14" fill="#334155">Set 크기 ≥ k(2) ?</text>
  <text x="749" y="176" font-size="14" fill="#b91c1c" font-weight="700">frodo 2명 → 정지</text>
  <text x="749" y="198" font-size="14" fill="#b91c1c" font-weight="700">neo 2명 → 정지</text>
  <text x="749" y="220" font-size="14" fill="#334155">muzi 1명 → 정지 아님</text>
  <text x="749" y="258" font-size="13" fill="#475569">신고 횟수가 아니라</text>
  <text x="749" y="276" font-size="13" fill="#475569">서로 다른 신고자 수로</text>
  <text x="749" y="294" font-size="13" fill="#475569">판정한다</text>

  <!-- 5 메일 -->
  <rect x="972" y="90" width="204" height="250" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
  <circle cx="992" cy="112" r="13" fill="#047857"/><text x="992" y="117" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">5</text>
  <text x="1084" y="118" font-size="16" font-weight="700" fill="#047857" text-anchor="middle">메일 배열</text>
  <text x="986" y="150" font-size="14" fill="#334155">정지된 사람의 Set 안</text>
  <text x="986" y="170" font-size="14" fill="#334155">신고자마다 1통</text>
  <text x="986" y="198" font-size="14" fill="#334155">frodo 정지 → muzi, apeach</text>
  <text x="986" y="220" font-size="14" fill="#334155">neo 정지 → frodo, muzi</text>
  <text x="986" y="262" font-size="14" fill="#334155">mail =</text>
  <text x="1074" y="292" font-size="20" font-weight="700" fill="#047857" text-anchor="middle">[2, 1, 1, 0]</text>
  <text x="986" y="320" font-size="13" fill="#475569">muzi frodo apeach neo 순</text>

  <line x1="228" y1="215" x2="257" y2="215" stroke="#334155" stroke-width="2" marker-end="url(#g)"/>
  <line x1="465" y1="215" x2="494" y2="215" stroke="#334155" stroke-width="2" marker-end="url(#g)"/>
  <line x1="702" y1="215" x2="731" y2="215" stroke="#334155" stroke-width="2" marker-end="url(#g)"/>
  <line x1="939" y1="215" x2="968" y2="215" stroke="#334155" stroke-width="2" marker-end="url(#g)"/>

  <!-- 코드 위치 -->
  <rect x="24" y="370" width="1152" height="206" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="44" y="400" font-size="16" font-weight="700" fill="#0f172a">각 단계가 풀이 A 코드의 어느 줄에서 일어나는가</text>
  <g font-size="14">
    <circle cx="56" cy="427" r="11" fill="#1d4ed8"/><text x="56" y="432" font-weight="700" fill="#fff" text-anchor="middle">2</text>
    <text x="80" y="432" fill="#0f172a" font-family="Consolas, monospace">idx.put(idList[i], i);</text>
    <text x="640" y="432" fill="#334155">이름을 답 배열의 칸 번호로 바꿔 둔다</text>
    <circle cx="56" cy="455" r="11" fill="#047857"/><text x="56" y="460" font-weight="700" fill="#fff" text-anchor="middle">3</text>
    <text x="80" y="460" fill="#0f172a" font-family="Consolas, monospace">reporters.computeIfAbsent(p[1], key -&gt; new HashSet&lt;&gt;()).add(p[0]);</text>
    <text x="640" y="460" fill="#334155">키는 피신고자 p[1], Set 에 넣는 값은 신고자 p[0]</text>
    <circle cx="56" cy="483" r="11" fill="#b91c1c"/><text x="56" y="488" font-weight="700" fill="#fff" text-anchor="middle">4</text>
    <text x="80" y="488" fill="#0f172a" font-family="Consolas, monospace">if (from.size() &gt;= k)</text>
    <text x="640" y="488" fill="#334155">Set 크기가 곧 서로 다른 신고자 수다</text>
    <circle cx="56" cy="511" r="11" fill="#047857"/><text x="56" y="516" font-weight="700" fill="#fff" text-anchor="middle">5</text>
    <text x="80" y="516" fill="#0f172a" font-family="Consolas, monospace">for (String user : from) mail[idx.get(user)]++;</text>
    <text x="640" y="516" fill="#334155">메일은 신고한 사람(user)의 칸에 더한다</text>
  </g>
  <text x="44" y="552" font-size="13" fill="#475569">신고 R 줄을 한 번씩 읽고(3), Set 들을 한 번씩 훑으므로(4, 5) 전체는 O(R + N) 이다. 예제 1 은 R = 5, N = 4 다.</text>
</svg>
