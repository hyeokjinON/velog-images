<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
  <title>신고 결과 받기 예제 1 — report 한 줄마다 reporters 맵이 자라는 모습과 메일 배열이 채워지는 순서</title>
  <rect width="1200" height="820" fill="#ffffff"/>
  <text x="24" y="36" font-size="20" font-weight="700" fill="#0f172a">신고 결과 받기 예제 1 — report 한 줄마다 reporters 맵이 어떻게 자라고, 메일 배열이 어떤 순서로 채워지나</text>
  <text x="24" y="62" font-size="14" fill="#475569">초록 굵은 글자 = 그 줄에서 새로 들어간 값, 회색 = 이전 줄에서 이미 있던 값, "—" = 아직 그 키가 맵에 없음, 빨강 = 정지된 사람</text>

  <!-- 1부: 맵이 자라는 모습 -->
  <text x="24" y="100" font-size="16" font-weight="700" fill="#1d4ed8">① 첫 번째 반복문 — report 를 한 줄씩 읽어 reporters.computeIfAbsent(p[1], …).add(p[0])</text>
  <rect x="24" y="114" width="1152" height="40" fill="#eff6ff" stroke="#bfdbfe"/>
  <g font-size="14" font-weight="700" fill="#1e3a8a">
    <text x="36" y="140">단계</text>
    <text x="90" y="140">읽은 줄</text>
    <text x="236" y="140">코드가 하는 일 (add 의 반환값)</text>
    <text x="640" y="140">키 frodo</text>
    <text x="830" y="140">키 neo</text>
    <text x="1010" y="140">키 muzi</text>
  </g>

  <g font-size="14" fill="#334155">
    <!-- row 1 -->
    <line x1="24" y1="206" x2="1176" y2="206" stroke="#e2e8f0"/>
    <circle cx="50" cy="175" r="12" fill="#1d4ed8"/><text x="50" y="180" font-weight="700" fill="#fff" text-anchor="middle">1</text>
    <text x="90" y="180" font-family="Consolas, monospace" fill="#0f172a">muzi frodo</text>
    <text x="236" y="172">frodo 키가 없어 빈 Set 을 만들고</text>
    <text x="236" y="194">muzi 를 넣는다 (true)</text>
    <text x="640" y="180">{ <tspan fill="#047857" font-weight="700">muzi</tspan> }</text>
    <text x="830" y="180" fill="#94a3b8">—</text>
    <text x="1010" y="180" fill="#94a3b8">—</text>

    <!-- row 2 -->
    <line x1="24" y1="262" x2="1176" y2="262" stroke="#e2e8f0"/>
    <circle cx="50" cy="231" r="12" fill="#1d4ed8"/><text x="50" y="236" font-weight="700" fill="#fff" text-anchor="middle">2</text>
    <text x="90" y="236" font-family="Consolas, monospace" fill="#0f172a">apeach frodo</text>
    <text x="236" y="228">frodo 키가 이미 있어 그 Set 에</text>
    <text x="236" y="250">apeach 를 넣는다 (true)</text>
    <text x="640" y="236"><tspan fill="#94a3b8">{ muzi, </tspan><tspan fill="#047857" font-weight="700">apeach</tspan><tspan fill="#94a3b8"> }</tspan></text>
    <text x="830" y="236" fill="#94a3b8">—</text>
    <text x="1010" y="236" fill="#94a3b8">—</text>

    <!-- row 3 -->
    <line x1="24" y1="318" x2="1176" y2="318" stroke="#e2e8f0"/>
    <circle cx="50" cy="287" r="12" fill="#1d4ed8"/><text x="50" y="292" font-weight="700" fill="#fff" text-anchor="middle">3</text>
    <text x="90" y="292" font-family="Consolas, monospace" fill="#0f172a">frodo neo</text>
    <text x="236" y="284">neo 키가 없어 빈 Set 을 만들고</text>
    <text x="236" y="306">frodo 를 넣는다 (true)</text>
    <text x="640" y="292" fill="#94a3b8">{ muzi, apeach }</text>
    <text x="830" y="292">{ <tspan fill="#047857" font-weight="700">frodo</tspan> }</text>
    <text x="1010" y="292" fill="#94a3b8">—</text>

    <!-- row 4 -->
    <line x1="24" y1="374" x2="1176" y2="374" stroke="#e2e8f0"/>
    <circle cx="50" cy="343" r="12" fill="#1d4ed8"/><text x="50" y="348" font-weight="700" fill="#fff" text-anchor="middle">4</text>
    <text x="90" y="348" font-family="Consolas, monospace" fill="#0f172a">muzi neo</text>
    <text x="236" y="340">neo 키가 이미 있어 그 Set 에</text>
    <text x="236" y="362">muzi 를 넣는다 (true)</text>
    <text x="640" y="348" fill="#94a3b8">{ muzi, apeach }</text>
    <text x="830" y="348"><tspan fill="#94a3b8">{ frodo, </tspan><tspan fill="#047857" font-weight="700">muzi</tspan><tspan fill="#94a3b8"> }</tspan></text>
    <text x="1010" y="348" fill="#94a3b8">—</text>

    <!-- row 5 -->
    <line x1="24" y1="430" x2="1176" y2="430" stroke="#cbd5e1"/>
    <circle cx="50" cy="399" r="12" fill="#1d4ed8"/><text x="50" y="404" font-weight="700" fill="#fff" text-anchor="middle">5</text>
    <text x="90" y="404" font-family="Consolas, monospace" fill="#0f172a">apeach muzi</text>
    <text x="236" y="396">muzi 키가 없어 빈 Set 을 만들고</text>
    <text x="236" y="418">apeach 를 넣는다 (true)</text>
    <text x="640" y="404" fill="#94a3b8">{ muzi, apeach }</text>
    <text x="830" y="404" fill="#94a3b8">{ frodo, muzi }</text>
    <text x="1010" y="404">{ <tspan fill="#047857" font-weight="700">apeach</tspan> }</text>
  </g>
  <text x="640" y="456" font-size="14" font-weight="700" fill="#0f172a">Set 크기:  frodo 2명</text>
  <text x="830" y="456" font-size="14" font-weight="700" fill="#0f172a">neo 2명</text>
  <text x="1010" y="456" font-size="14" font-weight="700" fill="#0f172a">muzi 1명</text>

  <!-- 2부: 정지 판정과 메일 -->
  <text x="24" y="506" font-size="16" font-weight="700" fill="#047857">② 두 번째 반복문 — reporters.values() 를 돌며 Set 크기가 k(2) 이상이면 그 Set 의 신고자 칸에 +1</text>
  <text x="24" y="530" font-size="14" fill="#475569">HashMap 은 넣은 순서를 지키지 않는다. JDK 21 에서 실제로 출력해 보니 muzi → neo → frodo 순서로 돌았다. 순서가 달라도 마지막 배열은 같다.</text>

  <g font-size="14">
    <text x="640" y="566" font-weight="700" fill="#1e3a8a" text-anchor="middle">muzi</text>
    <text x="740" y="566" font-weight="700" fill="#1e3a8a" text-anchor="middle">frodo</text>
    <text x="840" y="566" font-weight="700" fill="#1e3a8a" text-anchor="middle">apeach</text>
    <text x="940" y="566" font-weight="700" fill="#1e3a8a" text-anchor="middle">neo</text>
    <text x="1040" y="566" fill="#475569">← mail 배열 칸</text>
  </g>

  <g font-size="14" fill="#334155">
    <!-- a -->
    <text x="36" y="606">muzi 의 Set { apeach } 는 1명이라 2 미만이다. 정지가 아니므로 건너뛴다.</text>
    <rect x="596" y="584" width="88" height="34" fill="#f8fafc" stroke="#94a3b8"/><text x="640" y="607" text-anchor="middle">0</text>
    <rect x="696" y="584" width="88" height="34" fill="#f8fafc" stroke="#94a3b8"/><text x="740" y="607" text-anchor="middle">0</text>
    <rect x="796" y="584" width="88" height="34" fill="#f8fafc" stroke="#94a3b8"/><text x="840" y="607" text-anchor="middle">0</text>
    <rect x="896" y="584" width="88" height="34" fill="#f8fafc" stroke="#94a3b8"/><text x="940" y="607" text-anchor="middle">0</text>

    <!-- b -->
    <text x="36" y="656"><tspan fill="#b91c1c" font-weight="700">neo 정지</tspan> (Set { muzi, frodo }, 2명).</text>
    <text x="36" y="678">muzi 칸 +1, frodo 칸 +1</text>
    <rect x="596" y="646" width="88" height="34" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/><text x="640" y="669" text-anchor="middle" font-weight="700" fill="#047857">1</text>
    <rect x="696" y="646" width="88" height="34" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/><text x="740" y="669" text-anchor="middle" font-weight="700" fill="#047857">1</text>
    <rect x="796" y="646" width="88" height="34" fill="#f8fafc" stroke="#94a3b8"/><text x="840" y="669" text-anchor="middle">0</text>
    <rect x="896" y="646" width="88" height="34" fill="#f8fafc" stroke="#94a3b8"/><text x="940" y="669" text-anchor="middle">0</text>

    <!-- c -->
    <text x="36" y="718"><tspan fill="#b91c1c" font-weight="700">frodo 정지</tspan> (Set { muzi, apeach }, 2명).</text>
    <text x="36" y="740">muzi 칸 +1, apeach 칸 +1</text>
    <rect x="596" y="708" width="88" height="34" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/><text x="640" y="731" text-anchor="middle" font-weight="700" fill="#047857">2</text>
    <rect x="696" y="708" width="88" height="34" fill="#f8fafc" stroke="#94a3b8"/><text x="740" y="731" text-anchor="middle">1</text>
    <rect x="796" y="708" width="88" height="34" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/><text x="840" y="731" text-anchor="middle" font-weight="700" fill="#047857">1</text>
    <rect x="896" y="708" width="88" height="34" fill="#f8fafc" stroke="#94a3b8"/><text x="940" y="731" text-anchor="middle">0</text>
  </g>

  <rect x="24" y="764" width="1152" height="40" rx="8" fill="#ecfdf5" stroke="#047857"/>
  <text x="44" y="790" font-size="15" font-weight="700" fill="#047857">최종 mail = [2, 1, 1, 0] — 예제 1 의 기대 출력과 같다. muzi 는 frodo 와 neo 를 모두 신고해서 2통, neo 는 아무도 신고하지 않아서 0통이다.</text>
</svg>
