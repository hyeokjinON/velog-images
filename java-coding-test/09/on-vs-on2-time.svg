<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
  <title>같은 답을 내는 두 풀이의 실행 시간 — O(n) 은 입력이 늘어도 거의 그대로, O(n²) 은 급격히 늘어난다</title>
  <rect width="1200" height="640" fill="#ffffff"/>
  <text x="24" y="36" font-size="20" font-weight="700" fill="#0f172a">같은 답을 내는 두 풀이의 실행 시간 — O(n) 은 거의 그대로, O(n²) 은 입력이 늘수록 급격히 늘어난다</text>
  <text x="24" y="62" font-size="14" fill="#475569">내 PC 측정값(본문 3-2절, 3-3절의 표). 막대 길이는 패널마다 가장 긴 값에 맞춘 같은 비율이다. 초록 = O(n) 풀이, 빨강 = O(n²) 풀이</text>

  <!-- Panel A -->
  <rect x="24" y="80" width="1152" height="260" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <circle cx="46" cy="106" r="12" fill="#1d4ed8"/><text x="46" y="111" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">1</text>
  <text x="66" y="112" font-size="16" font-weight="700" fill="#0f172a">오픈채팅방 — 두 번 훑기 O(n) 과, 이름이 바뀔 때마다 지난 메시지를 고치는 순진한 방법 O(n²)</text>

  <g font-size="14">
    <text x="44" y="160" font-weight="700" fill="#0f172a">기록 20,000</text>
    <text x="300" y="150" text-anchor="end" fill="#334155">두 번 훑기</text>
    <rect x="310" y="136" width="3" height="20" fill="#047857"/>
    <text x="322" y="151" fill="#047857" font-weight="700">5ms</text>
    <text x="300" y="180" text-anchor="end" fill="#334155">순진한 방법</text>
    <rect x="310" y="166" width="27" height="20" fill="#b91c1c"/>
    <text x="348" y="181" fill="#b91c1c" font-weight="700">372ms</text>

    <line x1="44" y1="204" x2="1156" y2="204" stroke="#e2e8f0"/>

    <text x="44" y="240" font-weight="700" fill="#0f172a">기록 100,000</text>
    <text x="44" y="260" fill="#475569">(문제 최대)</text>
    <text x="300" y="230" text-anchor="end" fill="#334155">두 번 훑기</text>
    <rect x="310" y="216" width="3" height="20" fill="#047857"/>
    <text x="322" y="231" fill="#047857" font-weight="700">17ms</text>
    <text x="300" y="260" text-anchor="end" fill="#334155">순진한 방법</text>
    <rect x="310" y="246" width="760" height="20" fill="#b91c1c"/>
    <text x="1080" y="261" fill="#b91c1c" font-weight="700">10,648ms</text>
  </g>
  <text x="44" y="300" font-size="14" fill="#334155">기록이 5배(20,000 → 100,000)가 되자 순진한 방법은 372ms → 10,648ms 로 약 29배 느려졌다. 두 번 훑기는 5ms → 17ms 였다.</text>
  <text x="44" y="324" font-size="14" fill="#334155">100,000 건에서 두 풀이의 차이는 약 626배(10,648 ÷ 17)다. 두 번 훑기의 막대는 너무 짧아 선 하나로 보인다.</text>

  <!-- Panel B -->
  <rect x="24" y="360" width="1152" height="260" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <circle cx="46" cy="386" r="12" fill="#1d4ed8"/><text x="46" y="391" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2</text>
  <text x="66" y="392" font-size="16" font-weight="700" fill="#0f172a">신고 결과 받기의 중복 제거 — HashSet.add O(1) 와 ArrayList.contains O(n) 을 report 수만큼 반복</text>

  <g font-size="14">
    <text x="44" y="440" font-weight="700" fill="#0f172a">report 20,000</text>
    <text x="300" y="430" text-anchor="end" fill="#334155">HashSet</text>
    <rect x="310" y="416" width="3" height="20" fill="#047857"/>
    <text x="322" y="431" fill="#047857" font-weight="700">2ms</text>
    <text x="300" y="460" text-anchor="end" fill="#334155">ArrayList.contains</text>
    <rect x="310" y="446" width="100" height="20" fill="#b91c1c"/>
    <text x="420" y="461" fill="#b91c1c" font-weight="700">203ms</text>

    <line x1="44" y1="484" x2="1156" y2="484" stroke="#e2e8f0"/>

    <text x="44" y="520" font-weight="700" fill="#0f172a">report 50,000</text>
    <text x="300" y="510" text-anchor="end" fill="#334155">HashSet</text>
    <rect x="310" y="496" width="3" height="20" fill="#047857"/>
    <text x="322" y="511" fill="#047857" font-weight="700">2ms</text>
    <text x="300" y="540" text-anchor="end" fill="#334155">ArrayList.contains</text>
    <rect x="310" y="526" width="760" height="20" fill="#b91c1c"/>
    <text x="1080" y="541" fill="#b91c1c" font-weight="700">1,549ms</text>
  </g>
  <text x="44" y="580" font-size="14" fill="#334155">report 가 2.5배가 되자 ArrayList.contains 는 7.6배 느려졌다. 문제 최대인 200,000 개에서 HashSet 은 7ms 였고,</text>
  <text x="44" y="604" font-size="14" fill="#334155">ArrayList.contains 는 재지 않았다. 입력이 4배면 시간은 약 16배라서 약 25초로 추정한다.</text>
</svg>
