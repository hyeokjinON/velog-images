<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 864" width="760" height="864" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
  <title>그림 9-6b. 예제로 실수 잡기 — Leave 에서 닉네임을 지우면 예제는 통과해도 다시 들어오지 않는 사람에서 null 이 나온다</title>
  <rect width="760" height="864" fill="#ffffff"/>
  <text x="24" y="40" font-size="22" font-weight="700" fill="#0f172a">예제로 실수 잡기 ② — 예제는 통과해도</text>
  <text x="24" y="70" font-size="22" font-weight="700" fill="#0f172a">한 줄만 바꾼 입력에서 틀리는 경우</text>
  <text x="24" y="104" font-size="16" fill="#475569">초록 = 맞는 코드의 진행과 결과, 빨강 = 실수한 코드의 진행과</text>
  <text x="24" y="128" font-size="16" fill="#475569">결과, 회색 = 공통 입력</text>

  <circle cx="38" cy="170" r="13" fill="#1d4ed8"/><text x="38" y="176" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">2</text>
  <text x="60" y="176" font-size="17" font-weight="700" fill="#0f172a">오픈채팅방 — Leave 에서 nick.remove(uid) 를 하면, 예제는</text>
  <text x="60" y="200" font-size="17" font-weight="700" fill="#0f172a">통과하지만 다시 들어오지 않는 사람에서 null 이 나온다</text>

  <rect x="24" y="222" width="712" height="220" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="1.4"/>
  <text x="44" y="252" font-size="17" font-weight="700" fill="#334155">문제의 예제 5줄 (uid1234 가 나갔다가 다시 들어온다)</text>
  <g font-size="16" fill="#334155">
    <text x="44" y="282">3번 줄 Leave 에서 uid1234 를 지워도, 4번 줄</text>
    <text x="44" y="308">Enter uid1234 Prodo 가 다시 넣어 준다.</text>
    <text x="44" y="334">1차 끝의 맵 = { uid1234=Prodo, uid4567=Ryan }</text>
    <text x="44" y="360">remove 가 없을 때와 같은 맵이라 출력 4줄이 모두 같다.</text>
  </g>
  <rect x="44" y="378" width="672" height="48" rx="8" fill="#ecfdf5" stroke="#047857"/>
  <text x="64" y="409" font-size="17" font-weight="700" fill="#047857">예제는 통과한다 — 그래서 이 실수는 예제로 안 잡힌다</text>

  <rect x="24" y="466" width="712" height="254" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/>
  <text x="44" y="496" font-size="17" font-weight="700" fill="#b91c1c">예제에서 4번 줄만 뺀 4줄 (uid1234 가 다시 안 들어온다)</text>
  <g font-size="16" fill="#0f172a" font-family="Consolas, monospace">
    <text x="44" y="526">Enter uid1234 Muzi</text>
    <text x="300" y="526">Enter uid4567 Prodo</text>
    <text x="44" y="552">Leave uid1234</text>
    <text x="300" y="552">Change uid4567 Ryan</text>
  </g>
  <text x="44" y="586" font-size="16" fill="#334155">remove 하면 1차 끝의 맵 = { uid4567=Ryan }</text>
  <g font-size="16" font-weight="700">
    <text x="44" y="620" fill="#b91c1c">출력 (틀림)</text>
    <text x="44" y="648" fill="#b91c1c">null님이 들어왔습니다.</text>
    <text x="44" y="674" fill="#b91c1c">Ryan님이 들어왔습니다.</text>
    <text x="44" y="700" fill="#b91c1c">null님이 나갔습니다.</text>
    <text x="400" y="620" fill="#047857">정답</text>
    <text x="400" y="648" fill="#047857">Muzi님이 들어왔습니다.</text>
    <text x="400" y="674" fill="#047857">Ryan님이 들어왔습니다.</text>
    <text x="400" y="700" fill="#047857">Muzi님이 나갔습니다.</text>
  </g>

  <rect x="24" y="744" width="712" height="100" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <g font-size="16" fill="#0f172a">
    <text x="44" y="774">예제를 통과했다고 끝내지 말고, 예제를 한 줄만 바꾼 입력</text>
    <text x="44" y="800">(다시 안 들어오는 사람, 중복 신고)을 손으로 하나 더 넣어 본다.</text>
    <text x="44" y="826">실제로 실행해 확인한 결과다.</text>
  </g>
</svg>
