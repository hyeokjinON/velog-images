<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
  <title>오픈채팅방 예제 — 1차 훑기에서 nick 맵이 줄마다 덮어써지는 모습과, 그 시점 닉네임으로 바로 출력했을 때와의 차이</title>
  <rect width="1200" height="560" fill="#ffffff"/>
  <text x="24" y="36" font-size="20" font-weight="700" fill="#0f172a">오픈채팅방 예제 — 1차 훑기에서 nick 맵이 줄마다 어떻게 덮어써지나</text>
  <text x="24" y="62" font-size="14" fill="#475569">초록 굵은 글자 = 그 줄에서 새로 쓴 값, 취소선 = 덮어써져 사라진 값, 빨강 = 그 시점 닉네임으로 바로 출력하면 정답과 달라지는 줄</text>

  <rect x="24" y="80" width="1152" height="60" fill="#eff6ff" stroke="#bfdbfe"/>
  <g font-size="14" font-weight="700" fill="#1e3a8a">
    <text x="36" y="106">단계와 읽은 줄</text>
    <text x="276" y="106">nick[uid1234]</text>
    <text x="400" y="106">nick[uid4567]</text>
    <text x="524" y="106">put 반환값</text>
    <text x="524" y="128" font-weight="400" font-size="13">(이전 닉네임)</text>
    <text x="640" y="106">msgCount</text>
    <text x="736" y="106" fill="#b91c1c">이 줄에서 바로 출력하면</text>
    <text x="736" y="128" fill="#b91c1c" font-weight="400" font-size="13">(틀린 방법: 그 시점 닉네임)</text>
    <text x="960" y="106" fill="#047857">2차에서 만든 메시지</text>
    <text x="960" y="128" fill="#047857" font-weight="400" font-size="13">(정답: 마지막 닉네임)</text>
  </g>

  <g font-size="14" fill="#334155">
    <!-- 1 -->
    <circle cx="44" cy="167" r="11" fill="#047857"/><text x="44" y="172" font-weight="700" fill="#fff" text-anchor="middle">1</text>
    <text x="64" y="172" font-family="Consolas, monospace" fill="#0f172a">Enter uid1234 Muzi</text>
    <text x="276" y="172" fill="#047857" font-weight="700">Muzi</text>
    <text x="400" y="172" fill="#94a3b8">—</text>
    <text x="524" y="172">null</text>
    <text x="640" y="172">1</text>
    <text x="736" y="172" fill="#b91c1c" font-weight="700">Muzi님이 들어왔습니다.</text>
    <text x="960" y="172" fill="#047857">Prodo님이 들어왔습니다.</text>
    <line x1="24" y1="190" x2="1176" y2="190" stroke="#e2e8f0"/>

    <!-- 2 -->
    <circle cx="44" cy="215" r="11" fill="#047857"/><text x="44" y="220" font-weight="700" fill="#fff" text-anchor="middle">2</text>
    <text x="64" y="220" font-family="Consolas, monospace" fill="#0f172a">Enter uid4567 Prodo</text>
    <text x="276" y="220" fill="#94a3b8">Muzi</text>
    <text x="400" y="220" fill="#047857" font-weight="700">Prodo</text>
    <text x="524" y="220">null</text>
    <text x="640" y="220">2</text>
    <text x="736" y="220" fill="#b91c1c" font-weight="700">Prodo님이 들어왔습니다.</text>
    <text x="960" y="220" fill="#047857">Ryan님이 들어왔습니다.</text>
    <line x1="24" y1="238" x2="1176" y2="238" stroke="#e2e8f0"/>

    <!-- 3 -->
    <circle cx="44" cy="263" r="11" fill="#94a3b8"/><text x="44" y="268" font-weight="700" fill="#fff" text-anchor="middle">3</text>
    <text x="64" y="268" font-family="Consolas, monospace" fill="#0f172a">Leave uid1234</text>
    <text x="276" y="268" fill="#94a3b8">Muzi</text>
    <text x="400" y="268" fill="#94a3b8">Prodo</text>
    <text x="524" y="268" fill="#94a3b8">put 안 함</text>
    <text x="640" y="268">3</text>
    <text x="736" y="268" fill="#b91c1c" font-weight="700">Muzi님이 나갔습니다.</text>
    <text x="960" y="268" fill="#047857">Prodo님이 나갔습니다.</text>
    <line x1="24" y1="286" x2="1176" y2="286" stroke="#e2e8f0"/>

    <!-- 4 -->
    <circle cx="44" cy="311" r="11" fill="#047857"/><text x="44" y="316" font-weight="700" fill="#fff" text-anchor="middle">4</text>
    <text x="64" y="316" font-family="Consolas, monospace" fill="#0f172a">Enter uid1234 Prodo</text>
    <text x="276" y="316"><tspan fill="#94a3b8" text-decoration="line-through">Muzi</tspan><tspan fill="#047857" font-weight="700"> Prodo</tspan></text>
    <text x="400" y="316" fill="#94a3b8">Prodo</text>
    <text x="524" y="316">"Muzi"</text>
    <text x="640" y="316">4</text>
    <text x="736" y="316">Prodo님이 들어왔습니다.</text>
    <text x="960" y="316" fill="#047857">Prodo님이 들어왔습니다.</text>
    <line x1="24" y1="334" x2="1176" y2="334" stroke="#e2e8f0"/>

    <!-- 5 -->
    <circle cx="44" cy="359" r="11" fill="#047857"/><text x="44" y="364" font-weight="700" fill="#fff" text-anchor="middle">5</text>
    <text x="64" y="364" font-family="Consolas, monospace" fill="#0f172a">Change uid4567 Ryan</text>
    <text x="276" y="364" fill="#94a3b8">Prodo</text>
    <text x="400" y="364"><tspan fill="#94a3b8" text-decoration="line-through">Prodo</tspan><tspan fill="#047857" font-weight="700"> Ryan</tspan></text>
    <text x="524" y="364">"Prodo"</text>
    <text x="640" y="364">4 (그대로)</text>
    <text x="736" y="364" fill="#475569">메시지 없음</text>
    <text x="960" y="364" fill="#475569">메시지 없음</text>
    <line x1="24" y1="382" x2="1176" y2="382" stroke="#cbd5e1"/>
  </g>

  <rect x="24" y="400" width="560" height="140" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
  <text x="44" y="428" font-size="15" font-weight="700" fill="#047857">1차가 끝난 맵 = { uid1234=Prodo, uid4567=Ryan }</text>
  <text x="44" y="456" font-size="14" fill="#334155">uid1234 는 4번 줄에서 Muzi 가 Prodo 로 바뀌었고,</text>
  <text x="44" y="480" font-size="14" fill="#334155">uid4567 은 5번 줄에서 Prodo 가 Ryan 으로 바뀌었다.</text>
  <text x="44" y="504" font-size="14" fill="#334155">2차는 이 맵만 읽으므로 4개 메시지가 모두 마지막 닉네임으로</text>
  <text x="44" y="526" font-size="14" fill="#334155">나온다. 예제의 기대 출력 4줄과 같다.</text>

  <rect x="604" y="400" width="572" height="140" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/>
  <text x="624" y="428" font-size="15" font-weight="700" fill="#b91c1c">한 번만 훑으며 바로 출력하면 4줄 중 3줄이 틀린다</text>
  <text x="624" y="456" font-size="14" fill="#334155">1, 2, 3번 줄을 출력하는 순간에는 4, 5번 줄의 이름 변경을</text>
  <text x="624" y="480" font-size="14" fill="#334155">아직 읽지 않았다. 그래서 Muzi, Prodo, Muzi 가 그대로 남는다.</text>
  <text x="624" y="504" font-size="14" fill="#334155">고치려면 이름이 바뀔 때마다 지난 메시지를 다시 훑어야 하고,</text>
  <text x="624" y="526" font-size="14" fill="#334155">그것이 3-2절의 O(n²) 순진한 방법이다.</text>
</svg>
