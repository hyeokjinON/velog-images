<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
  <title>예제로 실수 잡기 — 중복 신고를 거르지 않으면 예제 2 가 틀리고, Leave 에서 닉네임을 지우면 예제는 통과해도 다른 입력에서 null 이 나온다</title>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  </defs>
  <rect width="1200" height="720" fill="#ffffff"/>
  <text x="24" y="36" font-size="20" font-weight="700" fill="#0f172a">예제로 실수 잡기 — 같은 입력을 맞는 코드와 틀린 코드에 넣으면 결과가 어디서 갈라지나</text>
  <text x="24" y="62" font-size="14" fill="#475569">초록 = 맞는 코드의 진행과 결과, 빨강 = 실수한 코드의 진행과 결과, 회색 = 공통 입력</text>

  <!-- Panel 1 -->
  <circle cx="38" cy="96" r="13" fill="#1d4ed8"/><text x="38" y="101" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">1</text>
  <text x="60" y="102" font-size="16" font-weight="700" fill="#0f172a">신고 결과 받기 예제 2 — id_list [con, ryan], report 는 "ryan con" 4줄, k = 3</text>

  <rect x="24" y="120" width="250" height="210" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="1.4"/>
  <text x="40" y="148" font-size="15" font-weight="700" fill="#334155">공통 입력</text>
  <g font-size="14" fill="#0f172a" font-family="Consolas, monospace">
    <text x="40" y="180">1  ryan con</text>
    <text x="40" y="206">2  ryan con</text>
    <text x="40" y="232">3  ryan con</text>
    <text x="40" y="258">4  ryan con</text>
  </g>
  <text x="40" y="296" font-size="13" fill="#475569">ryan 한 사람이 con 을</text>
  <text x="40" y="314" font-size="13" fill="#475569">네 번 신고했다</text>

  <line x1="274" y1="180" x2="310" y2="168" stroke="#334155" stroke-width="1.8" marker-end="url(#g)"/>
  <line x1="274" y1="270" x2="310" y2="282" stroke="#334155" stroke-width="1.8" marker-end="url(#g)"/>

  <rect x="316" y="120" width="860" height="100" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
  <text x="336" y="148" font-size="15" font-weight="700" fill="#047857">풀이 A — 피신고자별 Set 에 넣는다</text>
  <text x="336" y="174" font-size="14" fill="#334155">add 결과: 1줄 true, 2, 3, 4줄 false → con 의 Set = { ryan }, 크기 1</text>
  <text x="336" y="200" font-size="14" fill="#334155">1 &lt; 3 이라 con 은 정지가 아니다 → 메일 없음 → <tspan font-weight="700" fill="#047857">[0, 0] (기대 출력과 같다)</tspan></text>

  <rect x="316" y="230" width="860" height="100" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.6"/>
  <text x="336" y="258" font-size="15" font-weight="700" fill="#b91c1c">실수 — 줄마다 cnt[피신고자]++ 로 센다</text>
  <text x="336" y="284" font-size="14" fill="#334155">cnt[con] = 1 → 2 → 3 → 4. 4 ≥ 3 이라 con 이 정지된다</text>
  <text x="336" y="310" font-size="14" fill="#334155">정지된 con 을 신고한 줄이 4개라 mail[ryan] 이 4번 오른다 → <tspan font-weight="700" fill="#b91c1c">[0, 4] (틀림)</tspan></text>

  <text x="24" y="360" font-size="14" fill="#334155">예제 1 에는 같은 신고가 두 번 나오지 않는다. 그래서 이 실수를 해도 예제 1 은 [2, 1, 1, 0] 으로 통과하고, 예제 2 에서야 틀린다.</text>

  <!-- Panel 2 -->
  <circle cx="38" cy="404" r="13" fill="#1d4ed8"/><text x="38" y="409" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2</text>
  <text x="60" y="410" font-size="16" font-weight="700" fill="#0f172a">오픈채팅방 — Leave 에서 nick.remove(uid) 를 하면, 예제는 통과하지만 다시 들어오지 않는 사람에서 null 이 나온다</text>

  <rect x="24" y="428" width="564" height="230" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="1.4"/>
  <text x="44" y="456" font-size="15" font-weight="700" fill="#334155">문제의 예제 5줄 (uid1234 가 나갔다가 다시 들어온다)</text>
  <text x="44" y="484" font-size="14" fill="#334155">3번 줄 Leave 에서 uid1234 를 지워도, 4번 줄</text>
  <text x="44" y="508" font-size="14" fill="#334155">Enter uid1234 Prodo 가 다시 넣어 준다.</text>
  <text x="44" y="536" font-size="14" fill="#334155">1차 끝의 맵 = { uid1234=Prodo, uid4567=Ryan }</text>
  <text x="44" y="560" font-size="14" fill="#334155">remove 가 없을 때와 같은 맵이라 출력 4줄이 모두 같다.</text>
  <rect x="44" y="580" width="524" height="56" rx="8" fill="#ecfdf5" stroke="#047857"/>
  <text x="64" y="614" font-size="15" font-weight="700" fill="#047857">예제는 통과한다 — 그래서 이 실수는 예제로 안 잡힌다</text>

  <rect x="612" y="428" width="564" height="230" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/>
  <text x="632" y="456" font-size="15" font-weight="700" fill="#b91c1c">예제에서 4번 줄만 뺀 4줄 (uid1234 가 다시 안 들어온다)</text>
  <text x="632" y="484" font-size="14" fill="#334155">Enter uid1234 Muzi / Enter uid4567 Prodo /</text>
  <text x="632" y="508" font-size="14" fill="#334155">Leave uid1234 / Change uid4567 Ryan</text>
  <text x="632" y="536" font-size="14" fill="#334155">remove 하면 1차 끝의 맵 = { uid4567=Ryan }</text>
  <text x="632" y="564" font-size="14" fill="#b91c1c" font-weight="700">출력: null님이 들어왔습니다. / Ryan님이 들어왔습니다. /</text>
  <text x="672" y="586" font-size="14" fill="#b91c1c" font-weight="700">null님이 나갔습니다.</text>
  <text x="632" y="616" font-size="14" fill="#047857" font-weight="700">정답: Muzi님이 들어왔습니다. / Ryan님이 들어왔습니다. /</text>
  <text x="672" y="638" font-size="14" fill="#047857" font-weight="700">Muzi님이 나갔습니다.</text>

  <text x="24" y="690" font-size="14" fill="#334155">예제를 통과했다고 끝내지 말고, 예제를 한 줄만 바꾼 입력(다시 안 들어오는 사람, 중복 신고)을 손으로 하나 더 넣어 본다. 실제로 실행해 확인한 결과다.</text>
</svg>
