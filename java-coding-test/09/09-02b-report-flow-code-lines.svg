<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 484" width="760" height="484" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
  <title>그림 9-2b. 신고 결과 받기 풀이 A — 각 단계가 코드의 어느 줄에서 일어나는가</title>
  <rect width="760" height="484" fill="#ffffff"/>
  <text x="24" y="40" font-size="22" font-weight="700" fill="#0f172a">각 단계가 풀이 A 코드의 어느 줄에서 일어나는가</text>
  <text x="24" y="72" font-size="16" fill="#475569">번호는 그림 9-2a 의 단계 번호다. 고정폭 글자가 코드 한 줄이다.</text>

  <rect x="24" y="92" width="712" height="368" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <g font-size="16">
    <circle cx="50" cy="124" r="13" fill="#1d4ed8"/><text x="50" y="130" font-weight="700" fill="#fff" text-anchor="middle">2</text>
    <text x="74" y="130" fill="#0f172a" font-family="Consolas, monospace">idx.put(idList[i], i);</text>
    <text x="74" y="156" fill="#334155">이름을 답 배열의 칸 번호로 바꿔 둔다</text>

    <circle cx="50" cy="192" r="13" fill="#047857"/><text x="50" y="198" font-weight="700" fill="#fff" text-anchor="middle">3</text>
    <text x="74" y="198" fill="#0f172a" font-family="Consolas, monospace">reporters.computeIfAbsent(p[1], key -&gt; new HashSet&lt;&gt;()).add(p[0]);</text>
    <text x="74" y="224" fill="#334155">키는 피신고자 p[1], Set 에 넣는 값은 신고자 p[0]</text>

    <circle cx="50" cy="260" r="13" fill="#b91c1c"/><text x="50" y="266" font-weight="700" fill="#fff" text-anchor="middle">4</text>
    <text x="74" y="266" fill="#0f172a" font-family="Consolas, monospace">if (from.size() &gt;= k)</text>
    <text x="74" y="292" fill="#334155">Set 크기가 곧 서로 다른 신고자 수다</text>

    <circle cx="50" cy="328" r="13" fill="#047857"/><text x="50" y="334" font-weight="700" fill="#fff" text-anchor="middle">5</text>
    <text x="74" y="334" fill="#0f172a" font-family="Consolas, monospace">for (String user : from) mail[idx.get(user)]++;</text>
    <text x="74" y="360" fill="#334155">메일은 신고한 사람(user)의 칸에 더한다</text>
  </g>
  <line x1="48" y1="384" x2="712" y2="384" stroke="#cbd5e1"/>
  <text x="48" y="414" font-size="16" fill="#475569">신고 R 줄을 한 번씩 읽고(3), Set 들을 한 번씩 훑으므로(4, 5)</text>
  <text x="48" y="440" font-size="16" fill="#475569">전체는 O(R + N) 이다. 예제 1 은 R = 5, N = 4 다.</text>
</svg>
