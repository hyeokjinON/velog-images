<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 718" width="760" height="718" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
  <title>그림 9-3b. 신고 결과 받기 예제 1 — 두 번째 반복문에서 메일 배열이 어떤 순서로 채워지나</title>
  <rect width="760" height="718" fill="#ffffff"/>
  <text x="24" y="40" font-size="22" font-weight="700" fill="#0f172a">신고 결과 받기 예제 1 — 메일 배열이</text>
  <text x="24" y="70" font-size="22" font-weight="700" fill="#0f172a">어떤 순서로 채워지나</text>
  <text x="24" y="104" font-size="16" fill="#475569">초록 테두리 = 그 단계에서 1이 더해진 칸, 빨강 = 정지된 사람</text>

  <text x="24" y="144" font-size="17" font-weight="700" fill="#047857">② 두 번째 반복문 — reporters.values() 를 돌며</text>
  <text x="24" y="170" font-size="17" font-weight="700" fill="#047857">Set 크기가 k(2) 이상이면 그 Set 의 신고자 칸에 +1</text>
  <g font-size="16" fill="#475569">
    <text x="24" y="202">HashMap 은 넣은 순서를 지키지 않는다. JDK 21 에서 실제로</text>
    <text x="24" y="226">출력해 보니 muzi → neo → frodo 순서로 돌았다.</text>
    <text x="24" y="250">순서가 달라도 마지막 배열은 같다.</text>
  </g>

  <!-- column header -->
  <g font-size="16" font-weight="700" fill="#1e3a8a">
    <text x="36" y="292" font-weight="400" fill="#475569">mail 배열 칸 →</text>
    <text x="255" y="292" text-anchor="middle">muzi</text>
    <text x="385" y="292" text-anchor="middle">frodo</text>
    <text x="515" y="292" text-anchor="middle">apeach</text>
    <text x="645" y="292" text-anchor="middle">neo</text>
  </g>
  <line x1="24" y1="306" x2="736" y2="306" stroke="#cbd5e1"/>

  <g font-size="16" fill="#334155">
    <!-- a -->
    <text x="36" y="336">muzi 의 Set { apeach } 는 1명이라 2 미만이다. 정지가 아니므로 건너뛴다.</text>
    <rect x="200" y="350" width="110" height="38" fill="#f8fafc" stroke="#94a3b8"/><text x="255" y="375" text-anchor="middle">0</text>
    <rect x="330" y="350" width="110" height="38" fill="#f8fafc" stroke="#94a3b8"/><text x="385" y="375" text-anchor="middle">0</text>
    <rect x="460" y="350" width="110" height="38" fill="#f8fafc" stroke="#94a3b8"/><text x="515" y="375" text-anchor="middle">0</text>
    <rect x="590" y="350" width="110" height="38" fill="#f8fafc" stroke="#94a3b8"/><text x="645" y="375" text-anchor="middle">0</text>
    <line x1="24" y1="404" x2="736" y2="404" stroke="#e2e8f0"/>

    <!-- b -->
    <text x="36" y="434"><tspan fill="#b91c1c" font-weight="700">neo 정지</tspan> (Set { muzi, frodo }, 2명). muzi 칸 +1, frodo 칸 +1</text>
    <rect x="200" y="448" width="110" height="38" fill="#ecfdf5" stroke="#047857" stroke-width="2"/><text x="255" y="473" text-anchor="middle" font-weight="700" fill="#047857">1</text>
    <rect x="330" y="448" width="110" height="38" fill="#ecfdf5" stroke="#047857" stroke-width="2"/><text x="385" y="473" text-anchor="middle" font-weight="700" fill="#047857">1</text>
    <rect x="460" y="448" width="110" height="38" fill="#f8fafc" stroke="#94a3b8"/><text x="515" y="473" text-anchor="middle">0</text>
    <rect x="590" y="448" width="110" height="38" fill="#f8fafc" stroke="#94a3b8"/><text x="645" y="473" text-anchor="middle">0</text>
    <line x1="24" y1="502" x2="736" y2="502" stroke="#e2e8f0"/>

    <!-- c -->
    <text x="36" y="532"><tspan fill="#b91c1c" font-weight="700">frodo 정지</tspan> (Set { muzi, apeach }, 2명). muzi 칸 +1, apeach 칸 +1</text>
    <rect x="200" y="546" width="110" height="38" fill="#ecfdf5" stroke="#047857" stroke-width="2"/><text x="255" y="571" text-anchor="middle" font-weight="700" fill="#047857">2</text>
    <rect x="330" y="546" width="110" height="38" fill="#f8fafc" stroke="#94a3b8"/><text x="385" y="571" text-anchor="middle">1</text>
    <rect x="460" y="546" width="110" height="38" fill="#ecfdf5" stroke="#047857" stroke-width="2"/><text x="515" y="571" text-anchor="middle" font-weight="700" fill="#047857">1</text>
    <rect x="590" y="546" width="110" height="38" fill="#f8fafc" stroke="#94a3b8"/><text x="645" y="571" text-anchor="middle">0</text>
  </g>

  <rect x="24" y="606" width="712" height="92" rx="8" fill="#ecfdf5" stroke="#047857"/>
  <text x="44" y="634" font-size="17" font-weight="700" fill="#047857">최종 mail = [2, 1, 1, 0] — 예제 1 의 기대 출력과 같다.</text>
  <text x="44" y="660" font-size="16" fill="#334155">muzi 는 frodo 와 neo 를 모두 신고해서 2통,</text>
  <text x="44" y="684" font-size="16" fill="#334155">neo 는 아무도 신고하지 않아서 0통이다.</text>
</svg>
