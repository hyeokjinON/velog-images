<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 720" width="760" height="720" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<title>일마감 대사 한 장으로 보기: 은행 파일과 하루치 출금을 거래번호로 맞추고, 결과를 모르는 출금만 확정한다</title>
<defs><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="ms" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="mx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<rect width="760" height="720" fill="#ffffff"/>
<text x="20" y="34" font-size="21" fill="#0f172a" font-weight="700" xml:space="preserve">일마감 대사 한 장으로 보기:</text>
<text x="20" y="62" font-size="21" fill="#0f172a" font-weight="700" xml:space="preserve">은행 파일과 하루치 출금을 거래번호로 맞춘다</text>
<text x="20" y="96" font-size="16" fill="#475569" xml:space="preserve">회색 = 은행 쪽 기록, 파랑 = 우리 쪽 기록과 대사 잡</text>
<text x="20" y="119" font-size="16" fill="#475569" xml:space="preserve">초록 = 자동 확정, 주황 = 기록만 하고 사람이 본다</text>
<rect x="20" y="150" width="345" height="112" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.6"/>
<text x="32" y="176" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">① 은행 대사 파일</text>
<text x="32" y="199" font-size="16" fill="#0f172a" font-family="Consolas, D2Coding, monospace" xml:space="preserve">RECON_20261030.dat</text>
<text x="32" y="222" font-size="16" fill="#0f172a" xml:space="preserve">00:05 에 은행이 만든다</text>
<text x="32" y="245" font-size="16" fill="#0f172a" xml:space="preserve">은행이 처리한 출금만 한 줄씩</text>
<rect x="395" y="150" width="345" height="112" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="407" y="176" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">② 우리 DB 의 출금</text>
<text x="407" y="199" font-size="16" fill="#0f172a" font-family="Consolas, D2Coding, monospace" xml:space="preserve">transfer 표</text>
<text x="407" y="222" font-size="16" fill="#0f172a" xml:space="preserve">보낸 시각이 10-30 인 출금</text>
<text x="407" y="245" font-size="16" fill="#0f172a" xml:space="preserve">상태: COMPLETED, UNKNOWN …</text>
<line x1="192" y1="262" x2="250" y2="304" stroke="#334155" stroke-width="2.2" marker-end="url(#ms)"/>
<line x1="567" y1="262" x2="510" y2="304" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#mb)"/>
<rect x="20" y="306" width="720" height="112" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="32" y="332" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">③ 일마감 대사 잡 (Spring Batch 6)</text>
<text x="32" y="355" font-size="16" fill="#0f172a" xml:space="preserve">매일 01 ~ 06시 정각에 전날 분을 대사한다</text>
<text x="32" y="378" font-size="16" fill="#0f172a" xml:space="preserve">거래번호로 출금 하나와 파일 줄을 짝지어 판정한다</text>
<text x="32" y="401" font-size="16" fill="#0f172a" xml:space="preserve">점검 시간 23:50 ~ 00:10 덕분에 양쪽이 같은 하루다</text>
<line x1="192" y1="418" x2="192" y2="456" stroke="#047857" stroke-width="2.2" marker-end="url(#mg)"/>
<line x1="567" y1="418" x2="567" y2="456" stroke="#c2410c" stroke-width="2.2" marker-end="url(#mo)"/>
<rect x="20" y="458" width="345" height="112" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
<text x="32" y="484" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">④ 자동 확정</text>
<text x="32" y="507" font-size="16" fill="#0f172a" xml:space="preserve">UNKNOWN · SENDING 만</text>
<text x="32" y="530" font-size="16" fill="#0f172a" xml:space="preserve">파일에 줄 있음 → COMPLETED</text>
<text x="32" y="553" font-size="16" fill="#0f172a" xml:space="preserve">줄 없음 → FAILED E002 + 환불</text>
<rect x="395" y="458" width="345" height="112" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.6"/>
<text x="407" y="484" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">⑤ 기록만, 고치지 않음</text>
<text x="407" y="507" font-size="16" fill="#0f172a" xml:space="preserve">이미 확정된 건이 어긋나면</text>
<text x="407" y="530" font-size="16" fill="#0f172a" xml:space="preserve">recon_issue 에 한 줄 남긴다</text>
<text x="407" y="553" font-size="16" fill="#0f172a" xml:space="preserve">고치는 것은 사람이 SQL 로</text>
<line x1="192" y1="570" x2="300" y2="608" stroke="#047857" stroke-width="2.2" marker-end="url(#mg)"/>
<line x1="567" y1="570" x2="460" y2="608" stroke="#c2410c" stroke-width="2.2" marker-end="url(#mo)"/>
<rect x="20" y="610" width="720" height="90" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.6"/>
<text x="32" y="636" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">⑥ 요약 알림</text>
<text x="32" y="659" font-size="16" fill="#0f172a" xml:space="preserve">텔레그램(토큰이 있으면) 또는 로그로 보낸다</text>
<text x="32" y="682" font-size="16" fill="#0f172a" xml:space="preserve">알림이 실패해도 대사 결과는 그대로 남는다</text>
</svg>