<text x="60" y="598" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">합계</text>
<text x="330" y="598" font-size="16" fill="#0f172a" font-weight="700" font-family="Consolas, D2Coding, monospace" text-anchor="middle" xml:space="preserve">59</text>
<rect x="20" y="636" width="720" height="90" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
<text x="32" y="662" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">헤더와 트레일러도 59바이트로 맞춘다</text>
<text x="32" y="685" font-size="16" fill="#0f172a" xml:space="preserve">헤더 H: 구분 1 + 처리일 8 + 은행코드 3 = 12바이트</text>
<text x="32" y="708" font-size="16" fill="#0f172a" xml:space="preserve">트레일러 T: 구분 1 + 건수 9 + 금액 합계 18 = 28바이트</text>
