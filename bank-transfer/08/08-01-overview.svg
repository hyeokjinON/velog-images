<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 890" width="760" height="890" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<title>출금 접수 한 건과 차감 전략이 끼어드는 두 자리: 트랜잭션 바깥의 around, 트랜잭션 안의 withdraw</title>
<defs><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="ms" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="mx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<rect width="760" height="890" fill="#ffffff"/>
<text x="20" y="34" font-size="21" fill="#0f172a" font-weight="700" xml:space="preserve">출금 접수 한 건과 차감 전략이 끼어드는</text>
<text x="20" y="62" font-size="21" fill="#0f172a" font-weight="700" xml:space="preserve">두 자리: 바깥의 around, 안의 withdraw</text>
<text x="20" y="96" font-size="16" fill="#475569" xml:space="preserve">주황 = 트랜잭션 바깥(around), 초록 = 트랜잭션 안,</text>
<text x="20" y="119" font-size="16" fill="#475569" xml:space="preserve">빨강 = 실패 응답</text>
<rect x="20" y="146" width="720" height="64" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
<text x="32" y="172" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">① POST /api/v1/transfers — 1원 출금</text>
<text x="32" y="195" font-size="16" fill="#0f172a" xml:space="preserve">X-User-Id: load-hot, Idempotency-Key: 요청마다 새 값</text>
<line x1="240" y1="210" x2="240" y2="236" stroke="#c2410c" stroke-width="2.2" marker-end="url(#mo)"/>
<rect x="20" y="236" width="720" height="430" rx="8" fill="#fffbf5" stroke="#c2410c" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="36" y="264" font-size="17" fill="#0f172a" font-weight="700" xml:space="preserve">② debit.around(userId) — 트랜잭션 바깥</text>
<text x="36" y="290" font-size="16" fill="#c2410c" xml:space="preserve">redis: Redis 락 획득 → 안쪽 실행 → 커밋 뒤 해제</text>
<text x="36" y="313" font-size="16" fill="#c2410c" xml:space="preserve">optimistic: version 충돌이면 안쪽을 새로 (최대 5번)</text>
<rect x="40" y="332" width="680" height="292" rx="8" fill="#ffffff" stroke="#047857" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="56" y="360" font-size="17" fill="#0f172a" font-weight="700" xml:space="preserve">③ tx.execute — 접수 트랜잭션 (모두 커밋 또는 롤백)</text>
<rect x="60" y="378" width="300" height="44" rx="8" fill="#ffffff" stroke="#047857" stroke-width="1.6"/>
<text x="72" y="406" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">a. 출금 INSERT (RECEIVED)</text>
<line x1="150" y1="422" x2="150" y2="432" stroke="#047857" stroke-width="2.2" marker-end="url(#mg)"/>
<rect x="60" y="432" width="300" height="44" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
<text x="72" y="460" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">b. 잔고 차감 — withdraw</text>
<line x1="150" y1="476" x2="150" y2="486" stroke="#047857" stroke-width="2.2" marker-end="url(#mg)"/>
<rect x="60" y="486" width="300" height="44" rx="8" fill="#ffffff" stroke="#047857" stroke-width="1.6"/>
<text x="72" y="514" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">c. 원장 INSERT (WITHDRAW)</text>
<line x1="150" y1="530" x2="150" y2="540" stroke="#047857" stroke-width="2.2" marker-end="url(#mg)"/>
<rect x="60" y="540" width="300" height="44" rx="8" fill="#ffffff" stroke="#047857" stroke-width="1.6"/>
<text x="72" y="568" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">d. 아웃박스 INSERT</text>
<text x="60" y="608" font-size="16" fill="#047857" font-weight="700" xml:space="preserve">e. 커밋 → 잔고 행의 행 락 해제</text>
<line x1="360" y1="454" x2="384" y2="454" stroke="#047857" stroke-width="2.2" marker-end="url(#mg)"/>
<rect x="384" y="378" width="320" height="180" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.6"/>
<text x="396" y="404" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">b 칸은 전략마다 다르다</text>
<text x="396" y="430" font-size="16" fill="#047857" xml:space="preserve">conditional — 조건부 UPDATE</text>
<text x="396" y="456" font-size="16" fill="#1d4ed8" xml:space="preserve">pessimistic — 잠근 뒤 UPDATE</text>
<text x="396" y="482" font-size="16" fill="#b91c1c" xml:space="preserve">optimistic — version 비교</text>
<text x="396" y="508" font-size="16" fill="#c2410c" xml:space="preserve">redis — 안쪽은 conditional</text>
<text x="396" y="534" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">0건이면 a 까지 롤백 → 422</text>
<text x="36" y="650" font-size="16" fill="#c2410c" font-weight="700" xml:space="preserve">redis 는 이 자리에서 Redis 락을 푼다 (커밋이 끝난 뒤)</text>
<line x1="240" y1="666" x2="240" y2="692" stroke="#334155" stroke-width="2.2" marker-end="url(#ms)"/>
<rect x="20" y="692" width="720" height="88" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
<text x="32" y="718" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">④ 응답</text>
<text x="32" y="741" font-size="16" fill="#0f172a" xml:space="preserve">202 접수 · 422 잔고 부족 (다시 보내도 같다)</text>
<text x="32" y="764" font-size="16" fill="#b91c1c" xml:space="preserve">409 재시도 소진 · 503 락 못 잡음 (Retry-After: 1)</text>
<text x="380" y="814" font-size="16" fill="#0f172a" font-weight="700" text-anchor="middle" xml:space="preserve">핫스팟 초당 접수: conditional 105.7 &gt; pessimistic 98.9</text>
<text x="380" y="840" font-size="16" fill="#0f172a" font-weight="700" text-anchor="middle" xml:space="preserve">&gt; redis 80.6 &gt; optimistic 44.7</text>
<text x="20" y="874" font-size="16" fill="#64748b" xml:space="preserve">근거: bank-transfer PR #13 (P4-2) — JpaTransferStore.saveWithEvent, ADR-0009</text>
</svg>