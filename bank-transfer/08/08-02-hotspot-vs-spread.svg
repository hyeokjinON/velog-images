<text x="511" y="493" font-size="16" fill="#0f172a" font-family="Consolas, D2Coding, monospace" text-anchor="middle" xml:space="preserve">u004</text>
<rect x="562" y="472" width="82" height="30" rx="4" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
<text x="603" y="493" font-size="16" fill="#0f172a" font-family="Consolas, D2Coding, monospace" text-anchor="middle" xml:space="preserve">u005</text>
<rect x="654" y="472" width="82" height="30" rx="4" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
<text x="695" y="493" font-size="16" fill="#0f172a" font-family="Consolas, D2Coding, monospace" text-anchor="middle" xml:space="preserve">u006</text>
<text x="511" y="532" font-size="16" fill="#64748b" font-weight="700" text-anchor="middle" xml:space="preserve">…</text>
<text x="603" y="532" font-size="16" fill="#64748b" font-weight="700" text-anchor="middle" xml:space="preserve">…</text>
<text x="695" y="532" font-size="16" fill="#64748b" font-weight="700" text-anchor="middle" xml:space="preserve">…</text>
<rect x="470" y="548" width="82" height="30" rx="4" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
<text x="511" y="569" font-size="16" fill="#0f172a" font-family="Consolas, D2Coding, monospace" text-anchor="middle" xml:space="preserve">u498</text>
