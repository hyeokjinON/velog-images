<text x="695" y="569" font-size="16" fill="#0f172a" font-family="Consolas, D2Coding, monospace" text-anchor="middle" xml:space="preserve">u500</text>
<line x1="190" y1="509" x2="466" y2="449" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#mb)"/>
<line x1="190" y1="509" x2="466" y2="487" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#mb)"/>
<line x1="190" y1="509" x2="466" y2="563" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#mb)"/>
<text x="20" y="614" font-size="16" fill="#0f172a" xml:space="preserve">50명이 wallet 500행에 흩어진다 → 같은 행에서 기다릴 일이 거의 없다</text>
<text x="20" y="646" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">초당 624 ~ 668 — 네 전략이 회차 편차(최대 9%) 안</text>
<text x="20" y="690" font-size="16" fill="#64748b" xml:space="preserve">근거: load/hotspot.js · load/spread.js, docs/perf/p4-2-lock-comparison.md</text>
</svg>