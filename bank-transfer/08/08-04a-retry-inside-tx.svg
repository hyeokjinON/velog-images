<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 770" width="760" height="770" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<title>버린 방식: 같은 트랜잭션 안에서 다시 읽으면 스냅샷이 그대로라 version 7 이 계속 보이고 매번 진다</title>
<defs><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="ms" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="mx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<rect width="760" height="770" fill="#ffffff"/>
<text x="20" y="34" font-size="21" fill="#0f172a" font-weight="700" xml:space="preserve">버린 방식: 같은 트랜잭션 안에서 다시 읽으면</text>
<text x="20" y="62" font-size="21" fill="#0f172a" font-weight="700" xml:space="preserve">스냅샷이 그대로라 매번 진다</text>
<text x="20" y="96" font-size="16" fill="#475569" xml:space="preserve">위에서 아래로 시간이 흐른다. 같은 사용자의 잔고 행 하나.</text>
<text x="20" y="119" font-size="16" fill="#475569" xml:space="preserve">파랑 = 읽기, 초록 = 이긴 쪽, 빨강 = 진 쪽</text>
<rect x="15" y="146" width="220" height="60" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.6"/>
<text x="125" y="171" font-size="16" fill="#0f172a" font-weight="700" text-anchor="middle" xml:space="preserve">요청 A</text>
<text x="125" y="195" font-size="16" fill="#0f172a" text-anchor="middle" xml:space="preserve">(진 쪽)</text>
<line x1="125" y1="206" x2="125" y2="650" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
<rect x="270" y="146" width="220" height="60" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.6"/>
<text x="380" y="171" font-size="16" fill="#0f172a" font-weight="700" text-anchor="middle" xml:space="preserve">MySQL</text>
<text x="380" y="195" font-size="16" fill="#0f172a" text-anchor="middle" xml:space="preserve">wallet (load-hot)</text>
<line x1="380" y1="206" x2="380" y2="650" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
<rect x="525" y="146" width="220" height="60" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
<text x="635" y="171" font-size="16" fill="#0f172a" font-weight="700" text-anchor="middle" xml:space="preserve">요청 B</text>
<text x="635" y="195" font-size="16" fill="#0f172a" text-anchor="middle" xml:space="preserve">(이긴 쪽)</text>
<line x1="635" y1="206" x2="635" y2="650" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
<line x1="129" y1="280" x2="376" y2="280" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#mb)"/>
<text x="252.5" y="271" font-size="16" fill="#1d4ed8" text-anchor="middle" xml:space="preserve">→ 7</text>
<text x="252.5" y="248" font-size="16" fill="#1d4ed8" text-anchor="middle" xml:space="preserve">SELECT … version</text>
<circle cx="105" cy="280" r="13" fill="#1d4ed8"/><text x="105" y="286" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle" xml:space="preserve">①</text>
<rect x="250.71999999999997" y="293" width="258.56000000000006" height="26" fill="#ffffff"/>
<text x="380" y="312" font-size="16" fill="#1d4ed8" text-anchor="middle" xml:space="preserve">A 의 스냅샷이 이 순간에 고정된다</text>
<line x1="631" y1="390" x2="384" y2="390" stroke="#047857" stroke-width="2.2" marker-end="url(#mg)"/>
<text x="507.5" y="381" font-size="16" fill="#047857" text-anchor="middle" xml:space="preserve">COMMIT</text>
<text x="507.5" y="358" font-size="16" fill="#047857" text-anchor="middle" xml:space="preserve">UPDATE … version = 8</text>
<circle cx="655" cy="390" r="13" fill="#047857"/><text x="655" y="396" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle" xml:space="preserve">②</text>
<text x="380" y="420" font-size="16" fill="#0f172a" font-weight="700" text-anchor="middle" xml:space="preserve">최신 값: version 8</text>
<line x1="129" y1="490" x2="376" y2="490" stroke="#b91c1c" stroke-width="2.2" marker-end="url(#mr)"/>
<text x="252.5" y="481" font-size="16" fill="#b91c1c" text-anchor="middle" xml:space="preserve">version = 7</text>
<text x="252.5" y="458" font-size="16" fill="#b91c1c" text-anchor="middle" xml:space="preserve">UPDATE … WHERE</text>
<circle cx="105" cy="490" r="13" fill="#b91c1c"/><text x="105" y="496" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle" xml:space="preserve">③</text>
<text x="380" y="520" font-size="16" fill="#b91c1c" font-weight="700" text-anchor="middle" xml:space="preserve">→ 0건</text>
<line x1="129" y1="590" x2="376" y2="590" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#mb)"/>
<text x="252.5" y="581" font-size="16" fill="#1d4ed8" text-anchor="middle" xml:space="preserve">다시 SELECT</text>
<text x="252.5" y="558" font-size="16" fill="#1d4ed8" text-anchor="middle" xml:space="preserve">같은 트랜잭션에서</text>
<circle cx="105" cy="590" r="13" fill="#1d4ed8"/><text x="105" y="596" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle" xml:space="preserve">④</text>
<line x1="376" y1="636" x2="129" y2="636" stroke="#b91c1c" stroke-width="2.2" marker-end="url(#mr)"/>
<text x="252.5" y="627" font-size="16" fill="#b91c1c" text-anchor="middle" xml:space="preserve">→ 여전히 version 7</text>
<rect x="20" y="662" width="720" height="64" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.6"/>
<text x="32" y="688" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">결과: 다시 해도 ③ 에서 또 진다</text>
<text x="32" y="711" font-size="16" fill="#0f172a" xml:space="preserve">일반 SELECT 는 트랜잭션 처음의 스냅샷을 읽는다</text>
<text x="20" y="754" font-size="16" fill="#64748b" xml:space="preserve">MySQL 기본 격리 수준 REPEATABLE READ 기준. version 값은 설명용</text>
</svg>