<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 860" width="760" height="860" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<title>Redis 락만 믿고 안쪽에서 읽고 계산해 쓰면, 락을 잡지 않는 환불 1만 원이 덮여 사라진다</title>
<defs><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="ms" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="mx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<rect width="760" height="860" fill="#ffffff"/>
<text x="20" y="34" font-size="21" fill="#0f172a" font-weight="700" xml:space="preserve">Redis 락만 믿고 안쪽에서 읽고 계산해 쓰면</text>
<text x="20" y="62" font-size="21" fill="#0f172a" font-weight="700" xml:space="preserve">락을 잡지 않는 환불 1만 원이 사라진다</text>
<text x="20" y="96" font-size="16" fill="#475569" xml:space="preserve">잔고 50,000원. 출금 A 30,000원, 환불 R 10,000원.</text>
<text x="20" y="119" font-size="16" fill="#475569" xml:space="preserve">파랑 = 읽기, 초록 = 맞는 쓰기, 빨강 = 덮어쓰기</text>
<rect x="15" y="146" width="220" height="60" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.6"/>
<text x="125" y="171" font-size="16" fill="#0f172a" font-weight="700" text-anchor="middle" xml:space="preserve">출금 A 스레드</text>
<text x="125" y="195" font-size="16" fill="#0f172a" text-anchor="middle" xml:space="preserve">Redis 락 보유</text>
<line x1="125" y1="206" x2="125" y2="625" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
<rect x="270" y="146" width="220" height="60" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.6"/>
<text x="380" y="171" font-size="16" fill="#0f172a" font-weight="700" text-anchor="middle" xml:space="preserve">MySQL</text>
<text x="380" y="195" font-size="16" fill="#0f172a" text-anchor="middle" xml:space="preserve">wallet</text>
<line x1="380" y1="206" x2="380" y2="625" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
<rect x="525" y="146" width="220" height="60" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
<text x="635" y="171" font-size="16" fill="#0f172a" font-weight="700" text-anchor="middle" xml:space="preserve">환불 R 스레드</text>
<text x="635" y="195" font-size="16" fill="#0f172a" text-anchor="middle" xml:space="preserve">Redis 락 없음</text>
<line x1="635" y1="206" x2="635" y2="625" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
<line x1="129" y1="280" x2="376" y2="280" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#mb)"/>
<text x="252.5" y="271" font-size="16" fill="#1d4ed8" text-anchor="middle" xml:space="preserve">→ 50,000</text>
<text x="252.5" y="248" font-size="16" fill="#1d4ed8" text-anchor="middle" xml:space="preserve">SELECT balance</text>
<circle cx="105" cy="280" r="13" fill="#1d4ed8"/><text x="105" y="286" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle" xml:space="preserve">①</text>
<rect x="248.31999999999996" y="293" width="263.36000000000007" height="26" fill="#ffffff"/>
<text x="380" y="312" font-size="16" fill="#1d4ed8" text-anchor="middle" xml:space="preserve">잠금 없는 읽기라 R 을 막지 않는다</text>
<line x1="631" y1="400" x2="384" y2="400" stroke="#047857" stroke-width="2.2" marker-end="url(#mg)"/>
<text x="507.5" y="391" font-size="16" fill="#047857" text-anchor="middle" xml:space="preserve">COMMIT</text>
<text x="507.5" y="368" font-size="16" fill="#047857" text-anchor="middle" xml:space="preserve">balance + 10000</text>
<circle cx="655" cy="400" r="13" fill="#047857"/><text x="655" y="406" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle" xml:space="preserve">②</text>
<text x="380" y="430" font-size="16" fill="#047857" font-weight="700" text-anchor="middle" xml:space="preserve">잔고 60,000</text>
<rect x="45" y="448" width="160" height="78" fill="#ffffff"/>
<text x="125" y="468" font-size="16" fill="#0f172a" font-weight="700" text-anchor="middle" xml:space="preserve">앱에서 계산</text>
<text x="125" y="492" font-size="16" fill="#0f172a" text-anchor="middle" xml:space="preserve">50,000 − 30,000</text>
<text x="125" y="516" font-size="16" fill="#0f172a" text-anchor="middle" xml:space="preserve">= 20,000</text>
<line x1="129" y1="580" x2="376" y2="580" stroke="#b91c1c" stroke-width="2.2" marker-end="url(#mr)"/>
<text x="252.5" y="571" font-size="16" fill="#b91c1c" text-anchor="middle" xml:space="preserve">COMMIT</text>
<text x="252.5" y="548" font-size="16" fill="#b91c1c" text-anchor="middle" xml:space="preserve">SET balance = 20000</text>
<circle cx="105" cy="580" r="13" fill="#b91c1c"/><text x="105" y="586" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle" xml:space="preserve">③</text>
<text x="380" y="610" font-size="16" fill="#b91c1c" font-weight="700" text-anchor="middle" xml:space="preserve">잔고 20,000</text>
<rect x="20" y="640" width="720" height="88" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.6"/>
<text x="32" y="666" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">결과: 잔고 20,000 — 맞는 값은 30,000</text>
<text x="32" y="689" font-size="16" fill="#0f172a" xml:space="preserve">60,000 − 30,000 이어야 하는데 A 가 옛 값 50,000 으로 썼다</text>
<text x="32" y="712" font-size="16" fill="#0f172a" xml:space="preserve">환불 10,000원이 기록에서 사라졌다 (lost update)</text>
<rect x="20" y="744" width="720" height="64" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
<text x="32" y="770" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">실제 구현: 안쪽은 조건부 UPDATE</text>
<text x="32" y="793" font-size="16" fill="#0f172a" xml:space="preserve">balance = balance − 30000 → 최신 60,000 에서 빼 30,000</text>
<text x="20" y="840" font-size="16" fill="#64748b" xml:space="preserve">금액은 설명용. 근거: RedisWalletDebit 의 안쪽 = conditional (ADR-0009)</text>
</svg>