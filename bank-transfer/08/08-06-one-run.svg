<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 840" width="760" height="840" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<title>측정 한 회차의 순서: 전략 확인, 정리, 시드, InnoDB 정리 대기, k6 워밍업과 측정, 정확성 확인, 통과하지 못하면 .invalid</title>
<defs><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="ms" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="mx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<rect width="760" height="840" fill="#ffffff"/>
<text x="20" y="34" font-size="21" fill="#0f172a" font-weight="700" xml:space="preserve">측정 한 회차의 순서: 같은 출발점에서</text>
<text x="20" y="62" font-size="21" fill="#0f172a" font-weight="700" xml:space="preserve">시작하고, 끝나면 DB 를 센다</text>
<text x="20" y="96" font-size="16" fill="#475569" xml:space="preserve">load/run.sh 한 번 = 한 회차. 초록 = 통과, 빨강 = 버림</text>
<rect x="20" y="140" width="470" height="64" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
<text x="32" y="166" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">① 전략 확인</text>
<text x="32" y="189" font-size="16" fill="#0f172a" xml:space="preserve">GET /actuator/info 의 debit-strategy</text>
<line x1="255" y1="204" x2="255" y2="228" stroke="#334155" stroke-width="2.2" marker-end="url(#ms)"/>
<rect x="20" y="228" width="470" height="64" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
<text x="32" y="254" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">② 정리 — load/cleanup.sql</text>
<text x="32" y="277" font-size="16" fill="#0f172a" xml:space="preserve">부하용 사용자 501명의 행만 지운다</text>
<line x1="255" y1="292" x2="255" y2="316" stroke="#334155" stroke-width="2.2" marker-end="url(#ms)"/>
<rect x="20" y="316" width="470" height="64" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
<text x="32" y="342" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">③ 시드 — load/seed.sql</text>
<text x="32" y="365" font-size="16" fill="#0f172a" xml:space="preserve">501명, 잔고 10억, 받는 계좌 인증</text>
<line x1="255" y1="380" x2="255" y2="404" stroke="#334155" stroke-width="2.2" marker-end="url(#ms)"/>
<rect x="20" y="404" width="470" height="64" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
<text x="32" y="430" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">④ InnoDB 정리(purge) 대기</text>
<text x="32" y="453" font-size="16" fill="#0f172a" xml:space="preserve">history length &lt; 1000, 최대 60초</text>
<line x1="255" y1="468" x2="255" y2="492" stroke="#334155" stroke-width="2.2" marker-end="url(#ms)"/>
<rect x="20" y="492" width="470" height="64" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="32" y="518" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">⑤ k6 — 50 VU, 닫힌 모델</text>
<text x="32" y="541" font-size="16" fill="#0f172a" xml:space="preserve">워밍업 10초(집계 제외) + 측정 60초</text>
<line x1="255" y1="556" x2="255" y2="580" stroke="#334155" stroke-width="2.2" marker-end="url(#ms)"/>
<rect x="20" y="580" width="470" height="64" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
<text x="32" y="606" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">⑥ 정확성 확인 — load/verify.sql</text>
<text x="32" y="629" font-size="16" fill="#0f172a" xml:space="preserve">음수 · 잔고≠원장 · 출금≠WITHDRAW …</text>
<rect x="510" y="140" width="230" height="182" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.6"/>
<text x="522" y="166" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">반복 규칙</text>
<text x="522" y="192" font-size="16" fill="#0f172a" xml:space="preserve">전략마다 앱 새로 기동</text>
<text x="522" y="218" font-size="16" fill="#0f172a" xml:space="preserve">핫스팟 · 분산 번갈아</text>
<text x="522" y="244" font-size="16" fill="#0f172a" xml:space="preserve">3회씩 = 24회</text>
<text x="522" y="270" font-size="16" fill="#0f172a" xml:space="preserve">끝에 conditional 을</text>
<text x="522" y="296" font-size="16" fill="#0f172a" xml:space="preserve">한 번 더 (1% 차이)</text>
<rect x="510" y="404" width="230" height="152" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.6"/>
<text x="522" y="430" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">k6 가 남기는 것</text>
<text x="522" y="456" font-size="16" fill="#0f172a" xml:space="preserve">상태별 응답 수</text>
<text x="522" y="482" font-size="16" fill="#0f172a" xml:space="preserve">p50 · p95 · p99</text>
<text x="522" y="508" font-size="16" fill="#0f172a" xml:space="preserve">성공(202)만의 p95</text>
<text x="522" y="534" font-size="16" fill="#0f172a" xml:space="preserve">202 수 (워밍업 포함)</text>
<line x1="195" y1="644" x2="195" y2="680" stroke="#047857" stroke-width="2.2" marker-end="url(#mg)"/>
<polyline points="315,644 315,662 565,662 565,680" fill="none" stroke="#b91c1c" stroke-width="2.2" marker-end="url(#mr)"/>
<rect x="20" y="680" width="350" height="88" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
<text x="32" y="706" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">통과</text>
<text x="32" y="729" font-size="16" fill="#0f172a" xml:space="preserve">결과 .json 을 집계에 쓴다</text>
<text x="32" y="752" font-size="16" fill="#0f172a" xml:space="preserve">(25회 모두 통과)</text>
<rect x="390" y="680" width="350" height="88" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.6"/>
<text x="402" y="706" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">하나라도 어긋남 · 중단</text>
<text x="402" y="729" font-size="16" fill="#0f172a" xml:space="preserve">결과를 .json.invalid 로 바꾼다</text>
<text x="402" y="752" font-size="16" fill="#0f172a" xml:space="preserve">summarize.sh 가 읽지 않는다</text>
<text x="20" y="806" font-size="16" fill="#64748b" xml:space="preserve">근거: load/run.sh, load/verify.sql, docs/perf/p4-2-lock-comparison.md</text>
</svg>