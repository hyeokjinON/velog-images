<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 634" width="760" height="634" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<title>JSON 안의 줄바꿈은 역슬래시와 n 두 글자라, 옛 경계 식은 그 뒤의 계좌를 가리지도 세지도 못했다</title>
<defs><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="ms" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="mx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<rect width="760" height="634" fill="#ffffff"/>
<text x="20" y="34" font-size="21" fill="#0f172a" font-weight="700" xml:space="preserve">고치기 전: JSON 줄바꿈 뒤 계좌가</text>
<text x="20" y="62" font-size="21" fill="#0f172a" font-weight="700" xml:space="preserve">가려지지도, 세어지지도 않았다</text>
<text x="20" y="96" font-size="16" fill="#475569" xml:space="preserve">빨강 = 놓친 곳. 계좌번호는 설명용 예시 값</text>
<text x="20" y="119" font-size="16" fill="#475569" xml:space="preserve">옛 경계 = 영문 · 숫자에 붙지 않은 숫자만 계좌로 본다</text>
<circle cx="34" cy="180" r="13" fill="#334155"/><text x="34" y="186" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle" xml:space="preserve">①</text>
<rect x="60" y="150" width="680" height="68" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.6"/>
<text x="72" y="176" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">① 예외 메시지 (자바 문자열)</text>
<text x="72" y="199" font-size="16" fill="#0f172a" font-family="Consolas, D2Coding, monospace" xml:space="preserve">rows:&lt;줄바꿈&gt;1002123456789</text>
<line x1="400" y1="218" x2="400" y2="242" stroke="#334155" stroke-width="2.2" marker-end="url(#ms)"/>
<circle cx="34" cy="274" r="13" fill="#334155"/><text x="34" y="280" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle" xml:space="preserve">②</text>
<rect x="60" y="244" width="680" height="92" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.6"/>
<text x="72" y="270" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">② 파일에 적힌 ECS JSON 한 줄</text>
<text x="72" y="293" font-size="16" fill="#0f172a" font-family="Consolas, D2Coding, monospace" xml:space="preserve">"message":"rows:\n1002123456789"</text>
<text x="72" y="316" font-size="16" fill="#0f172a" xml:space="preserve">줄바꿈이 역슬래시 + n, 두 글자가 된다</text>
<line x1="400" y1="336" x2="400" y2="360" stroke="#334155" stroke-width="2.2" marker-end="url(#ms)"/>
<circle cx="34" cy="392" r="13" fill="#b91c1c"/><text x="34" y="398" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle" xml:space="preserve">③</text>
<rect x="60" y="362" width="680" height="92" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.6"/>
<text x="72" y="388" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">③ 옛 가리기 식: 숫자 바로 앞 글자가 영문 n</text>
<text x="72" y="411" font-size="16" fill="#0f172a" xml:space="preserve">→ 계좌로 보지 않는다 → 그대로 Loki 로</text>
<text x="72" y="434" font-size="16" fill="#0f172a" font-family="Consolas, D2Coding, monospace" xml:space="preserve">"message":"rows:\n1002123456789"</text>
<line x1="400" y1="454" x2="400" y2="478" stroke="#b91c1c" stroke-width="2.2" marker-end="url(#mr)"/>
<circle cx="34" cy="510" r="13" fill="#b91c1c"/><text x="34" y="516" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle" xml:space="preserve">④</text>
<rect x="60" y="480" width="680" height="68" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.6"/>
<text x="72" y="506" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">④ 금지 패턴 검사도 같은 경계 식</text>
<text x="72" y="529" font-size="16" fill="#0f172a" xml:space="preserve">→ 이 줄을 못 본다 → 결과 0줄 → 통과</text>
<text x="20" y="582" font-size="16" fill="#64748b" xml:space="preserve">가리기와 검사가 같은 가정을 쓰면 같이 틀린다.</text>
<text x="20" y="606" font-size="16" fill="#64748b" xml:space="preserve">0 이 '없어서 0' 이 아니라 '못 봐서 0' 이었다.</text>
</svg>