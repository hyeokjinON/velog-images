<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 840" width="760" height="840" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<title>로그 한 줄이 앱의 표준 출력에서 노드 파일, Alloy, Loki 를 거쳐 Grafana 화면에 나오기까지</title>
<defs><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="ms" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="mx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<rect width="760" height="840" fill="#ffffff"/>
<text x="20" y="34" font-size="21" fill="#0f172a" font-weight="700" xml:space="preserve">로그 한 줄이 지나는 길:</text>
<text x="20" y="62" font-size="21" fill="#0f172a" font-weight="700" xml:space="preserve">앱은 표준 출력에만 쓰고, 모으고 가리는 일은 Alloy 가</text>
<text x="20" y="96" font-size="16" fill="#475569" xml:space="preserve">파랑 = 앱과 사람, 회색 = 노드 디스크, 초록 = 수집기,</text>
<text x="20" y="119" font-size="16" fill="#475569" xml:space="preserve">주황 = 저장소. 번호 순서대로 읽는다</text>
<circle cx="34" cy="180" r="13" fill="#1d4ed8"/><text x="34" y="186" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle" xml:space="preserve">①</text>
<rect x="60" y="150" width="680" height="92" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="72" y="176" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">① 앱 (api 2대 · 게이트웨이 2대)</text>
<text x="72" y="199" font-size="16" fill="#0f172a" xml:space="preserve">표준 출력에만 쓴다. Loki 주소를 모른다</text>
<text x="72" y="222" font-size="16" fill="#0f172a" xml:space="preserve">kind 에서는 줄마다 JSON(ECS) 한 줄</text>
<line x1="400" y1="242" x2="400" y2="270" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#mb)"/>
<circle cx="34" cy="302" r="13" fill="#334155"/><text x="34" y="308" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle" xml:space="preserve">②</text>
<rect x="60" y="272" width="680" height="92" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.6"/>
<text x="72" y="298" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">② 노드 디스크의 파일</text>
<text x="72" y="321" font-size="16" fill="#0f172a" font-family="Consolas, D2Coding, monospace" xml:space="preserve">/var/log/pods/&lt;Pod&gt;/&lt;컨테이너&gt;/0.log</text>
<text x="72" y="344" font-size="16" fill="#0f172a" xml:space="preserve">containerd 가 적는다. 앱이 죽어도 줄은 남는다</text>
<line x1="400" y1="364" x2="400" y2="392" stroke="#334155" stroke-width="2.2" marker-end="url(#ms)"/>
<circle cx="34" cy="424" r="13" fill="#047857"/><text x="34" y="430" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle" xml:space="preserve">③</text>
<rect x="60" y="394" width="680" height="116" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
<text x="72" y="420" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">③ Alloy (노드마다 1개, DaemonSet)</text>
<text x="72" y="443" font-size="16" fill="#0f172a" xml:space="preserve">가. level 과 trace_id 를 먼저 꺼낸다</text>
<text x="72" y="466" font-size="16" fill="#0f172a" xml:space="preserve">나. 라벨은 셋만 남긴다</text>
<text x="72" y="489" font-size="16" fill="#0f172a" xml:space="preserve">다. 그 다음 계좌 · 1원인증 코드 · 금액을 가린다</text>
<line x1="400" y1="510" x2="400" y2="538" stroke="#047857" stroke-width="2.2" marker-end="url(#mg)"/>
<circle cx="34" cy="570" r="13" fill="#c2410c"/><text x="34" y="576" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle" xml:space="preserve">④</text>
<rect x="60" y="540" width="680" height="92" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.6"/>
<text x="72" y="566" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">④ Loki (제어 노드 1대, 보관 2일)</text>
<text x="72" y="589" font-size="16" fill="#0f172a" xml:space="preserve">라벨 namespace · app · container 로만 색인</text>
<text x="72" y="612" font-size="16" fill="#0f172a" xml:space="preserve">ruler 가 1분마다 ErrorLogSurge 식을 계산</text>
<line x1="400" y1="632" x2="400" y2="660" stroke="#c2410c" stroke-width="2.2" marker-end="url(#mo)"/>
<circle cx="34" cy="692" r="13" fill="#1d4ed8"/><text x="34" y="698" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle" xml:space="preserve">⑤</text>
<rect x="60" y="662" width="680" height="92" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="72" y="688" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">⑤ Grafana Explore (사람)</text>
<text x="72" y="711" font-size="16" fill="#0f172a" font-family="Consolas, D2Coding, monospace" xml:space="preserve">{namespace="bank-transfer"} | trace_id="…"</text>
<text x="72" y="734" font-size="16" fill="#0f172a" xml:space="preserve">줄의 trace_id 를 누르면 Tempo 의 trace 로</text>
<text x="20" y="788" font-size="16" fill="#64748b" xml:space="preserve">Loki 나 Alloy 가 죽어도 ① 은 표준 출력에 쓰기만 하므로</text>
<text x="20" y="812" font-size="16" fill="#64748b" xml:space="preserve">출금은 그대로 처리된다.</text>
</svg>