<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 856" width="760" height="856" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<title>가상 스레드 한 장으로 보기: 설정 한 줄로 웹은 400건/s 가 됐지만, 냉시동 교착 때문에 Java 21 에서는 끈다</title>
<defs><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="ms" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="mx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<rect width="760" height="856" fill="#ffffff"/>
<text x="20" y="34" font-size="21" fill="#0f172a" font-weight="700" xml:space="preserve">가상 스레드 한 장으로 보기:</text>
<text x="20" y="62" font-size="21" fill="#0f172a" font-weight="700" xml:space="preserve">설정 한 줄로 웹은 빨라졌지만 기본은 끈다</text>
<text x="20" y="96" font-size="16" fill="#475569" xml:space="preserve">파랑 = 문제와 설정, 초록 = 효과, 주황 = 한계, 빨강 = 위험</text>
<text x="20" y="119" font-size="16" fill="#475569" xml:space="preserve">수치는 한 PC 의 상대 비교다 (칸마다 3회 중앙값)</text>
<rect x="20" y="148" width="720" height="90" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="32" y="174" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">① 문제: 은행을 기다리는 동안 스레드가 묶인다</text>
<text x="32" y="197" font-size="16" fill="#0f172a" xml:space="preserve">1원인증 한 건 = 은행 두 번 호출(0.5초 × 2) ≈ 1초</text>
<text x="32" y="220" font-size="16" fill="#0f172a" xml:space="preserve">Tomcat 스레드 200개 → 천장 약 196건/s</text>
<line x1="380" y1="238" x2="380" y2="272" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#mb)"/>
<rect x="20" y="274" width="720" height="90" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="32" y="300" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">② 설정 한 줄 (업무 코드는 그대로)</text>
<text x="32" y="323" font-size="16" fill="#0f172a" font-family="Consolas, D2Coding, monospace" xml:space="preserve">spring.threads.virtual.enabled=true</text>
<text x="32" y="346" font-size="16" fill="#0f172a" xml:space="preserve">Tomcat 요청 · 앱 실행기 · @Scheduled · Kafka 리스너가 바뀐다</text>
<line x1="200" y1="364" x2="200" y2="398" stroke="#047857" stroke-width="2.2" marker-end="url(#mg)"/>
<line x1="560" y1="364" x2="560" y2="398" stroke="#c2410c" stroke-width="2.2" marker-end="url(#mo)"/>
<rect x="20" y="400" width="350" height="136" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
<text x="32" y="426" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">③ 웹: 천장이 사라졌다</text>
<text x="32" y="449" font-size="16" fill="#0f172a" xml:space="preserve">블로킹, 초당 400건 도착</text>
<text x="32" y="472" font-size="16" fill="#047857" font-weight="700" xml:space="preserve">59.0 → 400.0건/s</text>
<text x="32" y="495" font-size="16" fill="#0f172a" xml:space="preserve">비동기, 초당 800건 도착</text>
<text x="32" y="518" font-size="16" fill="#047857" font-weight="700" xml:space="preserve">495.8 → 800.0건/s</text>
<rect x="390" y="400" width="350" height="136" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.6"/>
<text x="402" y="426" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">④ 컨슈머: 그대로다</text>
<text x="402" y="449" font-size="16" fill="#c2410c" font-weight="700" xml:space="preserve">20.7 → 20.6건/s</text>
<text x="402" y="472" font-size="16" fill="#0f172a" xml:space="preserve">리스너 3개가 한 건씩 처리해</text>
<text x="402" y="495" font-size="16" fill="#0f172a" xml:space="preserve">은행을 동시에 기다리는 수가 3</text>
<text x="402" y="518" font-size="16" fill="#0f172a" xml:space="preserve">동시성은 코드가 만든다</text>
<line x1="380" y1="536" x2="380" y2="570" stroke="#b91c1c" stroke-width="2.2" marker-end="url(#mr)"/>
<rect x="20" y="572" width="720" height="114" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.6"/>
<text x="32" y="598" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">⑤ 위험: 막 뜬 앱에 요청이 몰리면 앱이 통째로 멈춘다</text>
<text x="32" y="621" font-size="16" fill="#0f172a" xml:space="preserve">가상 스레드 켬 4번 중 4번 멈춤, 끔 2번 모두 정상</text>
<text x="32" y="644" font-size="16" fill="#0f172a" xml:space="preserve">Jackson 의 synchronized 에 캐리어 16개가 모두 묶였다</text>
<text x="32" y="667" font-size="16" fill="#0f172a" xml:space="preserve">그런데 JFR 의 pinning 이벤트는 0건이었다</text>
<line x1="380" y1="686" x2="380" y2="720" stroke="#334155" stroke-width="2.2" marker-end="url(#ms)"/>
<rect x="20" y="722" width="720" height="114" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.6"/>
<text x="32" y="748" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">⑥ 판정: Java 21 에서는 기본값을 끈 채로 둔다 (ADR-0014)</text>
<text x="32" y="771" font-size="16" fill="#0f172a" xml:space="preserve">미리 정한 기준 3개 중 "pinning 0건" 이 어긋났다</text>
<text x="32" y="794" font-size="16" fill="#0f172a" xml:space="preserve">운영 기본인 MVC 비동기가 이미 초당 400건을 받는다</text>
<text x="32" y="817" font-size="16" fill="#0f172a" xml:space="preserve">다시 볼 조건: Java 24+ 또는 워밍업 + 동시 호출 상한</text>
</svg>