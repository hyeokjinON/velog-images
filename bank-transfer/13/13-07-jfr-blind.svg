<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 634" width="760" height="634" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<title>JFR 이 교착을 0건으로 본 이유: VirtualThreadPinned 는 모니터를 쥔 채 park 한 경우만, 그것도 park 가 끝날 때 기록된다</title>
<defs><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="ms" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="mx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<rect width="760" height="634" fill="#ffffff"/>
<text x="20" y="34" font-size="21" fill="#0f172a" font-weight="700" xml:space="preserve">JFR pinning 0건이 안전을 뜻하지 않는 이유</text>
<text x="20" y="68" font-size="16" fill="#475569" xml:space="preserve">jdk.VirtualThreadPinned 를 만드는 곳은 (JDK 21)</text>
<text x="20" y="91" font-size="16" fill="#475569" xml:space="preserve">VirtualThread.parkOnCarrierThread 하나, park 가 끝날 때 남는다</text>
<circle cx="34" cy="180" r="13" fill="#b91c1c"/><text x="34" y="186" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle" xml:space="preserve">①</text>
<rect x="60" y="124" width="560" height="114" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.6"/>
<text x="72" y="150" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">synchronized 입장 대기 (교착의 15개)</text>
<text x="72" y="173" font-size="16" fill="#0f172a" xml:space="preserve">park 가 아니므로 이벤트가 아예 안 생긴다</text>
<text x="72" y="196" font-size="16" fill="#0f172a" xml:space="preserve">그래도 캐리어는 붙잡고 있다 (실제 피해)</text>
<text x="72" y="219" font-size="16" fill="#0f172a" xml:space="preserve">볼 곳: jdk.JavaMonitorEnter, 스레드 덤프</text>
<rect x="630" y="124" width="110" height="114" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.6"/>
<text x="642" y="188" font-size="16" fill="#b91c1c" font-weight="700" xml:space="preserve">기록 0</text>
<circle cx="34" cy="310" r="13" fill="#b91c1c"/><text x="34" y="316" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle" xml:space="preserve">②</text>
<rect x="60" y="254" width="560" height="114" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.6"/>
<text x="72" y="280" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">모니터를 쥔 채 park (교착의 1개)</text>
<text x="72" y="303" font-size="16" fill="#0f172a" xml:space="preserve">기록 대상이지만 park 가 끝나야 남는다</text>
<text x="72" y="326" font-size="16" fill="#0f172a" xml:space="preserve">교착이라 끝나지 않는다 → 기록이 없다</text>
<text x="72" y="349" font-size="16" fill="#0f172a" xml:space="preserve">볼 곳: 스레드 덤프의 parkOnCarrierThread</text>
<rect x="630" y="254" width="110" height="114" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.6"/>
<text x="642" y="318" font-size="16" fill="#b91c1c" font-weight="700" xml:space="preserve">기록 0</text>
<circle cx="34" cy="440" r="13" fill="#047857"/><text x="34" y="446" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle" xml:space="preserve">③</text>
<rect x="60" y="384" width="560" height="114" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
<text x="72" y="410" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">정상: synchronized 안에서 잠깐 park</text>
<text x="72" y="433" font-size="16" fill="#0f172a" xml:space="preserve">park 가 끝날 때 기간과 함께 남는다</text>
<text x="72" y="456" font-size="16" fill="#0f172a" xml:space="preserve">V2 대조 테스트가 일부러 만든다 (1 ~ 3건)</text>
<text x="72" y="479" font-size="16" fill="#0f172a" xml:space="preserve">JDK 24+ 에서는 0건이 되어 테스트가 알려 준다</text>
<rect x="630" y="384" width="110" height="114" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
<text x="642" y="448" font-size="16" fill="#047857" font-weight="700" xml:space="preserve">기록됨</text>
<rect x="20" y="522" width="720" height="92" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.6"/>
<text x="32" y="548" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">그래서 이렇게 본다</text>
<text x="32" y="571" font-size="16" fill="#0f172a" xml:space="preserve">pinning 은 VirtualThreadPinned 와 JavaMonitorEnter 를 함께</text>
<text x="32" y="594" font-size="16" fill="#0f172a" xml:space="preserve">멈춘 앱은 JFR 이 아니라 가상 스레드까지 찍는 스레드 덤프로</text>
</svg>