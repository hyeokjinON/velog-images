<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 722" width="760" height="722" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<title>웹 1원인증 처리량: 끈 판은 스레드 천장에서 무너지고, 가상 스레드를 켠 판은 도착률을 모두 따라간다</title>
<defs><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="ms" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="mx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<rect width="760" height="722" fill="#ffffff"/>
<text x="20" y="34" font-size="21" fill="#0f172a" font-weight="700" xml:space="preserve">웹 1원인증 처리량 (건/s, 클수록 좋다)</text>
<text x="20" y="68" font-size="16" fill="#475569" xml:space="preserve">초록 = 도착률을 다 처리, 빨강 = 못 따라가 무너짐</text>
<text x="20" y="91" font-size="16" fill="#475569" xml:space="preserve">은행 지연 500ms, 칸마다 3회 중앙값, 점선 = 도착률</text>
<text x="20" y="134" font-size="18" fill="#0f172a" font-weight="700" xml:space="preserve">① 초당 400건 도착</text>
<text x="20" y="182" font-size="16" fill="#0f172a" xml:space="preserve">블로킹 (끔)</text>
<rect x="190" y="162" width="75.2" height="30" rx="4" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.6"/>
<text x="273.225" y="183" font-size="16" fill="#b91c1c" font-weight="700" xml:space="preserve">59.0  시간 초과 4,849건</text>
<text x="20" y="226" font-size="16" fill="#0f172a" xml:space="preserve">블로킹 + VT</text>
<rect x="190" y="206" width="510.0" height="30" rx="4" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
<text x="200" y="227" font-size="16" fill="#047857" font-weight="700" xml:space="preserve">400.0</text>
<text x="20" y="270" font-size="16" fill="#0f172a" xml:space="preserve">비동기 (끔)</text>
<rect x="190" y="250" width="509.7" height="30" rx="4" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
<text x="200" y="271" font-size="16" fill="#047857" font-weight="700" xml:space="preserve">399.8</text>
<text x="20" y="314" font-size="16" fill="#0f172a" xml:space="preserve">비동기 + VT</text>
<rect x="190" y="294" width="508.9" height="30" rx="4" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
<text x="200" y="315" font-size="16" fill="#047857" font-weight="700" xml:space="preserve">399.1</text>
<text x="20" y="358" font-size="16" fill="#0f172a" xml:space="preserve">코루틴 (P6-2)</text>
<rect x="190" y="338" width="509.6" height="30" rx="4" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
<text x="200" y="359" font-size="16" fill="#047857" font-weight="700" xml:space="preserve">399.7</text>
<line x1="700" y1="156" x2="700" y2="376" stroke="#334155" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="700" y="152" font-size="16" fill="#475569" font-weight="700" text-anchor="middle" xml:space="preserve">400</text>
<text x="20" y="416" font-size="18" fill="#0f172a" font-weight="700" xml:space="preserve">② 초당 800건 도착</text>
<text x="20" y="464" font-size="16" fill="#0f172a" xml:space="preserve">블로킹 + VT</text>
<rect x="190" y="444" width="510.0" height="30" rx="4" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
<text x="200" y="465" font-size="16" fill="#047857" font-weight="700" xml:space="preserve">800.0</text>
<text x="20" y="508" font-size="16" fill="#0f172a" xml:space="preserve">비동기 (끔)</text>
<rect x="190" y="488" width="316.1" height="30" rx="4" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.6"/>
<text x="200" y="509" font-size="16" fill="#b91c1c" font-weight="700" xml:space="preserve">495.8  p99 4,228ms</text>
<text x="20" y="552" font-size="16" fill="#0f172a" xml:space="preserve">비동기 + VT</text>
<rect x="190" y="532" width="510.0" height="30" rx="4" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
<text x="200" y="553" font-size="16" fill="#047857" font-weight="700" xml:space="preserve">800.0</text>
<text x="20" y="596" font-size="16" fill="#0f172a" xml:space="preserve">코루틴 (P6-2)</text>
<rect x="190" y="576" width="510.0" height="30" rx="4" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
<text x="200" y="597" font-size="16" fill="#047857" font-weight="700" xml:space="preserve">800.0</text>
<line x1="700" y1="438" x2="700" y2="614" stroke="#334155" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="700" y="434" font-size="16" fill="#475569" font-weight="700" text-anchor="middle" xml:space="preserve">800</text>
<text x="20" y="644" font-size="16" fill="#64748b" xml:space="preserve">끈 판의 천장: 블로킹은 Tomcat 200, 비동기는 뒤처리 실행기 8.</text>
<text x="20" y="668" font-size="16" fill="#64748b" xml:space="preserve">초당 800건에서 블로킹 + VT 는 끈 판을 재지 않았다 (400 에서 이미 무너짐).</text>
<text x="20" y="692" font-size="16" fill="#64748b" xml:space="preserve">VT = 가상 스레드. 코루틴 판은 같은 날 다시 잰 기준선이다.</text>
</svg>