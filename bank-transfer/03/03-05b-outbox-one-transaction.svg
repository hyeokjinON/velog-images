<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 650" width="760" height="650" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<title>채택한 방식: 이체와 처리 신호를 한 트랜잭션에 적고, Kafka 발행은 나중에 한다</title>
<defs><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="ms" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="mx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<rect width="760" height="650" fill="#ffffff"/>
<text x="20" y="34" font-size="21" fill="#0f172a" font-weight="700" xml:space="preserve">채택한 방식: 이체와 처리 신호를 한 트랜잭션에</text>
<text x="20" y="62" font-size="21" fill="#0f172a" font-weight="700" xml:space="preserve">적고, Kafka 발행은 나중에 한다</text>
<text x="20" y="96" font-size="16" fill="#475569" xml:space="preserve">초록 = 안전한 경로, 주황 = 같은 신호가 두 번 나갈 수 있는 곳.</text>
<text x="20" y="119" font-size="16" fill="#475569" xml:space="preserve">② ③ 은 다음 글(P3-2)에서 만든다</text>
<rect x="20" y="140" width="720" height="490" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="36" y="168" font-size="17" fill="#0f172a" font-weight="700" xml:space="preserve">B. 채택: 이체 + 신호를 한 트랜잭션, 발행은 나중에</text>
<rect x="44" y="186" width="672" height="64" rx="8" fill="#ffffff" stroke="#047857" stroke-width="1.6"/>
<text x="56" y="212" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">① [한 트랜잭션] INSERT transfer + INSERT outbox_event</text>
<text x="56" y="235" font-size="16" fill="#065f46" xml:space="preserve">둘 다 성공하거나 둘 다 롤백 → "저장 됐는데 신호 없음" 이 없다</text>
<line x1="199" y1="250" x2="199" y2="274" stroke="#047857" stroke-width="2.2" marker-end="url(#mg)"/>
<rect x="44" y="274" width="310" height="92" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="56" y="300" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">② (P3-2) 폴링 발행기</text>
<text x="56" y="323" font-size="16" fill="#0f172a" xml:space="preserve">0.5초마다 미발행 행을 읽어</text>
<text x="56" y="346" font-size="16" fill="#0f172a" xml:space="preserve">Kafka 로 보낸다</text>
<rect x="406" y="274" width="310" height="92" rx="8" fill="#ffffff" stroke="#047857" stroke-width="1.6"/>
<text x="418" y="300" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">③ (P3-2) Kafka 가 받은 뒤</text>
<text x="418" y="323" font-size="16" fill="#0f172a" xml:space="preserve">published_at 을 기록</text>
<line x1="354" y1="320" x2="406" y2="320" stroke="#047857" stroke-width="2.2" marker-end="url(#mg)"/>
<rect x="44" y="390" width="672" height="92" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.6"/>
<text x="56" y="416" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">③ 을 적기 전에 서버가 죽으면: 같은 신호가 한 번 더 나간다</text>
<text x="56" y="439" font-size="16" fill="#0f172a" xml:space="preserve">= at-least-once (적어도 한 번 전달). 중복은 허용한다</text>
<text x="56" y="462" font-size="16" fill="#0f172a" xml:space="preserve">컨슈머가 "RECEIVED 일 때만" 처리해서 중복을 걸러낸다</text>
<rect x="44" y="506" width="672" height="92" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
<text x="56" y="532" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">결과</text>
<text x="56" y="555" font-size="16" fill="#0f172a" xml:space="preserve">유실 없음 (재발행) + 중복은 컨슈머 조건부 UPDATE 가 흡수</text>
<text x="56" y="578" font-size="16" fill="#0f172a" xml:space="preserve">대가: 발행이 폴링이라 약 0.5초 늦고 빈 폴링 쿼리가 있다</text>
</svg>