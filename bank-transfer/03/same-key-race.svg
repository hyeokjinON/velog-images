<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<title>같은 키 요청 2건이 동시에 왔을 때: 두 번째 INSERT 는 기다렸다가 중복 오류를 받고, 새로 읽어 200 을 돌려준다</title>
<defs><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="ms" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="mx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<rect width="1200" height="800" fill="#ffffff"/>
<text x="24" y="36" font-size="20" fill="#0f172a" font-weight="700" xml:space="preserve">같은 키 요청 2건이 동시에 왔을 때 — 두 번째 요청이 막히는 곳과 돌려받는 것</text>
<text x="24" y="62" font-size="14" fill="#475569" xml:space="preserve">위에서 아래로 시간이 흐른다. 파랑 = 조회, 초록 = 이긴 쪽, 주황 = 기다림, 빨강 = 중복 오류. K = 같은 Idempotency-Key</text>
<rect x="80" y="82" width="240" height="56" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
<text x="200" y="105" font-size="15" fill="#0f172a" font-weight="700" text-anchor="middle" xml:space="preserve">요청 A 처리 스레드</text>
<text x="200" y="127" font-size="14" fill="#0f172a" text-anchor="middle" xml:space="preserve">(먼저 INSERT 한 쪽)</text>
<line x1="200" y1="138" x2="200" y2="700" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
<rect x="480" y="82" width="240" height="56" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.6"/>
<text x="600" y="105" font-size="15" fill="#0f172a" font-weight="700" text-anchor="middle" xml:space="preserve">MySQL</text>
<text x="600" y="127" font-size="14" fill="#0f172a" text-anchor="middle" xml:space="preserve">transfer · outbox_event</text>
<line x1="600" y1="138" x2="600" y2="700" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
<rect x="880" y="82" width="240" height="56" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.6"/>
<text x="1000" y="105" font-size="15" fill="#0f172a" font-weight="700" text-anchor="middle" xml:space="preserve">요청 B 처리 스레드</text>
<text x="1000" y="127" font-size="14" fill="#0f172a" text-anchor="middle" xml:space="preserve">(진 쪽)</text>
<line x1="1000" y1="138" x2="1000" y2="700" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
<line x1="40" y1="150" x2="40" y2="690" stroke="#334155" stroke-width="2.2" marker-end="url(#ms)"/>
<text x="52" y="170" font-size="14" fill="#334155" font-weight="700" xml:space="preserve">시간</text>
<line x1="204" y1="180" x2="596" y2="180" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#mb)"/>
<text x="400.0" y="172" font-size="14" fill="#1d4ed8" text-anchor="middle" xml:space="preserve">SELECT … WHERE key = K → 없음</text>
<circle cx="220" cy="158" r="12" fill="#1d4ed8"/><text x="220" y="163" font-size="14" fill="#ffffff" font-weight="700" text-anchor="middle" xml:space="preserve">①</text>
<line x1="996" y1="180" x2="604" y2="180" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#mb)"/>
<text x="800.0" y="172" font-size="14" fill="#1d4ed8" text-anchor="middle" xml:space="preserve">SELECT … WHERE key = K → 없음</text>
<circle cx="980" cy="158" r="12" fill="#1d4ed8"/><text x="980" y="163" font-size="14" fill="#ffffff" font-weight="700" text-anchor="middle" xml:space="preserve">①</text>
<rect x="435" y="192" width="330" height="20" fill="#ffffff"/>
<text x="600" y="206" font-size="14" fill="#1d4ed8" text-anchor="middle" xml:space="preserve">둘 다 "없음" 을 본다. 아직 아무도 커밋하지 않았다</text>
<line x1="204" y1="262" x2="596" y2="262" stroke="#047857" stroke-width="2.2" marker-end="url(#mg)"/>
<text x="400.0" y="254" font-size="14" fill="#047857" text-anchor="middle" xml:space="preserve">INSERT transfer(K) + INSERT outbox_event</text>
<circle cx="220" cy="240" r="12" fill="#047857"/><text x="220" y="245" font-size="14" fill="#ffffff" font-weight="700" text-anchor="middle" xml:space="preserve">②</text>
<text x="400" y="284" font-size="14" fill="#047857" text-anchor="middle" xml:space="preserve">K 값에 잠금이 걸린다</text>
<line x1="996" y1="330" x2="604" y2="330" stroke="#c2410c" stroke-width="2.2" marker-end="url(#mo)"/>
<text x="800.0" y="322" font-size="14" fill="#c2410c" text-anchor="middle" xml:space="preserve">INSERT transfer(K)</text>
<circle cx="980" cy="308" r="12" fill="#c2410c"/><text x="980" y="313" font-size="14" fill="#ffffff" font-weight="700" text-anchor="middle" xml:space="preserve">③</text>
<rect x="992" y="336" width="16" height="96" fill="#fdba74" stroke="#c2410c" stroke-width="1.4"/>
<text x="1020" y="372" font-size="14" fill="#c2410c" font-weight="700" xml:space="preserve">A 가 끝날 때까지</text>
<text x="1020" y="393" font-size="14" fill="#c2410c" font-weight="700" xml:space="preserve">INSERT 가 기다린다</text>
<line x1="204" y1="390" x2="596" y2="390" stroke="#047857" stroke-width="2.2" marker-end="url(#mg)"/>
<text x="400.0" y="382" font-size="14" fill="#047857" text-anchor="middle" xml:space="preserve">COMMIT</text>
<circle cx="220" cy="368" r="12" fill="#047857"/><text x="220" y="373" font-size="14" fill="#ffffff" font-weight="700" text-anchor="middle" xml:space="preserve">④</text>
<rect x="80" y="410" width="250" height="56" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
<text x="92" y="434" font-size="14" fill="#0f172a" font-weight="700" xml:space="preserve">A 응답: 202 Accepted</text>
<text x="92" y="455" font-size="14" fill="#0f172a" xml:space="preserve">새 이체 id = 7d0c…</text>
<line x1="604" y1="440" x2="988" y2="440" stroke="#b91c1c" stroke-width="2.2" marker-end="url(#mr)"/>
<text x="796.0" y="432" font-size="14" fill="#b91c1c" text-anchor="middle" xml:space="preserve">Duplicate entry 'K' for key uk_transfer_idempotency</text>
<circle cx="578" cy="418" r="12" fill="#b91c1c"/><text x="578" y="423" font-size="14" fill="#ffffff" font-weight="700" text-anchor="middle" xml:space="preserve">⑤</text>
<text x="800" y="466" font-size="14" fill="#b91c1c" text-anchor="middle" xml:space="preserve">B 의 트랜잭션 롤백 (B 의 outbox 행도 없다)</text>
<line x1="996" y1="530" x2="604" y2="530" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#mb)"/>
<text x="800.0" y="522" font-size="14" fill="#1d4ed8" text-anchor="middle" xml:space="preserve">새 트랜잭션: SELECT … WHERE key = K</text>
<circle cx="980" cy="508" r="12" fill="#1d4ed8"/><text x="980" y="513" font-size="14" fill="#ffffff" font-weight="700" text-anchor="middle" xml:space="preserve">⑥</text>
<line x1="604" y1="566" x2="996" y2="566" stroke="#047857" stroke-width="2.2" marker-end="url(#mg)"/>
<text x="800.0" y="558" font-size="14" fill="#047857" text-anchor="middle" xml:space="preserve">A 가 커밋한 행 (id 7d0c…, request_hash)</text>
<rect x="750" y="600" width="420" height="80" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.6"/>
<text x="762" y="624" font-size="14" fill="#0f172a" font-weight="700" xml:space="preserve">⑦ request_hash 비교</text>
<text x="762" y="645" font-size="14" fill="#0f172a" xml:space="preserve">같음 → 200 OK + A 와 같은 id 7d0c…</text>
<text x="762" y="666" font-size="14" fill="#0f172a" xml:space="preserve">다름 → 422 IDEMPOTENCY_KEY_REUSED</text>
<rect x="24" y="712" width="1152" height="70" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.6"/>
<text x="36" y="736" font-size="14" fill="#0f172a" font-weight="700" xml:space="preserve">테스트로 확인한 것 (TransferApiTest, 같은 키 동시 10건)</text>
<text x="36" y="757" font-size="14" fill="#0f172a" xml:space="preserve">응답은 202 한 건과 200 아홉 건이고 id 는 모두 같다. DB 에는 transfer 1행, outbox_event 1행만 남는다.</text>
</svg>