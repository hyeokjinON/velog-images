<text x="420" y="257" font-size="15" fill="#065f46" font-family="Consolas, D2Coding, monospace" xml:space="preserve">10000</text>
<text x="496" y="257" font-size="15" fill="#065f46" font-family="Consolas, D2Coding, monospace" xml:space="preserve">RECEIVED</text>
