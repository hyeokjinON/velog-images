<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" width="760" height="600" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<title>요청마다 transfer 와 outbox_event 에 생기는 행 ① ②: 첫 접수 때 1행씩 생기고, 같은 키 재요청에는 바뀌지 않는다</title>
<defs><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="ms" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="mx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<rect width="760" height="600" fill="#ffffff"/>
<text x="20" y="34" font-size="21" fill="#0f172a" font-weight="700" xml:space="preserve">요청마다 transfer 와 outbox_event 에 생기는 행 ① ②:</text>
<text x="20" y="62" font-size="21" fill="#0f172a" font-weight="700" xml:space="preserve">첫 접수 때 1행씩, 같은 키 재요청에는 그대로</text>
<text x="20" y="96" font-size="16" fill="#475569" xml:space="preserve">값은 설명용 예시다 (id 는 줄여 씀). 초록 행 = 새로 생긴 행,</text>
<text x="20" y="119" font-size="16" fill="#475569" xml:space="preserve">회색 행 = 그대로, 빨강 줄 = 롤백되어 남지 않은 행</text>
<rect x="20" y="140" width="720" height="212" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="36" y="166" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">① 첫 요청 (키 fixed-key-001, 1만 원) → 202</text>
<text x="36" y="190" font-size="16" fill="#1d4ed8" xml:space="preserve">두 테이블에 1행씩 생긴다</text>
<text x="36" y="242" font-size="16" fill="#0f172a" font-weight="700" font-family="Consolas, D2Coding, monospace" xml:space="preserve">transfer</text>
