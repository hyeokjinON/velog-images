<line x1="514" y1="276" x2="514" y2="336" stroke="#94a3b8" stroke-width="1"/>
<rect x="20" y="366" width="720" height="212" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="36" y="392" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">② 같은 키로 다시 → 200, 금액만 바꿔 → 422</text>
<text x="36" y="416" font-size="16" fill="#1d4ed8" xml:space="preserve">어느 테이블도 바뀌지 않는다</text>
<text x="36" y="468" font-size="16" fill="#0f172a" font-weight="700" font-family="Consolas, D2Coding, monospace" xml:space="preserve">transfer</text>
