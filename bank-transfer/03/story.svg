<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" width="1200" height="590" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<title>출금 버튼을 두 번 눌렀을 때: 키가 없으면 2건이 저장되고, 같은 키를 다시 보내면 1건만 남는다</title>
<defs><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="ms" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="mx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<rect width="1200" height="590" fill="#ffffff"/>
<text x="24" y="36" font-size="20" fill="#0f172a" font-weight="700" xml:space="preserve">출금 버튼을 두 번 눌렀을 때: 키가 없으면 2건이 저장되고, 같은 키를 다시 보내면 1건만 남는다</text>
<text x="24" y="62" font-size="14" fill="#475569" xml:space="preserve">예를 들어 꾸민 장면이다 (시각은 설명용). 빨강 = 사고가 나는 길, 초록 = 이 단계가 만든 길</text>
<rect x="16" y="86" width="1168" height="226" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="30" y="114" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">A. 키 없이 받으면 (버린 방식)</text>
<rect x="30" y="136" width="206" height="90" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="42" y="160" font-size="14" fill="#0f172a" font-weight="700" xml:space="preserve">① 10:00:00</text>
<text x="42" y="181" font-size="14" fill="#0f172a" xml:space="preserve">사용자가 5만 원</text>
<text x="42" y="202" font-size="14" fill="#0f172a" xml:space="preserve">출금 버튼을 누른다</text>
<line x1="236" y1="181" x2="260" y2="181" stroke="#334155" stroke-width="2.2" marker-end="url(#ms)"/>
<rect x="260" y="136" width="206" height="90" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
<text x="272" y="160" font-size="14" fill="#0f172a" font-weight="700" xml:space="preserve">② 서버가 이체 1번 저장</text>
<text x="272" y="181" font-size="14" fill="#0f172a" xml:space="preserve">응답이 네트워크에서</text>
<text x="272" y="202" font-size="14" fill="#0f172a" xml:space="preserve">늦어 화면이 멈춘다</text>
<line x1="466" y1="181" x2="490" y2="181" stroke="#334155" stroke-width="2.2" marker-end="url(#ms)"/>
<rect x="490" y="136" width="206" height="90" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="502" y="160" font-size="14" fill="#0f172a" font-weight="700" xml:space="preserve">③ 10:00:05</text>
<text x="502" y="181" font-size="14" fill="#0f172a" xml:space="preserve">사용자가 같은 버튼을</text>
<text x="502" y="202" font-size="14" fill="#0f172a" xml:space="preserve">다시 누른다</text>
<line x1="696" y1="181" x2="720" y2="181" stroke="#334155" stroke-width="2.2" marker-end="url(#ms)"/>
<rect x="720" y="136" width="206" height="90" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
<text x="732" y="160" font-size="14" fill="#0f172a" font-weight="700" xml:space="preserve">④ 서버는 처음 보는</text>
<text x="732" y="181" font-size="14" fill="#0f172a" xml:space="preserve">요청으로 알고</text>
<text x="732" y="202" font-size="14" fill="#0f172a" xml:space="preserve">이체 2번을 저장한다</text>
<line x1="926" y1="181" x2="950" y2="181" stroke="#334155" stroke-width="2.2" marker-end="url(#ms)"/>
<rect x="950" y="136" width="206" height="90" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.6"/>
<text x="962" y="160" font-size="14" fill="#0f172a" font-weight="700" xml:space="preserve">결과: 출금 2건</text>
<text x="962" y="181" font-size="14" fill="#0f172a" xml:space="preserve">5만 원이 두 번</text>
<text x="962" y="202" font-size="14" fill="#0f172a" xml:space="preserve">나간다 (10만 원)</text>
<text x="30" y="258" font-size="14" fill="#b91c1c" xml:space="preserve">서버가 키를 모르면 "같은 요청을 또 보냈다" 와 "5만 원을 한 번 더 보내고 싶다" 를 구분할 수 없다</text>
<text x="30" y="282" font-size="14" fill="#7f1d1d" xml:space="preserve">본문이 같으면 중복으로 보는 방법은 일부러 두 번 보내는 정상 출금까지 막는다</text>
<rect x="16" y="330" width="1168" height="226" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="30" y="358" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">B. 같은 Idempotency-Key 를 다시 보내면 (이 단계)</text>
<rect x="30" y="380" width="206" height="90" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="42" y="404" font-size="14" fill="#0f172a" font-weight="700" xml:space="preserve">① 10:00:00</text>
<text x="42" y="425" font-size="14" fill="#0f172a" xml:space="preserve">앱이 키 K 를 만들어</text>
<text x="42" y="446" font-size="14" fill="#0f172a" xml:space="preserve">요청에 붙인다</text>
<line x1="236" y1="425" x2="260" y2="425" stroke="#334155" stroke-width="2.2" marker-end="url(#ms)"/>
<rect x="260" y="380" width="206" height="90" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
<text x="272" y="404" font-size="14" fill="#0f172a" font-weight="700" xml:space="preserve">② 서버가 이체 1번 저장</text>
<text x="272" y="425" font-size="14" fill="#0f172a" xml:space="preserve">(키 K 와 함께)</text>
<text x="272" y="446" font-size="14" fill="#0f172a" xml:space="preserve">응답이 늦어 화면 멈춤</text>
<line x1="466" y1="425" x2="490" y2="425" stroke="#334155" stroke-width="2.2" marker-end="url(#ms)"/>
<rect x="490" y="380" width="206" height="90" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="502" y="404" font-size="14" fill="#0f172a" font-weight="700" xml:space="preserve">③ 10:00:05</text>
<text x="502" y="425" font-size="14" fill="#0f172a" xml:space="preserve">다시 누르면 앱이</text>
<text x="502" y="446" font-size="14" fill="#0f172a" xml:space="preserve">같은 키 K 로 보낸다</text>
<line x1="696" y1="425" x2="720" y2="425" stroke="#334155" stroke-width="2.2" marker-end="url(#ms)"/>
<rect x="720" y="380" width="206" height="90" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
<text x="732" y="404" font-size="14" fill="#0f172a" font-weight="700" xml:space="preserve">④ 서버: K 는 이미 있고</text>
<text x="732" y="425" font-size="14" fill="#0f172a" xml:space="preserve">내용도 같다 → 새로</text>
<text x="732" y="446" font-size="14" fill="#0f172a" xml:space="preserve">저장하지 않는다</text>
<line x1="926" y1="425" x2="950" y2="425" stroke="#334155" stroke-width="2.2" marker-end="url(#ms)"/>
<rect x="950" y="380" width="206" height="90" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
<text x="962" y="404" font-size="14" fill="#0f172a" font-weight="700" xml:space="preserve">결과: 출금 1건</text>
<text x="962" y="425" font-size="14" fill="#0f172a" xml:space="preserve">200 과 함께</text>
<text x="962" y="446" font-size="14" fill="#0f172a" xml:space="preserve">이체 1번 id 를 돌려준다</text>
<text x="30" y="502" font-size="14" fill="#047857" xml:space="preserve">재시도 때 같은 키를 다시 쓰는 것은 앱의 몫이고, 같은 키를 한 건으로 묶는 것은 서버(DB UNIQUE)의 몫이다</text>
<text x="30" y="526" font-size="14" fill="#065f46" xml:space="preserve">같은 키로 금액을 바꿔 보내면 422 IDEMPOTENCY_KEY_REUSED 로 거절한다</text>
</svg>