<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 880" width="760" height="880" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<title>Instant 하나가 DATETIME 컬럼에 KST 로 적히기까지 거치는 설정 4개</title>
<defs><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="ms" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="mx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<rect width="760" height="880" fill="#ffffff"/>
<text x="20" y="34" font-size="21" fill="#0f172a" font-weight="700" xml:space="preserve">Instant 하나가 DATETIME 컬럼에 KST 로</text>
<text x="20" y="62" font-size="21" fill="#0f172a" font-weight="700" xml:space="preserve">적히기까지 거치는 설정 4개</text>
<text x="20" y="96" font-size="16" fill="#475569" xml:space="preserve">예: 2026-10-20 KST 오전 9시에 접수된 이체. 초록 = 네 설정이 모두</text>
<text x="20" y="119" font-size="16" fill="#475569" xml:space="preserve">있을 때, 빨강 = ④ 가 빠졌을 때 (구현 전 실험에서 본 결과)</text>
<rect x="20" y="140" width="720" height="64" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="32" y="166" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">도메인 (Kotlin) — Instant</text>
<text x="32" y="189" font-size="16" fill="#0f172a" xml:space="preserve">2026-10-20T00:00:00Z (= KST 09:00)</text>
<line x1="380" y1="204" x2="380" y2="230" stroke="#334155" stroke-width="2.2" marker-end="url(#ms)"/>
<rect x="20" y="230" width="720" height="88" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
<text x="32" y="256" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">Hibernate 7</text>
<text x="32" y="279" font-size="16" fill="#0f172a" xml:space="preserve">③ jdbc.time_zone: Asia/Seoul</text>
<text x="32" y="302" font-size="16" fill="#0f172a" xml:space="preserve">④ preferred_instant_jdbc_type: TIMESTAMP</text>
<line x1="380" y1="318" x2="380" y2="344" stroke="#334155" stroke-width="2.2" marker-end="url(#ms)"/>
<rect x="20" y="344" width="720" height="88" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
<text x="32" y="370" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">JDBC 드라이버</text>
<text x="32" y="393" font-size="16" fill="#0f172a" xml:space="preserve">② connectionTimeZone=Asia/Seoul</text>
<text x="32" y="416" font-size="16" fill="#0f172a" xml:space="preserve">forceConnectionTimeZoneToSession=true</text>
<line x1="380" y1="432" x2="380" y2="458" stroke="#334155" stroke-width="2.2" marker-end="url(#ms)"/>
<rect x="20" y="458" width="720" height="64" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
<text x="32" y="484" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">MySQL 서버</text>
<text x="32" y="507" font-size="16" fill="#0f172a" xml:space="preserve">① --default-time-zone=+09:00</text>
<line x1="380" y1="522" x2="380" y2="552" stroke="#334155" stroke-width="2.2" marker-end="url(#ms)"/>
<text x="392" y="543" font-size="16" fill="#334155" xml:space="preserve">컬럼에 적히는 값</text>
<rect x="20" y="552" width="720" height="92" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
<text x="32" y="578" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">네 설정이 모두 있을 때</text>
<text x="32" y="601" font-size="16" fill="#0f172a" xml:space="preserve">transfer.created_at 컬럼 값 = 2026-10-20 09:00:00.000000</text>
<text x="32" y="624" font-size="16" fill="#0f172a" xml:space="preserve">→ KST 벽시계 시각 그대로 적힌다</text>
<rect x="20" y="660" width="720" height="138" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.6"/>
<text x="32" y="686" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">④ 를 빼고 ①②③ 만 두었을 때 (Hibernate 7)</text>
<text x="32" y="709" font-size="16" fill="#0f172a" xml:space="preserve">transfer.created_at 컬럼 값 = 2026-10-20 00:00:00.000000</text>
<text x="32" y="732" font-size="16" fill="#0f172a" xml:space="preserve">→ Instant 를 UTC 로 적어 9시간 어긋난다</text>
<text x="32" y="755" font-size="16" fill="#0f172a" xml:space="preserve">일마감 대사가 KST 날짜로 자르면,</text>
<text x="32" y="778" font-size="16" fill="#0f172a" xml:space="preserve">0시 ~ 9시 사이 거래가 전날로 들어갈 수 있다</text>
<text x="20" y="832" font-size="16" fill="#334155" xml:space="preserve">테스트 JVM 은 -Duser.timezone=UTC 로 고정했다.</text>
<text x="20" y="855" font-size="16" fill="#334155" xml:space="preserve">개발 PC 가 KST 라서 우연히 맞는 경우를 막기 위해서다</text>
</svg>