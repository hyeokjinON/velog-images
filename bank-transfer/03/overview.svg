<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<title>출금 접수 한 장: 중복을 거르고, 이체와 처리 신호를 함께 저장한 뒤 202 를 돌려준다</title>
<defs><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="ms" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="mx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<rect width="1200" height="650" fill="#ffffff"/>
<text x="24" y="36" font-size="20" fill="#0f172a" font-weight="700" xml:space="preserve">출금 접수 한 장: 중복을 거르고, 이체와 처리 신호를 함께 저장한 뒤 202 를 돌려준다</text>
<text x="24" y="62" font-size="14" fill="#475569" xml:space="preserve">파랑 = 요청 · 조회, 초록 = 정상 흐름, 빨강 = 거절, 회색 점선 = 다음 글(P3-2)에서 만드는 부분. 번호 순서대로 읽는다</text>
<rect x="20" y="110" width="160" height="104" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="32" y="134" font-size="14" fill="#0f172a" font-weight="700" xml:space="preserve">사용자 앱</text>
<text x="32" y="155" font-size="14" fill="#0f172a" xml:space="preserve">출금 버튼</text>
<text x="32" y="176" font-size="14" fill="#0f172a" xml:space="preserve">Idempotency-Key</text>
<text x="32" y="197" font-size="14" fill="#0f172a" xml:space="preserve">를 붙여 보낸다</text>
<rect x="220" y="86" width="600" height="506" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.6"/>
<line x1="180" y1="160" x2="240" y2="160" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#mb)"/>
<circle cx="200" cy="140" r="12" fill="#1d4ed8"/><text x="200" y="145" font-size="14" fill="#ffffff" font-weight="700" text-anchor="middle" xml:space="preserve">①</text>
<text x="236" y="110" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">API 서버 — 출금 접수 (P3-1)</text>
<rect x="240" y="126" width="330" height="62" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
<text x="252" y="150" font-size="14" fill="#0f172a" font-weight="700" xml:space="preserve">② 형식 검사</text>
<text x="252" y="171" font-size="14" fill="#0f172a" xml:space="preserve">키 1~64자, 계좌는 숫자 10~16자리</text>
<rect x="240" y="206" width="330" height="62" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
<text x="252" y="230" font-size="14" fill="#0f172a" font-weight="700" xml:space="preserve">③ 같은 키가 이미 있나? (먼저 조회)</text>
<text x="252" y="251" font-size="14" fill="#0f172a" xml:space="preserve">있으면 요청 내용의 해시를 비교한다</text>
<rect x="240" y="286" width="330" height="62" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
<text x="252" y="310" font-size="14" fill="#0f172a" font-weight="700" xml:space="preserve">④ 받는 계좌가 1원인증을 마쳤나?</text>
<text x="252" y="331" font-size="14" fill="#0f172a" xml:space="preserve">VERIFIED 인 계좌만 받는다</text>
<rect x="240" y="366" width="330" height="84" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
<text x="252" y="390" font-size="14" fill="#0f172a" font-weight="700" xml:space="preserve">⑤ 한 트랜잭션으로 저장</text>
<text x="252" y="411" font-size="14" fill="#0f172a" xml:space="preserve">transfer 행 1줄 (status = RECEIVED)</text>
<text x="252" y="432" font-size="14" fill="#0f172a" xml:space="preserve">outbox_event 행 1줄 (처리 신호)</text>
<rect x="240" y="470" width="330" height="62" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
<text x="252" y="494" font-size="14" fill="#0f172a" font-weight="700" xml:space="preserve">⑥ 202 Accepted 를 돌려준다</text>
<text x="252" y="515" font-size="14" fill="#0f172a" xml:space="preserve">은행 결과는 기다리지 않는다</text>
<line x1="405" y1="188" x2="405" y2="206" stroke="#047857" stroke-width="2.2" marker-end="url(#mg)"/>
<line x1="405" y1="268" x2="405" y2="286" stroke="#047857" stroke-width="2.2" marker-end="url(#mg)"/>
<line x1="405" y1="348" x2="405" y2="366" stroke="#047857" stroke-width="2.2" marker-end="url(#mg)"/>
<line x1="405" y1="450" x2="405" y2="470" stroke="#047857" stroke-width="2.2" marker-end="url(#mg)"/>
<rect x="596" y="126" width="208" height="62" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.6"/>
<text x="608" y="150" font-size="14" fill="#0f172a" font-weight="700" xml:space="preserve">400 형식 오류</text>
<text x="608" y="171" font-size="14" fill="#0f172a" xml:space="preserve">키 없음, 계좌 형식 오류 등</text>
<line x1="570" y1="157" x2="596" y2="157" stroke="#b91c1c" stroke-width="2.2" marker-end="url(#mr)"/>
<rect x="596" y="206" width="208" height="62" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="608" y="230" font-size="14" fill="#0f172a" font-weight="700" xml:space="preserve">같은 내용 → 200 기존 건</text>
<text x="608" y="251" font-size="14" fill="#0f172a" xml:space="preserve">다른 내용 → 422</text>
<line x1="570" y1="237" x2="596" y2="237" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#mb)"/>
<rect x="596" y="286" width="208" height="62" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.6"/>
<text x="608" y="310" font-size="14" fill="#0f172a" font-weight="700" xml:space="preserve">422</text>
<text x="608" y="331" font-size="14" fill="#0f172a" xml:space="preserve">ACCOUNT_NOT_VERIFIED</text>
<line x1="570" y1="317" x2="596" y2="317" stroke="#b91c1c" stroke-width="2.2" marker-end="url(#mr)"/>
<polyline points="240,501 100,501 100,216" fill="none" stroke="#047857" stroke-width="2.2" marker-end="url(#mg)"/>
<text x="30" y="530" font-size="14" fill="#047857" font-weight="700" xml:space="preserve">202 + 이체 id</text>
<text x="30" y="551" font-size="14" fill="#047857" xml:space="preserve">(Location 헤더)</text>
<rect x="860" y="100" width="316" height="360" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.6"/>
<text x="876" y="126" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">MySQL</text>
<rect x="876" y="142" width="284" height="104" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="888" y="166" font-size="14" fill="#0f172a" font-weight="700" xml:space="preserve">transfer</text>
<text x="888" y="187" font-size="14" fill="#0f172a" xml:space="preserve">idempotency_key 에 UNIQUE</text>
<text x="888" y="208" font-size="14" fill="#0f172a" xml:space="preserve">→ 같은 키의 두 번째 INSERT 는</text>
<text x="888" y="229" font-size="14" fill="#0f172a" xml:space="preserve">  중복 오류로 거절된다</text>
<rect x="876" y="262" width="284" height="84" rx="8" fill="#ffffff" stroke="#047857" stroke-width="1.6"/>
<text x="888" y="286" font-size="14" fill="#0f172a" font-weight="700" xml:space="preserve">outbox_event</text>
<text x="888" y="307" font-size="14" fill="#0f172a" xml:space="preserve">aggregate_id = 이체 id</text>
<text x="888" y="328" font-size="14" fill="#0f172a" xml:space="preserve">published_at = NULL (아직 안 보냄)</text>
<text x="876" y="376" font-size="14" fill="#065f46" font-weight="700" xml:space="preserve">두 행은 함께 생기거나</text>
<text x="876" y="397" font-size="14" fill="#065f46" font-weight="700" xml:space="preserve">함께 없다 (한 트랜잭션)</text>
<line x1="570" y1="430" x2="860" y2="430" stroke="#047857" stroke-width="2.2" marker-end="url(#mg)"/>
<text x="640" y="422" font-size="14" fill="#047857" xml:space="preserve">INSERT 2번 + COMMIT</text>
<line x1="1018" y1="460" x2="1018" y2="494" stroke="#94a3b8" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#mx)"/>
<rect x="860" y="494" width="316" height="98" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="872" y="518" font-size="14" fill="#0f172a" font-weight="700" xml:space="preserve">다음 글 (P3-2)</text>
<text x="872" y="539" font-size="14" fill="#0f172a" xml:space="preserve">폴링 퍼블리셔가 published_at 이</text>
<text x="872" y="560" font-size="14" fill="#0f172a" xml:space="preserve">NULL 인 행을 읽어 Kafka 로 보낸다</text>
<text x="24" y="630" font-size="14" fill="#64748b" xml:space="preserve">근거: bank-transfer PR #3 (P3-1) — TransferService, JpaTransferStore.saveWithEvent, V1__init.sql</text>
</svg>