<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1190" width="760" height="1190" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<title>출금 접수 한 장: 중복을 거르고, 이체와 처리 신호를 함께 저장한 뒤 202 를 돌려준다</title>
<defs><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="ms" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="mx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<rect width="760" height="1190" fill="#ffffff"/>
<text x="20" y="34" font-size="21" fill="#0f172a" font-weight="700" xml:space="preserve">출금 접수 한 장: 중복을 거르고, 이체와 처리 신호를</text>
<text x="20" y="62" font-size="21" fill="#0f172a" font-weight="700" xml:space="preserve">함께 저장한 뒤 202 를 돌려준다</text>
<text x="20" y="96" font-size="16" fill="#475569" xml:space="preserve">파랑 = 요청 · 조회, 초록 = 정상 흐름, 빨강 = 거절,</text>
<text x="20" y="119" font-size="16" fill="#475569" xml:space="preserve">회색 점선 = 다음 글(P3-2)에서 만드는 부분. 번호 순서대로 읽는다</text>
<rect x="20" y="140" width="720" height="64" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="32" y="166" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">사용자 앱</text>
<text x="32" y="189" font-size="16" fill="#0f172a" xml:space="preserve">출금 버튼을 누르면 Idempotency-Key 를 붙여 보낸다</text>
<rect x="50" y="240" width="690" height="514" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.6"/>
<text x="66" y="268" font-size="17" fill="#0f172a" font-weight="700" xml:space="preserve">API 서버 — 출금 접수 (P3-1)</text>
<line x1="400" y1="204" x2="400" y2="290" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#mb)"/>
<circle cx="426" cy="222" r="13" fill="#1d4ed8"/><text x="426" y="228" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle" xml:space="preserve">①</text>
<rect x="66" y="290" width="380" height="64" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
<text x="78" y="316" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">② 형식 검사</text>
<text x="78" y="339" font-size="16" fill="#0f172a" xml:space="preserve">키 1~64자, 계좌는 숫자 10~16자리</text>
<rect x="66" y="374" width="380" height="64" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
<text x="78" y="400" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">③ 같은 키가 이미 있나? (먼저 조회)</text>
<text x="78" y="423" font-size="16" fill="#0f172a" xml:space="preserve">있으면 요청 내용의 해시를 비교한다</text>
<rect x="66" y="458" width="380" height="64" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
<text x="78" y="484" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">④ 받는 계좌가 1원인증을 마쳤나?</text>
<text x="78" y="507" font-size="16" fill="#0f172a" xml:space="preserve">VERIFIED 인 계좌만 받는다</text>
<rect x="66" y="542" width="380" height="88" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
<text x="78" y="568" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">⑤ 한 트랜잭션으로 저장</text>
<text x="78" y="591" font-size="16" fill="#0f172a" xml:space="preserve">transfer 행 1줄 (status = RECEIVED)</text>
<text x="78" y="614" font-size="16" fill="#0f172a" xml:space="preserve">outbox_event 행 1줄 (처리 신호)</text>
<rect x="66" y="650" width="380" height="88" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
<text x="78" y="676" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">⑥ 202 Accepted 를 돌려준다</text>
<text x="78" y="699" font-size="16" fill="#0f172a" xml:space="preserve">응답: 202 + 이체 id (Location 헤더)</text>
<text x="78" y="722" font-size="16" fill="#0f172a" xml:space="preserve">은행 결과는 기다리지 않는다</text>
<line x1="256" y1="354" x2="256" y2="374" stroke="#047857" stroke-width="2.2" marker-end="url(#mg)"/>
<line x1="256" y1="438" x2="256" y2="458" stroke="#047857" stroke-width="2.2" marker-end="url(#mg)"/>
<line x1="256" y1="522" x2="256" y2="542" stroke="#047857" stroke-width="2.2" marker-end="url(#mg)"/>
<line x1="256" y1="630" x2="256" y2="650" stroke="#047857" stroke-width="2.2" marker-end="url(#mg)"/>
<rect x="476" y="290" width="248" height="64" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.6"/>
<text x="488" y="316" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">400 형식 오류</text>
<text x="488" y="339" font-size="16" fill="#0f172a" xml:space="preserve">키 없음, 계좌 형식 오류 등</text>
<line x1="446" y1="322" x2="476" y2="322" stroke="#b91c1c" stroke-width="2.2" marker-end="url(#mr)"/>
<rect x="476" y="374" width="248" height="64" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="488" y="400" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">같은 내용 → 200 기존 건</text>
<text x="488" y="423" font-size="16" fill="#0f172a" xml:space="preserve">다른 내용 → 422</text>
<line x1="446" y1="406" x2="476" y2="406" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#mb)"/>
<rect x="476" y="458" width="248" height="64" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.6"/>
<text x="488" y="484" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">422</text>
<text x="488" y="507" font-size="16" fill="#0f172a" xml:space="preserve">ACCOUNT_NOT_VERIFIED</text>
<line x1="446" y1="490" x2="476" y2="490" stroke="#b91c1c" stroke-width="2.2" marker-end="url(#mr)"/>
<polyline points="66,694 32,694 32,206" fill="none" stroke="#047857" stroke-width="2.2" marker-end="url(#mg)"/>
<polyline points="446,586 620,586 620,788" fill="none" stroke="#047857" stroke-width="2.2" marker-end="url(#mg)"/>
<text x="462" y="576" font-size="16" fill="#047857" font-weight="700" xml:space="preserve">INSERT 2번 + COMMIT</text>
<rect x="20" y="790" width="720" height="206" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.6"/>
<text x="36" y="818" font-size="17" fill="#0f172a" font-weight="700" xml:space="preserve">MySQL</text>
<rect x="36" y="834" width="336" height="112" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="48" y="860" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">transfer</text>
<text x="48" y="883" font-size="16" fill="#0f172a" xml:space="preserve">idempotency_key 에 UNIQUE</text>
<text x="48" y="906" font-size="16" fill="#0f172a" xml:space="preserve">같은 키의 두 번째 INSERT 는</text>
<text x="48" y="929" font-size="16" fill="#0f172a" xml:space="preserve">중복 오류로 거절된다</text>
<rect x="388" y="834" width="336" height="112" rx="8" fill="#ffffff" stroke="#047857" stroke-width="1.6"/>
<text x="400" y="860" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">outbox_event</text>
<text x="400" y="883" font-size="16" fill="#0f172a" xml:space="preserve">aggregate_id = 이체 id</text>
<text x="400" y="906" font-size="16" fill="#0f172a" xml:space="preserve">published_at = NULL</text>
<text x="400" y="929" font-size="16" fill="#0f172a" xml:space="preserve">(아직 안 보냄)</text>
<text x="36" y="976" font-size="16" fill="#065f46" font-weight="700" xml:space="preserve">두 행은 함께 생기거나 함께 없다 (한 트랜잭션)</text>
<line x1="380" y1="996" x2="380" y2="1030" stroke="#94a3b8" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#mx)"/>
<rect x="20" y="1030" width="720" height="70" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="32" y="1056" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">다음 글 (P3-2)</text>
<text x="32" y="1079" font-size="16" fill="#0f172a" xml:space="preserve">폴링 퍼블리셔가 published_at 이 NULL 인 행을 읽어 Kafka 로 보낸다</text>
<text x="20" y="1140" font-size="16" fill="#64748b" xml:space="preserve">근거: bank-transfer PR #3 (P3-1) — TransferService,</text>
<text x="20" y="1164" font-size="16" fill="#64748b" xml:space="preserve">JpaTransferStore.saveWithEvent, V1__init.sql</text>
</svg>