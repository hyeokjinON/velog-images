<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 790" width="760" height="790" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<title>1원인증 ① ~ ⑦: 성명조회를 보내는 동안 Tomcat 스레드는 풀로 돌아가고, 이름이 다르면 1원을 보내지 않는다</title>
<defs><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="ms" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="mx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<rect width="760" height="790" fill="#ffffff"/>
<text x="20" y="34" font-size="21" fill="#0f172a" font-weight="700" xml:space="preserve">1원인증 ① ~ ⑦: 성명조회 동안 Tomcat 스레드는</text>
<text x="20" y="62" font-size="21" fill="#0f172a" font-weight="700" xml:space="preserve">풀로 돌아가고, 이름이 다르면 1원을 안 보낸다</text>
<text x="20" y="96" font-size="16" fill="#475569" xml:space="preserve">위에서 아래로 시간이 흐른다.</text>
<text x="20" y="119" font-size="16" fill="#475569" xml:space="preserve">파랑 = 요청, 초록 = 응답, 빨강 = 멈추는 곳</text>
<rect x="10" y="140" width="170" height="60" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="95" y="165" font-size="16" fill="#0f172a" font-weight="700" text-anchor="middle" xml:space="preserve">사용자 · Tomcat</text>
<text x="95" y="189" font-size="16" fill="#0f172a" text-anchor="middle" xml:space="preserve">요청 스레드</text>
<line x1="95" y1="200" x2="95" y2="740" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
<rect x="200" y="140" width="170" height="60" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
<text x="285" y="165" font-size="16" fill="#0f172a" font-weight="700" text-anchor="middle" xml:space="preserve">1원인증 서비스</text>
<text x="285" y="189" font-size="16" fill="#0f172a" text-anchor="middle" xml:space="preserve">+ 어댑터</text>
<line x1="285" y1="200" x2="285" y2="740" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
<rect x="390" y="140" width="170" height="60" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
<text x="475" y="165" font-size="16" fill="#0f172a" font-weight="700" text-anchor="middle" xml:space="preserve">게이트웨이</text>
<text x="475" y="189" font-size="16" fill="#0f172a" text-anchor="middle" xml:space="preserve">Netty 루프 1개</text>
<line x1="475" y1="200" x2="475" y2="740" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
<rect x="580" y="140" width="170" height="60" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.6"/>
<text x="665" y="165" font-size="16" fill="#0f172a" font-weight="700" text-anchor="middle" xml:space="preserve">모의 은행</text>
<text x="665" y="189" font-size="16" fill="#0f172a" text-anchor="middle" xml:space="preserve">Netty 서버</text>
<line x1="665" y1="200" x2="665" y2="740" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
<line x1="99" y1="270" x2="281" y2="270" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#mb)"/>
<text x="190.0" y="238" font-size="16" fill="#1d4ed8" text-anchor="middle" xml:space="preserve">POST 받음</text>
<text x="190.0" y="261" font-size="16" fill="#1d4ed8" text-anchor="middle" xml:space="preserve">→ request()</text>
<circle cx="73" cy="270" r="13" fill="#1d4ed8"/><text x="73" y="276" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle" xml:space="preserve">①</text>
<line x1="289" y1="350" x2="471" y2="350" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#mb)"/>
<text x="380.0" y="318" font-size="16" fill="#1d4ed8" text-anchor="middle" xml:space="preserve">inquireHolderName</text>
<text x="380.0" y="341" font-size="16" fill="#1d4ed8" text-anchor="middle" xml:space="preserve">(090, 계좌)</text>
<circle cx="263" cy="350" r="13" fill="#1d4ed8"/><text x="263" y="356" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle" xml:space="preserve">②</text>
<line x1="479" y1="430" x2="661" y2="430" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#mb)"/>
<text x="570.0" y="421" font-size="16" fill="#1d4ed8" text-anchor="middle" xml:space="preserve">0200 NAM #7</text>
<circle cx="453" cy="430" r="13" fill="#1d4ed8"/><text x="453" y="436" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle" xml:space="preserve">③</text>
<rect x="12" y="448" width="166" height="64" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.6"/>
<text x="24" y="474" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">④ future 반환</text>
<text x="24" y="497" font-size="16" fill="#0f172a" xml:space="preserve">스레드는 풀로</text>
<line x1="661" y1="560" x2="479" y2="560" stroke="#047857" stroke-width="2.2" marker-end="url(#mg)"/>
<text x="570.0" y="528" font-size="16" fill="#047857" text-anchor="middle" xml:space="preserve">0210 NAM #7</text>
<text x="570.0" y="551" font-size="16" fill="#047857" text-anchor="middle" xml:space="preserve">예금주 홍길동</text>
<circle cx="687" cy="560" r="13" fill="#047857"/><text x="687" y="566" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle" xml:space="preserve">⑤</text>
<line x1="471" y1="640" x2="289" y2="640" stroke="#047857" stroke-width="2.2" marker-end="url(#mg)"/>
<text x="380.0" y="608" font-size="16" fill="#047857" text-anchor="middle" xml:space="preserve">future 완료</text>
<text x="380.0" y="631" font-size="16" fill="#047857" text-anchor="middle" xml:space="preserve">→ checkHolder</text>
<circle cx="497" cy="640" r="13" fill="#047857"/><text x="497" y="646" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle" xml:space="preserve">⑥</text>
<rect x="196" y="668" width="368" height="64" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.6"/>
<text x="208" y="694" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">⑦ 계좌 없음 404, 이름 다름 422</text>
<text x="208" y="717" font-size="16" fill="#0f172a" xml:space="preserve">이 경우 1원 이체는 시작하지 않는다</text>
<text x="20" y="766" font-size="16" fill="#64748b" xml:space="preserve">이름이 맞으면 그림 1-9b 로 이어진다</text>
</svg>