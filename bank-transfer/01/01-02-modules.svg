<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 720" width="760" height="720" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<title>모듈 5개와 의존 방향: account 는 아무것도 의존하지 않고 apps/api 가 조립한다</title>
<defs><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="ms" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="mx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<rect width="760" height="720" fill="#ffffff"/>
<text x="20" y="34" font-size="21" fill="#0f172a" font-weight="700" xml:space="preserve">모듈 5개와 의존 방향: account 는 아무것도</text>
<text x="20" y="62" font-size="21" fill="#0f172a" font-weight="700" xml:space="preserve">의존하지 않고, apps/api 가 조립한다</text>
<text x="20" y="96" font-size="16" fill="#475569" xml:space="preserve">화살표 = 의존한다(가져다 쓴다). 초록 = 도메인,</text>
<text x="20" y="119" font-size="16" fill="#475569" xml:space="preserve">빨강 = 빌드가 막는 import</text>
<rect x="20" y="150" width="340" height="88" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.6"/>
<text x="32" y="176" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">apps/api (실행)</text>
<text x="32" y="199" font-size="16" fill="#0f172a" xml:space="preserve">REST 컨트롤러 + 조립</text>
<text x="32" y="222" font-size="16" fill="#0f172a" xml:space="preserve">BankGatewayAdapter 가 여기에</text>
<rect x="400" y="150" width="300" height="88" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.6"/>
<text x="412" y="176" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">apps/mock-bank (실행)</text>
<text x="412" y="199" font-size="16" fill="#0f172a" xml:space="preserve">모의 은행 FEP 서버</text>
<text x="412" y="222" font-size="16" fill="#0f172a" xml:space="preserve">같은 전문 규격으로 응답</text>
<rect x="20" y="310" width="340" height="88" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
<text x="32" y="336" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">modules/account</text>
<text x="32" y="359" font-size="16" fill="#0f172a" xml:space="preserve">1원인증 도메인</text>
<text x="32" y="382" font-size="16" fill="#0f172a" xml:space="preserve">BankPort 인터페이스만 안다</text>
<rect x="400" y="310" width="300" height="88" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
<text x="412" y="336" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">modules/bank-gateway</text>
<text x="412" y="359" font-size="16" fill="#0f172a" xml:space="preserve">은행 접속 클라이언트</text>
<text x="412" y="382" font-size="16" fill="#0f172a" xml:space="preserve">폴링 · 재접속 · 응답 매칭</text>
<rect x="400" y="470" width="340" height="112" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
<text x="412" y="496" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">modules/bank-protocol</text>
<text x="412" y="519" font-size="16" fill="#0f172a" xml:space="preserve">전문 모델 + 고정길이 직렬화</text>
<text x="412" y="542" font-size="16" fill="#0f172a" xml:space="preserve">+ Netty 코덱</text>
<text x="412" y="565" font-size="16" fill="#0f172a" xml:space="preserve">(프레임 디코더 · 길이 붙이기)</text>
<rect x="20" y="470" width="340" height="112" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.6"/>
<text x="32" y="496" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">account 에서 Netty 를 쓰면</text>
<text x="32" y="519" font-size="16" fill="#0f172a" xml:space="preserve">dependencies { } 가 비어</text>
<text x="32" y="542" font-size="16" fill="#0f172a" xml:space="preserve">클래스패스에 Netty 가 없다</text>
<text x="32" y="565" font-size="16" fill="#0f172a" xml:space="preserve">→ 컴파일 실패</text>
<line x1="190" y1="238" x2="190" y2="310" stroke="#334155" stroke-width="2.2" marker-end="url(#ms)"/>
<polyline points="330,238 330,272 550,272 550,310" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#ms)"/>
<line x1="550" y1="398" x2="550" y2="470" stroke="#334155" stroke-width="2.2" marker-end="url(#ms)"/>
<polyline points="700,194 725,194 725,470" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#ms)"/>
<line x1="190" y1="398" x2="190" y2="470" stroke="#b91c1c" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#mr)"/>
<text x="204" y="440" font-size="16" fill="#b91c1c" font-weight="700" xml:space="preserve">import io.netty… ✕</text>
<text x="20" y="626" font-size="16" fill="#0f172a" xml:space="preserve">apps/api 가 account 와 bank-gateway 를 함께 가져와, BankPort 의</text>
<text x="20" y="650" font-size="16" fill="#0f172a" xml:space="preserve">구현(어댑터)으로 둘을 잇는다. 도메인은 Netty 를 끝까지 모른다.</text>
<text x="20" y="690" font-size="16" fill="#64748b" xml:space="preserve">근거: settings.gradle.kts, modules/account/build.gradle.kts, ADR-0001</text>
</svg>