<rect width="760" height="640" fill="#ffffff"/>
<text x="20" y="34" font-size="21" fill="#0f172a" font-weight="700" xml:space="preserve">20바이트 예금주 칸에 한글 이름을 넣을 때: 바이트로</text>
<text x="20" y="62" font-size="21" fill="#0f172a" font-weight="700" xml:space="preserve">자르면 깨지고, 글자 단위로 줄이면 온전하다</text>
<text x="20" y="96" font-size="16" fill="#475569" xml:space="preserve">칸 하나 = 1바이트. EUC-KR 에서 한글은 2칸, 영문 · 공백은 1칸.</text>
<text x="20" y="119" font-size="16" fill="#475569" xml:space="preserve">초록 = 온전한 한글, 회색 = 공백 채움, 빨강 = 깨진 바이트</text>
<text x="20" y="174" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">① "홍길동" — 3글자지만 6바이트. 남는 14칸은 공백</text>
