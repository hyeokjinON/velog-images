<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 830" width="760" height="830" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<title>TCP 로 받은 바이트를 전문 단위로 자르는 네 경우</title>
<defs><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="ms" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="mx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<rect width="760" height="830" fill="#ffffff"/>
<text x="20" y="34" font-size="21" fill="#0f172a" font-weight="700" xml:space="preserve">TCP 로 받은 바이트를 전문 단위로 자르는 네 경우</text>
<text x="20" y="68" font-size="16" fill="#475569" xml:space="preserve">위 줄 = 소켓에서 한 번에 읽은 바이트, 아래 = 디코더가 내놓는 것.</text>
<text x="20" y="91" font-size="16" fill="#475569" xml:space="preserve">성명조회 요청 하나 = 길이 4 + 본문 52 = 56바이트</text>
<text x="20" y="156" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">① 정상: 한 번에 56바이트</text>
<text x="20" y="196" font-size="16" fill="#475569" xml:space="preserve">읽기</text>
<rect x="90" y="170" width="56" height="40" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="118.0" y="196" font-size="15" fill="#0f172a" font-family="Consolas, D2Coding, monospace" text-anchor="middle" xml:space="preserve">0052</text>
<rect x="146" y="170" width="260" height="40" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
<text x="276.0" y="196" font-size="15" fill="#0f172a" text-anchor="middle" xml:space="preserve">본문 52바이트</text>
<text x="20" y="240" font-size="16" fill="#047857" xml:space="preserve">→ 프레임 1개: 길이 4바이트를 떼어 낸 본문 52바이트</text>
<text x="20" y="290" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">② 쪼개져 옴: 10바이트, 이어서 46바이트</text>
<text x="20" y="330" font-size="16" fill="#475569" xml:space="preserve">읽기 1</text>
<rect x="90" y="304" width="56" height="40" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="118.0" y="330" font-size="15" fill="#0f172a" font-family="Consolas, D2Coding, monospace" text-anchor="middle" xml:space="preserve">0052</text>
<rect x="146" y="304" width="30" height="40" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
<text x="161.0" y="330" font-size="15" fill="#0f172a" font-family="Consolas, D2Coding, monospace" text-anchor="middle" xml:space="preserve">6</text>
<text x="190" y="330" font-size="16" fill="#c2410c" xml:space="preserve">누적 10 &lt; 56 → 아직 내놓지 않는다</text>
<text x="20" y="380" font-size="16" fill="#475569" xml:space="preserve">읽기 2</text>
<rect x="176" y="354" width="230" height="40" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
<text x="291.0" y="380" font-size="15" fill="#0f172a" text-anchor="middle" xml:space="preserve">본문 나머지 46바이트</text>
<text x="20" y="424" font-size="16" fill="#047857" xml:space="preserve">→ 누적 56바이트가 되는 순간 프레임 1개 (본문 52바이트)</text>
<text x="20" y="474" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">③ 붙어 옴: 한 번에 112바이트 (전문 2개)</text>
<text x="20" y="514" font-size="16" fill="#475569" xml:space="preserve">읽기</text>
<rect x="90" y="488" width="56" height="40" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="118.0" y="514" font-size="15" fill="#0f172a" font-family="Consolas, D2Coding, monospace" text-anchor="middle" xml:space="preserve">0052</text>
<rect x="146" y="488" width="260" height="40" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
<text x="276.0" y="514" font-size="15" fill="#0f172a" text-anchor="middle" xml:space="preserve">본문 52바이트</text>
<rect x="406" y="488" width="56" height="40" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="434.0" y="514" font-size="15" fill="#0f172a" font-family="Consolas, D2Coding, monospace" text-anchor="middle" xml:space="preserve">0052</text>
<rect x="462" y="488" width="260" height="40" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
<text x="592.0" y="514" font-size="15" fill="#0f172a" text-anchor="middle" xml:space="preserve">본문 52바이트</text>
<text x="20" y="558" font-size="16" fill="#047857" xml:space="preserve">→ 길이를 따라 각각 잘라 프레임 2개</text>
<text x="20" y="608" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">④ 길이 자리가 숫자가 아님 (예: "00A2")</text>
<text x="20" y="648" font-size="16" fill="#475569" xml:space="preserve">읽기</text>
<rect x="90" y="622" width="56" height="40" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/>
<text x="118.0" y="648" font-size="15" fill="#0f172a" font-family="Consolas, D2Coding, monospace" text-anchor="middle" xml:space="preserve">00A2</text>
<rect x="146" y="622" width="260" height="40" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
<text x="276.0" y="648" font-size="15" fill="#0f172a" text-anchor="middle" xml:space="preserve">어디까지가 한 전문인지 모른다</text>
<text x="20" y="692" font-size="16" fill="#b91c1c" xml:space="preserve">→ CorruptedFrameException → 연결을 끊고 재접속한다</text>
<text x="20" y="716" font-size="16" fill="#b91c1c" xml:space="preserve">다음 전문의 시작을 알 수 없어서 이어 읽지 않는다</text>
<text x="20" y="776" font-size="16" fill="#64748b" xml:space="preserve">근거: AsciiLengthFieldFrameDecoder, BankCodecTest (②는 10바이트에서</text>
<text x="20" y="800" font-size="16" fill="#64748b" xml:space="preserve">쪼갠 테스트와 같은 모양)</text>
</svg>