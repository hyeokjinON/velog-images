<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 790" width="760" height="790" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<title>채널 파이프라인: 들어오는 전문은 아래에서 위로, 나가는 전문은 위에서 아래로 지난다</title>
<defs><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="ms" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="mx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<rect width="760" height="790" fill="#ffffff"/>
<text x="20" y="34" font-size="21" fill="#0f172a" font-weight="700" xml:space="preserve">채널 파이프라인: 들어오는 전문은 아래에서 위로,</text>
<text x="20" y="62" font-size="21" fill="#0f172a" font-weight="700" xml:space="preserve">나가는 전문은 위에서 아래로 지난다</text>
<text x="20" y="96" font-size="16" fill="#475569" xml:space="preserve">파랑 = 들어올 때(은행 → 우리), 초록 = 나갈 때(우리 → 은행).</text>
<text x="20" y="119" font-size="16" fill="#475569" xml:space="preserve">속이 빈 원 = 그 방향에서는 건너뛴다</text>
<rect x="150" y="160" width="460" height="64" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
<text x="162" y="186" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">비즈니스 핸들러 (게이트웨이)</text>
<text x="162" y="209" font-size="16" fill="#0f172a" xml:space="preserve">send() 가 쓰고 channelRead0 이 받는다</text>
<rect x="150" y="274" width="460" height="64" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
<text x="162" y="300" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">messageCodec — @Sharable</text>
<text x="162" y="323" font-size="16" fill="#0f172a" xml:space="preserve">객체 ↔ 바이트 (sealed + when)</text>
<rect x="150" y="388" width="460" height="64" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
<text x="162" y="414" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">lengthPrepender — @Sharable</text>
<text x="162" y="437" font-size="16" fill="#0f172a" xml:space="preserve">나갈 때만: 앞에 "0052" 를 붙인다</text>
<rect x="150" y="502" width="460" height="64" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.6"/>
<text x="162" y="528" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">frameDecoder — 채널마다 새로</text>
<text x="162" y="551" font-size="16" fill="#0f172a" xml:space="preserve">들어올 때만: 길이만큼 모아 자른다</text>
<rect x="150" y="616" width="460" height="56" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.6"/>
<text x="162" y="642" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">소켓 (TCP)</text>
<line x1="110" y1="648" x2="110" y2="186" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#mb)"/>
<line x1="650" y1="186" x2="650" y2="648" stroke="#047857" stroke-width="2.2" marker-end="url(#mg)"/>
<line x1="110" y1="306.0" x2="150" y2="306.0" stroke="#1d4ed8" stroke-width="2"/>
<circle cx="110" cy="306.0" r="7" fill="#1d4ed8"/>
<line x1="650" y1="306.0" x2="610" y2="306.0" stroke="#047857" stroke-width="2"/>
<circle cx="650" cy="306.0" r="7" fill="#047857"/>
<line x1="110" y1="420.0" x2="150" y2="420.0" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="4 4"/>
<circle cx="110" cy="420.0" r="7" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
<line x1="650" y1="420.0" x2="610" y2="420.0" stroke="#047857" stroke-width="2"/>
<circle cx="650" cy="420.0" r="7" fill="#047857"/>
<line x1="110" y1="534.0" x2="150" y2="534.0" stroke="#1d4ed8" stroke-width="2"/>
<circle cx="110" cy="534.0" r="7" fill="#1d4ed8"/>
<line x1="650" y1="534.0" x2="610" y2="534.0" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="4 4"/>
<circle cx="650" cy="534.0" r="7" fill="#ffffff" stroke="#047857" stroke-width="2"/>
<text x="160" y="255" font-size="16" fill="#1d4ed8" xml:space="preserve">응답 객체</text>
<text x="600" y="255" font-size="16" fill="#047857" text-anchor="end" xml:space="preserve">요청 객체</text>
<text x="160" y="369" font-size="16" fill="#1d4ed8" xml:space="preserve">본문 52바이트</text>
<text x="600" y="369" font-size="16" fill="#047857" text-anchor="end" xml:space="preserve">본문 52바이트</text>
<text x="160" y="483" font-size="16" fill="#1d4ed8" xml:space="preserve">본문 52바이트</text>
<text x="600" y="483" font-size="16" fill="#047857" text-anchor="end" xml:space="preserve">0052 + 본문 = 56</text>
<text x="160" y="597" font-size="16" fill="#1d4ed8" xml:space="preserve">56바이트</text>
<text x="600" y="597" font-size="16" fill="#047857" text-anchor="end" xml:space="preserve">56바이트</text>
<text x="110" y="706" font-size="16" fill="#1d4ed8" font-weight="700" text-anchor="middle" xml:space="preserve">들어올 때 ↑</text>
<text x="650" y="706" font-size="16" fill="#047857" font-weight="700" text-anchor="middle" xml:space="preserve">나갈 때 ↓</text>
<text x="20" y="744" font-size="16" fill="#64748b" xml:space="preserve">addLast 순서(소켓 쪽부터): frameDecoder → lengthPrepender → messageCodec</text>
<text x="20" y="768" font-size="16" fill="#64748b" xml:space="preserve">근거: BankCodec.addBankCodec</text>
</svg>