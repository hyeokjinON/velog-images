<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 946" width="760" height="946" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<title>보존 배치 한 장: 매일 06:30 에 두 표의 일회성 행만 1,000행씩 나눠 지우고, 금융 기록은 지우지 않는다</title>
<defs><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="ms" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="mx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<rect width="760" height="946" fill="#ffffff"/>
<text x="20" y="34" font-size="21" fill="#0f172a" font-weight="700" xml:space="preserve">보존 배치 한 장: 매일 06:30 에 일회성 행만</text>
<text x="20" y="62" font-size="21" fill="#0f172a" font-weight="700" xml:space="preserve">1,000행씩 나눠 지운다</text>
<text x="20" y="96" font-size="16" fill="#475569" xml:space="preserve">파랑 = 시작과 실행 관리, 초록 = 지우는 단계,</text>
<text x="20" y="119" font-size="16" fill="#475569" xml:space="preserve">빨강 = 지우지 않는 것. 번호 순서대로 읽는다</text>
<rect x="20" y="150" width="720" height="90" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="32" y="176" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">① 시작: 매일 06:30 KST 스케줄 (오늘 날짜)</text>
<text x="32" y="199" font-size="16" fill="#0f172a" font-family="Consolas, D2Coding, monospace" xml:space="preserve">또는 수동 POST /admin/retention-runs?date=</text>
<text x="32" y="222" font-size="16" fill="#0f172a" xml:space="preserve">대사 마지막 회차(06:00) 뒤에 돈다</text>
<line x1="380" y1="240" x2="380" y2="278" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#mb)"/>
<rect x="20" y="280" width="720" height="90" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="32" y="306" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">② 실행기 (DatedJobLauncher, 대사와 공용)</text>
<text x="32" y="329" font-size="16" fill="#0f172a" xml:space="preserve">날짜마다 잡 인스턴스 하나: 끝난 날짜는 409</text>
<text x="32" y="352" font-size="16" fill="#0f172a" xml:space="preserve">같은 날짜가 돌고 있으면 409 RETENTION_RUNNING</text>
<line x1="380" y1="370" x2="380" y2="408" stroke="#047857" stroke-width="2.2" marker-end="url(#mg)"/>
<rect x="20" y="410" width="720" height="113" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
<text x="32" y="436" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">③ 단계 ① purgeOutbox (tasklet, READ COMMITTED)</text>
<text x="32" y="459" font-size="16" fill="#0f172a" font-family="Consolas, D2Coding, monospace" xml:space="preserve">DELETE FROM outbox_event</text>
<text x="32" y="482" font-size="16" fill="#0f172a" font-family="Consolas, D2Coding, monospace" xml:space="preserve">  WHERE published_at &lt; :cutoff LIMIT 1000</text>
<text x="32" y="505" font-size="16" fill="#0f172a" xml:space="preserve">발행 뒤 7일 지난 행. 1,000건이면 한 번 더 부른다</text>
<line x1="380" y1="523" x2="380" y2="561" stroke="#047857" stroke-width="2.2" marker-end="url(#mg)"/>
<rect x="20" y="563" width="720" height="113" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
<text x="32" y="589" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">④ 단계 ② purgeVerifications (같은 모양)</text>
<text x="32" y="612" font-size="16" fill="#0f172a" font-family="Consolas, D2Coding, monospace" xml:space="preserve">DELETE FROM account_verification WHERE status</text>
<text x="32" y="635" font-size="16" fill="#0f172a" font-family="Consolas, D2Coding, monospace" xml:space="preserve">  IN ('SENT','EXPIRED','LOCKED') AND expires_at …</text>
<text x="32" y="658" font-size="16" fill="#0f172a" xml:space="preserve">만료 뒤 30일 지난, VERIFIED 가 아닌 인증</text>
<line x1="380" y1="676" x2="380" y2="714" stroke="#334155" stroke-width="2.2" marker-end="url(#ms)"/>
<rect x="20" y="716" width="720" height="67" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.6"/>
<text x="32" y="742" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">⑤ 결과: 표별 삭제 건수를 BATCH_* 표와 INFO 로그에</text>
<text x="32" y="765" font-size="16" fill="#0f172a" xml:space="preserve">실패하면 WARN 알림(예외 종류만). 다음 날 밀린 행까지 지운다</text>
<rect x="20" y="813" width="720" height="113" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.6"/>
<text x="32" y="839" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">지우지 않는 것 (조건에 걸리지 않거나, 지울 표 목록에 없다)</text>
<text x="32" y="862" font-size="16" fill="#0f172a" xml:space="preserve">미발행 아웃박스 (published_at 이 NULL)</text>
<text x="32" y="885" font-size="16" fill="#0f172a" xml:space="preserve">VERIFIED 1원인증 (출금 접수가 이 행을 본다)</text>
<text x="32" y="908" font-size="16" fill="#0f172a" font-family="Consolas, D2Coding, monospace" xml:space="preserve">transfer · wallet · wallet_ledger · recon_issue …</text>
</svg>