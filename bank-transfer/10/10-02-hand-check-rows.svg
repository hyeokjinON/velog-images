<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 678" width="760" height="678" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<title>손 확인 시드 8행이 보존 배치 뒤 어떻게 되나: 아웃박스 1행, 인증 3행만 지워진다</title>
<defs><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="ms" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="mx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<rect width="760" height="678" fill="#ffffff"/>
<text x="20" y="34" font-size="21" fill="#0f172a" font-weight="700" xml:space="preserve">손 확인 시드 8행: 실행 뒤 남는 행과 지워지는 행</text>
<text x="20" y="68" font-size="16" fill="#475569" xml:space="preserve">시드를 11-04 10:00 에 넣고 실행 날짜 11-04 로 돌렸다고 둔다.</text>
<text x="20" y="91" font-size="16" fill="#475569" xml:space="preserve">빨간 줄 = 지워진 행, 초록 = 남은 행. id 앞의 retention-hand- 는 줄였다</text>
<text x="20" y="128" font-size="18" fill="#0f172a" font-weight="700" xml:space="preserve">outbox_event (보관 7일)</text>
<text x="20" y="154" font-size="16" fill="#475569" font-family="Consolas, D2Coding, monospace" xml:space="preserve">cutoff = 11-04 00:00 − 7일 = 10-28 00:00</text>
<rect x="20" y="170" width="720" height="144" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.6"/>
<text x="36" y="194" font-size="16" fill="#475569" font-weight="700" xml:space="preserve">aggregate_id</text>
<text x="210" y="194" font-size="16" fill="#475569" font-weight="700" xml:space="preserve">published_at</text>
<text x="470" y="194" font-size="16" fill="#475569" font-weight="700" xml:space="preserve">비교</text>
<text x="610" y="194" font-size="16" fill="#475569" font-weight="700" xml:space="preserve">결과</text>
<line x1="20" y1="204" x2="740" y2="204" stroke="#cbd5e1"/>
<text x="36" y="228" font-size="15" fill="#0f172a" font-family="Consolas, D2Coding, monospace" xml:space="preserve">old</text>
<text x="210" y="228" font-size="15" fill="#0f172a" font-family="Consolas, D2Coding, monospace" xml:space="preserve">10-27 10:00</text>
<text x="470" y="228" font-size="15" fill="#0f172a" font-family="Consolas, D2Coding, monospace" xml:space="preserve">&lt; cutoff</text>
<text x="610" y="228" font-size="16" fill="#b91c1c" font-weight="700" xml:space="preserve">삭제</text>
<line x1="32" y1="223" x2="590" y2="223" stroke="#b91c1c" stroke-width="1.8"/>
<text x="36" y="262" font-size="15" fill="#0f172a" font-family="Consolas, D2Coding, monospace" xml:space="preserve">new</text>
<text x="210" y="262" font-size="15" fill="#0f172a" font-family="Consolas, D2Coding, monospace" xml:space="preserve">10-29 10:00</text>
<text x="470" y="262" font-size="15" fill="#0f172a" font-family="Consolas, D2Coding, monospace" xml:space="preserve">&gt;= cutoff</text>
<text x="610" y="262" font-size="16" fill="#047857" font-weight="700" xml:space="preserve">남음</text>
<text x="36" y="296" font-size="15" fill="#0f172a" font-family="Consolas, D2Coding, monospace" xml:space="preserve">pending</text>
<text x="210" y="296" font-size="15" fill="#0f172a" font-family="Consolas, D2Coding, monospace" xml:space="preserve">NULL</text>
<text x="470" y="296" font-size="15" fill="#0f172a" font-family="Consolas, D2Coding, monospace" xml:space="preserve">NULL(모름)</text>
<text x="610" y="296" font-size="16" fill="#047857" font-weight="700" xml:space="preserve">남음</text>
<text x="20" y="354" font-size="18" fill="#0f172a" font-weight="700" xml:space="preserve">account_verification (보관 30일)</text>
<text x="20" y="380" font-size="16" fill="#475569" font-family="Consolas, D2Coding, monospace" xml:space="preserve">cutoff = 11-04 00:00 − 30일 = 10-05 00:00</text>
<rect x="20" y="396" width="720" height="212" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.6"/>
<text x="36" y="420" font-size="16" fill="#475569" font-weight="700" xml:space="preserve">id (status)</text>
<text x="210" y="420" font-size="16" fill="#475569" font-weight="700" xml:space="preserve">expires_at</text>
<text x="470" y="420" font-size="16" fill="#475569" font-weight="700" xml:space="preserve">비교</text>
<text x="610" y="420" font-size="16" fill="#475569" font-weight="700" xml:space="preserve">결과</text>
<line x1="20" y1="430" x2="740" y2="430" stroke="#cbd5e1"/>
<text x="36" y="454" font-size="15" fill="#0f172a" font-family="Consolas, D2Coding, monospace" xml:space="preserve">sent (SENT)</text>
<text x="210" y="454" font-size="15" fill="#0f172a" font-family="Consolas, D2Coding, monospace" xml:space="preserve">10-04 10:00</text>
<text x="470" y="454" font-size="15" fill="#0f172a" font-family="Consolas, D2Coding, monospace" xml:space="preserve">목록 · &lt;</text>
<text x="610" y="454" font-size="16" fill="#b91c1c" font-weight="700" xml:space="preserve">삭제</text>
<line x1="32" y1="449" x2="590" y2="449" stroke="#b91c1c" stroke-width="1.8"/>
<text x="36" y="488" font-size="15" fill="#0f172a" font-family="Consolas, D2Coding, monospace" xml:space="preserve">expired (EXPIRED)</text>
<text x="210" y="488" font-size="15" fill="#0f172a" font-family="Consolas, D2Coding, monospace" xml:space="preserve">10-04 10:00</text>
<text x="470" y="488" font-size="15" fill="#0f172a" font-family="Consolas, D2Coding, monospace" xml:space="preserve">목록 · &lt;</text>
<text x="610" y="488" font-size="16" fill="#b91c1c" font-weight="700" xml:space="preserve">삭제</text>
<line x1="32" y1="483" x2="590" y2="483" stroke="#b91c1c" stroke-width="1.8"/>
<text x="36" y="522" font-size="15" fill="#0f172a" font-family="Consolas, D2Coding, monospace" xml:space="preserve">locked (LOCKED)</text>
<text x="210" y="522" font-size="15" fill="#0f172a" font-family="Consolas, D2Coding, monospace" xml:space="preserve">10-04 10:00</text>
<text x="470" y="522" font-size="15" fill="#0f172a" font-family="Consolas, D2Coding, monospace" xml:space="preserve">목록 · &lt;</text>
<text x="610" y="522" font-size="16" fill="#b91c1c" font-weight="700" xml:space="preserve">삭제</text>
<line x1="32" y1="517" x2="590" y2="517" stroke="#b91c1c" stroke-width="1.8"/>
<text x="36" y="556" font-size="15" fill="#0f172a" font-family="Consolas, D2Coding, monospace" xml:space="preserve">fresh (SENT)</text>
<text x="210" y="556" font-size="15" fill="#0f172a" font-family="Consolas, D2Coding, monospace" xml:space="preserve">10-06 10:00</text>
<text x="470" y="556" font-size="15" fill="#0f172a" font-family="Consolas, D2Coding, monospace" xml:space="preserve">목록 · &gt;=</text>
<text x="610" y="556" font-size="16" fill="#047857" font-weight="700" xml:space="preserve">남음</text>
<text x="36" y="590" font-size="15" fill="#0f172a" font-family="Consolas, D2Coding, monospace" xml:space="preserve">verified (VERIFIED)</text>
<text x="210" y="590" font-size="15" fill="#0f172a" font-family="Consolas, D2Coding, monospace" xml:space="preserve">10-04 10:00</text>
<text x="470" y="590" font-size="15" fill="#0f172a" font-family="Consolas, D2Coding, monospace" xml:space="preserve">목록 밖</text>
<text x="610" y="590" font-size="16" fill="#047857" font-weight="700" xml:space="preserve">남음</text>
<text x="20" y="632" font-size="16" fill="#64748b" xml:space="preserve">실제 손 확인에서는 아웃박스가 32건 지워졌다. 31건은 시드 밖의,</text>
<text x="20" y="656" font-size="16" fill="#64748b" xml:space="preserve">이전 손 확인 · 부하 측정이 남긴 발행 7일 지난 행이었다.</text>
</svg>