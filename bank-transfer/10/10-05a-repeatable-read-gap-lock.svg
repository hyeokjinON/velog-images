<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 780" width="760" height="780" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<title>REPEATABLE READ: 범위 DELETE 의 next-key 락이 새 미발행 행이 들어갈 빈 구간까지 잠가 INSERT 가 기다린다</title>
<defs><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="ms" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="mx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<rect width="760" height="780" fill="#ffffff"/>
<text x="20" y="34" font-size="21" fill="#0f172a" font-weight="700" xml:space="preserve">REPEATABLE READ: 범위 DELETE 가 빈 구간까지</text>
<text x="20" y="62" font-size="21" fill="#0f172a" font-weight="700" xml:space="preserve">잠가 새 아웃박스 INSERT 가 기다린다</text>
<text x="20" y="96" font-size="16" fill="#475569" xml:space="preserve">RetentionLockTest 의 모양. id 와 시각은 설명용 예시다.</text>
<text x="20" y="119" font-size="16" fill="#475569" xml:space="preserve">미발행 행은 published_at 이 NULL 이라 인덱스 맨 앞에 모인다</text>
<text x="20" y="152" font-size="17" fill="#0f172a" font-weight="700" xml:space="preserve">인덱스 idx_outbox_unpublished (published_at, id) 의 순서</text>
<rect x="40" y="168" width="680" height="46" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
<text x="56" y="197" font-size="15" fill="#0f172a" font-weight="700" font-family="Consolas, D2Coding, monospace" xml:space="preserve">(NULL, 41)</text>
<text x="250" y="197" font-size="16" fill="#0f172a" xml:space="preserve">미발행 — 다른 출금의 처리 신호</text>
<rect x="40" y="222" width="680" height="46" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
<text x="56" y="251" font-size="15" fill="#0f172a" font-weight="700" font-family="Consolas, D2Coding, monospace" xml:space="preserve">(NULL, 42)</text>
<text x="250" y="251" font-size="16" fill="#0f172a" xml:space="preserve">미발행 — 마지막 미발행 행</text>
<rect x="40" y="276" width="680" height="46" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="56" y="305" font-size="16" fill="#b91c1c" font-weight="700" xml:space="preserve">빈 구간(gap)</text>
<text x="250" y="305" font-size="16" fill="#b91c1c" xml:space="preserve">새 행 (NULL, 43) 이 들어갈 자리</text>
<rect x="40" y="330" width="680" height="46" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.6"/>
<text x="56" y="359" font-size="15" fill="#0f172a" font-weight="700" font-family="Consolas, D2Coding, monospace" xml:space="preserve">(10-27 23:59, 40)</text>
<text x="250" y="359" font-size="16" fill="#0f172a" xml:space="preserve">발행 · cutoff 전 → 지울 행</text>
<rect x="40" y="384" width="680" height="46" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
<text x="56" y="413" font-size="15" fill="#0f172a" font-weight="700" font-family="Consolas, D2Coding, monospace" xml:space="preserve">supremum</text>
<text x="250" y="413" font-size="16" fill="#0f172a" xml:space="preserve">인덱스 끝을 뜻하는 가상 기록</text>
<rect x="30" y="272" width="700" height="108" rx="8" fill="none" stroke="#b91c1c" stroke-width="3"/>
<rect x="30" y="380" width="700" height="54" rx="8" fill="none" stroke="#b91c1c" stroke-width="3"/>
<rect x="20" y="462" width="720" height="90" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
<text x="32" y="488" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">① REPEATABLE READ 의 범위 DELETE</text>
<text x="32" y="511" font-size="16" fill="#0f172a" xml:space="preserve">published_at &lt; cutoff 범위를 읽은 행마다 next-key 락</text>
<text x="32" y="534" font-size="16" fill="#0f172a" xml:space="preserve">(행 + 그 앞의 빈 구간)을 건다. 빨간 테두리가 잠긴 곳이다</text>
<rect x="20" y="566" width="720" height="90" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
<text x="32" y="592" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">② 다른 커넥션의 INSERT (NULL, 43)</text>
<text x="32" y="615" font-size="16" fill="#0f172a" xml:space="preserve">들어갈 자리가 잠긴 빈 구간 안이라</text>
<text x="32" y="638" font-size="16" fill="#0f172a" xml:space="preserve">INSERT_INTENTION 락을 얻지 못하고 기다린다</text>
<rect x="20" y="670" width="720" height="90" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.6"/>
<text x="32" y="696" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">③ 결과: 2초 락 대기 한도를 넘겨 실패</text>
<text x="32" y="719" font-size="16" fill="#0f172a" font-family="Consolas, D2Coding, monospace" xml:space="preserve">LOCK_WAIT_TIMEOUT (오류 1205)</text>
<text x="32" y="742" font-size="16" fill="#0f172a" xml:space="preserve">발행 행이 없으면 supremum 에서 기다린다</text>
</svg>