<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 760" width="760" height="760" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<title>같은 100건 동시 출금을 두 번 돌린 결과: 조건이 있으면 202 10건과 422 90건, 조건을 지우면 202 10건과 500 90건이고 두 경우 모두 잔고는 0</title>
<defs><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="ms" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="mx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<rect width="760" height="760" fill="#ffffff"/>
<text x="20" y="34" font-size="21" fill="#0f172a" font-weight="700" xml:space="preserve">같은 100건 동시 출금, 두 번 돌린 결과:</text>
<text x="20" y="62" font-size="21" fill="#0f172a" font-weight="700" xml:space="preserve">응답은 달라지고 잔고는 둘 다 0 이다</text>
<text x="20" y="96" font-size="16" fill="#475569" xml:space="preserve">잔고 100,000, 1만 원 출금 100건 (WalletConcurrencyTest).</text>
<text x="20" y="119" font-size="16" fill="#475569" xml:space="preserve">막대 하나 = 응답 100건, 길이는 건수에 비례</text>
<rect x="20" y="146" width="720" height="256" rx="8" fill="#ffffff" stroke="#047857" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="36" y="176" font-size="17" fill="#047857" font-weight="700" xml:space="preserve">정상: 조건이 있다 → 테스트 통과</text>
<text x="36" y="204" font-size="15" fill="#0f172a" font-family="Consolas, D2Coding, monospace" xml:space="preserve">UPDATE … WHERE user_id = ? AND balance &gt;= ?</text>
<rect x="36" y="226" width="68.8" height="44" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
<rect x="104.8" y="226" width="619.2" height="44" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="414.40000000000003" y="254" font-size="16" fill="#1d4ed8" font-weight="700" text-anchor="middle" xml:space="preserve">422 INSUFFICIENT_BALANCE × 90</text>
<text x="70.4" y="294" font-size="16" fill="#047857" font-weight="700" text-anchor="middle" xml:space="preserve">202 × 10</text>
<text x="36" y="330" font-size="16" fill="#0f172a" xml:space="preserve">11번째 요청부터 조건 0 &gt;= 10,000 이 거짓 → 0건 → 롤백</text>
<text x="36" y="354" font-size="16" fill="#0f172a" xml:space="preserve">잔고 0, 원장 합 0, 출금 행 10, WITHDRAW 10</text>
<text x="36" y="378" font-size="16" fill="#047857" font-weight="700" xml:space="preserve">단언 "202 정확히 10, 422 정확히 90" 통과</text>
<rect x="20" y="422" width="720" height="256" rx="8" fill="#ffffff" stroke="#b91c1c" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="36" y="452" font-size="17" fill="#b91c1c" font-weight="700" xml:space="preserve">뮤테이션: 조건을 지웠다 → 테스트 실패</text>
<text x="36" y="480" font-size="15" fill="#0f172a" font-family="Consolas, D2Coding, monospace" xml:space="preserve">UPDATE … WHERE user_id = ?   (AND balance &gt;= ? 삭제)</text>
<rect x="36" y="502" width="68.8" height="44" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
<rect x="104.8" y="502" width="619.2" height="44" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.6"/>
<text x="414.40000000000003" y="530" font-size="16" fill="#b91c1c" font-weight="700" text-anchor="middle" xml:space="preserve">500 × 90</text>
<text x="70.4" y="570" font-size="16" fill="#047857" font-weight="700" text-anchor="middle" xml:space="preserve">202 × 10</text>
<text x="36" y="606" font-size="16" fill="#0f172a" xml:space="preserve">11번째 요청부터 0 − 10,000 = −10,000 → CHECK 위반 → 500</text>
<text x="36" y="630" font-size="16" fill="#0f172a" xml:space="preserve">그래도 잔고는 0 이다. 음수가 되지 않았다 (CHECK 가 막음)</text>
<text x="36" y="654" font-size="16" fill="#b91c1c" font-weight="700" xml:space="preserve">단언 "422 정확히 90" 이 깨진다 → 테스트가 버그를 잡는다</text>
<text x="20" y="712" font-size="16" fill="#64748b" xml:space="preserve">근거: ADR-0008 결과 절, HANDOVER §4 — 변이 결과 {202=10, 500=90}</text>
<text x="20" y="736" font-size="16" fill="#64748b" xml:space="preserve">조건을 되돌린 뒤 같은 테스트는 다시 통과했다 (변경은 커밋하지 않음)</text>
</svg>