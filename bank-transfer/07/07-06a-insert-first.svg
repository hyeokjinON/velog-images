<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 880" width="760" height="880" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<title>지금 순서(출금 INSERT 먼저): 같은 키의 B 는 UNIQUE 에서 멈춰 지갑을 건드리지 않고 200 을 받는다</title>
<defs><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="ms" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="mx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<rect width="760" height="880" fill="#ffffff"/>
<text x="20" y="34" font-size="21" fill="#0f172a" font-weight="700" xml:space="preserve">지금 순서 (출금 INSERT 먼저):</text>
<text x="20" y="62" font-size="21" fill="#0f172a" font-weight="700" xml:space="preserve">같은 키의 B 는 UNIQUE 에서 멈추고 200 을 받는다</text>
<text x="20" y="96" font-size="16" fill="#475569" xml:space="preserve">잔고 10,000, 같은 키 K2 · 같은 내용으로 10,000원 요청 A · B.</text>
<text x="20" y="119" font-size="16" fill="#475569" xml:space="preserve">초록 = 이긴 쪽, 주황 = 기다림, 파랑 = 다시 읽기</text>
<rect x="15" y="146" width="220" height="60" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
<text x="125" y="171" font-size="16" fill="#0f172a" font-weight="700" text-anchor="middle" xml:space="preserve">요청 A 스레드</text>
<text x="125" y="195" font-size="16" fill="#0f172a" text-anchor="middle" xml:space="preserve">(먼저 INSERT)</text>
<line x1="125" y1="206" x2="125" y2="720" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
<rect x="270" y="146" width="220" height="60" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.6"/>
<text x="380" y="171" font-size="16" fill="#0f172a" font-weight="700" text-anchor="middle" xml:space="preserve">MySQL</text>
<text x="380" y="195" font-size="16" fill="#0f172a" text-anchor="middle" xml:space="preserve">transfer · wallet</text>
<line x1="380" y1="206" x2="380" y2="720" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
<rect x="525" y="146" width="220" height="60" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.6"/>
<text x="635" y="171" font-size="16" fill="#0f172a" font-weight="700" text-anchor="middle" xml:space="preserve">요청 B 스레드</text>
<text x="635" y="195" font-size="16" fill="#0f172a" text-anchor="middle" xml:space="preserve">(같은 키)</text>
<line x1="635" y1="206" x2="635" y2="720" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
<rect x="233.20000000000002" y="217" width="293.59999999999997" height="26" fill="#ffffff"/>
<text x="380" y="236" font-size="16" fill="#1d4ed8" text-anchor="middle" xml:space="preserve">① 둘 다 먼저 조회: (user-1, K2) 없음</text>
<line x1="129" y1="316" x2="376" y2="316" stroke="#047857" stroke-width="2.2" marker-end="url(#mg)"/>
<text x="252.5" y="307" font-size="16" fill="#047857" text-anchor="middle" xml:space="preserve">(user-1, K2)</text>
<text x="252.5" y="284" font-size="16" fill="#047857" text-anchor="middle" xml:space="preserve">INSERT transfer</text>
<circle cx="105" cy="316" r="13" fill="#047857"/><text x="105" y="322" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle" xml:space="preserve">②</text>
<text x="380" y="342" font-size="16" fill="#047857" font-weight="700" text-anchor="middle" xml:space="preserve">K2 값에 A 의 잠금</text>
<line x1="631" y1="400" x2="384" y2="400" stroke="#c2410c" stroke-width="2.2" marker-end="url(#mo)"/>
<text x="507.5" y="391" font-size="16" fill="#c2410c" text-anchor="middle" xml:space="preserve">INSERT transfer (user-1, K2)</text>
<circle cx="655" cy="400" r="13" fill="#c2410c"/><text x="655" y="406" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle" xml:space="preserve">③</text>
<rect x="627" y="406" width="16" height="126" fill="#fdba74" stroke="#c2410c" stroke-width="1.4"/>
<text x="507.5" y="436" font-size="16" fill="#c2410c" font-weight="700" text-anchor="middle" xml:space="preserve">지갑에 가기 전에</text>
<text x="507.5" y="459" font-size="16" fill="#c2410c" font-weight="700" text-anchor="middle" xml:space="preserve">여기서 기다린다</text>
<line x1="129" y1="520" x2="376" y2="520" stroke="#047857" stroke-width="2.2" marker-end="url(#mg)"/>
<text x="252.5" y="511" font-size="16" fill="#047857" text-anchor="middle" xml:space="preserve">원장 · 아웃박스, COMMIT</text>
<text x="252.5" y="488" font-size="16" fill="#047857" text-anchor="middle" xml:space="preserve">UPDATE wallet 10,000 → 0</text>
<circle cx="105" cy="520" r="13" fill="#047857"/><text x="105" y="526" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle" xml:space="preserve">④</text>
<rect x="15" y="540" width="220" height="42" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
<text x="27" y="567" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">A 응답: 202</text>
<line x1="384" y1="600" x2="631" y2="600" stroke="#b91c1c" stroke-width="2.2" marker-end="url(#mr)"/>
<text x="507.5" y="591" font-size="16" fill="#b91c1c" text-anchor="middle" xml:space="preserve">Duplicate entry → 롤백</text>
<circle cx="655" cy="600" r="13" fill="#b91c1c"/><text x="655" y="606" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle" xml:space="preserve">⑤</text>
<text x="507.5" y="626" font-size="16" fill="#b91c1c" text-anchor="middle" xml:space="preserve">지갑은 건드리지 않았다</text>
<line x1="631" y1="686" x2="384" y2="686" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#mb)"/>
<text x="507.5" y="677" font-size="16" fill="#1d4ed8" text-anchor="middle" xml:space="preserve">새 트랜잭션: 다시 조회</text>
<circle cx="655" cy="686" r="13" fill="#1d4ed8"/><text x="655" y="692" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle" xml:space="preserve">⑥</text>
<rect x="525" y="700" width="220" height="64" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
<text x="537" y="726" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">B 응답: 200</text>
<text x="537" y="749" font-size="16" fill="#0f172a" xml:space="preserve">A 의 출금 id</text>
<rect x="20" y="784" width="720" height="42" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
<text x="32" y="811" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">결과: 출금 1건, 차감 1번. B 는 "이미 접수됨" 을 받는다</text>
<text x="20" y="856" font-size="16" fill="#64748b" xml:space="preserve">근거: JpaTransferStore.saveWithEvent 의 순서, ADR-0008 결정 2</text>
</svg>