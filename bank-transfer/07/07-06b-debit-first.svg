<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 784" width="760" height="784" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<title>버린 순서(차감 먼저): 같은 키의 B 가 잔고 행에서 먼저 멈추고, 잔고 0 을 보고 422 를 받는다</title>
<defs><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="ms" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="mx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<rect width="760" height="784" fill="#ffffff"/>
<text x="20" y="34" font-size="21" fill="#0f172a" font-weight="700" xml:space="preserve">버린 순서 (차감 먼저):</text>
<text x="20" y="62" font-size="21" fill="#0f172a" font-weight="700" xml:space="preserve">같은 키의 B 가 잔고 0 을 보고 422 를 받는다</text>
<text x="20" y="96" font-size="16" fill="#475569" xml:space="preserve">같은 장면: 잔고 10,000, 같은 키 K2 · 같은 내용의 요청 A · B.</text>
<text x="20" y="119" font-size="16" fill="#475569" xml:space="preserve">초록 = 이긴 쪽, 주황 = 기다림, 빨강 = 틀린 응답</text>
<rect x="15" y="146" width="220" height="60" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
<text x="125" y="171" font-size="16" fill="#0f172a" font-weight="700" text-anchor="middle" xml:space="preserve">요청 A 스레드</text>
<text x="125" y="195" font-size="16" fill="#0f172a" text-anchor="middle" xml:space="preserve">(먼저 UPDATE)</text>
<line x1="125" y1="206" x2="125" y2="620" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
<rect x="270" y="146" width="220" height="60" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.6"/>
<text x="380" y="171" font-size="16" fill="#0f172a" font-weight="700" text-anchor="middle" xml:space="preserve">MySQL</text>
<text x="380" y="195" font-size="16" fill="#0f172a" text-anchor="middle" xml:space="preserve">wallet · transfer</text>
<line x1="380" y1="206" x2="380" y2="620" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
<rect x="525" y="146" width="220" height="60" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.6"/>
<text x="635" y="171" font-size="16" fill="#0f172a" font-weight="700" text-anchor="middle" xml:space="preserve">요청 B 스레드</text>
<text x="635" y="195" font-size="16" fill="#0f172a" text-anchor="middle" xml:space="preserve">(같은 키)</text>
<line x1="635" y1="206" x2="635" y2="620" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
<line x1="129" y1="290" x2="376" y2="290" stroke="#047857" stroke-width="2.2" marker-end="url(#mg)"/>
<text x="252.5" y="281" font-size="16" fill="#047857" text-anchor="middle" xml:space="preserve">10,000 → 0</text>
<text x="252.5" y="258" font-size="16" fill="#047857" text-anchor="middle" xml:space="preserve">UPDATE wallet</text>
<circle cx="105" cy="290" r="13" fill="#047857"/><text x="105" y="296" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle" xml:space="preserve">①</text>
<text x="380" y="316" font-size="16" fill="#047857" font-weight="700" text-anchor="middle" xml:space="preserve">잔고 행에 A 의 행 락</text>
<line x1="631" y1="380" x2="384" y2="380" stroke="#c2410c" stroke-width="2.2" marker-end="url(#mo)"/>
<text x="507.5" y="371" font-size="16" fill="#c2410c" text-anchor="middle" xml:space="preserve">UPDATE wallet (같은 행)</text>
<circle cx="655" cy="380" r="13" fill="#c2410c"/><text x="655" y="386" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle" xml:space="preserve">②</text>
<rect x="627" y="386" width="16" height="130" fill="#fdba74" stroke="#c2410c" stroke-width="1.4"/>
<text x="507.5" y="416" font-size="16" fill="#c2410c" font-weight="700" text-anchor="middle" xml:space="preserve">UNIQUE 까지 가지 못하고</text>
<text x="507.5" y="439" font-size="16" fill="#c2410c" font-weight="700" text-anchor="middle" xml:space="preserve">잔고 행에서 기다린다</text>
<line x1="129" y1="500" x2="376" y2="500" stroke="#047857" stroke-width="2.2" marker-end="url(#mg)"/>
<text x="252.5" y="491" font-size="16" fill="#047857" text-anchor="middle" xml:space="preserve">아웃박스, COMMIT</text>
<text x="252.5" y="468" font-size="16" fill="#047857" text-anchor="middle" xml:space="preserve">INSERT transfer · 원장</text>
<circle cx="105" cy="500" r="13" fill="#047857"/><text x="105" y="506" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle" xml:space="preserve">③</text>
<rect x="15" y="520" width="220" height="42" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
<text x="27" y="547" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">A 응답: 202</text>
<line x1="384" y1="580" x2="631" y2="580" stroke="#b91c1c" stroke-width="2.2" marker-end="url(#mr)"/>
<text x="507.5" y="571" font-size="16" fill="#b91c1c" text-anchor="middle" xml:space="preserve">최신 0 &gt;= 10,000 ? → 0건</text>
<circle cx="655" cy="580" r="13" fill="#b91c1c"/><text x="655" y="586" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle" xml:space="preserve">④</text>
<rect x="20" y="640" width="720" height="88" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.6"/>
<text x="32" y="666" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">결과: B 는 422 INSUFFICIENT_BALANCE 를 받는다</text>
<text x="32" y="689" font-size="16" fill="#0f172a" xml:space="preserve">같은 요청을 다시 보냈을 뿐인데 "잔고 부족" 이다. 실제로는 A 로 접수됐다</text>
<text x="32" y="712" font-size="16" fill="#0f172a" xml:space="preserve">멱등 응답이 잔고 상태에 따라 달라졌다 → 이 순서를 버렸다</text>
<text x="20" y="762" font-size="16" fill="#64748b" xml:space="preserve">근거: P4-1 설계 §4-1 (계획 작성 때 순서를 바꿨다), ADR-0008</text>
</svg>