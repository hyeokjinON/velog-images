<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 700" width="760" height="700" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<title>CI 의 infra-smoke 잡: PR 마다 같은 Compose 파일을 띄우고, 쓰고 읽고, 항상 지운다</title>
<defs><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="ms" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="mx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<rect width="760" height="700" fill="#ffffff"/>
<text x="20" y="34" font-size="21" fill="#0f172a" font-weight="700" xml:space="preserve">CI 의 infra-smoke 잡: PR 마다 같은 Compose 파일을</text>
<text x="20" y="62" font-size="21" fill="#0f172a" font-weight="700" xml:space="preserve">띄우고, 쓰고 읽고, 항상 지운다</text>
<text x="20" y="96" font-size="16" fill="#475569" xml:space="preserve">주황 = 차례로 도는 단계, 빨강 = 실패했을 때만, 회색 = 성공 · 실패와</text>
<text x="20" y="119" font-size="16" fill="#475569" xml:space="preserve">관계없이 항상. ubuntu-latest 러너에는 Docker 가 들어 있다</text>
<rect x="20" y="160" width="720" height="64" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.6"/>
<text x="32" y="186" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">① checkout — PR 의 코드를 러너로 받는다</text>
<text x="32" y="209" font-size="16" fill="#0f172a" font-family="Consolas, D2Coding, monospace" xml:space="preserve">uses: actions/checkout@v6</text>
<line x1="380" y1="224" x2="380" y2="246" stroke="#c2410c" stroke-width="2.2" marker-end="url(#mo)"/>
<rect x="20" y="246" width="720" height="64" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.6"/>
<text x="32" y="272" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">② Start — 세 서비스를 띄우고 healthy 까지 기다린다</text>
<text x="32" y="295" font-size="16" fill="#0f172a" font-family="Consolas, D2Coding, monospace" xml:space="preserve">up -d --wait --wait-timeout 240</text>
<line x1="380" y1="310" x2="380" y2="332" stroke="#c2410c" stroke-width="2.2" marker-end="url(#mo)"/>
<rect x="20" y="332" width="720" height="64" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.6"/>
<text x="32" y="358" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">③ Verify — bash infra/verify.sh</text>
<text x="32" y="381" font-size="16" fill="#0f172a" xml:space="preserve">MySQL · Kafka · Redis 에 실제로 쓰고 읽는다</text>
<line x1="195" y1="396" x2="195" y2="440" stroke="#b91c1c" stroke-width="2.2" marker-end="url(#mr)"/>
<line x1="565" y1="396" x2="565" y2="440" stroke="#334155" stroke-width="2.2" marker-end="url(#ms)"/>
<rect x="20" y="442" width="350" height="64" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.6"/>
<text x="32" y="468" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">④ 실패했을 때만</text>
<text x="32" y="491" font-size="16" fill="#0f172a" font-family="Consolas, D2Coding, monospace" xml:space="preserve">if: failure() → logs</text>
<rect x="390" y="442" width="350" height="64" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.6"/>
<text x="402" y="468" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">⑤ 항상</text>
<text x="402" y="491" font-size="16" fill="#0f172a" font-family="Consolas, D2Coding, monospace" xml:space="preserve">if: always() → down -v</text>
<text x="20" y="534" font-size="16" fill="#475569" xml:space="preserve">④ 컨테이너 로그를 PR 화면에 남겨, 왜 안 떴는지 바로 본다.</text>
<text x="20" y="558" font-size="16" fill="#475569" xml:space="preserve">⑤ 성공이든 실패든 컨테이너와 볼륨을 지운다.</text>
<rect x="20" y="576" width="720" height="64" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
<text x="32" y="602" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">결과: PR 화면에 infra-smoke 성공 또는 실패가 뜬다</text>
<text x="32" y="625" font-size="16" fill="#0f172a" xml:space="preserve">.env.example 을 그대로 쓰므로 CI 에 비밀 값이 필요 없다</text>
<text x="20" y="672" font-size="16" fill="#64748b" xml:space="preserve">근거: .github/workflows/ci.yml infra-smoke 잡</text>
</svg>