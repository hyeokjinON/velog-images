<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 780" width="760" height="780" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<title>Kafka 리스너 두 개: 묻는 위치마다 그 위치에서 닿는 주소를 돌려준다</title>
<defs><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="ms" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="mx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<rect width="760" height="780" fill="#ffffff"/>
<text x="20" y="34" font-size="21" fill="#0f172a" font-weight="700" xml:space="preserve">Kafka 리스너 두 개: 묻는 위치마다 그 위치에서</text>
<text x="20" y="62" font-size="21" fill="#0f172a" font-weight="700" xml:space="preserve">닿는 주소를 돌려준다</text>
<text x="20" y="96" font-size="16" fill="#475569" xml:space="preserve">왼쪽 = 내 PC 의 앱, 오른쪽 = 같은 Docker 네트워크의 kafka-ui.</text>
<text x="20" y="119" font-size="16" fill="#475569" xml:space="preserve">① 처음 접속 → ② 브로커가 "이 주소로 다시 와" → ③ 다시 접속</text>
<rect x="34" y="236" width="324" height="88" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="46" y="262" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">① localhost:9092 로 접속</text>
<text x="46" y="285" font-size="16" fill="#0f172a" xml:space="preserve">포트 매핑을 지나</text>
<text x="46" y="308" font-size="16" fill="#0f172a" xml:space="preserve">EXTERNAL 리스너에 닿는다</text>
<line x1="196" y1="324" x2="196" y2="346" stroke="#334155" stroke-width="2.2" marker-end="url(#ms)"/>
<rect x="34" y="346" width="324" height="88" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
<text x="46" y="372" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">② 브로커가 알려 준 주소</text>
<text x="46" y="395" font-size="16" fill="#0f172a" xml:space="preserve">EXTERNAL 의 advertised</text>
<text x="46" y="418" font-size="16" fill="#0f172a" font-family="Consolas, D2Coding, monospace" xml:space="preserve">localhost:9092</text>
<line x1="196" y1="434" x2="196" y2="456" stroke="#334155" stroke-width="2.2" marker-end="url(#ms)"/>
<rect x="34" y="456" width="324" height="88" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
<text x="46" y="482" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">③ localhost:9092 로</text>
<text x="46" y="505" font-size="16" fill="#0f172a" xml:space="preserve">다시 접속해 보낸다</text>
<text x="46" y="528" font-size="16" fill="#0f172a" xml:space="preserve">→ 성공</text>
<rect x="20" y="160" width="352" height="416" rx="8" fill="none" stroke="#1d4ed8" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="34" y="188" font-size="17" fill="#0f172a" font-weight="700" xml:space="preserve">A. 내 PC 의 IntelliJ 앱</text>
<text x="34" y="211" font-size="17" fill="#0f172a" font-weight="700" xml:space="preserve">bootstrap = localhost:9092</text>
<rect x="402" y="236" width="324" height="88" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="414" y="262" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">① kafka:29092 로 접속</text>
<text x="414" y="285" font-size="16" fill="#0f172a" xml:space="preserve">Docker 네트워크에서</text>
<text x="414" y="308" font-size="16" fill="#0f172a" xml:space="preserve">INTERNAL 리스너에 닿는다</text>
<line x1="564" y1="324" x2="564" y2="346" stroke="#334155" stroke-width="2.2" marker-end="url(#ms)"/>
<rect x="402" y="346" width="324" height="88" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
<text x="414" y="372" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">② 브로커가 알려 준 주소</text>
<text x="414" y="395" font-size="16" fill="#0f172a" xml:space="preserve">INTERNAL 의 advertised</text>
<text x="414" y="418" font-size="16" fill="#0f172a" font-family="Consolas, D2Coding, monospace" xml:space="preserve">kafka:29092</text>
<line x1="564" y1="434" x2="564" y2="456" stroke="#334155" stroke-width="2.2" marker-end="url(#ms)"/>
<rect x="402" y="456" width="324" height="88" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
<text x="414" y="482" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">③ kafka:29092 로</text>
<text x="414" y="505" font-size="16" fill="#0f172a" xml:space="preserve">다시 접속해 읽는다</text>
<text x="414" y="528" font-size="16" fill="#0f172a" xml:space="preserve">→ 성공</text>
<rect x="388" y="160" width="352" height="416" rx="8" fill="none" stroke="#047857" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="402" y="188" font-size="17" fill="#0f172a" font-weight="700" xml:space="preserve">B. kafka-ui 컨테이너</text>
<text x="402" y="211" font-size="17" fill="#0f172a" font-weight="700" xml:space="preserve">bootstrap = kafka:29092</text>
<rect x="20" y="600" width="720" height="118" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.6"/>
<text x="32" y="626" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">kafka 컨테이너의 리스너 3개 (받는 포트 → 알려 주는 주소)</text>
<text x="32" y="649" font-size="16" fill="#0f172a" font-family="Consolas, D2Coding, monospace" xml:space="preserve">INTERNAL://:29092    → kafka:29092</text>
<text x="32" y="672" font-size="16" fill="#0f172a" font-family="Consolas, D2Coding, monospace" xml:space="preserve">EXTERNAL://:9092     → localhost:9092</text>
<text x="32" y="695" font-size="16" fill="#0f172a" font-family="Consolas, D2Coding, monospace" xml:space="preserve">CONTROLLER://:9093   → 컨트롤러끼리만 쓴다</text>
<text x="20" y="752" font-size="16" fill="#64748b" xml:space="preserve">근거: infra/docker-compose.yml KAFKA_LISTENERS, KAFKA_ADVERTISED_LISTENERS</text>
</svg>