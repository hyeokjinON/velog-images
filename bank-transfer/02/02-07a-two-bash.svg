<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 700" width="760" height="700" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<title>Windows 에는 bash 가 두 개다: PowerShell 의 bash 는 WSL 실행기라 verify.sh 가 실패했다</title>
<defs><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="ms" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="mx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<rect width="760" height="700" fill="#ffffff"/>
<text x="20" y="34" font-size="21" fill="#0f172a" font-weight="700" xml:space="preserve">Windows 에는 bash 가 두 개다: PowerShell 의</text>
<text x="20" y="62" font-size="21" fill="#0f172a" font-weight="700" xml:space="preserve">bash 는 WSL 실행기라 verify.sh 가 실패했다</text>
<text x="20" y="96" font-size="16" fill="#475569" xml:space="preserve">왼쪽 빨강 = PowerShell 에서 bash 를 부른 길, 오른쪽 초록 =</text>
<text x="20" y="119" font-size="16" fill="#475569" xml:space="preserve">Git Bash 로 실행한 길. 명령은 같은 bash infra/verify.sh 다</text>
<rect x="34" y="236" width="324" height="88" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
<text x="46" y="262" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">① PATH 에서 먼저 찾은 것</text>
<text x="46" y="285" font-size="16" fill="#0f172a" font-family="Consolas, D2Coding, monospace" xml:space="preserve">...\WindowsApps\bash.exe</text>
<text x="46" y="308" font-size="16" fill="#0f172a" xml:space="preserve">= WSL 실행기</text>
<line x1="196" y1="324" x2="196" y2="346" stroke="#334155" stroke-width="2.2" marker-end="url(#ms)"/>
<rect x="34" y="346" width="324" height="88" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
<text x="46" y="372" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">② 기본 WSL 배포판 안의</text>
<text x="46" y="395" font-size="16" fill="#0f172a" font-family="Consolas, D2Coding, monospace" xml:space="preserve">/bin/bash</text>
<text x="46" y="418" font-size="16" fill="#0f172a" xml:space="preserve">를 실행하려 한다</text>
<line x1="196" y1="434" x2="196" y2="456" stroke="#334155" stroke-width="2.2" marker-end="url(#ms)"/>
<rect x="34" y="456" width="324" height="88" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.6"/>
<text x="46" y="482" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">③ 배포판이 docker-desktop</text>
<text x="46" y="505" font-size="16" fill="#0f172a" xml:space="preserve">하나뿐이고 /bin/bash 가</text>
<text x="46" y="528" font-size="16" fill="#0f172a" xml:space="preserve">없다 → execvpe 실패</text>
<text x="34" y="580" font-size="16" fill="#b91c1c" xml:space="preserve">Docker 자체는 정상이었다</text>
<text x="34" y="603" font-size="16" fill="#b91c1c" xml:space="preserve">(compose ps 는 세 서비스 healthy)</text>
<rect x="20" y="160" width="352" height="476" rx="8" fill="none" stroke="#b91c1c" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="34" y="188" font-size="17" fill="#0f172a" font-weight="700" xml:space="preserve">A. PowerShell 에서</text>
<text x="34" y="211" font-size="17" fill="#0f172a" font-weight="700" xml:space="preserve">bash infra/verify.sh</text>
<rect x="402" y="236" width="324" height="88" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
<text x="414" y="262" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">① Git for Windows 의 bash</text>
<text x="414" y="285" font-size="16" fill="#0f172a" font-family="Consolas, D2Coding, monospace" xml:space="preserve">C:\Program Files\Git\</text>
<text x="414" y="308" font-size="16" fill="#0f172a" font-family="Consolas, D2Coding, monospace" xml:space="preserve">bin\bash.exe</text>
<line x1="564" y1="324" x2="564" y2="346" stroke="#334155" stroke-width="2.2" marker-end="url(#ms)"/>
<rect x="402" y="346" width="324" height="88" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
<text x="414" y="372" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">② Windows 프로그램으로</text>
<text x="414" y="395" font-size="16" fill="#0f172a" xml:space="preserve">실행되어 docker.exe 를</text>
<text x="414" y="418" font-size="16" fill="#0f172a" xml:space="preserve">부른다</text>
<line x1="564" y1="434" x2="564" y2="456" stroke="#334155" stroke-width="2.2" marker-end="url(#ms)"/>
<rect x="402" y="456" width="324" height="88" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
<text x="414" y="482" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">③ MySQL 단계 통과</text>
<text x="414" y="505" font-size="16" fill="#0f172a" xml:space="preserve">Kafka 단계는 다른 문제로</text>
<text x="414" y="528" font-size="16" fill="#0f172a" xml:space="preserve">멈췄다 (그림 2-7b)</text>
<text x="402" y="580" font-size="16" fill="#047857" xml:space="preserve">IntelliJ 터미널의 셸을</text>
<text x="402" y="603" font-size="16" fill="#047857" xml:space="preserve">Git Bash 로 바꿔도 된다</text>
<rect x="388" y="160" width="352" height="476" rx="8" fill="none" stroke="#047857" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="402" y="188" font-size="17" fill="#0f172a" font-weight="700" xml:space="preserve">B. Git Bash 에서</text>
<text x="402" y="211" font-size="17" fill="#0f172a" font-weight="700" xml:space="preserve">같은 명령</text>
<text x="20" y="670" font-size="16" fill="#64748b" xml:space="preserve">근거: infra/README.md "자주 막히는 곳", CHANGELOG [P3-0] Fixed</text>
</svg>