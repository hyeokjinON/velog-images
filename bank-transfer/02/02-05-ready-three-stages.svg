<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 820" width="760" height="820" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<title>떴다와 쓸 수 있다는 다르다: 준비를 세 단계로 확인한다</title>
<defs><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="ms" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="mx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<rect width="760" height="820" fill="#ffffff"/>
<text x="20" y="34" font-size="21" fill="#0f172a" font-weight="700" xml:space="preserve">"떴다" 와 "쓸 수 있다" 는 다르다: 준비를 세 단계로</text>
<text x="20" y="62" font-size="21" fill="#0f172a" font-weight="700" xml:space="preserve">확인한다</text>
<text x="20" y="96" font-size="16" fill="#475569" xml:space="preserve">왼쪽 = 단계와 도구, 오른쪽 = 그 단계가 확인하는 것과 못 잡는 것</text>
<text x="20" y="119" font-size="16" fill="#475569" xml:space="preserve">(빨강). MySQL 은 첫 기동 때 초기화에 10~20초가 걸린다</text>
<rect x="20" y="160" width="300" height="124" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="32" y="186" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">1. 컨테이너 시작</text>
<text x="32" y="209" font-size="16" fill="#0f172a" font-family="Consolas, D2Coding, monospace" xml:space="preserve">docker compose up -d</text>
<text x="32" y="232" font-size="16" fill="#0f172a" xml:space="preserve">프로세스가 시작되면</text>
<text x="32" y="255" font-size="16" fill="#0f172a" xml:space="preserve">명령이 바로 끝난다</text>
<rect x="340" y="160" width="400" height="124" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
<text x="352" y="186" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">확인: 프로세스가 떴다</text>
<text x="352" y="209" font-size="16" fill="#b91c1c" xml:space="preserve">못 잡음: MySQL 이 아직 초기화 중</text>
<text x="352" y="232" font-size="16" fill="#b91c1c" xml:space="preserve">이때 앱이 붙으면 접속 실패</text>
<line x1="320" y1="222" x2="340" y2="222" stroke="#334155" stroke-width="2.2" marker-end="url(#ms)"/>
<line x1="170" y1="284" x2="170" y2="316" stroke="#334155" stroke-width="2.2" marker-end="url(#ms)"/>
<rect x="20" y="316" width="300" height="124" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
<text x="32" y="342" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">2. healthcheck + --wait</text>
<text x="32" y="365" font-size="16" fill="#0f172a" font-family="Consolas, D2Coding, monospace" xml:space="preserve">mysqladmin ping</text>
<text x="32" y="388" font-size="16" fill="#0f172a" font-family="Consolas, D2Coding, monospace" xml:space="preserve">kafka-broker-api-versions</text>
<text x="32" y="411" font-size="16" fill="#0f172a" font-family="Consolas, D2Coding, monospace" xml:space="preserve">redis-cli ping</text>
<rect x="340" y="316" width="400" height="124" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
<text x="352" y="342" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">확인: 접속해서 응답한다</text>
<text x="352" y="365" font-size="16" fill="#0f172a" xml:space="preserve">세 서비스가 모두 healthy 가 되면</text>
<text x="352" y="388" font-size="16" fill="#0f172a" xml:space="preserve">up -d --wait 가 끝난다</text>
<text x="352" y="411" font-size="16" fill="#b91c1c" xml:space="preserve">못 잡음: 앱 계정 권한, 한글, 리스너</text>
<line x1="320" y1="378" x2="340" y2="378" stroke="#334155" stroke-width="2.2" marker-end="url(#ms)"/>
<line x1="170" y1="440" x2="170" y2="472" stroke="#334155" stroke-width="2.2" marker-end="url(#ms)"/>
<rect x="20" y="472" width="300" height="124" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
<text x="32" y="498" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">3. bash infra/verify.sh</text>
<text x="32" y="521" font-size="16" fill="#0f172a" xml:space="preserve">[1/3] MySQL 쓰기 · 읽기</text>
<text x="32" y="544" font-size="16" fill="#0f172a" xml:space="preserve">[2/3] Kafka 보내기 · 읽기</text>
<text x="32" y="567" font-size="16" fill="#0f172a" xml:space="preserve">[3/3] Redis SET · GET</text>
<rect x="340" y="472" width="400" height="124" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
<text x="352" y="498" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">확인: 실제로 쓰고 읽힌다</text>
<text x="352" y="521" font-size="16" fill="#0f172a" xml:space="preserve">앱 계정으로 '한글확인' 저장 · 조회</text>
<text x="352" y="544" font-size="16" fill="#0f172a" xml:space="preserve">메시지 1건을 처음부터 다시 읽기</text>
<text x="352" y="567" font-size="16" fill="#0f172a" xml:space="preserve">끝에 "모두 정상입니다." 출력</text>
<line x1="320" y1="534" x2="340" y2="534" stroke="#334155" stroke-width="2.2" marker-end="url(#ms)"/>
<rect x="20" y="634" width="720" height="118" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.6"/>
<text x="32" y="660" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">healthcheck 숫자 읽기 (MySQL 기준)</text>
<text x="32" y="683" font-size="16" fill="#0f172a" xml:space="preserve">interval 5s — 5초마다 묻는다</text>
<text x="32" y="706" font-size="16" fill="#0f172a" xml:space="preserve">start_period 20s — 처음 20초 동안의 실패는 세지 않는다</text>
<text x="32" y="729" font-size="16" fill="#0f172a" xml:space="preserve">retries 30 — 그 뒤 30번 연달아 실패하면 unhealthy</text>
<text x="20" y="788" font-size="16" fill="#64748b" xml:space="preserve">근거: infra/docker-compose.yml healthcheck, infra/verify.sh</text>
</svg>