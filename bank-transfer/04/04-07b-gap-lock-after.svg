<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 712" width="760" height="712" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<title>고친 뒤 (발행기만 READ COMMITTED): 읽은 행만 잠가서, 새 접수의 아웃박스 INSERT 가 바로 들어간다</title>
<defs><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="ms" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="mx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<rect width="760" height="712" fill="#ffffff"/>
<text x="20" y="34" font-size="21" fill="#0f172a" font-weight="700" xml:space="preserve">고친 뒤 (발행기만 READ COMMITTED): 읽은 행만</text>
<text x="20" y="62" font-size="21" fill="#0f172a" font-weight="700" xml:space="preserve">잠가서, 새 접수의 INSERT 가 바로 들어간다</text>
<text x="20" y="96" font-size="16" fill="#475569" xml:space="preserve">그림 4-7a 와 같은 인덱스, 같은 순간이다. 초록 = 행 잠금,</text>
<text x="20" y="119" font-size="16" fill="#475569" xml:space="preserve">점선 초록 = 새로 들어간 행. 시각 · id 는 설명용</text>
<text x="20" y="150" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">① 같은 SELECT 를 READ COMMITTED 트랜잭션에서 실행한다</text>
<rect x="190" y="166" width="380" height="32" fill="#e2e8f0" stroke="#334155" stroke-width="1"/>
<text x="198" y="188" font-size="15" fill="#0f172a" font-weight="700" font-family="Consolas, D2Coding, monospace" xml:space="preserve">published_at</text>
<text x="348" y="188" font-size="15" fill="#0f172a" font-weight="700" font-family="Consolas, D2Coding, monospace" xml:space="preserve">id</text>
<text x="418" y="188" font-size="15" fill="#0f172a" font-weight="700" xml:space="preserve">잠금</text>
<rect x="190" y="198" width="380" height="34" fill="#ecfdf5" stroke="#94a3b8" stroke-width="1"/>
<text x="198" y="221" font-size="15" fill="#065f46" font-family="Consolas, D2Coding, monospace" xml:space="preserve">NULL</text>
<text x="348" y="221" font-size="15" fill="#065f46" font-family="Consolas, D2Coding, monospace" xml:space="preserve">7</text>
<text x="418" y="221" font-size="15" fill="#065f46" font-weight="700" xml:space="preserve">행 잠금</text>
<rect x="190" y="232" width="380" height="34" fill="#ecfdf5" stroke="#94a3b8" stroke-width="1"/>
<text x="198" y="255" font-size="15" fill="#065f46" font-family="Consolas, D2Coding, monospace" xml:space="preserve">NULL</text>
<text x="348" y="255" font-size="15" fill="#065f46" font-family="Consolas, D2Coding, monospace" xml:space="preserve">8</text>
<text x="418" y="255" font-size="15" fill="#065f46" font-weight="700" xml:space="preserve">행 잠금</text>
<rect x="190" y="266" width="380" height="34" fill="#ecfdf5" stroke="#047857" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="198" y="289" font-size="15" fill="#047857" font-weight="700" xml:space="preserve">(NULL, 9) ← 새 INSERT 가 바로 들어감</text>
<rect x="190" y="300" width="380" height="34" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
<text x="198" y="323" font-size="15" fill="#475569" font-family="Consolas, D2Coding, monospace" xml:space="preserve">09:59:50</text>
<text x="348" y="323" font-size="15" fill="#475569" font-family="Consolas, D2Coding, monospace" xml:space="preserve">1</text>
<text x="418" y="323" font-size="15" fill="#475569" xml:space="preserve">-</text>
<rect x="190" y="334" width="380" height="34" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
<text x="198" y="357" font-size="15" fill="#475569" font-family="Consolas, D2Coding, monospace" xml:space="preserve">09:59:51</text>
<text x="348" y="357" font-size="15" fill="#475569" font-family="Consolas, D2Coding, monospace" xml:space="preserve">2</text>
<text x="418" y="357" font-size="15" fill="#475569" xml:space="preserve">-</text>
<text x="20" y="398" font-size="16" fill="#334155" xml:space="preserve">READ COMMITTED 는 조건에 맞아 고른 행만 잠그고 빈 구간은 잠그지 않는다.</text>
<text x="20" y="422" font-size="16" fill="#334155" xml:space="preserve">id 9 는 이번 묶음에 없고, 다음 주기(0.5초 뒤)에 발행된다</text>
<rect x="20" y="452" width="720" height="112" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
<text x="32" y="478" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">② 함께 고친 것: 잠금을 쥐는 시간을 줄였다</text>
<text x="32" y="501" font-size="16" fill="#0f172a" xml:space="preserve">· 묶음을 전부 send 한 뒤 한 번에 get: "건수 × 5초" → 5초 안팎</text>
<text x="32" y="524" font-size="16" fill="#0f172a" xml:space="preserve">· 프로듀서 max.block.ms = 5초: 브로커가 없을 때 60초 막힘 방지</text>
<text x="32" y="547" font-size="16" fill="#0f172a" xml:space="preserve">· 행 잠금 + SKIP LOCKED 는 그대로 → 이중 발행은 여전히 없다</text>
<rect x="20" y="580" width="720" height="88" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="32" y="606" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">③ 증명 테스트 (OutboxRelayTest)</text>
<text x="32" y="629" font-size="16" fill="#0f172a" xml:space="preserve">발행기가 잠금을 쥔 동안 새 접수가 5초 안에 끝나는지 본다.</text>
<text x="32" y="652" font-size="16" fill="#0f172a" xml:space="preserve">격리 수준을 REPEATABLE READ 로 되돌리면 이 테스트가 실패한다</text>
</svg>