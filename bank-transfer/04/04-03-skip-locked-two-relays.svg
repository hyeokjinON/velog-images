<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 870" width="760" height="870" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<title>발행기 두 대가 동시에 돌 때: SKIP LOCKED 로 잠긴 행을 건너뛰어 서로 다른 행을 보낸다</title>
<defs><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="ms" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="mx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<rect width="760" height="870" fill="#ffffff"/>
<text x="20" y="34" font-size="21" fill="#0f172a" font-weight="700" xml:space="preserve">발행기 두 대가 동시에 돌 때: SKIP LOCKED 로</text>
<text x="20" y="62" font-size="21" fill="#0f172a" font-weight="700" xml:space="preserve">잠긴 행을 건너뛰어 서로 다른 행을 보낸다</text>
<text x="20" y="96" font-size="16" fill="#475569" xml:space="preserve">설명을 위해 한 번에 3건씩 읽는다고 둔다 (실제는 100건).</text>
<text x="20" y="119" font-size="16" fill="#475569" xml:space="preserve">초록 = 발행기 A 가 잠근 행, 파랑 = 발행기 B 가 잠근 행</text>
<text x="250" y="166" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">outbox_event (미발행 6행)</text>
<rect x="250" y="176" width="260" height="32" fill="#e2e8f0" stroke="#334155" stroke-width="1"/>
<text x="258" y="198" font-size="15" fill="#0f172a" font-weight="700" font-family="Consolas, D2Coding, monospace" xml:space="preserve">id</text>
<text x="328" y="198" font-size="15" fill="#0f172a" font-weight="700" font-family="Consolas, D2Coding, monospace" xml:space="preserve">published_at</text>
<text x="468" y="198" font-size="15" fill="#0f172a" font-weight="700" xml:space="preserve">잠금</text>
<rect x="250" y="208" width="260" height="34" fill="#ecfdf5" stroke="#94a3b8" stroke-width="1"/>
<text x="258" y="231" font-size="15" fill="#065f46" font-family="Consolas, D2Coding, monospace" xml:space="preserve">1</text>
<text x="328" y="231" font-size="15" fill="#065f46" font-family="Consolas, D2Coding, monospace" xml:space="preserve">NULL</text>
<text x="468" y="231" font-size="15" fill="#065f46" font-weight="700" xml:space="preserve">A</text>
<rect x="250" y="242" width="260" height="34" fill="#ecfdf5" stroke="#94a3b8" stroke-width="1"/>
<text x="258" y="265" font-size="15" fill="#065f46" font-family="Consolas, D2Coding, monospace" xml:space="preserve">2</text>
<text x="328" y="265" font-size="15" fill="#065f46" font-family="Consolas, D2Coding, monospace" xml:space="preserve">NULL</text>
<text x="468" y="265" font-size="15" fill="#065f46" font-weight="700" xml:space="preserve">A</text>
<rect x="250" y="276" width="260" height="34" fill="#ecfdf5" stroke="#94a3b8" stroke-width="1"/>
<text x="258" y="299" font-size="15" fill="#065f46" font-family="Consolas, D2Coding, monospace" xml:space="preserve">3</text>
<text x="328" y="299" font-size="15" fill="#065f46" font-family="Consolas, D2Coding, monospace" xml:space="preserve">NULL</text>
<text x="468" y="299" font-size="15" fill="#065f46" font-weight="700" xml:space="preserve">A</text>
<rect x="250" y="310" width="260" height="34" fill="#eff6ff" stroke="#94a3b8" stroke-width="1"/>
<text x="258" y="333" font-size="15" fill="#1d4ed8" font-family="Consolas, D2Coding, monospace" xml:space="preserve">4</text>
<text x="328" y="333" font-size="15" fill="#1d4ed8" font-family="Consolas, D2Coding, monospace" xml:space="preserve">NULL</text>
<text x="468" y="333" font-size="15" fill="#1d4ed8" font-weight="700" xml:space="preserve">B</text>
<rect x="250" y="344" width="260" height="34" fill="#eff6ff" stroke="#94a3b8" stroke-width="1"/>
<text x="258" y="367" font-size="15" fill="#1d4ed8" font-family="Consolas, D2Coding, monospace" xml:space="preserve">5</text>
<text x="328" y="367" font-size="15" fill="#1d4ed8" font-family="Consolas, D2Coding, monospace" xml:space="preserve">NULL</text>
<text x="468" y="367" font-size="15" fill="#1d4ed8" font-weight="700" xml:space="preserve">B</text>
<rect x="250" y="378" width="260" height="34" fill="#eff6ff" stroke="#94a3b8" stroke-width="1"/>
<text x="258" y="401" font-size="15" fill="#1d4ed8" font-family="Consolas, D2Coding, monospace" xml:space="preserve">6</text>
<text x="328" y="401" font-size="15" fill="#1d4ed8" font-family="Consolas, D2Coding, monospace" xml:space="preserve">NULL</text>
<text x="468" y="401" font-size="15" fill="#1d4ed8" font-weight="700" xml:space="preserve">B</text>
<line x1="320" y1="176" x2="320" y2="412" stroke="#94a3b8" stroke-width="1"/>
<line x1="460" y1="176" x2="460" y2="412" stroke="#94a3b8" stroke-width="1"/>
<rect x="20" y="208" width="200" height="98" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
<text x="32" y="234" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">발행기 A (앱 1)</text>
<text x="32" y="257" font-size="16" fill="#0f172a" xml:space="preserve">먼저 SELECT</text>
<text x="32" y="280" font-size="16" fill="#0f172a" xml:space="preserve">→ 1, 2, 3 을 잠근다</text>
<line x1="220" y1="257" x2="246" y2="257" stroke="#047857" stroke-width="2.2" marker-end="url(#mg)"/>
<rect x="540" y="304" width="200" height="120" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="552" y="330" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">발행기 B (앱 2)</text>
<text x="552" y="353" font-size="16" fill="#0f172a" xml:space="preserve">같은 SELECT</text>
<text x="552" y="376" font-size="16" fill="#0f172a" xml:space="preserve">1~3 은 건너뛰고</text>
<text x="552" y="399" font-size="16" fill="#0f172a" xml:space="preserve">→ 4, 5, 6 을 잠근다</text>
<line x1="540" y1="364" x2="514" y2="364" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#mb)"/>
<text x="20" y="460" font-size="17" fill="#0f172a" font-weight="700" xml:space="preserve">같은 순간 B 의 SELECT 가 쓰는 방식에 따라</text>
<rect x="20" y="480" width="720" height="88" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
<text x="32" y="506" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">FOR UPDATE SKIP LOCKED (채택)</text>
<text x="32" y="529" font-size="16" fill="#0f172a" xml:space="preserve">B 는 기다리지 않고 4~6 을 가져간다.</text>
<text x="32" y="552" font-size="16" fill="#0f172a" xml:space="preserve">두 발행기가 서로 다른 행을 보낸다. 이중 발행 없음</text>
<rect x="20" y="584" width="720" height="88" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.6"/>
<text x="32" y="610" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">FOR UPDATE 만</text>
<text x="32" y="633" font-size="16" fill="#0f172a" xml:space="preserve">B 는 1번 행에서 A 가 커밋할 때까지 기다린다.</text>
<text x="32" y="656" font-size="16" fill="#0f172a" xml:space="preserve">A 가 Kafka 를 기다리는 동안 B 도 함께 멈춘다</text>
<rect x="20" y="688" width="720" height="88" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.6"/>
<text x="32" y="714" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">잠금 없이 SELECT</text>
<text x="32" y="737" font-size="16" fill="#0f172a" xml:space="preserve">B 도 1~3 을 읽는다. A 와 B 가 같은 신호를</text>
<text x="32" y="760" font-size="16" fill="#0f172a" xml:space="preserve">Kafka 에 한 번씩, 모두 두 번 보낸다</text>
<text x="20" y="814" font-size="16" fill="#64748b" xml:space="preserve">증명 테스트 (OutboxRelayTest): 미발행 20건에 발행기 2개를 동시에</text>
<text x="20" y="838" font-size="16" fill="#64748b" xml:space="preserve">돌리면 두 발행기가 보낸 건수의 합이 20 이고, 미발행은 0건이다</text>
</svg>