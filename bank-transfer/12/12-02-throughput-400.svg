<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 602" width="760" height="602" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<title>초당 400건, 은행 500ms 에서 처리한 수: 블로킹 53.5, 스레드를 400으로 늘리면 386.1, 스레드를 놓는 세 판은 400.0</title>
<defs><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="ms" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="mx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<rect width="760" height="602" fill="#ffffff"/>
<text x="20" y="34" font-size="21" fill="#0f172a" font-weight="700" xml:space="preserve">초당 400건 도착, 은행 500ms 에서</text>
<text x="20" y="62" font-size="21" fill="#0f172a" font-weight="700" xml:space="preserve">1초에 201 로 끝낸 수 (건/s)</text>
<text x="20" y="96" font-size="16" fill="#475569" xml:space="preserve">막대 끝 = 3회 중앙값. 괄호 = p99.</text>
<text x="20" y="119" font-size="16" fill="#475569" xml:space="preserve">빨강 = 잡는 판, 주황 = 스레드만 늘린 확인, 초록 = 놓는 판</text>
<text x="20" y="176" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">MVC 블로킹</text>
<rect x="230" y="156" width="48.1" height="28" rx="4" fill="#b91c1c" opacity="0.85"/>
<text x="288.15" y="176" font-size="16" fill="#b91c1c" font-weight="700" xml:space="preserve">53.5 (9.9초)</text>
<text x="20" y="228" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">블로킹 · Tomcat 400</text>
<rect x="230" y="208" width="347.5" height="28" rx="4" fill="#c2410c" opacity="0.85"/>
<text x="587.49" y="228" font-size="16" fill="#c2410c" font-weight="700" xml:space="preserve">386.1 (3.3초)</text>
<text x="20" y="280" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">MVC 비동기</text>
<rect x="230" y="260" width="360.0" height="28" rx="4" fill="#047857" opacity="0.85"/>
<text x="600.0" y="280" font-size="16" fill="#047857" font-weight="700" xml:space="preserve">400.0 (1.15초)</text>
<text x="20" y="332" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">WebFlux 코루틴</text>
<rect x="230" y="312" width="360.0" height="28" rx="4" fill="#047857" opacity="0.85"/>
<text x="600.0" y="332" font-size="16" fill="#047857" font-weight="700" xml:space="preserve">400.0 (1.04초)</text>
<text x="20" y="384" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">WebFlux Reactor</text>
<rect x="230" y="364" width="360.0" height="28" rx="4" fill="#047857" opacity="0.85"/>
<text x="600.0" y="384" font-size="16" fill="#047857" font-weight="700" xml:space="preserve">400.0 (1.03초)</text>
<line x1="230" y1="148" x2="230" y2="412" stroke="#334155" stroke-width="1.4"/>
<rect x="20" y="432" width="720" height="112" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.6"/>
<text x="32" y="458" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">스레드 최대 (같은 칸)</text>
<text x="32" y="481" font-size="16" fill="#0f172a" xml:space="preserve">코루틴 103, MVC 비동기 148, Reactor 190</text>
<text x="32" y="504" font-size="16" fill="#0f172a" xml:space="preserve">블로킹 226 (표본 1 ~ 2개), Tomcat 400 은 426 (표본 5개)</text>
<text x="32" y="527" font-size="16" fill="#0f172a" xml:space="preserve">놓는 세 판은 처리량이 같고, 남은 차이는 스레드 수와 p99</text>
<text x="20" y="574" font-size="16" fill="#64748b" xml:space="preserve">한 PC 의 상대 비교. 근거: docs/perf/p6-2-web-reactive.md §5-2 · §5-3</text>
</svg>