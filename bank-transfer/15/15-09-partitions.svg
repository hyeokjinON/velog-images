<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 704" width="760" height="704" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<title>파티션 3개를 컨슈머 6개가 나눠 맡아 3개는 놀고, api-1 이 죽으면 놀던 api-2 의 컨슈머가 그 파티션을 이어받는다</title>
<defs><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="ms" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="mx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<rect width="760" height="704" fill="#ffffff"/>
<text x="20" y="34" font-size="21" fill="#0f172a" font-weight="700" xml:space="preserve">파티션 3개, 컨슈머 6개: 일하는 것은 3개</text>
<text x="20" y="68" font-size="16" fill="#475569" xml:space="preserve">주황 = transfer.requested 파티션, 초록 = 파티션을 맡은 컨슈머</text>
<text x="20" y="91" font-size="16" fill="#475569" xml:space="preserve">회색 = 파티션 없이 기다리는 컨슈머 (E2 의 #PARTITIONS 0)</text>
<rect x="20" y="120" width="720" height="230" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
<text x="36" y="148" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">① 평소: 한 파티션은 한 컨슈머만 읽는다</text>
<rect x="36" y="168" width="210" height="168" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="141" y="192" font-size="16" fill="#0f172a" font-weight="700" text-anchor="middle" xml:space="preserve">api-1</text>
<rect x="514" y="168" width="210" height="168" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="619" y="192" font-size="16" fill="#0f172a" font-weight="700" text-anchor="middle" xml:space="preserve">api-2</text>
<rect x="48" y="206" width="186" height="34" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
<text x="60" y="229" font-size="16" fill="#0f172a" xml:space="preserve">컨슈머 1 ← P0</text>
<rect x="48" y="248" width="186" height="34" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<text x="60" y="271" font-size="16" fill="#475569" xml:space="preserve">컨슈머 2 (놂)</text>
<rect x="48" y="290" width="186" height="34" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<text x="60" y="313" font-size="16" fill="#475569" xml:space="preserve">컨슈머 3 (놂)</text>
<rect x="526" y="206" width="186" height="34" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
<text x="538" y="229" font-size="16" fill="#0f172a" xml:space="preserve">컨슈머 1 ← P1</text>
<rect x="526" y="248" width="186" height="34" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
<text x="538" y="271" font-size="16" fill="#0f172a" xml:space="preserve">컨슈머 2 ← P2</text>
<rect x="526" y="290" width="186" height="34" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<text x="538" y="313" font-size="16" fill="#475569" xml:space="preserve">컨슈머 3 (놂)</text>
<rect x="318" y="206" width="124" height="34" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.6"/>
<text x="380" y="229" font-size="16" fill="#0f172a" font-weight="700" text-anchor="middle" xml:space="preserve">파티션 0</text>
<line x1="318" y1="223" x2="238" y2="223" stroke="#047857" stroke-width="2" marker-end="url(#mg)"/>
<rect x="318" y="248" width="124" height="34" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.6"/>
<text x="380" y="271" font-size="16" fill="#0f172a" font-weight="700" text-anchor="middle" xml:space="preserve">파티션 1</text>
<line x1="442" y1="265" x2="522" y2="223" stroke="#047857" stroke-width="2" marker-end="url(#mg)"/>
<rect x="318" y="290" width="124" height="34" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.6"/>
<text x="380" y="313" font-size="16" fill="#0f172a" font-weight="700" text-anchor="middle" xml:space="preserve">파티션 2</text>
<line x1="442" y1="307" x2="522" y2="265" stroke="#047857" stroke-width="2" marker-end="url(#mg)"/>
<line x1="380" y1="354" x2="380" y2="386" stroke="#334155" stroke-width="2.2" marker-end="url(#ms)"/>
<rect x="20" y="390" width="720" height="230" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
<text x="36" y="418" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">② api-1 이 빠진 뒤: 놀던 컨슈머가 이어받는다</text>
<rect x="36" y="438" width="210" height="168" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="141" y="462" font-size="16" fill="#b91c1c" font-weight="700" text-anchor="middle" xml:space="preserve">api-1 (죽음)</text>
<rect x="514" y="438" width="210" height="168" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="619" y="462" font-size="16" fill="#0f172a" font-weight="700" text-anchor="middle" xml:space="preserve">api-2</text>
<rect x="48" y="476" width="186" height="34" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="60" y="499" font-size="16" fill="#475569" xml:space="preserve">컨슈머 1 (놂)</text>
<rect x="48" y="518" width="186" height="34" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="60" y="541" font-size="16" fill="#475569" xml:space="preserve">컨슈머 2 (놂)</text>
<rect x="48" y="560" width="186" height="34" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="60" y="583" font-size="16" fill="#475569" xml:space="preserve">컨슈머 3 (놂)</text>
<rect x="526" y="476" width="186" height="34" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
<text x="538" y="499" font-size="16" fill="#0f172a" xml:space="preserve">컨슈머 1 ← P1</text>
<rect x="526" y="518" width="186" height="34" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
<text x="538" y="541" font-size="16" fill="#0f172a" xml:space="preserve">컨슈머 2 ← P2</text>
<rect x="526" y="560" width="186" height="34" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
<text x="538" y="583" font-size="16" fill="#0f172a" xml:space="preserve">컨슈머 3 ← P0</text>
<rect x="318" y="476" width="124" height="34" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.6"/>
<text x="380" y="499" font-size="16" fill="#0f172a" font-weight="700" text-anchor="middle" xml:space="preserve">파티션 0</text>
<line x1="442" y1="493" x2="522" y2="577" stroke="#047857" stroke-width="2" marker-end="url(#mg)"/>
<rect x="318" y="518" width="124" height="34" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.6"/>
<text x="380" y="541" font-size="16" fill="#0f172a" font-weight="700" text-anchor="middle" xml:space="preserve">파티션 1</text>
<line x1="442" y1="535" x2="522" y2="493" stroke="#047857" stroke-width="2" marker-end="url(#mg)"/>
<rect x="318" y="560" width="124" height="34" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.6"/>
<text x="380" y="583" font-size="16" fill="#0f172a" font-weight="700" text-anchor="middle" xml:space="preserve">파티션 2</text>
<line x1="442" y1="577" x2="522" y2="535" stroke="#047857" stroke-width="2" marker-end="url(#mg)"/>
<text x="20" y="650" font-size="16" fill="#64748b" xml:space="preserve">③ 컨슈머를 더 늘려도 일하는 수는 3 — 처리 병렬도의 상한은 파티션 수</text>
<text x="20" y="674" font-size="16" fill="#64748b" xml:space="preserve">어느 api 가 몇 개를 받을지는 리밸런스 때마다 달라질 수 있다</text>
</svg>