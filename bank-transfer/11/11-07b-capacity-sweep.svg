<text x="164.0" y="420.8285714285714" font-size="16" fill="#0f172a" font-weight="700" text-anchor="middle" xml:space="preserve">127</text>
<text x="164.0" y="466" font-size="16" fill="#0f172a" text-anchor="middle" xml:space="preserve">16</text>
