<text x="420.0" y="317.2" font-size="16" fill="#0f172a" font-weight="700" text-anchor="middle" xml:space="preserve">406</text>
<text x="420.0" y="466" font-size="16" fill="#0f172a" text-anchor="middle" xml:space="preserve">64</text>
<line x1="372.0" y1="202.28571428571428" x2="468.0" y2="202.28571428571428" stroke="#334155" stroke-width="2.4" stroke-dasharray="6 4"/>
<text x="464.0" y="196.28571428571428" font-size="16" fill="#475569" xml:space="preserve">640</text>
<rect x="508.0" y="281.4" width="80" height="158.6" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
<text x="548.0" y="309.4" font-size="16" fill="#0f172a" font-weight="700" text-anchor="middle" xml:space="preserve">427</text>
<text x="548.0" y="466" font-size="16" fill="#0f172a" text-anchor="middle" xml:space="preserve">128</text>
<text x="548.0" y="184" font-size="16" fill="#475569" text-anchor="middle" xml:space="preserve">예상 1280 ↑</text>
