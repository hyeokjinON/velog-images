<text x="206.66666666666669" y="900" font-size="16" fill="#475569" text-anchor="middle" xml:space="preserve">MySQL CPU 60%</text>
<rect x="380.00000000000006" y="691.0285714285715" width="80" height="158.9714285714286" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="420.00000000000006" y="719.0285714285715" font-size="16" fill="#0f172a" font-weight="700" text-anchor="middle" xml:space="preserve">428</text>
<text x="420.00000000000006" y="876" font-size="16" fill="#0f172a" text-anchor="middle" xml:space="preserve">Hikari 20</text>
<text x="420.00000000000006" y="900" font-size="16" fill="#475569" text-anchor="middle" xml:space="preserve">MySQL CPU 87%</text>
<rect x="593.3333333333334" y="677.2857142857142" width="80" height="172.71428571428572" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="633.3333333333334" y="705.2857142857142" font-size="16" fill="#0f172a" font-weight="700" text-anchor="middle" xml:space="preserve">465</text>
<text x="633.3333333333334" y="876" font-size="16" fill="#0f172a" text-anchor="middle" xml:space="preserve">Hikari 40</text>
<text x="633.3333333333334" y="900" font-size="16" fill="#475569" text-anchor="middle" xml:space="preserve">MySQL CPU 101%</text>
<text x="20" y="934" font-size="16" fill="#475569" xml:space="preserve">10 → 20 은 +51% (풀이 한계), 20 → 40 은 +8.8% (그 너머는 MySQL 로 추정)</text>
</svg>