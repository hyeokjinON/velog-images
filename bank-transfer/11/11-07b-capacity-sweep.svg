<text x="676.0" y="184" font-size="16" fill="#475569" text-anchor="middle" xml:space="preserve">예상 1500 ↑</text>
<text x="20" y="500" font-size="16" fill="#475569" xml:space="preserve">64 → 128 은 +5%, 128 → 256 은 +0.1%. CPU 는 최대 55% 로 80% 에 닿지 않았다</text>
<text x="20" y="560" font-size="17" fill="#0f172a" font-weight="700" xml:space="preserve">② Hikari 커넥션 풀 (상한 256)</text>
