<text x="292.0" y="466" font-size="16" fill="#0f172a" text-anchor="middle" xml:space="preserve">32</text>
<line x1="244.0" y1="321.1428571428571" x2="340.0" y2="321.1428571428571" stroke="#334155" stroke-width="2.4" stroke-dasharray="6 4"/>
<text x="336.0" y="315.1428571428571" font-size="16" fill="#475569" xml:space="preserve">320</text>
