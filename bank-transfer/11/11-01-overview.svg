<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1080" width="760" height="1080" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<title>출금 컨슈머 한 장: 은행을 기다리는 동안 스레드를 잡느냐 놓느냐</title>
<defs><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="ms" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="mx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<rect width="760" height="1080" fill="#ffffff"/>
<text x="20" y="34" font-size="21" fill="#0f172a" font-weight="700" xml:space="preserve">출금 컨슈머 한 장: 은행을 기다리는 동안</text>
<text x="20" y="62" font-size="21" fill="#0f172a" font-weight="700" xml:space="preserve">스레드를 잡느냐 놓느냐</text>
<text x="20" y="96" font-size="16" fill="#475569" xml:space="preserve">주황 = blocking (기본), 초록 = coroutine (설정으로 켬),</text>
<text x="20" y="119" font-size="16" fill="#475569" xml:space="preserve">파랑 = 대조 실험. 은행 지연 100ms 일 때의 측정값이다</text>
<rect x="20" y="140" width="720" height="64" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.6"/>
<text x="32" y="166" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">Kafka 토픽 transfer.requested</text>
<text x="32" y="189" font-size="16" fill="#0f172a" xml:space="preserve">파티션 3개, 컨슈머 3개가 한 번에 최대 50건씩 가져온다</text>
<line x1="196" y1="204" x2="196" y2="238" stroke="#c2410c" stroke-width="2.2" marker-end="url(#mo)"/>
<line x1="564" y1="204" x2="564" y2="238" stroke="#047857" stroke-width="2.2" marker-end="url(#mg)"/>
<rect x="20" y="240" width="352" height="456" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="34" y="268" font-size="17" fill="#0f172a" font-weight="700" xml:space="preserve">① blocking (기본값)</text>
<text x="34" y="294" font-size="16" fill="#c2410c" xml:space="preserve">컨슈머 스레드가 은행 답을</text>
<text x="34" y="317" font-size="16" fill="#c2410c" xml:space="preserve">.get() 으로 서서 기다린다</text>
<rect x="34" y="332" width="324" height="64" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
<text x="46" y="358" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">컨슈머 스레드 C-1</text>
<text x="46" y="381" font-size="16" fill="#0f172a" xml:space="preserve">출금 1건, 100ms 동안 서 있다</text>
<line x1="196" y1="396" x2="196" y2="412" stroke="#334155" stroke-width="2.2" marker-end="url(#ms)"/>
<rect x="34" y="412" width="324" height="64" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
<text x="46" y="438" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">컨슈머 스레드 C-2</text>
<text x="46" y="461" font-size="16" fill="#0f172a" xml:space="preserve">출금 1건, 100ms 동안 서 있다</text>
<line x1="196" y1="476" x2="196" y2="492" stroke="#334155" stroke-width="2.2" marker-end="url(#ms)"/>
<rect x="34" y="492" width="324" height="64" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
<text x="46" y="518" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">컨슈머 스레드 C-3</text>
<text x="46" y="541" font-size="16" fill="#0f172a" xml:space="preserve">출금 1건, 100ms 동안 서 있다</text>
<line x1="196" y1="556" x2="196" y2="576" stroke="#c2410c" stroke-width="2.2" marker-end="url(#mo)"/>
<rect x="34" y="576" width="324" height="100" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.6"/>
<text x="46" y="602" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">동시에 기다리는 출금 3건</text>
<text x="46" y="625" font-size="16" fill="#0f172a" xml:space="preserve">예상 3 ÷ 0.1초 = 30건/s</text>
<text x="46" y="648" font-size="16" fill="#0f172a" xml:space="preserve">측정 20.9건/s</text>
<rect x="388" y="240" width="352" height="456" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="402" y="268" font-size="17" fill="#0f172a" font-weight="700" xml:space="preserve">② coroutine</text>
<text x="402" y="294" font-size="16" fill="#047857" xml:space="preserve">await 로 기다리는 동안</text>
<text x="402" y="317" font-size="16" fill="#047857" xml:space="preserve">스레드를 놓는다</text>
<rect x="402" y="332" width="324" height="64" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
<text x="414" y="358" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">컨슈머 스레드 3개</text>
<text x="414" y="381" font-size="16" fill="#0f172a" xml:space="preserve">레코드마다 코루틴 하나</text>
<line x1="564" y1="396" x2="564" y2="412" stroke="#334155" stroke-width="2.2" marker-end="url(#ms)"/>
<rect x="402" y="412" width="324" height="64" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
<text x="414" y="438" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">은행 호출 자리 64개</text>
<text x="414" y="461" font-size="16" fill="#0f172a" xml:space="preserve">Semaphore, 자리를 먼저 잡는다</text>
<line x1="564" y1="476" x2="564" y2="492" stroke="#334155" stroke-width="2.2" marker-end="url(#ms)"/>
<rect x="402" y="492" width="324" height="64" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
<text x="414" y="518" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">은행 대기 최대 64건</text>
<text x="414" y="541" font-size="16" fill="#0f172a" xml:space="preserve">스레드도 커넥션도 안 잡는다</text>
<line x1="564" y1="556" x2="564" y2="576" stroke="#047857" stroke-width="2.2" marker-end="url(#mg)"/>
<rect x="402" y="576" width="324" height="100" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
<text x="414" y="602" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">동시에 기다리는 출금 64건</text>
<text x="414" y="625" font-size="16" fill="#0f172a" xml:space="preserve">예상 64 ÷ 0.1초 = 640건/s</text>
<text x="414" y="648" font-size="16" fill="#0f172a" xml:space="preserve">측정 387.3건/s (18.5배)</text>
<line x1="196" y1="696" x2="196" y2="732" stroke="#c2410c" stroke-width="2.2" marker-end="url(#mo)"/>
<line x1="564" y1="696" x2="564" y2="732" stroke="#047857" stroke-width="2.2" marker-end="url(#mg)"/>
<rect x="20" y="734" width="720" height="64" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.6"/>
<text x="32" y="760" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">모의 은행 — 응답 지연 100ms (고정)</text>
<text x="32" y="783" font-size="16" fill="#0f172a" xml:space="preserve">같은 PC, 같은 도구로 두 판을 번갈아 쟀다 (모두 49회)</text>
<rect x="20" y="822" width="720" height="96" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="32" y="848" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">③ 대조 실험: coroutine 의 자리를 3개로 묶으면 24.4건/s</text>
<text x="32" y="871" font-size="16" fill="#0f172a" xml:space="preserve">blocking 20.9건/s 와 같은 자릿수다. 그래서 차이를 만든 것은</text>
<text x="32" y="894" font-size="16" fill="#0f172a" xml:space="preserve">코루틴이 아니라 동시에 은행을 기다릴 수 있는 수다</text>
<rect x="20" y="938" width="720" height="64" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.6"/>
<text x="32" y="964" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">④ 운영 기본은 blocking 그대로</text>
<text x="32" y="987" font-size="16" fill="#0f172a" xml:space="preserve">transfer.consumer.mode = blocking | coroutine, 블로킹 코드는 지우지 않았다</text>
<text x="20" y="1040" font-size="16" fill="#475569" xml:space="preserve">근거: bank-transfer PR #19 · #20 (P6-1), docs/perf/p6-1-consumer-coroutines.md</text>
</svg>