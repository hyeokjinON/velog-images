<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 679" width="760" height="679" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<title>시간 초과는 안쪽부터 짧게: 연결 1초, 풀 대기 1초, 은행 3초, HTTP 응답 5초</title>
<defs><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="ms" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="mx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<rect width="760" height="679" fill="#ffffff"/>
<text x="20" y="34" font-size="21" fill="#0f172a" font-weight="700" xml:space="preserve">시간 초과는 안쪽부터 짧게:</text>
<text x="20" y="62" font-size="21" fill="#0f172a" font-weight="700" xml:space="preserve">연결 · 풀 1초 &lt; 은행 3초 &lt; HTTP 5초</text>
<text x="20" y="96" font-size="16" fill="#475569" xml:space="preserve">초록 = 넘으면 안 보냄, 주황 = 504 모름, 빨강 = api 쪽 모름</text>
<line x1="40" y1="139" x2="720" y2="139" stroke="#94a3b8" stroke-width="1.5"/>
<line x1="40" y1="133" x2="40" y2="145" stroke="#94a3b8" stroke-width="1.5"/>
<text x="40" y="127" font-size="16" fill="#475569" text-anchor="middle" xml:space="preserve">0초</text>
<line x1="176" y1="133" x2="176" y2="145" stroke="#94a3b8" stroke-width="1.5"/>
<text x="176" y="127" font-size="16" fill="#475569" text-anchor="middle" xml:space="preserve">1초</text>
<line x1="312" y1="133" x2="312" y2="145" stroke="#94a3b8" stroke-width="1.5"/>
<text x="312" y="127" font-size="16" fill="#475569" text-anchor="middle" xml:space="preserve">2초</text>
<line x1="448" y1="133" x2="448" y2="145" stroke="#94a3b8" stroke-width="1.5"/>
<text x="448" y="127" font-size="16" fill="#475569" text-anchor="middle" xml:space="preserve">3초</text>
<line x1="584" y1="133" x2="584" y2="145" stroke="#94a3b8" stroke-width="1.5"/>
<text x="584" y="127" font-size="16" fill="#475569" text-anchor="middle" xml:space="preserve">4초</text>
<line x1="720" y1="133" x2="720" y2="145" stroke="#94a3b8" stroke-width="1.5"/>
<text x="720" y="127" font-size="16" fill="#475569" text-anchor="middle" xml:space="preserve">5초</text>
<rect x="40" y="163" width="136" height="40" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
<text x="50" y="189" font-size="16" fill="#047857" font-weight="700" xml:space="preserve">① 연결</text>
<text x="186" y="189" font-size="15" fill="#475569" font-family="Consolas, D2Coding, monospace" xml:space="preserve">connect-timeout</text>
<rect x="40" y="229" width="136" height="40" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
<text x="50" y="255" font-size="16" fill="#047857" font-weight="700" xml:space="preserve">② 풀 대기</text>
<text x="186" y="255" font-size="15" fill="#475569" font-family="Consolas, D2Coding, monospace" xml:space="preserve">pending-acquire-timeout</text>
<rect x="40" y="295" width="408" height="40" rx="6" fill="#fff7ed" stroke="#c2410c" stroke-width="1.6"/>
<text x="50" y="321" font-size="16" fill="#c2410c" font-weight="700" xml:space="preserve">③ 게이트웨이의 은행 응답</text>
<text x="458" y="321" font-size="15" fill="#475569" font-family="Consolas, D2Coding, monospace" xml:space="preserve">504 BANK_TIMEOUT</text>
<rect x="40" y="361" width="680" height="40" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.6"/>
<text x="50" y="387" font-size="16" fill="#b91c1c" font-weight="700" xml:space="preserve">④ api 의 HTTP 응답</text>
<text x="710" y="387" font-size="15" fill="#475569" text-anchor="end" xml:space="preserve">3초 + 여유 2초</text>
<rect x="20" y="437" width="720" height="112" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.6"/>
<text x="32" y="463" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">잘못된 예 (값을 거꾸로 둔 경우, 설명용)</text>
<text x="32" y="486" font-size="16" fill="#0f172a" xml:space="preserve">HTTP 응답 2초 &lt; 은행 3초 라고 하자</text>
<text x="32" y="509" font-size="16" fill="#0f172a" xml:space="preserve">은행이 2.5초에 답해도 api 는 2초에 이미 끊었다</text>
<text x="32" y="532" font-size="16" fill="#b91c1c" font-weight="700" xml:space="preserve">→ 게이트웨이는 답을 받았는데 api 만 '모름' → 결과조회만 는다</text>
<rect x="20" y="569" width="720" height="90" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
<text x="32" y="595" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">지금 순서 (안쪽이 먼저 끝난다)</text>
<text x="32" y="618" font-size="16" fill="#0f172a" xml:space="preserve">은행 3초 안에 끝나면 api 는 5초 안에 반드시 답을 받는다</text>
<text x="32" y="641" font-size="16" fill="#475569" xml:space="preserve">MVC 판 비동기 요청 시간 초과는 30초 (은행 3초보다 길게)</text>
</svg>