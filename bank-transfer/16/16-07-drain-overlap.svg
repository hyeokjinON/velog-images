<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 699" width="760" height="699" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<title>워커 drain 때 Recreate 게이트웨이 두 대가 몇 초 동안 함께 은행에 붙었다 (drain-1)</title>
<defs><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="ms" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="mx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<rect width="760" height="699" fill="#ffffff"/>
<text x="20" y="34" font-size="21" fill="#0f172a" font-weight="700" xml:space="preserve">워커 drain 때 Recreate 게이트웨이 두 대가</text>
<text x="20" y="62" font-size="21" fill="#0f172a" font-weight="700" xml:space="preserve">몇 초 동안 함께 은행에 붙었다 (drain-1)</text>
<text x="20" y="96" font-size="16" fill="#475569" xml:space="preserve">가로축 = drain 시작 뒤 지난 시간(초). 막대 = Pod 상태.</text>
<text x="20" y="119" font-size="16" fill="#475569" xml:space="preserve">빨강 띠 = 두 대가 함께 Ready 인 구간 (경계는 표본 간격 ±1.5초)</text>
<rect x="416.0" y="162" width="205.20000000000005" height="166" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="20" y="223" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">옛 게이트웨이</text>
<rect x="200" y="202" width="421.2" height="30" fill="#bbf7d0" stroke="#047857" stroke-width="1.2"/>
<text x="208" y="223" font-size="16" fill="#0f172a" xml:space="preserve">퇴거 중: preStop 10초 + graceful</text>
<text x="20" y="303" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">새 게이트웨이</text>
<rect x="200" y="282" width="216.0" height="30" fill="#e2e8f0" stroke="#334155" stroke-width="1.2"/>
<text x="208" y="303" font-size="16" fill="#0f172a" xml:space="preserve">기동 중</text>
<rect x="416.0" y="282" width="288.0" height="30" fill="#bbf7d0" stroke="#047857" stroke-width="1.2"/>
<text x="424.0" y="303" font-size="16" fill="#0f172a" xml:space="preserve">Ready, 은행 연결</text>
<line x1="200" y1="352" x2="704.0" y2="352" stroke="#334155" stroke-width="1.6"/>
<line x1="200.0" y1="352" x2="200.0" y2="358" stroke="#334155" stroke-width="1.4"/>
<text x="200.0" y="378" font-size="16" fill="#475569" text-anchor="middle" xml:space="preserve">0</text>
<line x1="272.0" y1="352" x2="272.0" y2="358" stroke="#334155" stroke-width="1.4"/>
<text x="272.0" y="378" font-size="16" fill="#475569" text-anchor="middle" xml:space="preserve">2</text>
<line x1="344.0" y1="352" x2="344.0" y2="358" stroke="#334155" stroke-width="1.4"/>
<text x="344.0" y="378" font-size="16" fill="#475569" text-anchor="middle" xml:space="preserve">4</text>
<line x1="416.0" y1="352" x2="416.0" y2="358" stroke="#334155" stroke-width="1.4"/>
<text x="416.0" y="378" font-size="16" fill="#475569" text-anchor="middle" xml:space="preserve">6</text>
<line x1="488.0" y1="352" x2="488.0" y2="358" stroke="#334155" stroke-width="1.4"/>
<text x="488.0" y="378" font-size="16" fill="#475569" text-anchor="middle" xml:space="preserve">8</text>
<line x1="560.0" y1="352" x2="560.0" y2="358" stroke="#334155" stroke-width="1.4"/>
<text x="560.0" y="378" font-size="16" fill="#475569" text-anchor="middle" xml:space="preserve">10</text>
<line x1="632.0" y1="352" x2="632.0" y2="358" stroke="#334155" stroke-width="1.4"/>
<text x="632.0" y="378" font-size="16" fill="#475569" text-anchor="middle" xml:space="preserve">12</text>
<line x1="704.0" y1="352" x2="704.0" y2="358" stroke="#334155" stroke-width="1.4"/>
<text x="704.0" y="378" font-size="16" fill="#475569" text-anchor="middle" xml:space="preserve">14</text>
<text x="20" y="410" font-size="16" fill="#047857" font-weight="700" xml:space="preserve">+6.0초: 새 게이트웨이 Ready (빨강 띠 시작)</text>
<text x="20" y="433" font-size="16" fill="#b91c1c" font-weight="700" xml:space="preserve">+11.7초: 옛 게이트웨이 마지막 Ready (빨강 띠 끝)</text>
<text x="20" y="463" font-size="16" fill="#475569" xml:space="preserve">겹침: drain-1 약 6 ~ 7초, 세 번 측정하면 4 ~ 7초 (표본 간격 약 1.4초)</text>
<rect x="20" y="487" width="720" height="88" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.6"/>
<text x="32" y="513" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">왜: Recreate 는 배포(롤아웃) 규칙이다</text>
<text x="32" y="536" font-size="16" fill="#0f172a" xml:space="preserve">drain 의 퇴거는 ReplicaSet 이 새 Pod 를 바로 만들고,</text>
<text x="32" y="559" font-size="16" fill="#0f172a" xml:space="preserve">옛 Pod 는 종료 절차(preStop + graceful)를 밟는다</text>
<rect x="20" y="591" width="720" height="88" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="32" y="617" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">이번에는 출금 하나가 한 대로만 가서 이중 송신 0</text>
<text x="32" y="640" font-size="16" fill="#0f172a" xml:space="preserve">은행이 기관당 세션 하나만 허용하면 문제가 된다</text>
<text x="32" y="663" font-size="16" fill="#0f172a" xml:space="preserve">→ 다음 단계: Lease 리더 선출로 연결 주인 하나 (P8-3b)</text>
</svg>