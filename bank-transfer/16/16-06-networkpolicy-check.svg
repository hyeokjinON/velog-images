<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 746" width="760" height="746" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<title>NetworkPolicy 확인을 실패 쪽으로 닫는 순서</title>
<defs><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="ms" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="mx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<rect width="760" height="746" fill="#ffffff"/>
<text x="20" y="34" font-size="21" fill="#0f172a" font-weight="700" xml:space="preserve">NetworkPolicy 확인을 실패 쪽으로 닫는 순서</text>
<text x="20" y="68" font-size="16" fill="#475569" xml:space="preserve">확인용 임시 Pod(curl)는 '연결 시간 · curl 종료 코드' 를 낸다.</text>
<text x="20" y="91" font-size="16" fill="#475569" xml:space="preserve">초록 = 통과, 빨강 = 실패로 멈춤, 주황 = 함정</text>
<rect x="20" y="118" width="470" height="111" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="32" y="144" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">① 양성 대조: 정책이 없는 곳에 붙나?</text>
<text x="32" y="167" font-size="16" fill="#0f172a" font-family="Consolas, D2Coding, monospace" xml:space="preserve">kubernetes.default.svc</text>
<text x="32" y="190" font-size="16" fill="#0f172a" font-family="Consolas, D2Coding, monospace" xml:space="preserve">  .cluster.local:443</text>
<text x="32" y="213" font-size="16" fill="#0f172a" xml:space="preserve">연결 시간 &gt; 0 이어야 한다 (0.0019초)</text>
<rect x="510" y="118" width="230" height="111" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.6"/>
<text x="522" y="144" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">아니면 FAIL</text>
<text x="522" y="167" font-size="16" fill="#0f172a" xml:space="preserve">확인용 Pod 가</text>
<text x="522" y="190" font-size="16" fill="#0f172a" xml:space="preserve">못 뜬 것이다</text>
<text x="522" y="213" font-size="16" fill="#0f172a" xml:space="preserve">→ 빈 값 ≠ 막힘</text>
<line x1="490" y1="173" x2="510" y2="173" stroke="#b91c1c" stroke-width="2.2" marker-end="url(#mr)"/>
<line x1="255" y1="229" x2="255" y2="257" stroke="#047857" stroke-width="2.2" marker-end="url(#mg)"/>
<rect x="20" y="257" width="470" height="111" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="32" y="283" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">② 대상은 전체 이름(FQDN)으로 부른다</text>
<text x="32" y="306" font-size="16" fill="#0f172a" font-family="Consolas, D2Coding, monospace" xml:space="preserve">bank-gateway.bank-transfer</text>
<text x="32" y="329" font-size="16" fill="#0f172a" font-family="Consolas, D2Coding, monospace" xml:space="preserve">  .svc.cluster.local:8082</text>
<text x="32" y="352" font-size="16" fill="#0f172a" xml:space="preserve">MySQL 도 같은 모양 (:3306)</text>
<rect x="510" y="257" width="230" height="111" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.6"/>
<text x="522" y="283" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">짧은 이름이면</text>
<text x="522" y="306" font-size="16" fill="#0f172a" xml:space="preserve">DNS 가 검색 도메인을</text>
<text x="522" y="329" font-size="16" fill="#0f172a" xml:space="preserve">돌다 28 로 끝나</text>
<text x="522" y="352" font-size="16" fill="#0f172a" xml:space="preserve">막힘과 구분 안 됨</text>
<line x1="255" y1="368" x2="255" y2="396" stroke="#047857" stroke-width="2.2" marker-end="url(#mg)"/>
<rect x="20" y="396" width="720" height="42" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.6"/>
<text x="32" y="422" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">③ 결과를 연결 시간과 종료 코드로 나눈다</text>
<rect x="60" y="454" width="680" height="64" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
<text x="72" y="480" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">0.000000 28 → 막힘 (통과)</text>
<text x="72" y="503" font-size="16" fill="#0f172a" xml:space="preserve">연결 시간 초과: 정책이 패킷을 버렸다</text>
<rect x="60" y="530" width="680" height="64" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.6"/>
<text x="72" y="556" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">0.001124 처럼 0 보다 큼 → 연결됨 (실패)</text>
<text x="72" y="579" font-size="16" fill="#0f172a" xml:space="preserve">정책이 집행되지 않는다</text>
<rect x="60" y="606" width="680" height="64" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.6"/>
<text x="72" y="632" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">0.000000 6 → 이름 풀이 실패 (실패)</text>
<text x="72" y="655" font-size="16" fill="#0f172a" xml:space="preserve">대상 이름이 틀렸다. 막힘으로 읽지 않는다</text>
<text x="20" y="700" font-size="16" fill="#475569" xml:space="preserve">정책 전: bank-gateway 0.001124초 · mysql 0.000959초 (연결됨)</text>
<text x="20" y="723" font-size="16" fill="#475569" xml:space="preserve">정책 후: 둘 다 0.000000, 종료 코드 28 (막힘) → kindnet 이 집행</text>
</svg>