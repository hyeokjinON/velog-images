<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 917" width="760" height="917" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<title>은행이 내려갔을 때: readiness 에만 넣은 설정(B1)과 liveness 에도 넣은 설정(B2)</title>
<defs><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="ms" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="mx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<rect width="760" height="917" fill="#ffffff"/>
<text x="20" y="34" font-size="21" fill="#0f172a" font-weight="700" xml:space="preserve">은행이 내려갔을 때: readiness 에만 넣은 설정(B1)과</text>
<text x="20" y="62" font-size="21" fill="#0f172a" font-weight="700" xml:space="preserve">liveness 에도 넣은 설정(B2)</text>
<text x="20" y="96" font-size="16" fill="#475569" xml:space="preserve">초록 = 의도한 동작, 빨강 = 피하려는 동작.</text>
<text x="20" y="119" font-size="16" fill="#475569" xml:space="preserve">숫자는 부하(초당 20건) 중 측정한 값이다</text>
<rect x="20" y="146" width="720" height="42" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.6"/>
<text x="32" y="172" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">① 0초: 모의 은행을 내린다 (60초 또는 180초 동안)</text>
<text x="20" y="224" font-size="17" fill="#047857" font-weight="700" xml:space="preserve">B1 — readiness = readinessState + bankConnection</text>
<rect x="40" y="238" width="700" height="65" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
<text x="52" y="264" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">② 약 8 ~ 10초 뒤 readiness 가 DOWN</text>
<text x="52" y="287" font-size="16" fill="#0f172a" xml:space="preserve">5초 주기로 2번 실패 → Service 대상에서 빠진다</text>
<line x1="390" y1="303" x2="390" y2="325" stroke="#047857" stroke-width="2.2" marker-end="url(#mg)"/>
<rect x="40" y="325" width="700" height="65" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
<text x="52" y="351" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">③ api 가 부르면 바로 Connection refused</text>
<text x="52" y="374" font-size="16" fill="#0f172a" xml:space="preserve">연결 단계 실패 = 안 보냄 → 재시도 토픽으로</text>
<line x1="390" y1="390" x2="390" y2="412" stroke="#047857" stroke-width="2.2" marker-end="url(#mg)"/>
<rect x="40" y="412" width="700" height="65" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
<text x="52" y="438" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">④ 180초 장애는 재시도 예산(약 95초)을 넘어 DLT</text>
<text x="52" y="461" font-size="16" fill="#0f172a" xml:space="preserve">제한 재발행으로 결국 모두 COMPLETED</text>
<line x1="390" y1="477" x2="390" y2="499" stroke="#047857" stroke-width="2.2" marker-end="url(#mg)"/>
<rect x="40" y="499" width="700" height="65" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
<text x="52" y="525" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">⑤ 은행 복구 → 다시 Ready 까지 6.7 ~ 34.0초</text>
<text x="52" y="548" font-size="16" fill="#0f172a" xml:space="preserve">게이트웨이 재시작 0번 (60 · 60 · 180초 장애)</text>
<text x="20" y="608" font-size="17" fill="#b91c1c" font-weight="700" xml:space="preserve">B2 — liveness 에도 bankConnection</text>
<rect x="40" y="622" width="700" height="65" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.6"/>
<text x="52" y="648" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">② liveness 10초 × 3번 실패 → 약 35초에 재시작</text>
<text x="52" y="671" font-size="16" fill="#0f172a" xml:space="preserve">재시작해도 은행은 살아나지 않는다</text>
<line x1="390" y1="687" x2="390" y2="709" stroke="#b91c1c" stroke-width="2.2" marker-end="url(#mr)"/>
<rect x="40" y="709" width="700" height="65" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.6"/>
<text x="52" y="735" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">③ 새 프로세스도 startup 뒤 liveness 가 또 실패</text>
<text x="52" y="758" font-size="16" fill="#0f172a" xml:space="preserve">재시작: 60초 장애 1번, 180초 장애 2번</text>
<line x1="390" y1="774" x2="390" y2="796" stroke="#b91c1c" stroke-width="2.2" marker-end="url(#mr)"/>
<rect x="40" y="796" width="700" height="65" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.6"/>
<text x="52" y="822" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">④ 은행 복구 → 다시 Ready 까지 6.9 · 7.5초</text>
<text x="52" y="845" font-size="16" fill="#0f172a" xml:space="preserve">더 빠른 이유는 재접속 대기 초기화 (그림 16-5)</text>
<text x="20" y="895" font-size="16" fill="#475569" xml:space="preserve">두 설정 모두 출금은 전부 COMPLETED, 은행에 두 번 간 거래번호 0</text>
</svg>