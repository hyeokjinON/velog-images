<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 632" width="760" height="632" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<title>쌓인 출금 수를 카운터 차이로 세면 재시작 때 -420 이 나온다. 사건은 카운터로, 상태는 DB 를 직접 세서 본다</title>
<defs><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="ms" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="mx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<rect width="760" height="632" fill="#ffffff"/>
<text x="20" y="34" font-size="21" fill="#0f172a" font-weight="700" xml:space="preserve">쌓인 출금 수는 어디서 세나:</text>
<text x="20" y="62" font-size="21" fill="#0f172a" font-weight="700" xml:space="preserve">사건은 카운터, 상태는 DB</text>
<text x="20" y="96" font-size="16" fill="#475569" xml:space="preserve">빨강 = 버린 방법, 초록 = 고른 방법</text>
<text x="20" y="119" font-size="16" fill="#475569" xml:space="preserve">숫자는 실험 M1b(리더 노드 강제 종료)와 M4 의 값</text>
<text x="20" y="166" font-size="18" fill="#0f172a" font-weight="700" xml:space="preserve">A. 버린 방법: 접수 카운터 − 완료 카운터</text>
<circle cx="34" cy="214" r="13" fill="#b91c1c"/><text x="34" y="220" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle" xml:space="preserve">①</text>
<rect x="60" y="180" width="680" height="68" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.6"/>
<text x="72" y="206" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">api Pod 가 접수 카운터를 메모리에 들고 있다</text>
<text x="72" y="229" font-size="16" fill="#0f172a" xml:space="preserve">노드가 죽어 Pod 가 다시 뜨면 카운터는 0 부터 센다</text>
<circle cx="34" cy="294" r="13" fill="#b91c1c"/><text x="34" y="300" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle" xml:space="preserve">②</text>
<rect x="60" y="260" width="680" height="68" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.6"/>
<text x="72" y="286" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">"지금 값 − 처음 값" 으로 잰 접수 수 = −420</text>
<text x="72" y="309" font-size="16" fill="#0f172a" xml:space="preserve">Kafka 가 같은 메시지를 두 번 주면 두 번 셀 수도 있다</text>
<text x="20" y="376" font-size="18" fill="#0f172a" font-weight="700" xml:space="preserve">B. 고른 방법: 둘로 나눈다</text>
<rect x="20" y="390" width="350" height="160" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
<text x="32" y="416" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">사건 (Counter · Timer)</text>
<text x="32" y="439" font-size="16" fill="#0f172a" xml:space="preserve">접수 · 은행 결과 · 확정</text>
<text x="32" y="462" font-size="16" fill="#0f172a" xml:space="preserve">DLT · 재발행 · 포기</text>
<text x="32" y="485" font-size="16" fill="#0f172a" xml:space="preserve">커밋 뒤에만 센다</text>
<text x="32" y="508" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">rate · increase 로 읽는다</text>
<text x="32" y="531" font-size="16" fill="#0f172a" xml:space="preserve">increase ≈ 1030 vs DB 1029</text>
<rect x="390" y="390" width="350" height="160" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
<text x="402" y="416" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">상태 (DB 를 센 Gauge)</text>
<text x="402" y="439" font-size="16" fill="#0f172a" xml:space="preserve">미완료 건 · 가장 오래된 나이</text>
<text x="402" y="462" font-size="16" fill="#0f172a" xml:space="preserve">미발행 아웃박스</text>
<text x="402" y="485" font-size="16" fill="#0f172a" xml:space="preserve">api 가 10초마다 COUNT</text>
<text x="402" y="508" font-size="16" fill="#0f172a" font-family="Consolas, D2Coding, monospace" xml:space="preserve">나이는 SQL 의 NOW(6)</text>
<text x="402" y="531" font-size="16" fill="#0f172a" xml:space="preserve">조회 실패면 0 이 아니라 NaN</text>
<text x="20" y="580" font-size="16" fill="#64748b" xml:space="preserve">재시작이 없으면 카운터와 DB 가 같았다 (M4: 12,801 = 12,801).</text>
<text x="20" y="604" font-size="16" fill="#64748b" xml:space="preserve">그래도 "쌓였나" 는 DB 의 진짜 수로 보고, 카운터는 속도로만 본다.</text>
</svg>