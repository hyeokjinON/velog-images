<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 746" width="760" height="746" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<title>고치기 전: 컨슈머가 적은 UNKNOWN 을 다음 틱에 바로 물어서, 돈이 나간 출금이 FAILED 로 확정된다</title>
<defs><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="ms" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="mx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<rect width="760" height="746" fill="#ffffff"/>
<text x="20" y="34" font-size="21" fill="#0f172a" font-weight="700" xml:space="preserve">고치기 전: 컨슈머가 적은 UNKNOWN 을 다음 틱에 바로</text>
<text x="20" y="62" font-size="21" fill="#0f172a" font-weight="700" xml:space="preserve">물어서, 돈이 나간 출금이 FAILED 로 확정된다</text>
<text x="20" y="96" font-size="16" fill="#475569" xml:space="preserve">최종 리뷰에서 나온 시나리오다. t = 컨슈머가 이체 전문을 보낸 뒤 지난 시간.</text>
<text x="20" y="119" font-size="16" fill="#475569" xml:space="preserve">빨강 = 틀린 확정, 회색 점선 = 아무도 보지 않는 로그</text>
<text x="20" y="154" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">시각</text>
<text x="130" y="154" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">일어난 일</text>
<text x="20" y="206" font-size="16" fill="#0f172a" font-weight="700" font-family="Consolas, D2Coding, monospace" xml:space="preserve">t=0.0s</text>
<rect x="130" y="168" width="610" height="64" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="142" y="194" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">컨슈머 → 은행: 이체 전문 (거래번호 T…01)</text>
<text x="142" y="217" font-size="16" fill="#0f172a" xml:space="preserve">status = SENDING, sending_at = t0</text>
<text x="20" y="284" font-size="16" fill="#0f172a" font-weight="700" font-family="Consolas, D2Coding, monospace" xml:space="preserve">t=3.0s</text>
<rect x="130" y="246" width="610" height="64" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.6"/>
<text x="142" y="272" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">3초 안에 응답 없음 → 타임아웃</text>
<text x="142" y="295" font-size="16" fill="#0f172a" xml:space="preserve">status = UNKNOWN</text>
<text x="20" y="362" font-size="16" fill="#0f172a" font-weight="700" font-family="Consolas, D2Coding, monospace" xml:space="preserve">t=3.1s</text>
<rect x="130" y="324" width="610" height="88" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.6"/>
<text x="142" y="350" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">정리 작업 틱: UNKNOWN 이면 바로 결과조회 T…01</text>
<text x="142" y="373" font-size="16" fill="#0f172a" xml:space="preserve">은행은 아직 처리 중이라 원거래가 없다 → 처리결과 2001</text>
<text x="142" y="396" font-size="16" fill="#0f172a" xml:space="preserve">→ status = FAILED 로 확정 (틀린 확정)</text>
<text x="20" y="464" font-size="16" fill="#0f172a" font-weight="700" font-family="Consolas, D2Coding, monospace" xml:space="preserve">t=3.2s</text>
<rect x="130" y="426" width="610" height="64" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.6"/>
<text x="142" y="452" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">은행이 이체를 마친다 (돈이 나간다)</text>
<text x="142" y="475" font-size="16" fill="#0f172a" xml:space="preserve">응답이 와도 기다리던 쪽이 이미 타임아웃으로 끝났다</text>
<rect x="130" y="504" width="610" height="64" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="142" y="530" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">늦은 응답은 짝이 없어 로그 한 줄만 남는다</text>
<text x="142" y="553" font-size="16" fill="#0f172a" xml:space="preserve">late or unknown response</text>
<rect x="20" y="588" width="720" height="88" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.6"/>
<text x="32" y="614" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">DB 에는 FAILED, 실제로는 출금 완료</text>
<text x="32" y="637" font-size="16" fill="#0f172a" xml:space="preserve">사용자가 실패를 보고 다시 요청하면 두 번 나간다.</text>
<text x="32" y="660" font-size="16" fill="#0f172a" xml:space="preserve">"모르면 다시 보내지 않는다" 를 지키려던 장치가 이중 출금의 길을 열었다</text>
<text x="20" y="708" font-size="16" fill="#64748b" xml:space="preserve">근거: bank-transfer PR #7 최종 리뷰, ADR-0006 결정 3 · 한계 절</text>
</svg>