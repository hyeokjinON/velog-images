<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 870" width="760" height="870" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<title>시간 경쟁 테스트를 순서 비교로: 뒤 메시지 처리 확인 시각이 앞 메시지의 DLT 이동 시각보다 먼저인지만 본다</title>
<defs><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="ms" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="mx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<rect width="760" height="870" fill="#ffffff"/>
<text x="20" y="34" font-size="21" fill="#0f172a" font-weight="700" xml:space="preserve">시간 경쟁 테스트를 순서 비교로: 뒤 메시지 처리 확인이</text>
<text x="20" y="62" font-size="21" fill="#0f172a" font-weight="700" xml:space="preserve">앞 메시지의 DLT 이동보다 먼저인지만 본다</text>
<text x="20" y="96" font-size="16" fill="#475569" xml:space="preserve">테스트 간격 0.5 · 1 · 2초 → 앞 메시지는 약 3.5초 뒤 DLT (주황 마름모).</text>
<text x="20" y="119" font-size="16" fill="#475569" xml:space="preserve">초록 점 = 뒤 메시지 처리 확인, 빨간 점 = 느린 CI 의 처리 확인</text>
<rect x="20" y="150" width="720" height="300" rx="8" fill="#ffffff" stroke="#b91c1c" stroke-width="1.6"/>
<text x="36" y="178" font-size="17" fill="#b91c1c" font-weight="700" xml:space="preserve">고치기 전: 3초라는 고정 마감</text>
<line x1="80" y1="232" x2="680" y2="232" stroke="#334155" stroke-width="2"/>
<line x1="80" y1="226" x2="80" y2="238" stroke="#334155" stroke-width="2"/>
<text x="80" y="258" font-size="16" fill="#475569" text-anchor="middle" xml:space="preserve">0초</text>
<line x1="180" y1="226" x2="180" y2="238" stroke="#334155" stroke-width="2"/>
<text x="180" y="258" font-size="16" fill="#475569" text-anchor="middle" xml:space="preserve">1초</text>
<line x1="280" y1="226" x2="280" y2="238" stroke="#334155" stroke-width="2"/>
<text x="280" y="258" font-size="16" fill="#475569" text-anchor="middle" xml:space="preserve">2초</text>
<line x1="380" y1="226" x2="380" y2="238" stroke="#334155" stroke-width="2"/>
<text x="380" y="258" font-size="16" fill="#475569" text-anchor="middle" xml:space="preserve">3초</text>
<line x1="480" y1="226" x2="480" y2="238" stroke="#334155" stroke-width="2"/>
<text x="480" y="258" font-size="16" fill="#475569" text-anchor="middle" xml:space="preserve">4초</text>
<line x1="580" y1="226" x2="580" y2="238" stroke="#334155" stroke-width="2"/>
<text x="580" y="258" font-size="16" fill="#475569" text-anchor="middle" xml:space="preserve">5초</text>
<line x1="680" y1="226" x2="680" y2="238" stroke="#334155" stroke-width="2"/>
<text x="680" y="258" font-size="16" fill="#475569" text-anchor="middle" xml:space="preserve">6초</text>
<line x1="380" y1="196" x2="380" y2="244" stroke="#b91c1c" stroke-width="2.5" stroke-dasharray="6 5"/>
<circle cx="400.0" cy="232" r="7" fill="#b91c1c"/>
<text x="386" y="208" font-size="16" fill="#b91c1c" font-weight="700" xml:space="preserve">마감 3초</text>
<path d="M430.0,222 L440.0,232 L430.0,242 L420.0,232 z" fill="#c2410c"/>
<text x="36" y="300" font-size="16" fill="#0f172a" xml:space="preserve">보통 CI: 뒤 메시지 0.4초 확인 → 마감 안 → 통과</text>
<circle cx="120.0" cy="232" r="8" fill="#047857"/>
<text x="36" y="330" font-size="16" fill="#b91c1c" font-weight="700" xml:space="preserve">느린 CI: 뒤 메시지 3.2초 확인 → 마감 넘김 → 실패</text>
<text x="36" y="360" font-size="16" fill="#b91c1c" xml:space="preserve">막힌 게 아닌데도 실패한다. 3.5초와의 여유가 0.5초뿐이다</text>
<text x="36" y="396" font-size="16" fill="#0f172a" xml:space="preserve">앞 메시지 DLT(3.5초)와 마감(3초) 사이가 좁아</text>
<text x="36" y="424" font-size="16" fill="#0f172a" xml:space="preserve">CI 가 조금만 느려도 결과가 흔들린다</text>
<rect x="20" y="474" width="720" height="316" rx="8" fill="#ffffff" stroke="#047857" stroke-width="1.6"/>
<text x="36" y="502" font-size="17" fill="#047857" font-weight="700" xml:space="preserve">고친 뒤: 두 사건의 순서만 비교</text>
<line x1="80" y1="556" x2="680" y2="556" stroke="#334155" stroke-width="2"/>
<line x1="80" y1="550" x2="80" y2="562" stroke="#334155" stroke-width="2"/>
<text x="80" y="582" font-size="16" fill="#475569" text-anchor="middle" xml:space="preserve">0초</text>
<line x1="180" y1="550" x2="180" y2="562" stroke="#334155" stroke-width="2"/>
<text x="180" y="582" font-size="16" fill="#475569" text-anchor="middle" xml:space="preserve">1초</text>
<line x1="280" y1="550" x2="280" y2="562" stroke="#334155" stroke-width="2"/>
<text x="280" y="582" font-size="16" fill="#475569" text-anchor="middle" xml:space="preserve">2초</text>
<line x1="380" y1="550" x2="380" y2="562" stroke="#334155" stroke-width="2"/>
<text x="380" y="582" font-size="16" fill="#475569" text-anchor="middle" xml:space="preserve">3초</text>
<line x1="480" y1="550" x2="480" y2="562" stroke="#334155" stroke-width="2"/>
<text x="480" y="582" font-size="16" fill="#475569" text-anchor="middle" xml:space="preserve">4초</text>
<line x1="580" y1="550" x2="580" y2="562" stroke="#334155" stroke-width="2"/>
<text x="580" y="582" font-size="16" fill="#475569" text-anchor="middle" xml:space="preserve">5초</text>
<line x1="680" y1="550" x2="680" y2="562" stroke="#334155" stroke-width="2"/>
<text x="680" y="582" font-size="16" fill="#475569" text-anchor="middle" xml:space="preserve">6초</text>
<circle cx="400.0" cy="556" r="8" fill="#047857"/>
<path d="M540.0,546 L550.0,556 L540.0,566 L530.0,556 z" fill="#c2410c"/>
<text x="400.0" y="534" font-size="16" fill="#047857" font-weight="700" text-anchor="middle" xml:space="preserve">observedAt</text>
<text x="540.0" y="534" font-size="16" fill="#c2410c" font-weight="700" text-anchor="middle" xml:space="preserve">dlt.timestamp()</text>
<text x="36" y="624" font-size="16" fill="#047857" font-weight="700" xml:space="preserve">느린 CI 라 모든 시각이 늦어져도 observedAt &lt; dlt.timestamp()</text>
<text x="36" y="652" font-size="16" fill="#0f172a" xml:space="preserve">→ 논블로킹이면 순서가 그대로라 통과한다</text>
<text x="36" y="688" font-size="16" fill="#b91c1c" font-weight="700" xml:space="preserve">블로킹 재시도라면 뒤 메시지는 앞 메시지가 DLT 로 간 뒤에야</text>
<text x="36" y="716" font-size="16" fill="#b91c1c" font-weight="700" xml:space="preserve">처리되므로 observedAt &gt; dlt.timestamp() 가 되어 실패한다</text>
<text x="36" y="752" font-size="16" fill="#0f172a" xml:space="preserve">같은 JVM 시계로 잰 두 시각이라 비교가 의미 있다</text>
<text x="20" y="812" font-size="16" fill="#64748b" xml:space="preserve">근거: bank-transfer RetryTopicFlowTest —</text>
<text x="20" y="836" font-size="16" fill="#64748b" xml:space="preserve">재시도 중인 메시지가 같은 파티션의 뒤 메시지를 막지 않는다</text>
</svg>