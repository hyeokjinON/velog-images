<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1010" width="760" height="1010" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<title>바꾼 기준: 마지막 재발행 뒤에 sending_at 이 새로 찍힌 은행 장애만 횟수를 센다</title>
<defs><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="ms" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="mx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<rect width="760" height="1010" fill="#ffffff"/>
<text x="20" y="34" font-size="21" fill="#0f172a" font-weight="700" xml:space="preserve">바꾼 기준: 마지막 재발행 뒤에 sending_at 이 새로</text>
<text x="20" y="62" font-size="21" fill="#0f172a" font-weight="700" xml:space="preserve">찍힌 은행 장애만 횟수를 센다</text>
<text x="20" y="96" font-size="16" fill="#475569" xml:space="preserve">파란 점 = sending_at (컨슈머가 SENDING 으로 바꾼 시각),</text>
<text x="20" y="119" font-size="16" fill="#475569" xml:space="preserve">초록 네모 = republished_at (정리 작업이 재발행한 시각). 시각은 예시</text>
<rect x="20" y="150" width="720" height="250" rx="8" fill="#ffffff" stroke="#c2410c" stroke-width="1.6"/>
<text x="36" y="178" font-size="17" fill="#c2410c" font-weight="700" xml:space="preserve">은행 장애 — 재발행하고 횟수 +1</text>
<circle cx="48" cy="208" r="8" fill="#1d4ed8"/>
<text x="70" y="214" font-size="16" fill="#0f172a" xml:space="preserve">sending_at 10:01:35 (재시도 마지막 시도)</text>
<rect x="40" y="232" width="16" height="16" fill="#047857"/>
<text x="70" y="246" font-size="16" fill="#0f172a" xml:space="preserve">republished_at 10:06:40 (재발행 1, 횟수 1)</text>
<circle cx="48" cy="272" r="8" fill="#1d4ed8"/>
<text x="70" y="278" font-size="16" fill="#0f172a" xml:space="preserve">sending_at 10:06:41 (재발행된 메시지를 다시 시도)</text>
<text x="70" y="310" font-size="16" fill="#0f172a" xml:space="preserve">→ 또 연결 없음 → 재시도 토픽 → DLT</text>
<text x="36" y="352" font-size="16" fill="#c2410c" font-weight="700" xml:space="preserve">다음 판단: sending_at 10:08:16 &gt; republished_at 10:06:40</text>
<text x="36" y="380" font-size="16" fill="#c2410c" font-weight="700" xml:space="preserve">→ 조건이 맞는다 → 재발행 2, 횟수 2</text>
<rect x="20" y="424" width="720" height="200" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="36" y="452" font-size="17" fill="#1d4ed8" font-weight="700" xml:space="preserve">Kafka 장애 — 건너뜀, 횟수 그대로</text>
<line x1="41" y1="475" x2="55" y2="489" stroke="#94a3b8" stroke-width="3"/><line x1="41" y1="489" x2="55" y2="475" stroke="#94a3b8" stroke-width="3"/>
<text x="70" y="488" font-size="16" fill="#0f172a" xml:space="preserve">outbox_event.published_at = NULL (신호가 Kafka 로 못 나감)</text>
<line x1="41" y1="507" x2="55" y2="521" stroke="#94a3b8" stroke-width="3"/><line x1="41" y1="521" x2="55" y2="507" stroke="#94a3b8" stroke-width="3"/>
<text x="70" y="520" font-size="16" fill="#0f172a" xml:space="preserve">sending_at 없음 (컨슈머가 받은 적이 없다)</text>
<text x="36" y="562" font-size="16" fill="#1d4ed8" font-weight="700" xml:space="preserve">판단: sending_at IS NOT NULL 에서 빠진다</text>
<text x="36" y="590" font-size="16" fill="#0f172a" xml:space="preserve">Kafka 가 돌아오면 밀린 신호가 발행되어 평소대로 처리된다</text>
<rect x="20" y="668" width="720" height="250" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
<text x="36" y="696" font-size="17" fill="#334155" font-weight="700" xml:space="preserve">컨슈머 장애 (재발행 1 뒤에 꺼짐) — 건너뜀</text>
<circle cx="48" cy="726" r="8" fill="#1d4ed8"/>
<text x="70" y="732" font-size="16" fill="#0f172a" xml:space="preserve">sending_at 10:01:35 (꺼지기 전 마지막 시도)</text>
<rect x="40" y="750" width="16" height="16" fill="#047857"/>
<text x="70" y="764" font-size="16" fill="#0f172a" xml:space="preserve">republished_at 10:06:40 (재발행 1)</text>
<line x1="41" y1="783" x2="55" y2="797" stroke="#94a3b8" stroke-width="3"/><line x1="41" y1="797" x2="55" y2="783" stroke="#94a3b8" stroke-width="3"/>
<text x="70" y="796" font-size="16" fill="#0f172a" xml:space="preserve">그 뒤 컨슈머가 꺼져 아무도 시도하지 않음</text>
<text x="36" y="838" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">판단: sending_at 10:01:35 &gt; republished_at 10:06:40 이 거짓</text>
<text x="36" y="866" font-size="16" fill="#0f172a" xml:space="preserve">→ 건너뜀. 컨슈머가 돌아오면 밀린 재발행 메시지를 읽는다</text>
<text x="36" y="894" font-size="16" fill="#0f172a" xml:space="preserve">횟수는 1 그대로라, 재발행 기회 두 번이 남아 있다</text>
<text x="20" y="956" font-size="16" fill="#64748b" xml:space="preserve">근거: bank-transfer P3-3b 설계 §5 표, ADR-0007 결정 4,</text>
<text x="20" y="980" font-size="16" fill="#64748b" xml:space="preserve">TransferReconcilerTest · JpaTransferStoreTest</text>
</svg>