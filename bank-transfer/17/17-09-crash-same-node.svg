<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 598" width="760" height="598" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<title>리더 노드를 SIGKILL 하면 Lease 만료로 14.3초 뒤 이어받지만, 두 대가 한 노드에 있으면 353초가 걸린다</title>
<defs><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="ms" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="mx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<rect width="760" height="598" fill="#ffffff"/>
<text x="20" y="34" font-size="21" fill="#0f172a" font-weight="700" xml:space="preserve">노드가 갑자기 죽을 때: 배치가 공백을 정한다</text>
<text x="20" y="68" font-size="16" fill="#475569" xml:space="preserve">초록 = 다른 노드에 대기가 있을 때, 빨강 = 한 노드에 몰렸을 때</text>
<text x="20" y="91" font-size="16" fill="#475569" xml:space="preserve">실험 H4′ (docker kill = SIGKILL, 반납 없음)</text>
<text x="20" y="138" font-size="18" fill="#0f172a" font-weight="700" xml:space="preserve">A. 리더와 대기가 서로 다른 워커</text>
<rect x="20" y="152" width="720" height="92" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
<text x="32" y="178" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">리더 노드 SIGKILL → 반납 없이 리더가 사라진다</text>
<text x="32" y="201" font-size="16" fill="#0f172a" xml:space="preserve">Lease 갱신이 멈추고 15초 뒤 만료 → 대기가 획득</text>
<text x="32" y="224" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">은행 공백 14.3초, 새 리더 14.6초</text>
<text x="20" y="292" font-size="18" fill="#0f172a" font-weight="700" xml:space="preserve">B. 리더와 대기가 모두 worker2</text>
<circle cx="34" cy="340" r="13" fill="#b91c1c"/><text x="34" y="346" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle" xml:space="preserve">①</text>
<rect x="60" y="306" width="680" height="68" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.6"/>
<text x="72" y="332" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">앞 실험에서 노드가 빠진 동안 대체 Pod 이 worker2 로 갔다</text>
<text x="72" y="355" font-size="16" fill="#0f172a" xml:space="preserve">ScheduleAnyway 라 노드가 돌아와도 다시 퍼지지 않았다</text>
<circle cx="34" cy="420" r="13" fill="#b91c1c"/><text x="34" y="426" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle" xml:space="preserve">②</text>
<rect x="60" y="386" width="680" height="68" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.6"/>
<text x="72" y="412" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">worker2 SIGKILL → 리더 · 대기 동시에 사라짐</text>
<text x="72" y="435" font-size="16" fill="#0f172a" xml:space="preserve">노드 장애 감지 약 50초 + 축출 대기 300초</text>
<rect x="20" y="470" width="720" height="46" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.6"/>
<text x="32" y="499" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">은행 공백 353초 — 복제본 2개가 이중화가 아니었다</text>
<text x="20" y="546" font-size="16" fill="#64748b" xml:space="preserve">돈은 두 경우 모두 맞았다 (결과 모름 0, 이중 송신 0).</text>
<text x="20" y="570" font-size="16" fill="#64748b" xml:space="preserve">다음 단계(#18)에서 DoNotSchedule 로 바꿔 353초 → 14.4초.</text>
</svg>