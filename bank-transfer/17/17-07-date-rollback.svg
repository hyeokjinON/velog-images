<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 602" width="760" height="602" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<title>CAS 가 못 막는 것: 시계가 늦은 게이트웨이가 정상 CAS 로 새 날짜 장부를 옛 날짜로 덮으면 양쪽 날짜 모두 번호가 겹친다</title>
<defs><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="ms" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="mx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<rect width="760" height="602" fill="#ffffff"/>
<text x="20" y="34" font-size="21" fill="#0f172a" font-weight="700" xml:space="preserve">CAS 가 못 막는 것: 날짜 되돌림</text>
<text x="20" y="68" font-size="16" fill="#475569" xml:space="preserve">빨강 = 고치기 전에 일어날 수 있던 일, 초록 = 고친 규칙</text>
<text x="20" y="91" font-size="16" fill="#475569" xml:space="preserve">D = 어제, D+1 = 오늘 (자정 직후)</text>
<circle cx="34" cy="154" r="13" fill="#334155"/><text x="34" y="160" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle" xml:space="preserve">①</text>
<rect x="60" y="120" width="680" height="68" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.6"/>
<text x="72" y="146" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">자정 직후 장부</text>
<text x="72" y="169" font-size="16" fill="#0f172a" font-family="Consolas, D2Coding, monospace" xml:space="preserve">{date: D+1, reservedTo: 1000}</text>
<circle cx="34" cy="236" r="13" fill="#b91c1c"/><text x="34" y="242" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle" xml:space="preserve">②</text>
<rect x="60" y="202" width="680" height="68" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.6"/>
<text x="72" y="228" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">시계가 몇 초 늦은 게이트웨이는 아직 D 라고 본다</text>
<text x="72" y="251" font-size="16" fill="#0f172a" xml:space="preserve">"날짜가 다르다" → 0부터 D 날짜로 예약</text>
<circle cx="34" cy="318" r="13" fill="#b91c1c"/><text x="34" y="324" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle" xml:space="preserve">③</text>
<rect x="60" y="284" width="680" height="68" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.6"/>
<text x="72" y="310" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">읽은 버전 그대로라 CAS 는 성공한다</text>
<text x="72" y="333" font-size="16" fill="#0f172a" font-family="Consolas, D2Coding, monospace" xml:space="preserve">{date: D, reservedTo: 1000} 로 덮음</text>
<circle cx="34" cy="400" r="13" fill="#b91c1c"/><text x="34" y="406" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle" xml:space="preserve">④</text>
<rect x="60" y="366" width="680" height="68" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.6"/>
<text x="72" y="392" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">D 날짜 번호 1 ~ 1000 을 다시 낸다 (중복)</text>
<text x="72" y="415" font-size="16" fill="#0f172a" xml:space="preserve">다음 D+1 예약자도 1부터 다시 (또 중복)</text>
<rect x="20" y="452" width="720" height="92" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
<text x="32" y="478" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">고친 규칙 (fail-closed)</text>
<text x="32" y="501" font-size="16" fill="#0f172a" xml:space="preserve">저장된 날짜가 더 새로우면 예약하지 않고 안 보냄</text>
<text x="32" y="524" font-size="16" fill="#0f172a" xml:space="preserve">기록이 깨졌으면(형식 · 숫자 아님) 덮지 않고 송신을 멈춘다</text>
<text x="20" y="574" font-size="16" fill="#64748b" xml:space="preserve">CAS 는 "동시에 쓰기" 를 막지 "틀린 값 쓰기" 를 막지 않는다.</text>
</svg>