<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<title>두 게이트웨이가 동시에 예약하면 resourceVersion 조건부 갱신으로 한쪽만 성공하고, 진 쪽은 다시 읽어 다음 구간을 받는다</title>
<defs><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="ms" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="mx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<rect width="760" height="540" fill="#ffffff"/>
<text x="20" y="34" font-size="21" fill="#0f172a" font-weight="700" xml:space="preserve">동시에 예약하면: CAS 로 한쪽만 이긴다</text>
<text x="20" y="68" font-size="16" fill="#475569" xml:space="preserve">초록 = 성공한 쓰기, 빨강 = 409 로 거절된 쓰기</text>
<text x="20" y="91" font-size="16" fill="#475569" xml:space="preserve">두 대가 잠깐 둘 다 리더라고 믿는 상황을 가정</text>
<circle cx="34" cy="154" r="13" fill="#334155"/><text x="34" y="160" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle" xml:space="preserve">①</text>
<rect x="60" y="120" width="680" height="68" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.6"/>
<text x="72" y="146" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">A 와 B 가 같은 장부를 읽는다</text>
<text x="72" y="169" font-size="16" fill="#0f172a" font-family="Consolas, D2Coding, monospace" xml:space="preserve">reservedTo=1000, resourceVersion=7</text>
<circle cx="34" cy="236" r="13" fill="#047857"/><text x="34" y="242" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle" xml:space="preserve">②</text>
<rect x="60" y="202" width="680" height="68" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
<text x="72" y="228" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">A 가 먼저 쓴다: 2000 으로 (조건 rv=7) → 성공</text>
<text x="72" y="251" font-size="16" fill="#0f172a" xml:space="preserve">A 의 구간 1001..2000, 장부는 rv=8</text>
<circle cx="34" cy="318" r="13" fill="#b91c1c"/><text x="34" y="324" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle" xml:space="preserve">③</text>
<rect x="60" y="284" width="680" height="68" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.6"/>
<text x="72" y="310" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">B 도 쓴다: 2000 으로 (조건 rv=7) → 409 Conflict</text>
<text x="72" y="333" font-size="16" fill="#0f172a" xml:space="preserve">읽은 뒤에 장부가 바뀌었으니 거절</text>
<circle cx="34" cy="400" r="13" fill="#047857"/><text x="34" y="406" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle" xml:space="preserve">④</text>
<rect x="60" y="366" width="680" height="68" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
<text x="72" y="392" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">B 가 다시 읽는다: reservedTo=2000, rv=8</text>
<text x="72" y="415" font-size="16" fill="#0f172a" xml:space="preserve">다시 쓴다: 3000 → 성공, B 의 구간 2001..3000</text>
<rect x="20" y="452" width="720" height="68" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
<text x="32" y="478" font-size="16" fill="#0f172a" font-weight="700" xml:space="preserve">두 구간은 겹치지 않는다 (1001..2000 / 2001..3000)</text>
<text x="32" y="501" font-size="16" fill="#0f172a" xml:space="preserve">테스트: 두 예약자 × 25번 → 5만 개가 1 ~ 50,000, 겹침 · 빈틈 0</text>
</svg>